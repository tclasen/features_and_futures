<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="workspace">
      <header class="page-header">
        <p class="eyebrow">Your workspace</p>
        <h1>Workboard</h1>
        <p class="intro">Keep your projects organized and moving forward.</p>
      </header>

      <section class="panel" aria-labelledby="projects-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Overview</p>
            <h2 id="projects-heading">Projects</h2>
          </div>
          <span class="count" id="project-count">0 projects</span>
        </div>
        <form id="project-form" class="project-form">
          <label for="project-name">Project name</label>
          <div class="form-row">
            <input id="project-name" name="name" type="text" autocomplete="off" placeholder="e.g. Website refresh">
            <button type="submit">Create project</button>
          </div>
          <p id="form-alert" class="alert" role="alert" hidden></p>
        </form>
        <div id="project-list" class="project-list" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
  </style>
</head>
<body>
  <h1 id="project-heading">Project</h1>
  <button id="back-btn">Projects</button>
  <script type="module">
    // Extract project id from URL path
    const path = window.location.pathname;
    // The URL is of the form /projects/<id> (no file extension).
    const match = path.match(/\/projects\/(\d+)/);
    const id = match ? Number(match[1]) : null;
    if (id) {
      fetch(`/api/projects/${id}`)
        .then(r => r.json())
        .then(data => {
          const heading = document.getElementById('project-heading');
          heading.textContent = data.name;
        })
        .catch(() => {
          document.getElementById('project-heading').textContent = 'Project not found';
        });
    }
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>

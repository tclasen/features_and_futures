<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Project</title>
  <style>
    body { font-family: sans-serif; }
  </style>
</head>
<body>
  <h1 id="project-heading">Project</h1>
  <button id="back-btn">Projects</button>

  <script>
    async function loadProject() {
      const idMatch = location.pathname.match(/\/projects\/(\d+)/);
      if (!idMatch) return;
      const id = idMatch[1];
      const res = await fetch(`/api/projects/${id}`);
      if (!res.ok) {
        document.getElementById('project-heading').textContent = 'Project not found';
        return;
      }
      const data = await res.json();
      document.getElementById('project-heading').textContent = data.name;
    }
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = '/';
    });
    loadProject();
  </script>
</body>
</html>

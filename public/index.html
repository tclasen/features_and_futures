<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #202b3c; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(760px, calc(100% - 32px)); margin: 64px auto; }
    h1 { margin: 0 0 28px; font-size: 2rem; letter-spacing: -.03em; }
    form, .project-row { display: flex; align-items: center; gap: 12px; }
    form { padding: 20px; background: white; border: 1px solid #e0e6ef; border-radius: 10px; }
    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    input { min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid #b8c4d4; border-radius: 6px; font: inherit; }
    button { padding: 10px 15px; color: white; background: #315fc5; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #244caa; }
    .project-list { display: grid; gap: 10px; margin-top: 22px; }
    .project-row { justify-content: space-between; padding: 14px 16px; background: white; border: 1px solid #e0e6ef; border-radius: 8px; }
    .project-name { font-weight: 600; }
    .error { min-height: 1.5em; margin: 12px 0 0; color: #b42318; }
    .back { margin-bottom: 22px; }
    .task-form { margin-top: 22px; }
    .task-list { display: grid; gap: 10px; margin-top: 16px; }
    .task-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: white; border: 1px solid #e0e6ef; border-radius: 8px; }
    .task-row input { flex: initial; }
    .task-row .task-name { flex: 1; }
    .task-row form { padding: 0; border: 0; background: transparent; }
    .task-filter { margin-top: 18px; }
    select { margin-left: 8px; padding: 8px; font: inherit; }
    @media (max-width: 520px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
      if (match) {
        const response = await fetch(`/api/projects/${match[1]}`);
        if (!response.ok) { history.replaceState({}, '', '/'); return render(); }
        const project = await response.json();
        const tasksResponse = await fetch(`/api/projects/${match[1]}/tasks`);
        const tasks = await tasksResponse.json();
        app.innerHTML = `<button class="back" type="button">Projects</button><h1>${escapeHtml(project.name)}</h1>${project.archived ? '<p>Archived project</p>' : ''}<form class="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" type="text" aria-label="New project name" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form><p class="error rename-error" role="alert" aria-live="polite"></p><label class="task-filter" for="default-priority">Default task priority</label><select id="default-priority" aria-label="Default task priority" ${project.archived ? 'disabled' : ''}><option ${project.defaultPriority === 'Low' ? 'selected' : ''}>Low</option><option ${project.defaultPriority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.defaultPriority === 'High' ? 'selected' : ''}>High</option></select><form class="task-form"><label for="task-title">Task title</label><input id="task-title" type="text" aria-label="Task title" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form><p class="error" role="alert" aria-live="polite"></p><label class="task-filter" for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select><label class="task-filter" for="priority-filter">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select><section class="task-list" aria-label="Tasks"></section>`;
        app.querySelector('.back').addEventListener('click', () => { history.pushState({}, '', '/'); render(); });
        if (!project.archived) app.querySelector('.rename-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#new-project-name');
          const name = input.value.trim();
          const error = app.querySelector('.rename-error');
          if (!name) { error.textContent = 'Project name is required'; input.focus(); return; }
          const response = await fetch(`/api/projects/${match[1]}/rename`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
          if (response.ok) render();
        });
        const defaultPriority = app.querySelector('#default-priority');
        defaultPriority.addEventListener('change', async () => {
          const response = await fetch(`/api/projects/${match[1]}/default-priority`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: defaultPriority.value }) });
          if (response.ok) project.defaultPriority = defaultPriority.value;
        });
        const list = app.querySelector('.task-list');
        const filter = app.querySelector('#task-filter');
        const priorityFilter = app.querySelector('#priority-filter');
        const drawTasks = () => {
          const shown = tasks.filter(task => (filter.value === 'All' || (filter.value === 'Completed') === task.completed) && (priorityFilter.value === 'All' || priorityFilter.value === task.priority));
          list.innerHTML = shown.map(task => `<div class="task-row" data-testid="task-row"><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" data-id="${task.id}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}><span class="task-name">${escapeHtml(task.title)}</span><select aria-label="Task priority" data-priority-id="${task.id}" ${project.archived ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select><input type="text" aria-label="Task due date" data-due-date="${task.id}" value="${escapeHtml(task.dueDate || '')}" ${project.archived ? 'disabled' : ''}><button type="button" data-save-due="${task.id}" ${project.archived ? 'disabled' : ''}>Save due date</button><form class="task-rename" data-id="${task.id}"><label for="new-task-title-${task.id}">New task title</label><input id="new-task-title-${task.id}" type="text" aria-label="New task title" value="${escapeHtml(task.title)}" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename task</button></form></div>`).join('');
          list.querySelectorAll('.task-rename').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const input = form.querySelector('input');
            const title = input.value.trim();
            let error = app.querySelector('.task-rename-error');
            if (!error) { error = document.createElement('p'); error.className = 'error task-rename-error'; error.setAttribute('role', 'alert'); list.before(error); }
            if (!title) { error.textContent = 'Task title is required'; input.focus(); return; }
            const task = tasks.find(item => item.id === Number(form.dataset.id));
            const response = await fetch(`/api/tasks/${task.id}/rename`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
            if (response.ok) { task.title = title; error.textContent = ''; drawTasks(); }
          }));
          list.querySelectorAll('input[type="checkbox"]').forEach(box => box.addEventListener('change', async () => {
            const task = tasks.find(item => item.id === Number(box.dataset.id));
            task.completed = box.checked;
            await fetch(`/api/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: task.completed }) });
            drawTasks();
          }));
          list.querySelectorAll('[data-save-due]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => item.id === Number(button.dataset.saveDue));
            const input = list.querySelector(`[data-due-date="${task.id}"]`);
            const error = app.querySelector('.error');
            const response = await fetch(`/api/tasks/${task.id}/due-date`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dueDate: input.value }) });
            if (response.ok) { task.dueDate = (await response.json()).dueDate; input.value = task.dueDate || ''; error.textContent = ''; }
            else error.textContent = (await response.json()).error || 'Unable to save due date';
          }));
          list.querySelectorAll('[data-priority-id]').forEach(select => select.addEventListener('change', async () => {
            const task = tasks.find(item => item.id === Number(select.dataset.priorityId));
            const priority = select.value;
            const response = await fetch(`/api/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority }) });
            if (response.ok) { task.priority = priority; drawTasks(); }
          }));
        };
        filter.addEventListener('change', drawTasks);
        priorityFilter.addEventListener('change', drawTasks);
        drawTasks();
        app.querySelector('.task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#task-title');
          const title = input.value.trim();
          const error = app.querySelector('.error');
          if (!title) { error.textContent = 'Task title is required'; input.focus(); return; }
          const response = await fetch(`/api/projects/${match[1]}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
          if (response.ok) { tasks.push(await response.json()); input.value = ''; error.textContent = ''; drawTasks(); }
        });
        return;
      }
      const response = await fetch('/api/projects');
      const projects = await response.json();
      app.innerHTML = `<h1>Workboard</h1><form><label for="project-name">Project name</label><input id="project-name" name="name" type="text" aria-label="Project name"><button type="submit">Create project</button></form><p class="error" role="alert" aria-live="polite"></p><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select><section class="project-list" aria-label="Projects"></section>`;
      const drawProjects = () => {
        const archived = app.querySelector('#project-filter').value === 'Archived';
        app.querySelector('.project-list').innerHTML = projects.filter(project => project.archived === archived).map(project => `<div class="project-row" data-testid="project-row"><span class="project-name">${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span><button type="button" data-open="${project.id}">Open project</button><button type="button" data-archive="${project.id}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        app.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => { history.pushState({}, '', `/projects/${button.dataset.open}`); render(); }));
        app.querySelectorAll('[data-archive]').forEach(button => button.addEventListener('click', async () => { await fetch(`/api/projects/${button.dataset.archive}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !archived }) }); render(); }));
      };
      app.querySelector('#project-filter').addEventListener('change', drawProjects);
      drawProjects();
      const form = app.querySelector('form');
      const input = app.querySelector('input');
      const error = app.querySelector('.error');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) { error.textContent = 'Project name is required'; input.focus(); return; }
        const created = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
        if (created.ok) render();
      });
    }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

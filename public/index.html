<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <section id="project-list">
        <h1>Workboard</h1>
        <form id="create-project">
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text">
            <button type="submit">Create project</button>
          </div>
        </form>
        <div class="project-filter">
          <label for="project-filter">Project filter</label>
          <select id="project-filter">
            <option>Active</option>
            <option>Archived</option>
          </select>
        </div>
        <div id="projects" aria-label="Projects"></div>
      </section>
      <section id="project-detail" hidden>
        <button id="back-to-projects" type="button">Projects</button>
        <h1 id="project-heading"></h1>
        <p id="archived-project" hidden>Archived project</p>
        <form id="create-task">
          <label for="task-title">Task title</label>
          <div class="form-controls">
            <input id="task-title" name="title" type="text">
            <button type="submit">Create task</button>
          </div>
        </form>
        <div class="task-filter">
          <label for="task-filter">Task filter</label>
          <select id="task-filter">
            <option>All</option>
            <option>Open</option>
            <option>Completed</option>
          </select>
        </div>
        <div id="tasks" aria-label="Tasks"></div>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>

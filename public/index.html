<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <section id="project-list">
        <h1>Workboard</h1>
        <form id="create-project">
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text">
            <button type="submit">Create project</button>
          </div>
        </form>
        <div class="project-filter">
          <label for="project-filter">Project filter</label>
          <select id="project-filter">
            <option>Active</option>
            <option>Archived</option>
          </select>
        </div>
        <form id="search-projects">
          <label for="project-search">Project search</label>
          <div class="form-controls">
            <input id="project-search" type="text">
            <button type="submit">Search projects</button>
          </div>
        </form>
        <div id="projects" aria-label="Projects"></div>
      </section>
      <section id="project-detail" hidden>
        <button id="back-to-projects" type="button">Projects</button>
        <h1 id="project-heading"></h1>
        <p id="archived-project" hidden>Archived project</p>
        <form id="rename-project">
          <label for="new-project-name">New project name</label>
          <div class="form-controls">
            <input id="new-project-name" name="name" type="text" disabled>
            <button type="submit" disabled>Rename project</button>
          </div>
        </form>
        <div class="task-filter">
          <label for="default-task-priority">Default task priority</label>
          <select id="default-task-priority" disabled>
            <option>Low</option>
            <option selected>Normal</option>
            <option>High</option>
          </select>
        </div>
        <form id="create-task">
          <label for="task-title">Task title</label>
          <div class="form-controls">
            <input id="task-title" name="title" type="text">
            <button type="submit">Create task</button>
          </div>
        </form>
        <div class="task-filter">
          <label for="task-filter">Task filter</label>
          <select id="task-filter">
            <option>All</option>
            <option>Open</option>
            <option>Completed</option>
          </select>
        </div>
        <div class="task-filter">
          <label for="priority-filter">Priority filter</label>
          <select id="priority-filter">
            <option>All</option>
            <option>Low</option>
            <option>Normal</option>
            <option>High</option>
          </select>
        </div>
        <form id="due-range">
          <label for="due-from">Due from</label>
          <input id="due-from" type="text">
          <label for="due-through">Due through</label>
          <input id="due-through" type="text">
          <button type="submit">Apply due range</button>
        </form>
        <form id="search-tasks">
          <label for="task-search">Task search</label>
          <div class="form-controls">
            <input id="task-search" type="text">
            <button type="submit">Search tasks</button>
          </div>
        </form>
        <div id="tasks" aria-label="Tasks"></div>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
  </body>
</html>

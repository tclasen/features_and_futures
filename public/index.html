<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <script type="module" src="/app.js"></script>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #192330; background: #f5f7fa; }
      body { margin: 0; }
      main { width: min(680px, calc(100% - 40px)); margin: 64px auto; }
      h1 { margin: 0 0 28px; font-size: 2rem; }
      form { display: flex; gap: 10px; margin-bottom: 18px; }
      label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #aab5c2; border-radius: 6px; font: inherit; }
      button { padding: 10px 15px; border: 0; border-radius: 6px; color: white; background: #2459a6; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #194681; }
      button:focus-visible, input:focus-visible { outline: 3px solid #8bb8f3; outline-offset: 2px; }
      [role="alert"] { color: #a32626; margin: 8px 0 16px; }
      ul { list-style: none; padding: 0; margin: 0; }
      [data-testid="project-row"] { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; margin: 10px 0; border: 1px solid #dce2e9; border-radius: 8px; background: white; }
      .project-name { overflow-wrap: anywhere; }
      .back { margin-bottom: 24px; }
    </style>
  </head>
  <body><main id="app"><h1>Workboard</h1></main></body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17212b; background: #f4f6f8; }
      body { margin: 0; }
      main { width: min(680px, calc(100% - 40px)); margin: 56px auto; }
      h1 { font-size: 2rem; margin: 0 0 24px; }
      form, [data-testid="project-row"] { display: flex; align-items: center; gap: 12px; }
      form { margin-bottom: 24px; }
      input { min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid #aeb8c2; border-radius: 5px; font: inherit; }
      button { padding: 10px 14px; border: 0; border-radius: 5px; background: #155eef; color: white; font: inherit; cursor: pointer; }
      button:hover { background: #1049bd; }
      [data-testid="project-row"] { justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #d7dde3; }
      [role="alert"] { color: #b42318; margin: 0 0 16px; }
      .back { margin-bottom: 20px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

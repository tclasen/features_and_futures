<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <section id="project-list" aria-labelledby="app-title" hidden>
      <h1 id="app-title">Workboard</h1>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <div class="form-row">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
      </form>
      <p id="alert" role="alert" hidden></p>
      <div id="projects" aria-live="polite"></div>
    </section>
    <section id="project-detail" aria-live="polite" hidden>
      <button id="back-button" type="button">Projects</button>
      <h1 id="project-title"></h1>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <p class="eyebrow">PROJECT SPACE</p>
        <h1 id="page-title">Workboard</h1>
      </header>
      <section id="project-list-view" aria-labelledby="list-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">YOUR WORK</p>
            <h2 id="list-heading">Projects</h2>
          </div>
        </div>
        <form id="project-form" class="create-form">
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
          <p id="form-alert" class="alert" role="alert" hidden></p>
        </form>
        <div id="projects" class="project-list" aria-live="polite"></div>
      </section>
      <section id="project-detail-view" aria-labelledby="project-title" hidden>
        <button id="back-button" class="back-button" type="button">Projects</button>
        <h2 id="project-title"></h2>
      </section>
    </main>
  </body>
</html>

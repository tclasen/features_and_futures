<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section id="project-list" aria-labelledby="page-title">
        <h1 id="page-title">Workboard</h1>
        <form id="create-project-form">
          <label for="project-name">Project name</label>
          <div class="form-row">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
          <p id="form-alert" class="alert" role="alert" hidden></p>
        </form>
        <div id="projects" class="projects" aria-live="polite"></div>
      </section>
      <section id="project-detail" aria-labelledby="detail-title" hidden>
        <button id="back-to-projects" class="back-button" type="button">Projects</button>
        <h1 id="detail-title"></h1>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <h1 id="heading">Workboard</h1>
    <p id="error" role="alert" hidden></p>
    <section id="project-list" hidden>
      <form id="create-project" novalidate>
        <label for="project-name">Project name</label>
        <div class="input-row">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
      </form>
      <div id="projects" aria-label="Projects"></div>
    </section>
    <section id="project-detail" hidden>
      <button id="back" type="button">Projects</button>
      <div id="task-board" hidden>
        <form id="create-task" novalidate>
          <label for="task-title">Task title</label>
          <div class="input-row">
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit">Create task</button>
          </div>
        </form>
        <label for="task-filter">Task filter</label>
        <select id="task-filter">
          <option value="all">All</option>
          <option value="open">Open</option>
          <option value="completed">Completed</option>
        </select>
        <div id="tasks" aria-label="Tasks"></div>
      </div>
    </section>
  </main>
</body>
</html>

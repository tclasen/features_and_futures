<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6f9; color: #17243b; font: 16px system-ui, sans-serif; }
    main { max-width: 760px; margin: 64px auto; padding: 32px; background: white; border: 1px solid #dee4ec; border-radius: 12px; }
    h1 { margin-top: 0; overflow-wrap: anywhere; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    .fields { display: flex; gap: 12px; }
    input { min-width: 0; flex: 1; border: 1px solid #8795ab; border-radius: 6px; padding: 12px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 12px 16px; background: #244fc4; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #193d9c; }
    :focus-visible { outline: 3px solid #e3931e; outline-offset: 3px; }
    [role="alert"] { color: #a32121; margin-top: 16px; }
    #projects { margin-top: 28px; }
    .project-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 0; border-top: 1px solid #dee4ec; }
    .project-row span { overflow-wrap: anywhere; min-width: 0; }
    .project-row button { flex-shrink: 0; }
    @media (max-width: 540px) { main { margin: 20px 12px; padding: 24px; } .fields { flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');

    async function api(path, options) {
      const response = await fetch(path, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || 'Unable to load projects');
      return body;
    }

    function showAlert(message) {
      const alert = app.querySelector('[role="alert"]');
      alert.textContent = message;
      alert.hidden = !message;
    }

    function navigate(path) {
      history.pushState({}, '', path);
      render();
    }

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) {
        app.innerHTML = '<h1>Loading project…</h1><button type="button">Projects</button><div role="alert" hidden></div>';
        app.querySelector('button').onclick = () => navigate('/');
        try {
          const project = await api('/api/projects/' + match[1]);
          if (location.pathname !== '/projects/' + match[1]) return;
          app.querySelector('h1').textContent = project.name;
          document.title = project.name + ' · Workboard';
        } catch (error) {
          showAlert(error.message);
        }
        return;
      }
      document.title = 'Workboard';
      app.innerHTML = `
        <h1>Workboard</h1>
        <form>
          <label for="project-name">Project name</label>
          <div class="fields"><input id="project-name" name="name" type="text"><button type="submit">Create project</button></div>
        </form>
        <div role="alert" hidden></div>
        <div id="projects"></div>`;
      const form = app.querySelector('form');
      const input = app.querySelector('input');
      const projects = app.querySelector('#projects');
      function addRow(project) {
        const row = document.createElement('div');
        row.className = 'project-row';
        row.dataset.testid = 'project-row';
        const name = document.createElement('span');
        name.textContent = project.name;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Open project';
        button.onclick = () => navigate('/projects/' + project.id);
        row.append(name, button);
        projects.append(row);
      }
      // Keep initial loading ahead of creation so each row appears exactly once.
      const loaded = api('/api/projects').then(items => items.forEach(addRow));
      loaded.catch(error => showAlert(error.message));
      form.onsubmit = async event => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) return showAlert('Project name is required');
        const button = form.querySelector('button');
        button.disabled = true;
        showAlert('');
        try {
          await loaded;
          const project = await api('/api/projects', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
          });
          addRow(project);
          input.value = '';
          input.focus();
        } catch (error) {
          showAlert(error.message);
        } finally {
          button.disabled = false;
        }
      };
    }
    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

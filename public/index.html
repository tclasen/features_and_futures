<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Workboard</h1>
      <p id="alert" role="alert" hidden></p>
      <section id="project-list">
        <form id="create-project" novalidate>
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
        </form>
        <h2>Projects</h2>
        <div class="project-filter">
          <label for="project-filter">Project filter</label>
          <select id="project-filter">
            <option value="active">Active</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div id="projects"></div>
        <p id="empty" hidden>No matching projects.</p>
      </section>
      <section id="project-detail" hidden>
        <button id="back" type="button">Projects</button>
        <p id="archived-notice" hidden>Archived project</p>
        <h2>Tasks</h2>
        <form id="create-task" novalidate>
          <label for="task-title">Task title</label>
          <div class="form-controls">
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit">Create task</button>
          </div>
        </form>
        <div class="task-filter">
          <label for="task-filter">Task filter</label>
          <select id="task-filter">
            <option value="all">All</option>
            <option value="open">Open</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div id="tasks"></div>
        <p id="tasks-empty" hidden>No matching tasks.</p>
      </section>
    </main>
  </body>
</html>

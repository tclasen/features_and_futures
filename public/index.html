<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <section id="projects-view">
        <h1>Workboard</h1>
        <form id="project-form" novalidate>
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
        </form>
        <p id="list-alert" role="alert" hidden></p>
        <div id="project-list" aria-label="Projects"></div>
      </section>
      <section id="project-view" hidden>
        <button id="back-button" type="button">Projects</button>
        <h1 id="project-heading"></h1>
        <p id="detail-alert" role="alert" hidden></p>
      </section>
    </main>
  </body>
</html>

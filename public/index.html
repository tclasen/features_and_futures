async function render(){if(location.pathname==='/directory'){await renderDirectory();return}const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);if(match){const list=await(await fetch('/api/projects')).json(),p=list.find(x=>String(x.id)===match[1]);if(!p){app.innerHTML='<h1>Project not found</h1><button id="back">Projects</button>';document.querySelector('#back').onclick=()=>go('/');return}const locked=!!p.archived;app.innerHTML=`<button id="back">Projects</button><button id="download-project" type="button">Download project</button>${locked?'<p>Archived project</p>':''}<h1>${esc(p.name)}</h1><form id="rename-project"><div><label for="new-project-name">New project name</label><input id="new-project-name" type="text" ${locked?'disabled':''}></div><button ${locked?'disabled':''}>Rename project</button></form><div id="rename-alert" class="alert" role="alert" hidden></div><form id="create-task"><div><label for="task-title">Task title</label><input id="task-title" type="text"></div><button ${locked?'disabled':''}>Create task</button></form><div id="alert" class="alert" role="alert" hidden></div><div class="filters"><label for="default-task-priority">Default task priority</label><select id="default-task-priority" ${locked?'disabled':''}><option ${p.defaultPriority==='Low'?'selected':''}>Low</option><option ${p.defaultPriority==='Normal'?'selected':''}>Normal</option><option ${p.defaultPriority==='High'?'selected':''}>High</option></select><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select><label for="priority-filter">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select><form id="due-range"><div><label for="due-from">Due from</label><input id="due-from" type="text"></div><div><label for="due-through">Due through</label><input id="due-through" type="text"></di k-row"><span>${esc(t.title)}</span><label><input class="task-check" type="checkbox" aria-label="Complete ${esc(t.title)}" data-id="${t.id}" ${t.completed?'checked':''} ${locked||!!t.deleted?'disabled':''}></label><label>Task priority<select class="task-priority" data-id="${t.id}" ${locked||!!t.deleted?'disabled':''}><option ${t.priority==='Low'?'selected':''}>Low</option><option ${t.priority==='Normal'?'selected':''}>Normal</option><option ${t.priority==='High'?'selected':''}>High</option></select></label><form class="rename-task" data-id="${t.id}"><div><label for="new-task-${t.id}">New task title</label><input id="new-task-${t.id}" type="text" value="${esc(t.title)}" ${locked||!!t.deleted?'disabled':''}></div><button ${locked||!!t.deleted?'disabled':''}>Rename task</button></form><form class="due-date" data-id="${t.id}"><div><label for="due-${t.id}">Task due date</label><input id="due-${t.id}" type="text" value="${esc(t.dueDate||'')}" ${locked||!!t.deleted?'disabled':''}></div><button ${locked||!!t.deleted?'disabled':''}>Save due date</button></form><form class="task-notes" data-id="${t.id}"><div><label for="notes-${t.id}">Task notes</label><textarea id="notes-${t.id}" ${locked||!!t.deleted?'disabled':''}>${esc(t.notes||'')}</textarea></div><button ${locked||!!t.deleted?'disabled':''}>Save notes</button></form><div><label for="destination-${t.id}">Destination project</label><select id="destination-${t.id}" class="destination" data-id="${t.id}" ${locked||!!t.deleted||!list.some(x=>!x.archived&&String(x.id)!==match[1])?'disabled':''}>${list.filter(x=>!x.archived&&String(x.id)!==match[1]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="move-task" data-id="${t.id}" ${locked||!!t.deleted||!list.some(x=>!x.archived&&String(x.id)!==match[1])?'disabled':''}>Move task</button><button class="task-state" data-id="${t.id}" data-action="${t.deleted?'restore':'delete'}" ${locked?'disabled':''}>${t.deleted?'Restore task':'Delete task'}</ );tasks.find(t=>String(t.id)===s.dataset.id).priority=s.value;draw()});document.querySelectorAll('.task-check').forEach(b=>b.onchange=async()=>{await fetch(`/api/projects/${match[1]}/tasks/${b.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:b.checked})});tasks.find(t=>String(t.id)===b.dataset.id).completed=+b.checked;draw()});document.querySelectorAll('.rename-task').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const id=form.dataset.id,input=form.querySelector('input'),alert=document.querySelector('#task-rename-alert'),title=input.value.trim();if(!title){alert.textContent='Task title is required';alert.hidden=false;return}const response=await fetch(`/api/projects/${match[1]}/tasks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(response.ok){tasks.find(t=>String(t.id)===id).title=title;alert.hidden=true;draw()}})};document.querySelector('#task-filter').onchange=draw;document.querySelector('#priority-filter').onchange=draw;document.querySelector('#due-range').onsubmit=e=>{e.preventDefault();const from=document.querySelector('#due-from').value.trim(),through=document.querySelector('#due-through').value.trim(),alert=document.querySelector('#due-alert'),valid=s=>!s||(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s)&&(()=>{const [y,m,d]=s.split('-').map(Number);if(y<1||m<1||m>12)return false;const leap=y%4===0&&(y%100!==0||y%400===0);return d>=1&&d<=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][m-1]})());if(!valid(from)||!valid(through)){alert.textContent='Due range must use valid YYYY-MM-DD dates';alert.hidden=false;return}if(from&&through&&from>through){alert.textContent='Due from must not be after Due through';alert.hidden=false;return}appliedFrom=from;appliedThrough=through;alert.hidden=true;draw()};document.querySelector('#default-task-priority').onchange=async e=>{const value=e.target.value;const r=await fetch(`/api/projects/${match[1]}`,{method:'PATCH',hea const projects=await(await fetch('/api/projects')).json();app.innerHTML=`<h1>Workboard</h1><form id="create"><div><label for="project-name">Project name</label><input id="project-name" type="text"></div><button>Create project</button></form><div id="alert" class="alert" role="alert" hidden></div><form id="import-project"><div><label for="project-json">Project JSON</label><textarea id="project-json"></textarea></div><div><label for="imported-project-name">Imported project name</label><input id="imported-project-name" type="text"></div><button>Import project</button></form><div id="import-alert" class="alert" role="alert" hidden></div><p><button id="open-directory" type="button">Task directory</button></p><form id="project-search"><div><label for="project-search-query">Project search</label><input id="project-search-query" type="text"></div><button>Search projects</button></form><div class="filters"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div><div id="projects" class="rows"></div>`;document.querySelector('#open-directory').onclick=()=>go('/directory');let projectQuery='';document.querySelector('#import-project').onsubmit=async e=>{e.preventDefault();const json=document.querySelector('#project-json'),name=document.querySelector('#imported-project-name'),alert=document.querySelector('#import-alert');const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({json:json.value,name:name.value})});if(r.ok){const x=await r.json();go(`/projects/${x.id}`)}else{const x=await r.json();alert.textContent=x.error||'Invalid project JSON';alert.hidden=false}};document.querySelector('#project-search').onsubmit=e=>{e.preventDefault();projectQuery=document.querySelector('#project-search-query').value.trim();draw()};const draw=()=>{const archived=document.querySelector('#project-filter').value==='Archived',shown=projects.filter(p=>!!p.arch async function renderDirectory(){const rows=await(await fetch('/api/directory')).json();app.innerHTML=`<button id="back">Projects</button><h1>Task directory</h1><div class="filters"><label for="project-scope">Project scope</label><select id="project-scope"><option>Active</option><option>Archived</option></select><label for="directory-task-filter">Task filter</label><select id="directory-task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select><label for="directory-priority-filter">Priority filter</label><select id="directory-priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></div><form id="directory-search"><div><label for="directory-query">Directory search</label><input id="directory-query"></div><button>Search directory</button></form><form id="directory-range"><div><label for="directory-from">Due from</label><input id="directory-from"></div><div><label for="directory-through">Due through</label><input id="directory-through"></div><button>Apply due range</button></form><div id="directory-alert" class="alert" role="alert" hidden></div><button id="complete-visible" type="button">Complete visible tasks</button><button id="reopen-visible" type="button">Reopen visible tasks</button><div id="directory-empty" role="status" hidden>No matching tasks</div><div id="directory-rows" class="rows"></div>`;document.querySelector('#back').onclick=()=>go('/');let query='',from='',through='';const draw=()=>{const scope=document.querySelector('#project-scope').value,f=document.querySelector('#directory-task-filter').value,priority=document.querySelector('#directory-priority-filter').value;const visible=rows.filter(t=>!!t.archived===(scope==='Archived')&&(f==='Deleted'?!!t.deleted:!t.deleted&&(f==='All'||(f==='Open'&&!t.completed)||(f==='Completed'&&t.completed)))&&(priority==='All'||priority===t.priority)&&(!from&&!through||!!t.dueDate&&(!from||t.dueDate>=from)&&(!throu y%400===0);return y>=1&&m>=1&&m<=12&&d>=1&&d<=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][m-1]})()),alert=document.querySelector('#directory-alert');if(!valid(a)||!valid(b)){alert.textContent='Due range must use valid YYYY-MM-DD dates';alert.hidden=false;return}if(a&&b&&a>b){alert.textContent='Due from must not be after Due through';alert.hidden=false;return}from=a;through=b;alert.hidden=true;draw()};['project-scope','directory-task-filter','directory-priority-filter'].forEach(id=>document.querySelector('#'+id).onchange=draw);draw()}

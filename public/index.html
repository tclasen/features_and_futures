<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header"><h1><a href="/">Workboard</a></h1></header>
    <section id="project-list" aria-labelledby="list-heading">
      <h2 id="list-heading">Projects</h2>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <div class="create-controls">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
        <p id="error-message" role="alert" hidden></p>
      </form>
      <label for="project-search">Project search</label>
      <input id="project-search" type="text">
      <button id="search-projects" type="button">Search projects</button>
      <label for="project-filter">Project filter</label>
      <select id="project-filter"><option>Active</option><option>Archived</option></select>
      <div id="projects" aria-live="polite"></div>
    </section>
    <section id="project-detail" hidden>
      <button id="back-button" type="button">Projects</button>
      <h2 id="detail-name"></h2>
      <p id="archived-notice" hidden>Archived project</p>
      <form id="rename-form">
        <label for="new-project-name">New project name</label>
        <div class="create-controls">
          <input id="new-project-name" type="text" autocomplete="off">
          <button type="submit">Rename project</button>
        </div>
        <p id="rename-error" role="alert" hidden></p>
      </form>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <div class="create-controls">
          <input id="task-title" name="title" type="text" autocomplete="off">
          <button type="submit">Create task</button>
        </div>
        <p id="task-error-message" role="alert" hidden></p>
      </form>
      <label for="task-search">Task search</label>
      <input id="task-search" type="text">
      <button id="search-tasks" type="button">Search tasks</button>
      <label for="default-task-priority">Default task priority</label>
      <select id="default-task-priority"><option>Low</option><option selected>Normal</option><option>High</option></select>
      <label for="task-filter">Task filter</label>
      <select id="task-filter">
        <option>All</option>
        <option>Open</option>
        <option>Completed</option>
      </select>
      <label for="priority-filter">Priority filter</label>
      <select id="priority-filter">
        <option>All</option>
        <option>Low</option>
        <option>Normal</option>
        <option>High</option>
      </select>
      <label for="due-from">Due from</label>
      <input id="due-from" type="text">
      <label for="due-through">Due through</label>
      <input id="due-through" type="text">
      <button id="apply-due-range" type="button">Apply due range</button>
      <p id="task-rename-error" role="alert" hidden></p>
      <div id="tasks" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>

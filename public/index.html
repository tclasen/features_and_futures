async function render(){const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);if(match){const list=await(await fetch('/api/projects')).json(),p=list.find(x=>String(x.id)===match[1]);if(!p){app.innerHTML='<h1>Project not found</h1><button id="back">Projects</button>';document.querySelector('#back').onclick=()=>go('/');return}const locked=!!p.archived;app.innerHTML=`<button id="back">Projects</button>${locked?'<p>Archived project</p>':''}<h1>${esc(p.name)}</h1><form id="rename-project"><div><label for="new-project-name">New project name</label><input id="new-project-name" type="text" ${locked?'disabled':''}></div><button ${locked?'disabled':''}>Rename project</button></form><div id="rename-alert" class="alert" role="alert" hidden></div><form id="create-task"><div><label for="task-title">Task title</label><input id="task-title" type="text"></div><button ${locked?'disabled':''}>Create task</button></form><div id="alert" class="alert" role="alert" hidden></div><div class="filters"><label for="default-task-priority">Default task priority</label><select id="default-task-priority" ${locked?'disabled':''}><option ${p.defaultPriority==='Low'?'selected':''}>Low</option><option ${p.defaultPriority==='Normal'?'selected':''}>Normal</option><option ${p.defaultPriority==='High'?'selected':''}>High</option></select><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select><label for="priority-filter">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select><form id="due-range"><div><label for="due-from">Due from</label><input id="due-from" type="text"></div><div><label for="due-through">Due through</label><input id="due-through" type="text"></div><button>Apply due range</button></form></div><form id="task-search"><div><label for="task-search-query">Task search</label><input id="task-search-query" type="text"></div><button>Search tasks</button></form><div id="task-rename-alert" class="alert" role="alert" hidden></div><div id="due-alert" class="alert" role="alert" hidden></div><div id="tasks" class="rows"></div>`;document.querySelector('#back').onclick=()=>go('/');document.querySelector('#rename-project').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#new-project-name'),alert=document.querySelector('#rename-alert'),name=input.value.trim();if(!name){alert.textContent='Project name is required';alert.hidden=false;return}const response=await fetch(`/api/projects/${match[1]}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(response.ok){document.querySelector('h1').textContent=name;input.value='';alert.hidden=true}};let tasks=await(await fetch(`/api/projects/${match[1]}/tasks`)).json();let appliedFrom='',appliedThrough='',taskQuery='';document.querySelector('#task-search').onsubmit=e=>{e.preventDefault();taskQuery=document.querySelector('#task-search-query').value.trim();draw()};document.querySelector('#due-from').value=appliedFrom;document.querySelector('#due-through').value=appliedThrough;const draw=()=>{const f=document.querySelector('#task-filter').value,priority=document.querySelector('#priority-filter').value;document.querySelector('#tasks').innerHTML=tasks.filter(t=>(f==='All'||(f==='Open'&&!t.completed)||(f==='Completed'&&t.completed))&&(priority==='All'||t.priority===priority)&&(!appliedFrom&&!appliedThrough||!!t.dueDate&&(!appliedFrom||t.dueDate>=appliedFrom)&&(!appliedThrough||t.dueDate<=appliedThrough))&&fold(t.title).includes(fold(taskQuery))).map(t=>`<div class="row" data-testid="task-row"><span>${esc(t.title)}</span><label><input class="task-check" type="checkbox" aria-label="Complete ${esc(t.title)}" data-id="${t.id}" ${t.completed?'checked':''} ${locked?'disabled':''}></label><label>Task priority<select class="task-priority" data-id="${t.id}" ${locked?'disabled':''}><option ${t.priority==='Low'?'selected':''}>Low</option><option ${t.priority==='Normal'?'selected':''}>Normal</option><option ${t.priority==='High'?'selected':''}>High</option></select></label><form class="rename-task" data-id="${t.id}"><div><label for="new-task-${t.id}">New task title</label><input id="new-task-${t.id}" type="text" value="${esc(t.title)}" ${locked?'disabled':''}></div><button ${locked?'disabled':''}>Rename task</button></form><form class="due-date" data-id="${t.id}"><div><label for="due-${t.id}">Task due date</label><input id="due-${t.id}" type="text" value="${esc(t.dueDate||'')}" ${locked?'disabled':''}></div><button ${locked?'disabled':''}>Save due date</button></form><div><label for="destination-${t.id}">Destination project</label><select id="destination-${t.id}" class="destination" data-id="${t.id}" ${locked||!list.some(x=>!x.archived&&String(x.id)!==match[1])?'disabled':''}>${list.filter(x=>!x.archived&&String(x.id)!==match[1]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="move-task" data-id="${t.id}" ${locked||!list.some(x=>!x.archived&&String(x.id)!==match[1])?'disabled':''}>Move task</button></div></div>`).join('');document.querySelectorAll('.move-task').forEach(b=>b.onclick=async()=>{const select=document.querySelector(`#destination-${b.dataset.id}`);if(!select.value)return;const r=await fetch(`/api/projects/${match[1]}/tasks/${b.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({moveTo:Number(select.value)})});if(r.ok){tasks=tasks.filter(t=>String(t.id)!==b.dataset.id);draw()}});document.querySelectorAll('.due-date').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const id=form.dataset.id,input=form.querySelector('input'),value=input.value.trim(),alert=document.querySelector('#due-alert');const response=await fetch(`/api/projects/${match[1]}/tasks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({dueDate:value})});if(!response.ok){alert.textContent='Due date must be a valid YYYY-MM-DD date';alert.hidden=false;return}tasks.find(t=>String(t.id)===id).dueDate=value||null;alert.hidden=true;draw()});document.querySelectorAll('.task-priority').forEach(s=>s.onchange=async()=>{await fetch(`/api/projects/${match[1]}/tasks/${s.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:s.value})});tasks.find(t=>String(t.id)===s.dataset.id).priority=s.value;draw()});document.querySelectorAll('.task-check').forEach(b=>b.onchange=async()=>{await fetch(`/api/projects/${match[1]}/tasks/${b.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:b.checked})});tasks.find(t=>String(t.id)===b.dataset.id).completed=+b.checked;draw()});document.querySelectorAll('.rename-task').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const id=form.dataset.id,input=form.querySelector('input'),alert=document.querySelector('#task-rename-alert'),title=input.value.trim();if(!title){alert.textContent='Task title is required';alert.hidden=false;return}const response=await fetch(`/api/projects/${match[1]}/tasks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(response.ok){tasks.find(t=>String(t.id)===id).title=title;alert.hidden=true;draw()}})};document.querySelector('#task-filter').onchange=draw;document.querySelector('#priority-filter').onchange=draw;document.querySelector('#due-range').onsubmit=e=>{e.preventDefault();const from=document.querySelector('#due-from').value.trim(),through=document.querySelector('#due-through').value.trim(),alert=document.querySelector('#due-alert'),valid=s=>!s||(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s)&&(()=>{const [y,m,d]=s.split('-').map(Number);if(y<1||m<1||m>12)return false;const leap=y%4===0&&(y%100!==0||y%400===0);return d>=1&&d<=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][m-1]})());if(!valid(from)||!valid(through)){alert.textContent='Due range must use valid YYYY-MM-DD dates';alert.hidden=false;return}if(from&&through&&from>through){alert.textContent='Due from must not be after Due through';alert.hidden=false;return}appliedFrom=from;appliedThrough=through;alert.hidden=true;draw()};document.querySelector('#default-task-priority').onchange=async e=>{const value=e.target.value;const r=await fetch(`/api/projects/${match[1]}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({defaultPriority:value})});if(r.ok)p.defaultPriority=value};draw();document.querySelector('#create-task').onsubmit=async e=>{e.preventDefault();const title=document.querySelector('#task-title').value.trim(),a=document.querySelector('#alert');if(!title){a.textContent='Task title is required';a.hidden=false;return}const r=await fetch(`/api/projects/${match[1]}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(r.ok){tasks.push(await r.json());document.querySelector('#task-title').value='';a.hidden=true;draw()}};return}
const projects=await(await fetch('/api/projects')).json();app.innerHTML=`<h1>Workboard</h1><form id="create"><div><label for="project-name">Project name</label><input id="project-name" type="text"></div><button>Create project</button></form><div id="alert" class="alert" role="alert" hidden></div><form id="project-search"><div><label for="project-search-query">Project search</label><input id="project-search-query" type="text"></div><button>Search projects</button></form><div class="filters"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div><div id="projects" class="rows"></div>`;let projectQuery='';document.querySelector('#project-search').onsubmit=e=>{e.preventDefault();projectQuery=document.querySelector('#project-search-query').value.trim();draw()};const draw=()=>{const archived=document.querySelector('#project-filter').value==='Archived',shown=projects.filter(p=>!!p.archived===archived&&fold(p.name).includes(fold(projectQuery)));document.querySelector('#projects').innerHTML=shown.map(p=>`<div class="row" data-testid="project-row"><span>${esc(p.name)} <span data-testid="project-summary">${p.completedCount}/${p.totalCount} completed</span></span><div class="actions"><button data-open="${p.id}">Open project</button>${archived?`<button data-action="restore" data-id="${p.id}">Restore project</button>`:`<button data-action="archive" data-id="${p.id}">Archive project</button>`}</div></div>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(`/projects/${b.dataset.open}`));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{await fetch(`/api/projects/${b.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action})});const p=projects.find(x=>String(x.id)===b.dataset.id);p.archived=b.dataset.action==='archive';draw()})};document.querySelector('#project-filter').onchange=draw;d

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182230; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 760px; margin: 56px auto; padding: 0 24px; }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    form, .project-row { display: flex; gap: 12px; align-items: center; }
    form { margin-bottom: 24px; }
    input { box-sizing: border-box; flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #aeb8c5; border-radius: 6px; font: inherit; }
    button { padding: 10px 15px; border: 0; border-radius: 6px; background: #2458c6; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #19449e; }
    .project-row { justify-content: space-between; padding: 14px 16px; margin: 10px 0; background: white; border: 1px solid #dce2e9; border-radius: 8px; }
    .alert { margin: -12px 0 18px; color: #a51f2b; }
    @media (max-width: 500px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="container">
    <section id="project-list" hidden>
      <h1>Workboard</h1>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <div class="form-row">
          <input id="project-name" name="name" type="text">
          <button type="submit">Create project</button>
        </div>
      </form>
      <p id="alert" role="alert" hidden></p>
      <label for="project-filter">Project filter</label>
      <select id="project-filter"><option>Active</option><option>Archived</option></select>
      <div id="projects"></div>
    </section>
    <section id="project-detail" hidden>
      <button id="back" type="button">Projects</button>
      <h1 id="project-title"></h1>
      <p id="archived-label" hidden>Archived project</p>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <div class="form-row">
          <input id="task-title" name="title" type="text">
          <button type="submit">Create task</button>
        </div>
      </form>
      <p id="task-alert" role="alert" hidden></p>
      <label for="task-filter">Task filter</label>
      <select id="task-filter">
        <option>All</option><option>Open</option><option>Completed</option>
      </select>
      <div id="tasks"></div>
    </section>
  </main>
</body>
</html>

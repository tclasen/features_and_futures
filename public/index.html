<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f4f6fa; }
      body { margin: 0; }
      main { max-width: 760px; margin: 56px auto; padding: 0 24px; }
      h1 { margin: 0 0 28px; font-size: 2rem; }
      form { display: flex; gap: 12px; align-items: end; margin-bottom: 24px; }
      label { display: grid; flex: 1; gap: 7px; font-weight: 600; }
      input { min-width: 0; padding: 11px 12px; border: 1px solid #aab3c2; border-radius: 6px; font: inherit; }
      button { padding: 11px 16px; border: 0; border-radius: 6px; color: white; background: #3157c8; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #2445a8; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      .project-controls { display: flex; justify-content: flex-end; margin-bottom: 20px; }
      .project-row-actions { display: flex; align-items: center; gap: 10px; }
      [data-testid="project-summary"] { color: #586174; font-size: .9rem; }
      .archived-notice { margin-top: -18px; margin-bottom: 24px; color: #586174; }
      .project-list { display: grid; gap: 10px; }
      [data-testid="project-row"] { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px; border: 1px solid #d9deea; border-radius: 8px; background: white; }
      .task-controls { display: flex; gap: 12px; align-items: end; margin: 24px 0; }
      .task-filter { max-width: 220px; }
      .task-list { display: grid; gap: 10px; }
      [data-testid="task-row"] { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid #d9deea; border-radius: 8px; background: white; }
      [data-testid="task-row"] input { width: 18px; height: 18px; }
      .error { margin: 0 0 16px; color: #a32121; }
      .back { margin-bottom: 24px; }
      @media (max-width: 520px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fa; color: #1b293d; font: 16px system-ui, sans-serif; }
    main { max-width: 760px; margin: 64px auto; padding: 32px; background: white; border: 1px solid #d9e0ea; border-radius: 12px; }
    h1 { margin-top: 0; overflow-wrap: anywhere; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; }
    input { flex: 1; min-width: 160px; border: 1px solid #8493a8; border-radius: 6px; padding: 12px; font: inherit; }
    button { background: #2257b4; color: white; border: 0; border-radius: 6px; padding: 12px 18px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 3px solid #dc8b00; outline-offset: 3px; }
    [role="alert"] { color: #a32323; margin-top: 16px; }
    #projects, #tasks { margin-top: 28px; }
    #task-form { margin-top: 24px; }
    .filter { margin-top: 24px; }
    select { padding: 10px; font: inherit; }
    .task-row { display: flex; align-items: center; gap: 12px; border-top: 1px solid #d9e0ea; padding: 16px 0; }
    .task-row input { flex: none; min-width: 0; width: 20px; height: 20px; }
    .task-row span { overflow-wrap: anywhere; min-width: 0; }
    .project-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid #d9e0ea; padding: 16px 0; }
    .project-row span { overflow-wrap: anywhere; min-width: 0; }
    .project-row button { flex-shrink: 0; }
    @media (max-width: 600px) { main { margin: 20px 12px; padding: 20px; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.getElementById('app');
    async function request(path, options) {
      const response = await fetch(path, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || 'Unable to load projects');
      return body;
    }
    function showError(message) {
      let alert = app.querySelector('[role="alert"]');
      if (!alert) {
        alert = document.createElement('p');
        alert.setAttribute('role', 'alert');
        app.append(alert);
      }
      alert.textContent = message;
      alert.hidden = false;
    }
    function addRow(project) {
      const row = document.createElement('div');
      row.className = 'project-row';
      row.dataset.testid = 'project-row';
      const name = document.createElement('span');
      name.textContent = project.name;
      const open = document.createElement('button');
      open.textContent = 'Open project';
      open.addEventListener('click', () => { location.href = '/projects/' + project.id; });
      row.append(name, open);
      document.getElementById('projects').append(row);
    }
    async function renderTasks(projectId) {
      app.insertAdjacentHTML('beforeend', '<form id="task-form"><label for="task-title">Task title</label><div class="controls"><input id="task-title" type="text"><button type="submit" disabled>Create task</button></div><p role="alert" hidden></p></form><div class="filter"><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></div><section id="tasks" aria-label="Tasks"></section>');
      const endpoint = '/api/projects/' + projectId + '/tasks';
      const form = document.getElementById('task-form');
      const input = document.getElementById('task-title');
      const button = form.querySelector('button');
      const filter = document.getElementById('task-filter');
      const list = document.getElementById('tasks');
      let tasks = await request(endpoint);
      function drawTasks() {
        list.replaceChildren();
        for (const task of tasks) {
          if (filter.value === 'Open' && task.completed) continue;
          if (filter.value === 'Completed' && !task.completed) continue;
          const row = document.createElement('div');
          row.className = 'task-row';
          row.dataset.testid = 'task-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.setAttribute('aria-label', 'Complete ' + task.title);
          const title = document.createElement('span');
          title.textContent = task.title;
          checkbox.addEventListener('change', async () => {
            checkbox.disabled = true;
            app.querySelector('[role="alert"]').hidden = true;
            try {
              const updated = await request(endpoint + '/' + task.id, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: checkbox.checked })
              });
              Object.assign(task, updated);
              drawTasks();
            } catch (error) {
              checkbox.checked = task.completed;
              showError(error.message);
            } finally { checkbox.disabled = false; }
          });
          row.append(checkbox, title);
          list.append(row);
        }
      }
      drawTasks();
      button.disabled = false;
      filter.addEventListener('change', drawTasks);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) { showError('Task title is required'); return; }
        button.disabled = true;
        app.querySelector('[role="alert"]').hidden = true;
        try {
          tasks.push(await request(endpoint, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title })
          }));
          drawTasks();
          input.value = '';
          input.focus();
        } catch (error) { showError(error.message); }
        finally { button.disabled = false; }
      });
    }
    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) {
        app.innerHTML = '<h1></h1><button id="back">Projects</button>';
        document.getElementById('back').addEventListener('click', () => { location.href = '/'; });
        try {
          const project = await request('/api/projects/' + match[1]);
          app.querySelector('h1').textContent = project.name;
          await renderTasks(project.id);
        } catch (error) { showError(error.message); }
        return;
      }
      app.innerHTML = '<h1>Workboard</h1><form><label for="project-name">Project name</label><div class="controls"><input id="project-name" name="name" type="text"><button type="submit">Create project</button></div><p role="alert" hidden></p></form><section id="projects" aria-label="Projects"></section>';
      const form = app.querySelector('form');
      const input = document.getElementById('project-name');
      const button = form.querySelector('button');
      button.disabled = true;
      try {
        for (const project of await request('/api/projects')) addRow(project);
      } catch (error) { showError(error.message); }
      button.disabled = false;
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) { showError('Project name is required'); return; }
        button.disabled = true;
        app.querySelector('[role="alert"]').hidden = true;
        try {
          const project = await request('/api/projects', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
          });
          addRow(project);
          input.value = '';
          input.focus();
        } catch (error) { showError(error.message); }
        finally { button.disabled = false; }
      });
    }
    render();
  </script>
</body>
</html>

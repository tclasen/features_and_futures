<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workboard</title><style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:800px;margin:auto;padding:56px 24px}h1{margin:0 0 28px}.form{display:flex;gap:12px;margin-bottom:24px}input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid #cbd3e1;border-radius:8px;font:inherit;background:white}button{border:0;border-radius:8px;padding:11px 16px;background:#315fe8;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;margin:10px 0;background:white;border:1px solid #e0e5ee;border-radius:10px}.row-name{font-weight:600;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:8px}.back{margin-bottom:24px}[role=alert]{color:#b42318}
</style></head><body><main class="shell" id="app"></main><script type="module">
const app=document.querySelector('#app'), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,opts){const r=await fetch(url,opts);if(!r.ok)throw Error((await r.json()).error||'Request failed');return r.status===204?null:r.json()}
async function render(){const match=location.pathname.match(/^\/projects\/([^/]+)\/?$/);if(match){const id=decodeURIComponent(match[1]);let p,tasks;try{p=await request('/api/projects/'+encodeURIComponent(id));tasks=await request(`/api/projects/${encodeURIComponent(id)}/tasks`)}catch{app.innerHTML='<h1>Project not found</h1><button>Projects</button>';app.querySelector('button').onclick=()=>location.href='/';return}
app.innerHTML=`<button class="back">Projects</button><h1>${esc(p.name)}</h1>${p.archived?'<p>Archived project</p>':''}<form class="form rename-form"><input type="text" aria-label="New project name" name="name" ${p.archived?'disabled':''}><button ${p.archived?'disabled':''}>Rename project</button></form><div class="rename-alert" aria-live="polite"></div><form class="form task-form"><input type="text" aria-label="Task title" name="title"><button ${p.archived?'disabled':''}>Create task</button></form><div class="alert-slot" aria-live="polite"></div><label>Task filter <select aria-label="Task filter"><option>All</option><option>Open</option><option>Completed</option></select></label> <label>Priority filter <select aria-label="Priority filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label><section aria-label="Tasks"></section>`;
app.querySelector('.back').onclick=()=>location.href='/';app.querySelector('.rename-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,name=new FormData(form).get('name').trim(),slot=app.querySelector('.rename-alert');if(!name){slot.innerHTML='<p role="alert">Project name is required</p>';return}try{p=await request(`/api/projects/${encodeURIComponent(id)}/rename`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});app.querySelector('h1').textContent=p.name;form.reset();slot.innerHTML=''}catch(err){slot.innerHTML=`<p role="alert">${esc(err.message)}</p>`}};const filter=app.querySelector('[aria-label="Task filter"]'),priorityFilter=app.querySelector('[aria-label="Priority filter"]'),section=app.querySelector('section');function alertTask(message){app.querySelector('.alert-slot').innerHTML=message?`<p role="alert">${esc(message)}</p>`:''}function draw(){section.innerHTML=tasks.filter(t=>(filter.value==='All'||(filter.value==='Completed')===Boolean(t.completed))&&(priorityFilter.value==='All'||priorityFilter.value===t.priority)).map(t=>`<div class="row" data-testid="task-row"><span class="row-name">${esc(t.title)}</span><span class="actions"><input type="checkbox" aria-label="Complete ${esc(t.title)}" data-id="${esc(t.id)}" ${t.completed?'checked':''} ${p.archived?'disabled':''}><select aria-label="Task priority" data-priority="${esc(t.id)}" ${p.archived?'disabled':''}><option ${t.priority==='Low'?'selected':''}>Low</option><option ${t.priority==='Normal'?'selected':''}>Normal</option><option ${t.priority==='High'?'selected':''}>High</option></select><input type="text" aria-label="New task title" data-rename-input="${esc(t.id)}" ${p.archived?'disabled':''}><button data-rename="${esc(t.id)}" ${p.archived?'disabled':''}>Rename task</button></span></div>`).join('');section.querySelectorAll('[data-rename]').forEach(button=>button.onclick=async()=>{const taskId=button.dataset.rename,input=section.querySelector(`[data-rename-input="${CSS.escape(taskId)}"]`),title=input.value.trim();if(!title){alertTask('Task title is required');return}try{await request(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(taskId)}/rename`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title})});tasks.find(t=>t.id===taskId).title=title;alertTask('');draw()}catch(err){alertTask(err.message)}});section.querySelectorAll('[data-id]').forEach(box=>box.onchange=async()=>{try{await request(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(box.dataset.id)}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({completed:box.checked})});tasks.find(t=>t.id===box.dataset.id).completed=box.checked?1:0;draw()}catch{box.checked=!box.checked}});section.querySelectorAll('[data-priority]').forEach(select=>select.onchange=async()=>{const task=tasks.find(t=>t.id===select.dataset.priority),previous=task.priority;try{await request(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(task.id)}/priority`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({priority:select.value})});task.priority=select.value;draw()}catch{select.value=previous}})}filter.onchange=draw;priorityFilter.onchange=draw;draw();app.querySelector('.task-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,title=new FormData(f).get('title').trim();if(!title){app.querySelector('.alert-slot').innerHTML='<p role="alert">Task title is required</p>';return}try{tasks.push(await request(`/api/projects/${encodeURIComponent(id)}/tasks`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title})}));f.reset();app.querySelector('.alert-slot').innerHTML='';draw()}catch(err){app.querySelector('.alert-slot').innerHTML=`<p role="alert">${esc(err.message)}</p>`}};return}
const filterValue=new URLSearchParams(location.search).get('filter')==='Archived'?'Archived':'Active',projects=await request('/api/projects?filter='+filterValue);app.innerHTML=`<h1>Workboard</h1><form class="form"><input type="text" aria-label="Project name" name="name"><button>Create project</button></form><div class="alert-slot" aria-live="polite"></div><label>Project filter <select aria-label="Project filter"><option ${filterValue==='Active'?'selected':''}>Active</option><option ${filterValue==='Archived'?'selected':''}>Archived</option></select></label><section aria-label="Projects">${projects.map(p=>`<div class="row" data-testid="project-row"><span class="row-name">${esc(p.name)}</span><span class="actions"><span data-testid="project-summary">${p.completed}/${p.total} completed</span><button data-open="${esc(p.id)}">Open project</button><button data-state="${esc(p.id)}">${p.archived?'Restore project':'Archive project'}</button></span></div>`).join('')}</section>`;
app.querySelector('select').onchange=e=>{location.search='?filter='+encodeURIComponent(e.target.value)};app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>location.href='/projects/'+encodeURIComponent(b.dataset.open));app.querySelectorAll('[data-state]').forEach(b=>b.onclick=async()=>{await request(`/api/projects/${encodeURIComponent(b.dataset.state)}/${filterValue==='Active'?'archive':'restore'}`,{method:'POST'});render()});app.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,name=new FormData(f).get('name').trim();if(!name){app.querySelector('.alert-slot').innerHTML='<p role="alert">Project name is required</p>';return}await request('/api/projects',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})});render()}}
render();
</script></body></html>

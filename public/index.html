<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workboard</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#172033;background:#f5f7fb}body{margin:0;padding:48px 20px}main{max-width:760px;margin:auto}h1{margin-top:0}form,.project-row,.project-detail,.task-row{background:white;border:1px solid #dce2eb;border-radius:10px;padding:18px}form{display:flex;align-items:end;gap:12px;flex-wrap:wrap}label{display:grid;gap:6px;flex:1;min-width:200px;font-weight:600}input,select{font:inherit;padding:10px;border:1px solid #aab4c3;border-radius:6px}button{font:inherit;padding:10px 14px;border:0;border-radius:6px;color:white;background:#3157c8;cursor:pointer}button:hover{background:#2445a7}button:disabled{opacity:.55;cursor:not-allowed}.project-list{display:grid;gap:10px;margin-top:20px}.project-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}[role=alert]{color:#b42318;margin:12px 0}.back{margin-bottom:20px}.task-row{display:flex;align-items:center;gap:10px;padding:14px 18px}.task-row[hidden]{display:none}.task-row input{padding:0}.summary{font-size:.9rem;color:#46536a}
</style></head><body><main id="app"><h1>Workboard</h1><p>Loading…</p></main><script>
const app=document.querySelector('#app');
let taskFilterSelection='All',priorityFilterSelection='All',dueFrom='',dueThrough='',appliedDueFrom='',appliedDueThrough='';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,options){const r=await fetch(url,options);const b=await r.json();if(!r.ok)throw Error(b.error||'Request failed');return b}
const post=(url,body={})=>request(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
async function showList(error=''){const projects=await request('/api/projects');const filter=new URLSearchParams(location.search).get('filter')||'Active';const shown=projects.filter(p=>Boolean(p.archived)===(filter==='Archived'));
app.innerHTML=`<h1>Workboard</h1><label>Project filter<select id="project-filter"><option${filter==='Active'?' selected':''}>Active</option><option${filter==='Archived'?' selected':''}>Archived</option></select></label><form id="create-form"><label>Project name<input name="name" type="text" autocomplete="off"></label><button>Create project</button></form><div id="message" role="alert" aria-live="polite">${esc(error)}</div><section class="project-list" aria-label="Projects">${shown.map(p=>`<div class="project-row" data-testid="project-row"><span>${esc(p.name)}</span><span class="summary" data-testid="project-summary">${p.completed_count}/${p.total_count} completed</span><div class="actions"><button type="button" data-open="${esc(p.id)}">Open project</button>${p.archived?`<button type="button" data-action="restore" data-id="${esc(p.id)}">Restore project</button>`:`<button type="button" data-action="archive" data-id="${esc(p.id)}">Archive project</button>`}</div></div>`).join('')}</section>`;
app.querySelector('#project-filter').onchange=e=>{history.replaceState({},'',`/?filter=${e.target.value}`);showList()};
app.querySelector('#create-form').onsubmit=async e=>{e.preventDefault();try{await post('/api/projects',{name:new FormData(e.currentTarget).get('name')});history.replaceState({},'','/');await showList()}catch(x){app.querySelector('#message').textContent=x.message}};
app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{taskFilterSelection='All';priorityFilterSelection='All';dueFrom=dueThrough=appliedDueFrom=appliedDueThrough='';history.pushState({},'',`/projects/${encodeURIComponent(b.dataset.open)}`);render()});
app.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{await post(`/api/projects/${encodeURIComponent(b.dataset.id)}/${b.dataset.action}`);showList()});}
async function showProject(id){const back=()=>{history.pushState({},'','/');render()};try{const project=await request(`/api/projects/${encodeURIComponent(id)}`);const tasks=await request(`/api/projects/${encodeURIComponent(id)}/tasks`);const archived=Boolean(project.archived);
app.innerHTML=`<button class="back">Projects</button><section class="project-detail"><h1>${esc(project.name)}</h1>${archived?'<p>Archived project</p>':''}</section><form id="rename-form"><label>New project name<input name="name" type="text" autocomplete="off"${archived?' disabled':''}></label><button${archived?' disabled':''}>Rename project</button></form><label>Default task priority<select id="default-priority"${archived?' disabled':''}><option${project.default_priority==='Low'?' selected':''}>Low</option><option${project.default_priority==='Normal'?' selected':''}>Normal</option><option${project.default_priority==='High'?' selected':''}>High</option></select></label><form id="task-form"><label>Task title<input name="title" type="text" autocomplete="off"${archived?' disabled':''}></label><button${archived?' disabled':''}>Create task</button></form><div id="task-message" role="alert" aria-live="polite"></div><div class="actions" style="margin-top:18px"><label>Task filter<select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></label><label>Priority filter<select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label></div><div class="actions"><label>Due from<input id="due-from" type="text" value="${esc(dueFrom)}"></label><label>Due through<input id="due-through" type="text" value="${esc(dueThrough)}"></label><button type="button" id="apply-due-range">Apply due range</button></div><section class="project-list" aria-label="Tasks">${tasks.map(t=>`<div class="task-row" data-testid="task-row"><input type="checkbox" ${t.completed?'checked':''}${archived?' disabled':''} aria-label="Complete ${esc(t.title)}" data-task="${esc(t.id)}"><span>${esc(t.title)}</span><label>Task due date<input type="text" data-due-date="${esc(t.id)}" value="${esc(t.due_date||'')}"${archived?' disabled':''}></label><button type="button" data-save-due="${esc(t.id)}"${archived?' disabled':''}>Save due date</button><label>Task priority<select data-priority="${esc(t.id)}"${archived?' disabled':''}><option${t.priority==='Low'?' selected':''}>Low</option><option${t.priority==='Normal'?' selected':''}>Normal</option><option${t.priority==='High'?' selected':''}>High</option></select></label><form class="task-rename" data-rename="${esc(t.id)}"><label>New task title<input name="title" type="text" autocomplete="off"${archived?' disabled':''}></label><button${archived?' disabled':''}>Rename task</button></form></div>`).join('')}</section>`;
app.querySelector('.back').onclick=back;app.querySelector('#default-priority').onchange=async e=>{await request(`/api/projects/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({default_priority:e.target.value})})};if(!archived)app.querySelector('#rename-form').onsubmit=async e=>{e.preventDefault();try{await request(`/api/projects/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:new FormData(e.currentTarget).get('name')})});showProject(id)}catch(x){app.querySelector('#task-message').textContent=x.message}};app.querySelector('#task-filter').value=taskFilterSelection;app.querySelector('#priority-filter').value=priorityFilterSelection;const apply=()=>app.querySelectorAll('.task-row').forEach(row=>{const checked=row.querySelector('input[type=checkbox]').checked,f=app.querySelector('#task-filter').value,p=app.querySelector('#priority-filter').value,priority=row.querySelector('[data-priority]').value;const completionMatches=f==='All'||(f==='Open'&&!checked)||(f==='Completed'&&checked),date=row.querySelector('[data-due-date]').value;const dateMatches=!appliedDueFrom&&!appliedDueThrough||Boolean(date)&&(!appliedDueFrom||date>=appliedDueFrom)&&(!appliedDueThrough||date<=appliedDueThrough);row.hidden=!(completionMatches&&(p==='All'||p===priority)&&dateMatches)});app.querySelector('#task-filter').onchange=e=>{taskFilterSelection=e.target.value;apply()};app.querySelector('#priority-filter').onchange=e=>{priorityFilterSelection=e.target.value;apply()};app.querySelector('#due-from').value=dueFrom;app.querySelector('#due-through').value=dueThrough;app.querySelector('#apply-due-range').onclick=()=>{const from=app.querySelector('#due-from').value.trim(),through=app.querySelector('#due-through').value.trim(),valid=s=>!s||(/^\\d{4}-\\d{2}-\\d{2}$/.test(s)&&(()=>{const [y,m,d]=s.split('-').map(Number),x=new Date(0);x.setUTCHours(0,0,0,0);x.setUTCFullYear(y,m-1,d);return y>=1&&x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d})());if(!valid(from)||!valid(through)){app.querySelector('#task-message').textContent='Due range must use valid YYYY-MM-DD dates';return}if(from&&through&&from>through){app.querySelector('#task-message').textContent='Due from must not be after Due through';return}dueFrom=appliedDueFrom=from;dueThrough=appliedDueThrough=through;app.querySelector('#task-message').textContent='';apply()};apply();
app.querySelectorAll('[data-save-due]').forEach(button=>button.onclick=async()=>{const field=app.querySelector(`[data-due-date="${CSS.escape(button.dataset.saveDue)}"]`);try{await request(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(button.dataset.saveDue)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({due_date:field.value})});field.value=field.value.trim()}catch(x){app.querySelector('#task-message').textContent=x.message}});app.querySelectorAll('[data-priority]').forEach(select=>select.onchange=async()=>{await request(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(select.dataset.priority)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:select.value})});apply()});app.querySelectorAll('[data-task]').forEach(box=>box.onchange=async()=>{await request(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(box.dataset.task)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:box.checked})});apply()});
app.querySelectorAll('[data-rename]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();try{await request(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(form.dataset.rename)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:new FormData(form).get('title')})});showProject(id)}catch(x){app.querySelector('#task-message').textContent=x.message}});
app.querySelector('#task-form').onsubmit=async e=>{e.preventDefault();try{await post(`/api/projects/${encodeURIComponent(id)}/tasks`,{title:new FormData(e.currentTarget).get('title')});showProject(id)}catch(x){app.querySelector('#task-message').textContent=x.message}};
}catch{app.innerHTML='<button class="back">Projects</button><h1>Project not found</h1>';app.querySelector('.back').onclick=back}}
function render(){const m=location.pathname.match(/^\/projects\/([^/]+)\/?$/);m?showProject(decodeURIComponent(m[1])):showList()}addEventListener('popstate',render);render();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182230; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 3rem 1.25rem; }
    main { max-width: 680px; margin: auto; }
    h1 { margin: 0 0 1.5rem; font-size: 2rem; }
    form { display: flex; gap: .75rem; margin-bottom: 1.5rem; }
    input { flex: 1; min-width: 0; padding: .75rem; border: 1px solid #aab4c0; border-radius: 6px; font: inherit; }
    button { padding: .7rem 1rem; border: 0; border-radius: 6px; background: #2156a5; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #163f7d; }
    button:focus-visible, input:focus-visible { outline: 3px solid #83b6ff; outline-offset: 2px; }
    .project-list { display: grid; gap: .65rem; }
    [data-testid="project-row"] { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid #dce2e9; border-radius: 8px; background: white; }
    [role="alert"] { color: #a12622; margin: .5rem 0 1rem; }
    .task-list { display: grid; gap: .65rem; }
    [data-testid="task-row"] { display: flex; align-items: center; gap: .75rem; padding: 1rem; border: 1px solid #dce2e9; border-radius: 8px; background: white; }
    [data-testid="task-row"] input { flex: none; }
    @media (max-width: 480px) { form { flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const api = async (url, options) => {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const element = (tag, text) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      return node;
    };

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) {
        const project = await api(`/api/projects/${match[1]}`);
        const back = element('button', 'Projects');
        back.type = 'button';
        back.addEventListener('click', () => { location.href = '/'; });
        const heading = element('h1', project.name);
        const rename = element('form');
        const renameInput = element('input');
        renameInput.value = project.name;
        renameInput.setAttribute('aria-label', 'Project name');
        const renameButton = element('button', 'Rename project');
        renameButton.type = 'submit';
        rename.append(renameInput, renameButton);
        rename.addEventListener('submit', async event => {
          event.preventDefault();
          const name = renameInput.value.trim();
          if (!name) { alert.textContent = 'Project name is required'; alert.hidden = false; return; }
          await api(`/api/projects/${match[1]}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
          heading.textContent = name; alert.hidden = true;
        });
        const archivedMessage = project.archived ? element('p', 'Archived project') : null;
        const form = element('form');
        const input = element('input');
        input.type = 'text';
        input.setAttribute('aria-label', 'Task title');
        const create = element('button', 'Create task');
        create.type = 'submit';
        form.append(input, create);
        if (project.archived) create.disabled = true;
        const alert = element('p');
        alert.setAttribute('role', 'alert');
        alert.hidden = true;
        const filterLabel = element('label', 'Task filter');
        const filter = element('select');
        filter.setAttribute('aria-label', 'Task filter');
        for (const value of ['All', 'Open', 'Completed']) filter.append(element('option', value));
        filterLabel.append(filter);
        const tasks = element('section');
        tasks.className = 'task-list';
        tasks.setAttribute('aria-label', 'Tasks');
        const refresh = async () => {
          const items = await api(`/api/projects/${match[1]}/tasks`);
          tasks.replaceChildren(...items.filter(task => filter.value === 'All' || (filter.value === 'Completed') === task.completed).map(task => {
            const row = element('div');
            row.dataset.testid = 'task-row';
            const checkbox = element('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed;
            checkbox.disabled = project.archived;
            checkbox.setAttribute('aria-label', `Complete ${task.title}`);
            checkbox.addEventListener('change', async () => {
              await api(`/api/tasks/${task.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
              await refresh();
            });
            row.append(checkbox, element('span', task.title));
            return row;
          }));
        };
        filter.addEventListener('change', refresh);
        form.addEventListener('submit', async event => {
          event.preventDefault();
          const title = input.value.trim();
          if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; input.focus(); return; }
          try {
            await api(`/api/projects/${match[1]}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
            input.value = ''; alert.hidden = true; await refresh();
          } catch (error) { alert.textContent = error.message; alert.hidden = false; }
        });
        app.replaceChildren(back, heading, rename, ...(archivedMessage ? [archivedMessage] : []), form, alert, filterLabel, tasks);
        await refresh();
        return;
      }

      const heading = element('h1', 'Workboard');
      const form = element('form');
      const input = element('input');
      input.type = 'text';
      input.name = 'name';
      input.setAttribute('aria-label', 'Project name');
      input.autocomplete = 'off';
      const create = element('button', 'Create project');
      create.type = 'submit';
      form.append(input, create);
      const alert = element('p');
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const projectFilter = element('select');
      projectFilter.setAttribute('aria-label', 'Project filter');
      for (const value of ['Active', 'Archived']) projectFilter.append(element('option', value));
      const list = element('section');
      list.className = 'project-list';
      list.setAttribute('aria-label', 'Projects');

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          input.focus();
          return;
        }
        create.disabled = true;
        try {
          await api('/api/projects', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
          });
          input.value = '';
          alert.hidden = true;
          await renderProjects(list);
        } catch (error) {
          alert.textContent = error.message;
          alert.hidden = false;
        } finally { create.disabled = false; }
      });
      app.replaceChildren(heading, form, alert, projectFilter, list);
      projectFilter.addEventListener('change', () => renderProjects(list, projectFilter.value));
      await renderProjects(list, projectFilter.value);
    }

    let projectListRequest = 0;
    async function renderProjects(list, filter = 'Active') {
      const request = ++projectListRequest;
      const projects = await api(`/api/projects?filter=${filter}`);
      if (request !== projectListRequest) return;
      const rows = projects.map(project => {
        const row = element('div');
        row.dataset.testid = 'project-row';
        row.append(element('span', project.name));
        const summary = element('span', `${project.completedCount}/${project.totalCount} completed`);
        summary.dataset.testid = 'project-summary';
        row.append(summary);
        const open = element('button', 'Open project');
        open.type = 'button';
        open.addEventListener('click', () => { location.href = `/projects/${project.id}`; });
        row.append(open);
        const action = element('button', project.archived ? 'Restore project' : 'Archive project');
        action.type = 'button';
        action.addEventListener('click', async () => {
          await api(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          await renderProjects(list, filter);
        });
        row.append(action);
        return row;
      });
      list.replaceChildren(...rows);
    }

    render().catch(() => {
      app.replaceChildren(element('h1', 'Workboard'), element('p', 'Unable to load Workboard.'));
    });
  </script>
</body>
</html>

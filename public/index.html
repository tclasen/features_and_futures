<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section id="project-list" aria-labelledby="page-title">
        <h1 id="page-title">Workboard</h1>
        <form id="create-project-form">
          <label for="project-name">Project name</label>
          <div class="form-row">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
          <p id="form-alert" class="alert" role="alert" hidden></p>
        </form>
        <label for="project-filter">Project filter</label>
        <select id="project-filter">
          <option value="active">Active</option>
          <option value="archived">Archived</option>
        </select>
        <div id="projects" class="projects" aria-live="polite"></div>
      </section>
      <section id="project-detail" aria-labelledby="detail-title" hidden>
        <button id="back-to-projects" class="back-button" type="button">Projects</button>
        <h1 id="detail-title"></h1>
        <p id="archived-notice" hidden>Archived project</p>
        <form id="rename-project-form">
          <label for="new-project-name">New project name</label>
          <div class="form-row">
            <input id="new-project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Rename project</button>
          </div>
          <p id="rename-alert" class="alert" role="alert" hidden></p>
        </form>
        <form id="create-task-form">
          <label for="task-title">Task title</label>
          <div class="form-row">
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit">Create task</button>
          </div>
          <p id="task-alert" class="alert" role="alert" hidden></p>
        </form>
        <label for="default-task-priority">Default task priority</label>
        <select id="default-task-priority">
          <option>Low</option>
          <option selected>Normal</option>
          <option>High</option>
        </select>
        <label for="task-filter">Task filter</label>
        <select id="task-filter">
          <option>All</option>
          <option>Open</option>
          <option>Completed</option>
        </select>
        <label for="priority-filter">Priority filter</label>
        <select id="priority-filter">
          <option>All</option>
          <option>Low</option>
          <option>Normal</option>
          <option>High</option>
        </select>
        <div id="tasks" class="tasks" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>

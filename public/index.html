<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Workboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .alert { color: red; margin-top: 0.5rem; }
    .project-row { display: flex; align-items: center; margin: 0.5rem 0; }
    .project-row button { margin-left: 1rem; }
  </style>
</head>
<body>
  <h1>Workboard</h1>
  <label for="project-name-input">Project name</label>
  <input type="text" id="project-name-input" />
  <button id="create-project-btn">Create project</button>
  <div id="alert" class="alert" style="display:none;">Project name is required</div>
  <div id="project-list"></div>

  <script>
    async function fetchProjects() {
      const res = await fetch('/api/projects');
      const projects = await res.json();
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      projects.forEach(p => {
        const row = document.createElement('div');
        row.className = 'project-row';
        row.setAttribute('data-testid', 'project-row');
        const nameSpan = document.createElement('span');
        nameSpan.textContent = p.name;
        const openBtn = document.createElement('button');
        openBtn.textContent = 'Open project';
        openBtn.onclick = () => {
          window.location.href = `/projects/${p.id}`;
        };
        row.appendChild(nameSpan);
        row.appendChild(openBtn);
        list.appendChild(row);
      });
    }

    document.getElementById('create-project-btn').addEventListener('click', async () => {
      const input = document.getElementById('project-name-input');
      const name = input.value.trim();
      const alertDiv = document.getElementById('alert');
      if (!name) {
        alertDiv.style.display = 'block';
        return;
      }
      alertDiv.style.display = 'none';
      await fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      input.value = '';
      fetchProjects();
    });

    // Initial load
    fetchProjects();
  </script>
</body>
</html>

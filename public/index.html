<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workboard</title>
<style>
:root{font-family:system-ui,sans-serif;color:#182230;background:#f5f7fa}body{margin:0}main{max-width:760px;margin:56px auto;padding:0 24px}h1{font-size:2rem;margin:0 0 28px}form,.row{background:white;border:1px solid #dce2e9;border-radius:8px;padding:20px}form{display:flex;gap:12px;align-items:end}label{display:block;font-weight:600;margin-bottom:7px}input{font:inherit;padding:10px 12px;border:1px solid #aab5c2;border-radius:5px;width:min(420px,55vw)}select{font:inherit;padding:10px 12px;border:1px solid #aab5c2;border-radius:5px;background:white}.task-title{flex:1}.task-check{width:auto} .row label{margin:0;display:flex;align-items:center;gap:10px}button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:5px;background:#245fc5;color:white;cursor:pointer}button:hover{background:#194da8}.rows{display:grid;gap:12px;margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center}.alert{color:#a32626;margin:12px 0 0}
</style>
</head>
<body><main id="app"></main>
<script>
const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function render(){
 const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);
 if(match){
  const projects=await (await fetch('/api/projects')).json();const project=projects.find(p=>String(p.id)===match[1]);
  app.innerHTML=project?`<button id="back">Projects</button><h1>${esc(project.name)}</h1><form id="create-task"><div><label for="task-title">Task title</label><input id="task-title" name="title" type="text"></div><button type="submit">Create task</button></form><div id="alert" class="alert" role="alert" hidden></div><div style="margin-top:18px"><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></div><div id="tasks" class="rows"></div>`:'<h1>Project not found</h1><button id="back">Projects</button>';
  document.querySelector('#back').onclick=()=>{history.pushState({},'', '/');render()};
  if(!project)return;
  let tasks=await (await fetch(`/api/projects/${match[1]}/tasks`)).json();
  const drawTasks=()=>{const filter=document.querySelector('#task-filter').value;const shown=tasks.filter(t=>filter==='All'||(filter==='Open'?!t.completed:!!t.completed));document.querySelector('#tasks').innerHTML=shown.map(t=>`<div class="row" data-testid="task-row"><span class="task-title">${esc(t.title)}</span><label><input class="task-check" type="checkbox" aria-label="Complete ${esc(t.title)}" data-id="${t.id}" ${t.completed?'checked':''}></label></div>`).join('');document.querySelectorAll('.task-check').forEach(box=>box.onchange=async()=>{await fetch(`/api/projects/${match[1]}/tasks/${box.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:box.checked})});tasks.find(t=>String(t.id)===box.dataset.id).completed=box.checked?1:0;drawTasks()})};
  document.querySelector('#task-filter').onchange=drawTasks;drawTasks();
  document.querySelector('#create-task').onsubmit=async e=>{e.preventDefault();const title=document.querySelector('#task-title').value.trim();const alert=document.querySelector('#alert');if(!title){alert.textContent='Task title is required';alert.hidden=false;return}const response=await fetch(`/api/projects/${match[1]}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(response.ok){tasks.push(await response.json());document.querySelector('#task-title').value='';alert.hidden=true;drawTasks()}};
  return;
 }
 app.innerHTML='<h1>Workboard</h1><form id="create"><div><label for="project-name">Project name</label><input id="project-name" name="name" type="text"></div><button type="submit">Create project</button></form><div id="alert" class="alert" role="alert" hidden></div><div id="projects" class="rows"></div>';
 const list=await (await fetch('/api/projects')).json();const projects=document.querySelector('#projects');
 projects.innerHTML=list.map(p=>`<div class="row" data-testid="project-row"><span>${esc(p.name)}</span><button data-id="${p.id}">Open project</button></div>`).join('');
 projects.querySelectorAll('button').forEach(b=>b.onclick=()=>{history.pushState({},'',`/projects/${b.dataset.id}`);render()});
 document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const name=document.querySelector('#project-name').value.trim();const alert=document.querySelector('#alert');if(!name){alert.textContent='Project name is required';alert.hidden=false;return}const response=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(response.ok)render()};
}
window.addEventListener('popstate',render);render();
</script></body></html>

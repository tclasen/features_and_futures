<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18212f; background: #f5f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 64px auto; padding: 0 24px; }
    h1 { font-size: 2rem; margin: 0 0 24px; }
    form, .project-row, .task-row { background: white; border: 1px solid #dce2eb; border-radius: 8px; padding: 20px; }
    form { display: flex; gap: 12px; align-items: end; }
    label { display: grid; gap: 6px; flex: 1; font-weight: 600; }
    input, select { padding: 10px; border: 1px solid #aab5c5; border-radius: 5px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 5px; background: #245fc5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #174b9e; }
    #alert { color: #a21d2b; margin-top: 12px; }
    #projects, #tasks { display: grid; gap: 10px; margin-top: 20px; }
    .project-row, .task-row { display: flex; justify-content: space-between; align-items: center; }
    .task-row label { display: flex; flex-direction: row; align-items: center; }
    @media (max-width: 520px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
<main id="app"><h1>Workboard</h1></main>
<script>
  const app = document.querySelector('#app');
  const projectPath = location.pathname.match(/^\/projects\/(\d+)$/);
  const directoryPage = location.pathname === '/directory';
  async function loadProjects() {
    const response = await fetch('/api/projects');
    if (!response.ok) throw new Error('Could not load projects');
    return response.json();
  }
  function go(path) { location.href = path; }
  if (directoryPage) {
    app.innerHTML = `<button type="button" id="back">Projects</button><h1>Task directory</h1>
      <label>Project scope<select id="scope"><option>Active</option><option>Archived</option></select></label>
      <label>Task filter<select id="filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select></label>
      <label>Priority filter<select id="priority"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label>
      <label>Directory search<input id="query" aria-label="Directory search"></label><button id="search" type="button">Search directory</button>
      <label>Due from<input id="from"></label><label>Due through<input id="through"></label><button id="apply" type="button">Apply due range</button>
      <div id="alert" role="alert"></div><section id="results"></section>`;
    app.querySelector('#back').onclick = () => go('/');
    let query = '', range = { from: '', through: '' };
    const key = value => value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, c => c.toLowerCase());
    const valid = value => { const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return false; const [y, mo, d] = m.slice(1).map(Number); const leap = y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0); return y >= 1 && mo >= 1 && mo <= 12 && d >= 1 && d <= [31,leap?29:28,31,30,31,30,31,31,30,31,30,31][mo-1]; };
    async function renderDirectory() {
      const rows = await (await fetch('/api/directory')).json();
      const filter = app.querySelector('#filter').value, priority = app.querySelector('#priority').value;
      const visible = rows.filter(t => t.archived === (app.querySelector('#scope').value === 'Archived') &&
        (filter === 'Deleted' ? t.deleted : !t.deleted && (filter === 'All' || (filter === 'Completed') === t.completed)) &&
        (priority === 'All' || t.priority === priority) && key(t.title).includes(key(query)) &&
        ((!range.from && !range.through) || (t.dueDate && (!range.from || t.dueDate >= range.from) && (!range.through || t.dueDate <= range.through))));
      const section = app.querySelector('#results'); section.replaceChildren();
      for (const task of visible) {
        const row = document.createElement('div'); row.dataset.testid = 'directory-task-row';
        const put = (id, text) => { const el = document.createElement('span'); el.dataset.testid = id; el.textContent = text; row.append(el); };
        put('directory-task-title', task.title); put('directory-project-name', task.projectName);
        put('directory-task-completion', task.completed ? 'Completed' : 'Open'); put('directory-task-priority', task.priority);
        put('directory-task-due-date', task.dueDate); put('directory-task-notes', task.notes);
        const open = document.createElement('button'); open.textContent = 'Open project'; open.onclick = () => go(`/projects/${task.projectId}`); row.append(open); section.append(row);
      }
    }
    app.querySelector('#search').onclick = () => { query = app.querySelector('#query').value.trim(); renderDirectory(); };
    app.querySelector('#apply').onclick = () => { const from = app.querySelector('#from').value.trim(), through = app.querySelector('#through').value.trim(), alert = app.querySelector('#alert'); if ((from && !valid(from)) || (through && !valid(through))) { alert.textContent = 'Due range must use valid YYYY-MM-DD dates'; return; } if (from && through && from > through) { alert.textContent = 'Due from must not be after Due through'; return; } range = { from, through }; alert.textContent = ''; renderDirectory(); };
    for (const id of ['scope','filter','priority']) app.querySelector(`#${id}`).onchange = renderDirectory;
    renderDirectory();
  } else if (projectPath) {
    loadProjects().then(projects => {
      const project = projects.find(item => String(item.id) === projectPath[1]);
      if (!project) { app.innerHTML = '<h1>Project not found</h1>'; return; }
      app.innerHTML = `<button type="button" id="back">Projects</button><button type="button" id="download-project">Download project</button><h1 id="project-name"></h1>
        ${project.archived ? '<p>Archived project</p>' : ''}
        <form id="rename-form"><label>New project name<input name="name" aria-label="New project name" ${project.archived ? 'disabled' : ''}></label><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form>
        <form id="task-form"><label>Task title<input name="title" aria-label="Task title"></label><button type="submit">Create task</button></form>
        <label>Default task priority<select id="default-priority" aria-label="Default task priority" ${project.archived ? 'disabled' : ''}><option>Low</option><option>Normal</option><option>High</option></select></label>
        <div id="alert" role="alert" aria-live="polite"></div>
        <label>Task filter<select id="task-filter" aria-label="Task filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select></label>
        <label>Priority filter<select id="priority-filter" aria-label="Priority filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label>
        <div id="task-search"><label>Task search<input id="task-search-query" aria-label="Task search"></label><button type="button" id="search-tasks">Search tasks</button></div>
        <div id="due-range"><label>Due from<input id="due-from" aria-label="Due from"></label><label>Due through<input id="due-through" aria-label="Due through"></label><button type="button" id="apply-due-range">Apply due range</button></div>
        <section id="tasks" aria-label="Tasks"></section>`;
      app.querySelector('#project-name').textContent = project.name;
      app.querySelector('#back').addEventListener('click', () => go('/'));
      app.querySelector('#download-project').addEventListener('click', () => {
        location.href = `/api/projects/${project.id}/export`;
      });
      const alert = app.querySelector('#alert');
      const renameForm = app.querySelector('#rename-form');
      if (renameForm) {
        renameForm.addEventListener('submit', async event => {
          event.preventDefault();
          const input = renameForm.elements.name;
          const name = input.value.trim();
          if (!name) { alert.textContent = 'Project name is required'; return; }
          const response = await fetch(`/api/projects/${project.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
          if (!response.ok) { alert.textContent = 'Unable to rename project'; return; }
          project.name = name;
          app.querySelector('#project-name').textContent = name;
          input.value = '';
          alert.textContent = '';
        });
      }
      const form = app.querySelector('#task-form');
      const defaultPriority = app.querySelector('#default-priority');
      defaultPriority.value = project.defaultPriority || 'Normal';
      defaultPriority.addEventListener('change', async () => {
        const response = await fetch(`/api/projects/${project.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ defaultPriority: defaultPriority.value }) });
        if (!response.ok) { alert.textContent = 'Unable to update default task priority'; return; }
        project.defaultPriority = defaultPriority.value;
        alert.textContent = '';
      });
      const filter = app.querySelector('#task-filter');
      let appliedTaskQuery = '';
      function searchKey(value) { return value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, character => character.toLowerCase()); }
      app.querySelector('#search-tasks').addEventListener('click', () => {
        appliedTaskQuery = app.querySelector('#task-search-query').value.trim();
        renderTasks().catch(() => { alert.textContent = 'Unable to load tasks'; });
      });
      const priorityFilter = app.querySelector('#priority-filter');
      let appliedRange = { from: '', through: '' };
      function validDate(value) {
        const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return false;
        const [, y, m, d] = match.map(Number);
        const leap = y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0);
        return y >= 1 && m >= 1 && m <= 12 && d >= 1 && d <= [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
      }
      app.querySelector('#apply-due-range').addEventListener('click', async () => {
        const from = app.querySelector('#due-from').value.trim();
        const through = app.querySelector('#due-through').value.trim();
        if ((from && !validDate(from)) || (through && !validDate(through))) { alert.textContent = 'Due range must use valid YYYY-MM-DD dates'; return; }
        if (from && through && from > through) { alert.textContent = 'Due from must not be after Due through'; return; }
        appliedRange = { from, through }; alert.textContent = ''; await renderTasks();
      });
      if (project.archived) form.querySelector('button').disabled = true;
      async function renderTasks() {
        const response = await fetch(`/api/projects/${project.id}/tasks`);
        if (!response.ok) throw new Error('Could not load tasks');
        const tasks = await response.json();
        const projects = await loadProjects();
        const destinations = projects.filter(item => !item.archived && item.id !== project.id);
        const list = app.querySelector('#tasks'); list.replaceChildren();
        for (const task of tasks.filter(item =>
          (filter.value === 'Deleted' ? Boolean(item.deleted) : !item.deleted && (filter.value === 'All' || (filter.value === 'Completed') === Boolean(item.completed))) &&
          (priorityFilter.value === 'All' || item.priority === priorityFilter.value) &&
          searchKey(item.title).includes(searchKey(appliedTaskQuery)) &&
          ((!appliedRange.from && !appliedRange.through) || (Boolean(item.dueDate) && (!appliedRange.from || item.dueDate >= appliedRange.from) && (!appliedRange.through || item.dueDate <= appliedRange.through)))
        )) {
          const row = document.createElement('div'); row.className = 'task-row'; row.dataset.testid = 'task-row';
          const title = document.createElement('span'); title.textContent = task.title;
          const locked = Boolean(project.archived) || Boolean(task.deleted);
          const renameInput = document.createElement('input'); renameInput.type = 'text'; renameInput.setAttribute('aria-label', 'New task title'); renameInput.disabled = locked;
          const renameButton = document.createElement('button'); renameButton.type = 'button'; renameButton.textContent = 'Rename task'; renameButton.disabled = locked;
          renameButton.addEventListener('click', async () => {
            const newTitle = renameInput.value.trim();
            if (!newTitle) { alert.textContent = 'Task title is required'; return; }
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: newTitle }) });
            if (!response.ok) { alert.textContent = 'Unable to rename task'; return; }
            alert.textContent = ''; await renderTasks();
          });
          const priorityLabel = document.createElement('label');
          priorityLabel.textContent = 'Task priority';
          const priority = document.createElement('select'); priority.setAttribute('aria-label', 'Task priority'); priority.disabled = locked;
          for (const value of ['Low', 'Normal', 'High']) {
            const option = document.createElement('option'); option.value = value; option.textContent = value; priority.append(option);
          }
          priority.value = task.priority;
          priority.addEventListener('change', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: priority.value }) });
            if (!response.ok) { alert.textContent = 'Unable to update task priority'; await renderTasks(); return; }
            alert.textContent = '';
            await renderTasks();
          });
          const label = document.createElement('label');
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = Boolean(task.completed); checkbox.disabled = locked; checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
            if (!response.ok) { checkbox.checked = !checkbox.checked; alert.textContent = 'Unable to update task'; return; }
            await renderTasks();
          });
          const dueDateInput = document.createElement('input'); dueDateInput.type = 'text'; dueDateInput.setAttribute('aria-label', 'Task due date'); dueDateInput.value = task.dueDate || ''; dueDateInput.disabled = locked;
          const saveDueDate = document.createElement('button'); saveDueDate.type = 'button'; saveDueDate.textContent = 'Save due date'; saveDueDate.disabled = locked;
          saveDueDate.addEventListener('click', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dueDate: dueDateInput.value }) });
            if (!response.ok) { alert.textContent = 'Due date must be a valid YYYY-MM-DD date'; return; }
            alert.textContent = ''; await renderTasks();
          });
          const notes = document.createElement('textarea'); notes.setAttribute('aria-label', 'Task notes'); notes.value = task.notes || ''; notes.disabled = locked;
          const saveNotes = document.createElement('button'); saveNotes.type = 'button'; saveNotes.textContent = 'Save notes'; saveNotes.disabled = locked;
          saveNotes.addEventListener('click', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ notes: notes.value }) });
            if (!response.ok) { alert.textContent = 'Unable to save notes'; return; }
            alert.textContent = ''; await renderTasks();
          });
          const destination = document.createElement('select'); destination.setAttribute('aria-label', 'Destination project');
          for (const item of destinations) {
            const option = document.createElement('option'); option.value = item.id; option.textContent = item.name; destination.append(option);
          }
          const moveButton = document.createElement('button'); moveButton.type = 'button'; moveButton.textContent = 'Move task';
          destination.disabled = locked || destinations.length === 0;
          moveButton.disabled = destination.disabled;
          moveButton.addEventListener('click', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}/move`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ destinationProjectId: Number(destination.value) }) });
            if (!response.ok) { alert.textContent = 'Unable to move task'; return; }
            alert.textContent = ''; await renderTasks();
          });
          const deletion = document.createElement('button'); deletion.type = 'button'; deletion.textContent = task.deleted ? 'Restore task' : 'Delete task'; deletion.disabled = Boolean(project.archived);
          deletion.addEventListener('click', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ deleted: !Boolean(task.deleted) }) });
            if (!response.ok) { alert.textContent = 'Unable to update task'; return; }
            alert.textContent = ''; await renderTasks();
          });
          label.append(checkbox); row.append(title, renameInput, renameButton, priorityLabel, priority, dueDateInput, saveDueDate, notes, saveNotes, destination, moveButton, deletion, label); list.append(row);
        }
      }
      filter.addEventListener('change', () => renderTasks().catch(() => { alert.textContent = 'Unable to load tasks'; }));
      priorityFilter.addEventListener('change', () => renderTasks().catch(() => { alert.textContent = 'Unable to load tasks'; }));
      form.addEventListener('submit', async event => {
        event.preventDefault(); const input = form.elements.title; const title = input.value.trim();
        if (!title) { alert.textContent = 'Task title is required'; return; }
        const response = await fetch(`/api/projects/${project.id}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
        if (!response.ok) { alert.textContent = 'Unable to create task'; return; }
        input.value = ''; alert.textContent = ''; await renderTasks();
      });
      renderTasks().catch(() => { alert.textContent = 'Unable to load tasks'; });
    }).catch(() => { app.innerHTML = '<h1>Unable to load project</h1>'; });
  } else {
    app.innerHTML = `<h1>Workboard</h1>
      <button type="button" id="directory-link">Task directory</button>
      <form id="create-form"><label>Project name<input name="name" aria-label="Project name"></label><button type="submit">Create project</button></form>
      <form id="import-form"><label>Project JSON<textarea name="json" aria-label="Project JSON"></textarea></label><label>Imported project name<input name="name" aria-label="Imported project name"></label><button type="submit">Import project</button></form>
      <div id="alert" role="alert" aria-live="polite"></div>
      <label>Project filter<select id="project-filter" aria-label="Project filter"><option>Active</option><option>Archived</option></select></label>
      <label>Project search<input id="project-search-query" aria-label="Project search"></label><button type="button" id="search-projects">Search projects</button>
      <section id="projects" aria-label="Projects"></section>`;
    const alert = app.querySelector('#alert');
    app.querySelector('#directory-link').onclick = () => go('/directory');
    const form = app.querySelector('#create-form');
    app.querySelector('#import-form').addEventListener('submit', async event => {
      event.preventDefault();
      const importForm = event.currentTarget;
      const name = importForm.elements.name.value.trim();
      if (!name) { alert.textContent = 'Project name is required'; return; }
      const response = await fetch('/api/projects/import', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ json: importForm.elements.json.value, name }) });
      if (!response.ok) {
        const result = await response.json();
        alert.textContent = result.error === 'Project name is required' ? result.error : 'Invalid project JSON';
        return;
      }
      const result = await response.json();
      go(`/projects/${result.id}`);
    });
    let appliedProjectQuery = '';
    function searchKey(value) { return value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, character => character.toLowerCase()); }
    app.querySelector('#search-projects').addEventListener('click', () => {
      appliedProjectQuery = app.querySelector('#project-search-query').value.trim();
      render().catch(() => { alert.textContent = 'Unable to load projects'; });
    });
    async function render() {
      const projects = await loadProjects();
      const list = app.querySelector('#projects'); list.replaceChildren();
      for (const project of projects.filter(item => Boolean(item.archived) === (app.querySelector('#project-filter').value === 'Archived') && searchKey(item.name).includes(searchKey(appliedProjectQuery)))) {
        const row = document.createElement('div'); row.className = 'project-row'; row.dataset.testid = 'project-row';
        const name = document.createElement('span'); name.textContent = project.name;
        const summary = document.createElement('span'); summary.dataset.testid = 'project-summary'; summary.textContent = `${project.completedCount}/${project.totalCount} completed`;
        const open = document.createElement('button'); open.type = 'button'; open.textContent = 'Open project';
        open.addEventListener('click', () => go(`/projects/${project.id}`));
        const action = document.createElement('button'); action.type = 'button'; action.textContent = project.archived ? 'Restore project' : 'Archive project';
        action.addEventListener('click', async () => {
          const response = await fetch(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          if (!response.ok) { alert.textContent = 'Unable to update project'; return; }
          await render();
        });
        row.append(name, summary, open, action); list.append(row);
      }
    }
    app.querySelector('#project-filter').addEventListener('change', () => render().catch(() => { alert.textContent = 'Unable to load projects'; }));
    form.addEventListener('submit', async event => {
      event.preventDefault(); const input = form.elements.name; const name = input.value.trim();
      if (!name) { alert.textContent = 'Project name is required'; return; }
      const response = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
      if (!response.ok) { alert.textContent = 'Unable to create project'; return; }
      input.value = ''; alert.textContent = ''; await render();
    });
    render().catch(() => { alert.textContent = 'Unable to load projects'; });
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202a36; background: #f4f6f8; }
      body { margin: 0; }
      main { box-sizing: border-box; max-width: 760px; margin: 64px auto; padding: 32px; background: white; border: 1px solid #dce2e8; border-radius: 12px; }
      h1 { margin: 0 0 28px; font-size: 2rem; }
      form { display: flex; gap: 12px; align-items: end; }
      label { display: grid; gap: 7px; flex: 1; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #aeb9c5; border-radius: 6px; font: inherit; }
      button { padding: 10px 14px; border: 0; border-radius: 6px; background: #2458a6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #194783; }
      #alert { min-height: 1.5em; margin: 12px 0 0; color: #a32626; }
      #projects { display: grid; gap: 10px; margin-top: 24px; }
      [data-testid="project-row"] { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px; border: 1px solid #dce2e8; border-radius: 8px; }
      [hidden] { display: none !important; }
      @media (max-width: 600px) { main { margin: 20px; padding: 22px; } form { align-items: stretch; flex-direction: column; } }
    </style>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main id="app">
      <h1 id="heading">Workboard</h1>
      <section id="project-list" aria-label="Projects">
        <form id="create-form">
          <label for="project-name">Project name</label>
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </form>
        <p id="alert" role="alert" aria-live="polite"></p>
        <div id="projects"></div>
      </section>
      <section id="project-detail" hidden>
        <button id="back-button" type="button">Projects</button>
      </section>
    </main>
  </body>
</html>

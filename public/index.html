<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Your project workspace</p>
      <h1 id="heading">Workboard</h1>
      <p id="alert" role="alert" hidden></p>
      <section id="project-list" aria-label="Projects">
        <form id="create-project">
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
        </form>
        <div id="projects"></div>
        <p id="empty" hidden>No projects yet. Create a project to get started.</p>
      </section>
      <section id="project-detail" hidden>
        <button id="back" type="button">Projects</button>
      </section>
    </main>
  </body>
</html>

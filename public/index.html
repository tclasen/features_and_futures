<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <p class="brand">WORKBOARD</p>
      <section id="projects-view">
        <h1>Workboard</h1>
        <p class="intro">A place for your projects.</p>
        <form id="project-form">
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
        </form>
        <p id="error" role="alert" hidden></p>
        <label for="project-filter">Project filter</label>
        <select id="project-filter">
          <option>Active</option>
          <option>Archived</option>
        </select>
        <div id="project-list" aria-label="Projects"></div>
        <p id="empty" class="empty" hidden>No projects yet. Create your first project above.</p>
      </section>
      <section id="project-view" hidden>
        <button id="back" class="secondary" type="button">Projects</button>
        <h1 id="project-title"></h1>
        <p id="archived-notice" hidden>Archived project</p>
        <p id="detail-error" role="alert" hidden></p>
        <form id="rename-form" hidden>
          <label for="new-project-name">New project name</label>
          <div class="form-controls">
            <input id="new-project-name" name="name" type="text" autocomplete="off" disabled>
            <button type="submit" disabled>Rename project</button>
          </div>
        </form>
        <div id="task-controls" hidden>
          <form id="task-form">
            <label for="task-title">Task title</label>
            <div class="form-controls">
              <input id="task-title" name="title" type="text" autocomplete="off">
              <button type="submit">Create task</button>
            </div>
          </form>
          <label for="task-filter">Task filter</label>
          <select id="task-filter">
            <option>All</option>
            <option>Open</option>
            <option>Completed</option>
          </select>
          <div id="task-list" aria-label="Tasks"></div>
        </div>
      </section>
    </main>
  </body>
</html>

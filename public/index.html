<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <section id="project-list" aria-labelledby="app-title" hidden>
      <h1 id="app-title">Workboard</h1>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <div class="form-row">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
      </form>
      <p id="alert" role="alert" hidden></p>
      <label for="project-filter">Project filter</label>
      <select id="project-filter"><option>Active</option><option>Archived</option></select>
      <div id="projects" aria-live="polite"></div>
    </section>
    <section id="project-detail" aria-live="polite" hidden>
      <button id="back-button" type="button">Projects</button>
      <h1 id="project-title"></h1>
      <p id="archived-notice" hidden>Archived project</p>
      <form id="rename-form">
        <label for="new-project-name">New project name</label>
        <div class="form-row">
          <input id="new-project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Rename project</button>
        </div>
      </form>
      <p id="rename-alert" role="alert" hidden></p>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <div class="form-row">
          <input id="task-title" name="title" type="text" autocomplete="off">
          <button type="submit">Create task</button>
        </div>
      </form>
      <p id="task-alert" role="alert" hidden></p>
      <label for="default-task-priority">Default task priority</label>
      <select id="default-task-priority"><option>Low</option><option>Normal</option><option>High</option></select>
      <label for="task-filter">Task filter</label>
      <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select>
      <label for="priority-filter">Priority filter</label>
      <select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
      <div class="form-row due-range">
        <label for="due-from">Due from</label>
        <input id="due-from" type="text" placeholder="YYYY-MM-DD">
        <label for="due-through">Due through</label>
        <input id="due-through" type="text" placeholder="YYYY-MM-DD">
        <button id="apply-due-range" type="button">Apply due range</button>
      </div>
      <p id="due-range-alert" role="alert" hidden></p>
      <div id="tasks" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17212b; background: #f4f7fa; }
    body { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; }
    h1 { margin-bottom: 1.5rem; }
    form, .project-row { display: flex; align-items: center; gap: .75rem; }
    form { margin-bottom: 1rem; }
    input, select { flex: 1; min-width: 0; padding: .65rem; font: inherit; border: 1px solid #9ba9b7; border-radius: 4px; }
    .task-row { display: flex; align-items: center; gap: .75rem; margin: .6rem 0; padding: 1rem; background: white; border: 1px solid #d6dfe7; border-radius: 5px; }
    .task-row input { flex: initial; }
    .task-row input[type="checkbox"] { flex: 0 0 1.1rem; width: 1.1rem; height: 1.1rem; padding: 0; appearance: auto; }
    button { padding: .65rem 1rem; font: inherit; border: 0; border-radius: 4px; color: white; background: #145c91; cursor: pointer; }
    button:hover { background: #0d456f; }
    .project-row { justify-content: space-between; margin: .6rem 0; padding: 1rem; background: white; border: 1px solid #d6dfe7; border-radius: 5px; }
    [role="alert"] { color: #a11; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    async function request(path, options) {
      const response = await fetch(path, options);
      return response.json();
    }

    function element(tag, text, parent) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      parent.append(node);
      return node;
    }

    async function showProjects() {
      app.replaceChildren();
      element('h1', 'Workboard', app);
      const filterLabel = element('label', 'Project filter', app);
      const filter = element('select', undefined, filterLabel);
      filter.setAttribute('aria-label', 'Project filter');
      for (const value of ['Active', 'Archived']) element('option', value, filter);
      const form = element('form', undefined, app);
      const input = element('input', undefined, form);
      input.type = 'text';
      input.setAttribute('aria-label', 'Project name');
      const submit = element('button', 'Create project', form);
      submit.type = 'submit';
      const alert = element('p', undefined, app);
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const list = element('section', undefined, app);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const result = await request('/api/projects', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name: input.value })
        });
        if (result.error) { alert.textContent = result.error; alert.hidden = false; return; }
        input.value = '';
        alert.hidden = true;
        await renderRows(list, filter.value);
      });
      filter.addEventListener('change', () => renderRows(list, filter.value));
      await renderRows(list, filter.value);
    }

    async function renderRows(list, filter) {
      list.replaceChildren();
      const projects = await request(`/api/projects?filter=${filter}`);
      for (const project of projects) {
        const row = element('div', undefined, list);
        row.dataset.testid = 'project-row';
        element('span', project.name, row);
        const summary = element('span', `${project.completedCount}/${project.totalCount} completed`, row);
        summary.dataset.testid = 'project-summary';
        const open = element('button', 'Open project', row);
        open.type = 'button';
        open.addEventListener('click', () => { location.href = `/projects/${project.id}`; });
        const archive = element('button', project.archived ? 'Restore project' : 'Archive project', row);
        archive.type = 'button';
        archive.addEventListener('click', async () => {
          await request(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          await renderRows(list, filter);
        });
      }
    }

    async function showProject(id) {
      app.replaceChildren();
      const project = await request(`/api/projects/${id}`);
      if (project.error) { element('h1', 'Project not found', app); return; }
      element('h1', project.name, app);
      if (project.archived) element('p', 'Archived project', app);
      const back = element('button', 'Projects', app);
      back.addEventListener('click', () => { location.href = '/'; });
      const renameForm = element('form', undefined, app);
      const renameInput = element('input', undefined, renameForm);
      renameInput.type = 'text';
      renameInput.setAttribute('aria-label', 'New project name');
      renameInput.value = project.name;
      renameInput.disabled = project.archived;
      const renameButton = element('button', 'Rename project', renameForm);
      renameButton.type = 'submit';
      renameButton.disabled = project.archived;
      const renameAlert = element('p', undefined, app);
      renameAlert.setAttribute('role', 'alert');
      renameAlert.hidden = true;
      renameForm.addEventListener('submit', async event => {
        event.preventDefault();
        const result = await request(`/api/projects/${id}/rename`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: renameInput.value }) });
        if (result.error) { renameAlert.textContent = result.error; renameAlert.hidden = false; return; }
        project.name = result.name;
        document.querySelector('h1').textContent = result.name;
        renameInput.value = result.name;
        renameAlert.hidden = true;
      });
      const defaultLabel = element('label', 'Default task priority', app);
      const defaultPriority = element('select', undefined, defaultLabel);
      defaultPriority.setAttribute('aria-label', 'Default task priority');
      for (const value of ['Low', 'Normal', 'High']) {
        const option = element('option', value, defaultPriority);
        option.value = value;
        option.selected = project.defaultPriority === value;
      }
      defaultPriority.disabled = project.archived;
      defaultPriority.addEventListener('change', async () => {
        await request(`/api/projects/${id}/default-priority`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: defaultPriority.value }) });
      });
      const form = element('form', undefined, app);
      const input = element('input', undefined, form);
      input.type = 'text';
      input.setAttribute('aria-label', 'Task title');
      const submit = element('button', 'Create task', form);
      submit.type = 'submit';
      submit.disabled = project.archived;
      const alert = element('p', undefined, app);
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const filterLabel = element('label', 'Task filter', app);
      const filter = element('select', undefined, filterLabel);
      filter.setAttribute('aria-label', 'Task filter');
      for (const value of ['All', 'Open', 'Completed']) element('option', value, filter);
      const priorityFilterLabel = element('label', 'Priority filter', app);
      const priorityFilter = element('select', undefined, priorityFilterLabel);
      priorityFilter.setAttribute('aria-label', 'Priority filter');
      for (const value of ['All', 'Low', 'Normal', 'High']) element('option', value, priorityFilter);
      const rangeForm = element('form', undefined, app);
      const fromInput = element('input', undefined, rangeForm);
      fromInput.type = 'text';
      fromInput.setAttribute('aria-label', 'Due from');
      const throughInput = element('input', undefined, rangeForm);
      throughInput.type = 'text';
      throughInput.setAttribute('aria-label', 'Due through');
      const rangeButton = element('button', 'Apply due range', rangeForm);
      rangeButton.type = 'submit';
      const list = element('section', undefined, app);
      let appliedFrom = '', appliedThrough = '';
      let taskRenderVersion = 0;
      const renderTasks = async () => {
        const renderVersion = ++taskRenderVersion;
        list.replaceChildren();
        const tasks = await request(`/api/projects/${id}/tasks`);
        if (renderVersion !== taskRenderVersion) return;
        const destinations = await request('/api/projects?filter=Active');
        if (renderVersion !== taskRenderVersion) return;
        for (const task of tasks) {
          if (filter.value === 'Open' && task.completed || filter.value === 'Completed' && !task.completed) continue;
          if (priorityFilter.value !== 'All' && task.priority !== priorityFilter.value) continue;
          if ((appliedFrom || appliedThrough) && (!task.dueDate || (appliedFrom && task.dueDate < appliedFrom) || (appliedThrough && task.dueDate > appliedThrough))) continue;
          const row = element('div', undefined, list);
          row.dataset.testid = 'task-row';
          row.className = 'task-row';
          element('span', task.title, row);
          const renameForm = element('form', undefined, row);
          const renameInput = element('input', undefined, renameForm);
          renameInput.type = 'text';
          renameInput.value = task.title;
          renameInput.setAttribute('aria-label', 'New task title');
          renameInput.disabled = project.archived;
          const renameButton = element('button', 'Rename task', renameForm);
          renameButton.type = 'submit';
          renameButton.disabled = project.archived;
          renameForm.addEventListener('submit', async event => {
            event.preventDefault();
            const result = await request(`/api/tasks/${task.id}/rename`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: renameInput.value }) });
            if (result.error) { alert.textContent = result.error; alert.hidden = false; return; }
            alert.hidden = true;
            await renderTasks();
          });
          const checkbox = element('input', undefined, row);
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.disabled = project.archived;
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          const priority = element('select', undefined, row);
          priority.setAttribute('aria-label', 'Task priority');
          priority.disabled = project.archived;
          for (const value of ['Low', 'Normal', 'High']) {
            const option = element('option', value, priority);
            option.value = value;
            option.selected = task.priority === value;
          }
          priority.addEventListener('change', async () => {
            await request(`/api/tasks/${task.id}/priority`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: priority.value }) });
            await renderTasks();
          });
          checkbox.addEventListener('change', async () => {
            await request(`/api/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
            await renderTasks();
          });
          const dueForm = element('form', undefined, row);
          const dueInput = element('input', undefined, dueForm);
          dueInput.type = 'text';
          dueInput.value = task.dueDate || '';
          dueInput.setAttribute('aria-label', 'Task due date');
          dueInput.disabled = project.archived;
          const dueButton = element('button', 'Save due date', dueForm);
          dueButton.type = 'submit';
          dueButton.disabled = project.archived;
          dueForm.addEventListener('submit', async event => {
            event.preventDefault();
            const result = await request(`/api/tasks/${task.id}/due-date`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dueDate: dueInput.value }) });
            if (result.error) { alert.textContent = result.error; alert.hidden = false; return; }
            alert.hidden = true;
            await renderTasks();
          });
          const moveForm = element('form', undefined, row);
          const destinationSelect = element('select', undefined, moveForm);
          destinationSelect.setAttribute('aria-label', 'Destination project');
          for (const destination of destinations.filter(item => item.id !== project.id)) {
            const option = element('option', destination.name, destinationSelect);
            option.value = destination.id;
          }
          const moveButton = element('button', 'Move task', moveForm);
          moveButton.type = 'submit';
          moveButton.disabled = project.archived || destinationSelect.options.length === 0;
          destinationSelect.disabled = moveButton.disabled;
          moveForm.addEventListener('submit', async event => {
            event.preventDefault();
            const result = await request(`/api/tasks/${task.id}/move`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ projectId: Number(destinationSelect.value) }) });
            if (result.error) { alert.textContent = result.error; alert.hidden = false; return; }
            alert.hidden = true;
            await renderTasks();
          });
        }
      };
      filter.addEventListener('change', renderTasks);
      priorityFilter.addEventListener('change', renderTasks);
      rangeForm.addEventListener('submit', event => {
        event.preventDefault();
        const from = fromInput.value.trim(), through = throughInput.value.trim();
        const validDate = value => {
          if (!value) return true;
          const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (!match) return false;
          const [, ys, ms, ds] = match;
          const y = Number(ys), m = Number(ms), d = Number(ds);
          const leap = y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0);
          const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
          return y >= 1 && m >= 1 && m <= 12 && d >= 1 && d <= days[m - 1];
        };
        if (!validDate(from) || !validDate(through)) { alert.textContent = 'Due range must use valid YYYY-MM-DD dates'; alert.hidden = false; return; }
        if (from && through && from > through) { alert.textContent = 'Due from must not be after Due through'; alert.hidden = false; return; }
        appliedFrom = from; appliedThrough = through;
        alert.hidden = true;
        renderTasks();
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const result = await request(`/api/projects/${id}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: input.value }) });
        if (result.error) { alert.textContent = result.error; alert.hidden = false; return; }
        input.value = '';
        alert.hidden = true;
        await renderTasks();
      });
      await renderTasks();
    }

    const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
    if (match) await showProject(match[1]);
    else await showProjects();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1d2939; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 760px; margin: 64px auto; padding: 0 24px; }
    h1 { margin: 0 0 28px; font-size: 2rem; }
    form { display: flex; gap: 12px; align-items: end; margin-bottom: 24px; }
    label { display: grid; gap: 7px; font-weight: 600; flex: 1; }
    input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #aab4c0; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 11px 16px; background: #245bd6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #1949b6; }
    a.download { display: inline-block; border-radius: 6px; padding: 11px 16px; background: #245bd6; color: white; font-weight: 600; text-decoration: none; }
    .project-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; margin: 10px 0; background: white; border: 1px solid #e1e6ed; border-radius: 8px; }
    .project-name { font-weight: 600; overflow-wrap: anywhere; }
    .task-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin: 10px 0; background: white; border: 1px solid #e1e6ed; border-radius: 8px; }
    .task-row form { margin: 0; flex: 1; }
    .task-row form label { min-width: 120px; }
    .task-row label { display: flex; align-items: center; gap: 10px; font-weight: 400; }
    .task-row input { width: auto; }
    select { padding: 9px 12px; border: 1px solid #aab4c0; border-radius: 6px; font: inherit; }
    [role="alert"] { color: #b42318; margin: 0 0 16px; }
    .back { margin-bottom: 24px; }
    @media (max-width: 520px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.querySelector('#app');
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normalizeSearch = value => String(value).replace(/[A-Z]/g, c => c.toLowerCase()).replace(/[ \t]+/g, ' ');
    async function renderList() {
      app.innerHTML = '<h1>Workboard</h1><button type="button" id="open-directory">Task directory</button><form id="create-form"><label>Project name<input name="name" type="text" autocomplete="off"></label><button type="submit">Create project</button></form><div id="alert" role="alert" hidden></div><label>Project filter<select id="project-filter"><option>Active</option><option>Archived</option></select></label><form id="project-search-form"><label>Project search<input name="query" type="text" autocomplete="off"></label><button type="submit">Search projects</button></form><section id="projects" aria-label="Projects"></section><h2>Import project</h2><form id="import-form"><label>Project JSON<textarea name="json"></textarea></label><label>Imported project name<input name="name" type="text"></label><button type="submit">Import project</button></form><div id="import-alert" role="alert" hidden></div>';
      document.querySelector('#open-directory').onclick = () => location.href = '/directory';
      const form = document.querySelector('#create-form'), input = form.elements.name, alert = document.querySelector('#alert');
      let appliedQuery = '';
      const searchForm = document.querySelector('#project-search-form');
      searchForm.addEventListener('submit', event => { event.preventDefault(); appliedQuery = searchForm.elements.query.value.trim(); load(); });
      async function load() {
        const archived = document.querySelector('#project-filter').value === 'Archived';
        const projects = await fetch(`/api/projects?filter=${archived ? 'Archived' : 'Active'}`).then(r => r.json());
        const needle = normalizeSearch(appliedQuery);
        document.querySelector('#projects').innerHTML = projects.filter(p => normalizeSearch(p.name).includes(needle)).map(p => `<div class="project-row" data-testid="project-row"><span class="project-name">${escapeHTML(p.name)}</span><span data-testid="project-summary">${p.completedCount}/${p.totalCount} completed</span><button type="button" data-open="${escapeHTML(p.id)}">Open project</button><button type="button" data-archive="${escapeHTML(p.id)}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => location.href = `/projects/${encodeURIComponent(b.dataset.open)}`);
        document.querySelectorAll('[data-archive]').forEach(b => b.onclick = async () => { await fetch(`/api/projects/${encodeURIComponent(b.dataset.archive)}/archive`, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:!archived})}); await load(); });
      }
      form.addEventListener('submit', async event => { event.preventDefault(); const name=input.value.trim(); if(!name){alert.textContent='Project name is required';alert.hidden=false;return;} await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}); input.value='';alert.hidden=true;await load(); });
      document.querySelector('#import-form').addEventListener('submit', async event => { event.preventDefault(); const f=event.currentTarget, alertBox=document.querySelector('#import-alert'); let payload; try { payload=JSON.parse(f.elements.json.value); } catch { alertBox.textContent='Invalid project JSON'; alertBox.hidden=false; return; } const name=f.elements.name.value.trim(); if(!name){ alertBox.textContent='Project name is required'; alertBox.hidden=false; return; } const result=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document:payload,name})}); if(!result.ok){const error=await result.json();alertBox.textContent=error.error;alertBox.hidden=false;return;} location.href='/projects/'+encodeURIComponent((await result.json()).id); });
      document.querySelector('#project-filter').addEventListener('change',load); await load();
    }
    async function renderDetail(id) {
      let appliedDueFrom = '', appliedDueThrough = '', appliedTaskQuery = '';
      const response = await fetch(`/api/projects/${encodeURIComponent(id)}`);
      if (!response.ok) { app.innerHTML = '<h1>Project not found</h1><button class="back" type="button">Projects</button>'; }
      else {
        const project = await response.json();
        app.innerHTML = `<button class="back" type="button">Projects</button><button class="download" type="button" id="download-project">Download project</button>${project.archived ? '<p>Archived project</p>' : ''}<h1>${escapeHTML(project.name)}</h1><form id="rename-form"><label>New project name<input name="name" type="text" autocomplete="off" ${project.archived ? 'disabled' : ''}></label><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form><div id="rename-alert" role="alert" hidden></div><form id="task-form"><label>Task title<input name="title" type="text" autocomplete="off" ${project.archived ? 'disabled' : ''}></label><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form><div id="task-alert" role="alert" hidden></div><label>Task filter<select id="task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select></label><label>Priority filter<select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label><label>Default task priority<select id="default-priority" ${project.archived ? 'disabled' : ''}><option ${project.defaultPriority === 'Low' ? 'selected' : ''}>Low</option><option ${project.defaultPriority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.defaultPriority === 'High' ? 'selected' : ''}>High</option></select></label><form id="due-range-form"><label>Due from<input name="dueFrom" type="text" placeholder="YYYY-MM-DD"></label><label>Due through<input name="dueThrough" type="text" placeholder="YYYY-MM-DD"></label><button type="submit">Apply due range</button></form><div id="range-alert" role="alert" hidden></div><form id="task-search-form"><label>Task search<input name="query" type="text" autocomplete="off"></label><button type="submit">Search tasks</button></form><section id="tasks" aria-label="Tasks"></section>`;
        document.querySelector('#download-project').addEventListener('click', async () => {
          const result = await fetch(`/api/projects/${encodeURIComponent(id)}/export`);
          const blob = await result.blob();
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'workboard-project.json';
          link.click();
          URL.revokeObjectURL(link.href);
        });
        const alert = document.querySelector('#task-alert');
        if (!project.archived) {
          const renameForm = document.querySelector('#rename-form');
          const renameAlert = document.querySelector('#rename-alert');
          renameForm.addEventListener('submit', async event => {
            event.preventDefault();
            const name = renameForm.elements.name.value.trim();
            if (!name) { renameAlert.textContent = 'Project name is required'; renameAlert.hidden = false; return; }
            const result = await fetch(`/api/projects/${encodeURIComponent(id)}/rename`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
            if (!result.ok) { renameAlert.textContent = 'Project name is required'; renameAlert.hidden = false; return; }
            project.name = name;
            document.querySelector('h1').textContent = name;
            renameForm.elements.name.value = '';
            renameAlert.hidden = true;
          });
        }
        async function loadTasks() {
          const [tasks, destinations] = await Promise.all([
            fetch(`/api/projects/${encodeURIComponent(id)}/tasks`).then(r => r.json()),
            fetch('/api/projects?filter=Active').then(r => r.json())
          ]);
          const eligible = destinations.filter(p => p.id !== id);
          const filter = document.querySelector('#task-filter').value;
          const priorityFilter = document.querySelector('#priority-filter').value;
          const needle = normalizeSearch(appliedTaskQuery);
          const visible = tasks.filter(task => normalizeSearch(task.title).includes(needle) && (filter === 'Deleted' ? Boolean(task.deleted) : !task.deleted && (filter === 'All' || (filter === 'Completed') === Boolean(task.completed))) && (priorityFilter === 'All' || task.priority === priorityFilter) && (!appliedDueFrom && !appliedDueThrough || task.dueDate && (!appliedDueFrom || task.dueDate >= appliedDueFrom) && (!appliedDueThrough || task.dueDate <= appliedDueThrough)));
          document.querySelector('#tasks').innerHTML = visible.map(task => `<div class="task-row" data-testid="task-row"><label><input type="checkbox" aria-label="Complete ${escapeHTML(task.title)}" data-task-id="${escapeHTML(task.id)}" ${task.completed ? 'checked' : ''} ${project.archived || task.deleted ? 'disabled' : ''}>${escapeHTML(task.title)}</label><form data-rename-task="${escapeHTML(task.id)}"><label>New task title<input name="title" type="text" autocomplete="off" ${project.archived || task.deleted ? 'disabled' : ''}></label><button type="submit" ${project.archived || task.deleted ? 'disabled' : ''}>Rename task</button></form><label>Task priority<select aria-label="Task priority" data-priority-task="${escapeHTML(task.id)}" ${project.archived || task.deleted ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select></label><form data-due-task="${escapeHTML(task.id)}"><label>Task due date<input name="dueDate" type="text" value="${escapeHTML(task.dueDate || '')}" placeholder="YYYY-MM-DD" ${project.archived || task.deleted ? 'disabled' : ''}></label><button type="submit" ${project.archived || task.deleted ? 'disabled' : ''}>Save due date</button></form><form data-notes-task="${escapeHTML(task.id)}"><label>Task notes<textarea name="notes" ${project.archived || task.deleted ? 'disabled' : ''}>${escapeHTML(task.notes || '')}</textarea></label><button type="submit" ${project.archived || task.deleted ? 'disabled' : ''}>Save notes</button></form><label>Destination project<select aria-label="Destination project" data-destination-task="${escapeHTML(task.id)}" ${project.archived || task.deleted || eligible.length === 0 ? 'disabled' : ''}>${eligible.map(p => `<option value="${escapeHTML(p.id)}">${escapeHTML(p.name)}</option>`).join('')}</select></label><button type="button" data-move-task="${escapeHTML(task.id)}" ${project.archived || task.deleted || eligible.length === 0 ? 'disabled' : ''}>Move task</button><button type="button" data-delete-task="${escapeHTML(task.id)}" ${project.archived ? 'disabled' : ''}>${task.deleted ? 'Restore task' : 'Delete task'}</button></div>`).join('');
          document.querySelectorAll('#tasks input[type="checkbox"]').forEach(box => box.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(box.dataset.taskId)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ completed: box.checked }) });
            await loadTasks();
          }));
          document.querySelectorAll('[data-priority-task]').forEach(select => select.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(select.dataset.priorityTask)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ priority: select.value }) });
            await loadTasks();
          }));
          document.querySelectorAll('[data-move-task]').forEach(button => button.addEventListener('click', async () => {
            const select = document.querySelector(`[data-destination-task="${CSS.escape(button.dataset.moveTask)}"]`);
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(button.dataset.moveTask)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ destinationProjectId: select.value }) });
            await loadTasks();
          }));
          document.querySelectorAll('[data-delete-task]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => item.id === button.dataset.deleteTask);
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(task.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ deleted: !task.deleted }) });
            await loadTasks();
          }));
          document.querySelectorAll('[data-notes-task]').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(form.dataset.notesTask)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ notes: form.elements.notes.value }) });
            await loadTasks();
          }));
          document.querySelectorAll('[data-due-task]').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const dueDate = form.elements.dueDate.value.trim();
            const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(form.dataset.dueTask)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dueDate }) });
            if (!result.ok) { alert.textContent = 'Due date must be a valid YYYY-MM-DD date'; alert.hidden = false; return; }
            alert.hidden = true;
            form.elements.dueDate.value = (await result.json()).dueDate || '';
            await loadTasks();
          }));
          document.querySelectorAll('[data-rename-task]').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const input = form.elements.title;
            const title = input.value.trim();
            if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
            const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${encodeURIComponent(form.dataset.renameTask)}/rename`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title }) });
            if (!result.ok) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
            alert.hidden = true;
            await loadTasks();
          }));
        }
        document.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = event.currentTarget.elements.title;
          const title = input.value.trim();
          if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
          const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title }) });
          if (!result.ok) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
          input.value = ''; alert.hidden = true; await loadTasks();
        });
        document.querySelector('#default-priority').addEventListener('change', async event => {
          const priority = event.currentTarget.value;
          await fetch(`/api/projects/${encodeURIComponent(id)}/default-priority`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ priority }) });
        });
        document.querySelector('#task-filter').addEventListener('change', loadTasks);
        const taskSearchForm = document.querySelector('#task-search-form');
        taskSearchForm.addEventListener('submit', event => { event.preventDefault(); appliedTaskQuery = taskSearchForm.elements.query.value.trim(); loadTasks(); });
        document.querySelector('#due-range-form').addEventListener('submit', event => {
          event.preventDefault();
          const form = event.currentTarget;
          const from = form.elements.dueFrom.value.trim(), through = form.elements.dueThrough.value.trim();
          const valid = value => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value); if (!m) return false; const y=+m[1], mo=+m[2], d=+m[3]; if (y<1 || mo<1 || mo>12 || d<1) return false; const leap=y%4===0&&(y%100!==0||y%400===0); return d <= [31,leap?29:28,31,30,31,30,31,31,30,31,30,31][mo-1]; };
          const alert = document.querySelector('#range-alert');
          if ((from && !valid(from)) || (through && !valid(through))) { alert.textContent='Due range must use valid YYYY-MM-DD dates'; alert.hidden=false; return; }
          if (from && through && from > through) { alert.textContent='Due from must not be after Due through'; alert.hidden=false; return; }
          appliedDueFrom=from; appliedDueThrough=through; alert.hidden=true; loadTasks();
        });
        document.querySelector('#priority-filter').addEventListener('change', loadTasks);
        await loadTasks();
      }
      document.querySelector('.back').addEventListener('click', () => { location.href = '/'; });
    }
    async function renderDirectory() {
      app.innerHTML = `<button type="button" class="back" onclick="location.href='/'">Projects</button><h1>Task directory</h1><label>Project scope<select id="scope"><option>Active</option><option>Archived</option></select></label><label>Task filter<select id="dir-task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select></label><label>Priority filter<select id="dir-priority"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label><form id="directory-search"><label>Directory search<input name="query"></label><button>Search directory</button></form><form id="directory-range"><label>Due from<input name="from"></label><label>Due through<input name="through"></label><button>Apply due range</button></form><div id="directory-alert" role="alert" hidden></div><section id="directory-results"></section>`;
      let query='', from='', through='';
      const normalize = s => normalizeSearch(s.trim());
      async function load() {
        const projects = await fetch('/api/projects?filter='+document.querySelector('#scope').value).then(r=>r.json());
        const all = await Promise.all(projects.map(async p => (await fetch(`/api/projects/${encodeURIComponent(p.id)}/tasks`).then(r=>r.json())).map(t=>({...t, owner:p}))));
        const f=document.querySelector('#dir-task-filter').value, pr=document.querySelector('#dir-priority').value, needle=normalize(query);
        const rows=all.flat().filter(t=>normalize(t.title).includes(needle) && (f==='Deleted'?!!t.deleted:!t.deleted&&(f==='All'||(f==='Completed')===!!t.completed)) && (pr==='All'||t.priority===pr) && ((!from&&!through)|| (t.dueDate&&(!from||t.dueDate>=from)&&(!through||t.dueDate<=through))));
        document.querySelector('#directory-results').innerHTML=rows.map(t=>`<div data-testid="directory-task-row"><span data-testid="directory-task-title">${escapeHTML(t.title)}</span><span data-testid="directory-project-name">${escapeHTML(t.owner.name)}</span><span data-testid="directory-task-completion">${t.completed?'Completed':'Open'}</span><span data-testid="directory-task-priority">${escapeHTML(t.priority||'Normal')}</span><span data-testid="directory-task-due-date">${escapeHTML(t.dueDate||'')}</span><span data-testid="directory-task-notes">${escapeHTML(t.notes||'')}</span><button type="button" data-owner="${escapeHTML(t.owner.id)}">Open project</button></div>`).join('');
        document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>location.href='/projects/'+encodeURIComponent(b.dataset.owner));
      }
      document.querySelector('#directory-search').onsubmit=e=>{e.preventDefault();query=e.currentTarget.elements.query.value.trim();load();};
      document.querySelector('#directory-range').onsubmit=e=>{e.preventDefault();const a=e.currentTarget.elements.from.value.trim(),b=e.currentTarget.elements.through.value.trim();const valid=s=>!s||/^\d{4}-\d{2}-\d{2}$/.test(s)&&validCalendar(s); if(!valid(a)||!valid(b)){const x=document.querySelector('#directory-alert');x.textContent='Due range must use valid YYYY-MM-DD dates';x.hidden=false;return;}if(a&&b&&a>b){const x=document.querySelector('#directory-alert');x.textContent='Due from must not be after Due through';x.hidden=false;return;}from=a;through=b;document.querySelector('#directory-alert').hidden=true;load();};
      for(const id of ['scope','dir-task-filter','dir-priority'])document.querySelector('#'+id).onchange=load;
      await load();
    }
    function validCalendar(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return false;const y=+m[1],mo=+m[2],d=+m[3],leap=y%4===0&&(y%100!==0||y%400===0);return y>0&&mo>=1&&mo<=12&&d>=1&&d<=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31][mo-1];}
    const match = location.pathname.match(/^\/projects\/([^/]+)\/?$/);
    if (location.pathname === '/directory') renderDirectory(); else if (match) renderDetail(decodeURIComponent(match[1])); else renderList();
  </script>
</body>
</html>

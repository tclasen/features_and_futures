<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <section id="projects-view" aria-labelledby="page-title">
      <h1 id="page-title">Workboard</h1>
      <form id="project-form">
        <label for="project-name">Project name</label>
        <div class="form-row">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
        <p id="alert" role="alert" hidden></p>
      </form>
      <form id="project-search-form">
        <label for="project-search">Project search</label>
        <div class="form-row">
          <input id="project-search" type="text">
          <button type="submit">Search projects</button>
        </div>
      </form>
      <label for="project-filter">Project filter</label>
      <select id="project-filter">
        <option>Active</option>
        <option>Archived</option>
      </select>
      <div id="project-list" aria-live="polite"></div>
    </section>
    <section id="detail-view" hidden>
      <button id="back-button" type="button">Projects</button>
      <p id="archived-notice" hidden>Archived project</p>
      <h1 id="project-title"></h1>
      <form id="rename-form">
        <label for="new-project-name">New project name</label>
        <div class="form-row">
          <input id="new-project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Rename project</button>
        </div>
        <p id="rename-alert" role="alert" hidden></p>
      </form>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <div class="form-row">
          <input id="task-title" name="title" type="text" autocomplete="off">
          <button type="submit">Create task</button>
        </div>
        <p id="task-alert" role="alert" hidden></p>
      </form>
      <label for="default-task-priority">Default task priority</label>
      <select id="default-task-priority">
        <option>Low</option>
        <option>Normal</option>
        <option>High</option>
      </select>
      <form id="task-search-form">
        <label for="task-search">Task search</label>
        <div class="form-row">
          <input id="task-search" type="text">
          <button type="submit">Search tasks</button>
        </div>
      </form>
      <label for="task-filter">Task filter</label>
      <select id="task-filter">
        <option>All</option>
        <option>Open</option>
        <option>Completed</option>
      </select>
      <label for="priority-filter">Priority filter</label>
      <select id="priority-filter">
        <option>All</option>
        <option>Low</option>
        <option>Normal</option>
        <option>High</option>
      </select>
      <div class="form-row">
        <label for="due-from">Due from</label>
        <input id="due-from" type="text">
        <label for="due-through">Due through</label>
        <input id="due-through" type="text">
        <button id="apply-due-range" type="button">Apply due range</button>
      </div>
      <div id="task-list" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>

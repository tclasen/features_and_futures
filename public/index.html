<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #202938; background: #f4f6f9; }
    body { margin: 0; }
    main { max-width: 760px; margin: 64px auto; padding: 32px; background: white; border-radius: 12px; box-shadow: 0 4px 18px #16243a12; }
    h1 { margin-top: 0; }
    form { display: flex; gap: 12px; align-items: end; margin: 24px 0; }
    label { display: grid; gap: 6px; flex: 1; font-weight: 600; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 6px; }
    input { border: 1px solid #aab4c2; }
    button { border: 0; background: #2459c4; color: white; cursor: pointer; }
    button:hover { background: #19479f; }
    .project-row, .task-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 1px solid #e3e7ed; }
    .task-row label { display: flex; align-items: center; gap: 8px; font-weight: 400; }
    select { font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid #aab4c2; }
    .alert { color: #a32626; margin: 12px 0; }
    @media (max-width: 600px) { main { margin: 20px; padding: 22px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapePath = id => `/projects/${encodeURIComponent(id)}`;
    async function projects() {
      const response = await fetch('/api/projects');
      if (!response.ok) throw new Error('Unable to load projects');
      return response.json();
    }
    let listRenderVersion = 0;
    async function renderList(selectedFilter = 'Active') {
      const version = ++listRenderVersion;
      app.replaceChildren();
      const heading = document.createElement('h1');
      heading.textContent = 'Workboard';
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Project name';
      const input = document.createElement('input');
      input.type = 'text';
      input.setAttribute('aria-label', 'Project name');
      label.append(input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create project';
      form.append(label, submit);
      const alert = document.createElement('div');
      alert.className = 'alert';
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          return;
        }
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
        if (response.ok) renderList();
      });
      const filterLabel = document.createElement('label');
      filterLabel.textContent = 'Project filter';
      const filter = document.createElement('select');
      filter.setAttribute('aria-label', 'Project filter');
      for (const value of ['Active', 'Archived']) {
        const option = document.createElement('option'); option.textContent = value; option.value = value; filter.append(option);
      }
      filter.value = selectedFilter;
      filter.addEventListener('change', () => renderList(filter.value));
      filterLabel.append(filter);
      app.append(heading, form, alert, filterLabel);
      const allProjects = await projects();
      if (version !== listRenderVersion) return;
      for (const project of allProjects) {
        if (filter.value === 'Active' && project.archived || filter.value === 'Archived' && !project.archived) continue;
        const row = document.createElement('div');
        row.className = 'project-row';
        row.dataset.testid = 'project-row';
        const name = document.createElement('span');
        name.textContent = project.name;
        const open = document.createElement('button');
        open.textContent = 'Open project';
        open.addEventListener('click', () => { location.href = escapePath(project.id); });
        const summary = document.createElement('span');
        summary.dataset.testid = 'project-summary';
        summary.textContent = `${project.completedCount}/${project.totalCount} completed`;
        const archive = document.createElement('button');
        archive.textContent = project.archived ? 'Restore project' : 'Archive project';
        archive.addEventListener('click', async () => {
          await fetch(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          renderList(filter.value);
        });
        row.append(name, summary, open, archive);
        app.append(row);
      }
    }
    async function renderProject(id) {
      const project = (await projects()).find(item => String(item.id) === id);
      if (!project) { location.replace('/'); return; }
      app.replaceChildren();
      const back = document.createElement('button');
      back.textContent = 'Projects';
      back.addEventListener('click', () => { location.href = '/'; });
      const heading = document.createElement('h1');
      heading.textContent = project.name;
      app.append(back, heading);
      const renameForm = document.createElement('form');
      const renameLabel = document.createElement('label');
      renameLabel.textContent = 'New project name';
      const renameInput = document.createElement('input');
      renameInput.type = 'text';
      renameInput.setAttribute('aria-label', 'New project name');
      renameInput.disabled = project.archived;
      renameLabel.append(renameInput);
      const renameButton = document.createElement('button');
      renameButton.type = 'submit';
      renameButton.textContent = 'Rename project';
      renameButton.disabled = project.archived;
      renameForm.append(renameLabel, renameButton);
      const renameAlert = document.createElement('div');
      renameAlert.className = 'alert';
      renameAlert.setAttribute('role', 'alert');
      renameAlert.hidden = true;
      renameForm.addEventListener('submit', async event => {
        event.preventDefault();
        const name = renameInput.value.trim();
        if (!name) { renameAlert.textContent = 'Project name is required'; renameAlert.hidden = false; return; }
        const response = await fetch(`/api/projects/${encodeURIComponent(id)}/rename`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
        if (response.ok) renderProject(id);
      });
      app.append(renameForm, renameAlert);
      if (project.archived) {
        const status = document.createElement('p'); status.textContent = 'Archived project'; app.append(status);
      }
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Task title';
      const input = document.createElement('input');
      input.type = 'text';
      input.setAttribute('aria-label', 'Task title');
      label.append(input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create task';
      submit.disabled = project.archived;
      form.append(label, submit);
      const alert = document.createElement('div');
      alert.className = 'alert';
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const defaultPriorityLabel = document.createElement('label');
      defaultPriorityLabel.textContent = 'Default task priority';
      const defaultPriority = document.createElement('select');
      defaultPriority.setAttribute('aria-label', 'Default task priority');
      for (const value of ['Low', 'Normal', 'High']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        defaultPriority.append(option);
      }
      defaultPriority.value = project.defaultPriority;
      defaultPriority.disabled = project.archived;
      defaultPriority.addEventListener('change', async () => {
        const response = await fetch(`/api/projects/${encodeURIComponent(id)}/default-priority`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: defaultPriority.value }) });
        if (!response.ok) { defaultPriority.value = project.defaultPriority; return; }
        project.defaultPriority = defaultPriority.value;
      });
      app.append(defaultPriorityLabel, defaultPriority);
      const filterLabel = document.createElement('label');
      filterLabel.textContent = 'Task filter';
      const filter = document.createElement('select');
      filter.setAttribute('aria-label', 'Task filter');
      for (const value of ['All', 'Open', 'Completed']) {
        const option = document.createElement('option');
        option.textContent = value;
        option.value = value;
        filter.append(option);
      }
      filterLabel.append(filter);
      const priorityFilterLabel = document.createElement('label');
      priorityFilterLabel.textContent = 'Priority filter';
      const priorityFilter = document.createElement('select');
      priorityFilter.setAttribute('aria-label', 'Priority filter');
      for (const value of ['All', 'Low', 'Normal', 'High']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        priorityFilter.append(option);
      }
      priorityFilterLabel.append(priorityFilter);
      const dueRangeForm = document.createElement('div');
      const fromLabel = document.createElement('label');
      fromLabel.textContent = 'Due from';
      const fromInput = document.createElement('input');
      fromInput.type = 'text';
      fromInput.setAttribute('aria-label', 'Due from');
      fromLabel.append(fromInput);
      const throughLabel = document.createElement('label');
      throughLabel.textContent = 'Due through';
      const throughInput = document.createElement('input');
      throughInput.type = 'text';
      throughInput.setAttribute('aria-label', 'Due through');
      throughLabel.append(throughInput);
      const applyRange = document.createElement('button');
      applyRange.type = 'button';
      applyRange.textContent = 'Apply due range';
      let appliedFrom = '';
      let appliedThrough = '';
      function validCalendarDate(value) {
        const match = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(value);
        if (!match) return false;
        const [, year, month, day] = match.map(Number);
        if (year < 1 || month < 1 || month > 12) return false;
        const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
        return day >= 1 && day <= [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
      }
      applyRange.addEventListener('click', () => {
        const from = fromInput.value.trim();
        const through = throughInput.value.trim();
        if (from && !validCalendarDate(from) || through && !validCalendarDate(through)) {
          alert.textContent = 'Due range must use valid YYYY-MM-DD dates'; alert.hidden = false; return;
        }
        if (from && through && from > through) {
          alert.textContent = 'Due from must not be after Due through'; alert.hidden = false; return;
        }
        appliedFrom = from; appliedThrough = through; alert.hidden = true; renderTasks();
      });
      dueRangeForm.append(fromLabel, throughLabel, applyRange);
      app.append(form, alert, filterLabel, priorityFilterLabel, dueRangeForm);
      let taskRenderVersion = 0;
      async function renderTasks() {
        const version = ++taskRenderVersion;
        const response = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`);
        const tasks = await response.json();
        if (version !== taskRenderVersion) return;
        app.querySelectorAll('[data-testid="task-row"]').forEach(row => row.remove());
        for (const task of tasks) {
          if (filter.value === 'Open' && task.completed || filter.value === 'Completed' && !task.completed) continue;
          if (priorityFilter.value !== 'All' && task.priority !== priorityFilter.value) continue;
          if ((appliedFrom || appliedThrough) && !task.dueDate) continue;
          if (task.dueDate && (appliedFrom && task.dueDate < appliedFrom || appliedThrough && task.dueDate > appliedThrough)) continue;
          const row = document.createElement('div');
          row.className = 'task-row';
          row.dataset.testid = 'task-row';
          const taskLabel = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.disabled = project.archived;
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            await fetch(`/api/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
            renderTasks();
          });
          const title = document.createElement('span');
          title.textContent = task.title;
          taskLabel.append(checkbox, title);
          row.append(taskLabel);
          const renameInput = document.createElement('input');
          renameInput.type = 'text';
          renameInput.setAttribute('aria-label', 'New task title');
          renameInput.disabled = project.archived;
          const renameButton = document.createElement('button');
          renameButton.type = 'button';
          renameButton.textContent = 'Rename task';
          renameButton.disabled = project.archived;
          if (!project.archived) {
            renameButton.addEventListener('click', async () => {
              const title = renameInput.value.trim();
              if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
              const renameResponse = await fetch(`/api/tasks/${task.id}/rename`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
              if (renameResponse.ok) { alert.hidden = true; await renderTasks(); }
            });
          }
          row.append(renameInput, renameButton);
          const priority = document.createElement('select');
          priority.setAttribute('aria-label', 'Task priority');
          for (const value of ['Low', 'Normal', 'High']) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            priority.append(option);
          }
          priority.value = task.priority;
          priority.disabled = project.archived;
          priority.addEventListener('change', async () => {
            const priorityResponse = await fetch(`/api/tasks/${task.id}/priority`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: priority.value }) });
            await renderTasks();
          });
          row.append(priority);
          const dueDateInput = document.createElement('input');
          dueDateInput.type = 'text';
          dueDateInput.value = task.dueDate || '';
          dueDateInput.setAttribute('aria-label', 'Task due date');
          dueDateInput.disabled = project.archived;
          const saveDueDate = document.createElement('button');
          saveDueDate.type = 'button';
          saveDueDate.textContent = 'Save due date';
          saveDueDate.disabled = project.archived;
          saveDueDate.addEventListener('click', async () => {
            const dueDate = dueDateInput.value.trim();
            const dateResponse = await fetch(`/api/tasks/${task.id}/due-date`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dueDate }) });
            if (!dateResponse.ok) {
              const result = await dateResponse.json();
              alert.textContent = result.error || 'Unable to save due date';
              alert.hidden = false;
              return;
            }
            alert.hidden = true;
            await renderTasks();
          });
          row.append(dueDateInput, saveDueDate);
          app.append(row);
        }
      }
      filter.addEventListener('change', renderTasks);
      priorityFilter.addEventListener('change', renderTasks);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
        const response = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
        if (response.ok) { input.value = ''; alert.hidden = true; await renderTasks(); }
      });
      await renderTasks();
    }
    const match = location.pathname.match(/^\/projects\/(\d+)$/);
    (match ? renderProject(match[1]) : renderList()).catch(error => {
      app.textContent = error.message;
    });
  </script>
</body>
</html>

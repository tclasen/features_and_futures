<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workboard</title><style>
:root{font-family:system-ui,sans-serif;color:#182230;background:#f5f7fa}body{margin:0}main{max-width:760px;margin:56px auto;padding:0 24px}h1{font-size:2rem;margin:24px 0}form,.row{background:white;border:1px solid #dce2e9;border-radius:8px;padding:20px}form{display:flex;gap:12px;align-items:end}label{display:block;font-weight:600;margin-bottom:7px}input{font:inherit;padding:10px 12px;border:1px solid #aab5c2;border-radius:5px;width:min(420px,55vw)}select{font:inherit;padding:10px 12px;border:1px solid #aab5c2;border-radius:5px;background:white}button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:5px;background:#245fc5;color:white;cursor:pointer}.rows{display:grid;gap:12px;margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.row label{margin:0;display:flex;align-items:center;gap:10px}.task-check{width:auto}.alert{color:#a32626;margin:12px 0 0}.filters{margin-top:18px}.actions{display:flex;gap:8px;align-items:center}

async function render(){const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);if(match){const list=await(await fetch('/api/projects')).json(),p=list.find(x=>String(x.id)===match[1]);if(!p){app.innerHTML='<h1>Project not found</h1><button id="back">Projects</button>';document.querySelector('#back').onclick=()=>go('/');return}const locked=!!p.archived;app.innerHTML=`<button id="back">Projects</button>${locked?'<p>Archived project</p>':''}<h1>${esc(p.name)}</h1><form id="rename-project"><div><label for="new-project-name">New project name</label><input id="new-project-name" type="text" ${locked?'disabled':''}></div><button ${locked?'disabled':''}>Rename project</button></form><div id="rename-alert" class="alert" role="alert" hidden></div><form id="create-task"><div><label for="task-title">Task title</label><input id="task-title" type="text"></div><button ${locked?'disabled':''}>Create task</button></form><div id="alert" class="alert" role="alert" hidden></div><div class="filters"><label for="default-task-priority">Default task priority</label><select id="default-task-priority" ${locked?'disabled':''}><option ${p.defaultPriority==='Low'?'selected':''}>Low</option><option ${p.defaultPriority==='Normal'?'selected':''}>Normal</option><option ${p.defaultPriority==='High'?'selected':''}>High</option></select><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select><label for="priority-filter">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></div><div id="task-rename-alert" class="alert" role="alert" hidden></div><div id="tasks" class="rows"></div>`;document.querySelector('#back').onclick=()=>go('/');document.querySelector('#rename-project').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#new-project-name'),alert=document.querySelector('#rename-alert'),name=input.value.trim();if(!name){alert.textContent='Project name is required';alert.hidden=false;return}const response=await fetch(`/api/projects/${match[1]}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(response.ok)render()};let tasks=await(await fetch(`/api/projects/${match[1]}/tasks`)).json();const draw=()=>{const f=document.querySelector('#task-filter').value,priority=document.querySelector('#priority-filter').value;document.querySelector('#tasks').innerHTML=tasks.filter(t=>(f==='All'||(f==='Open'&&!t.completed)||(f==='Completed'&&t.completed))&&(priority==='All'||t.priority===priority)).map(t=>`<div class="row" data-testid="task-row"><span>${esc(t.title)}</span><label><input class="task-check" type="checkbox" aria-label="Complete ${esc(t.title)}" data-id="${t.id}" ${t.completed?'checked':''} ${locked?'disabled':''}></label><label>Task priority<select class="task-priority" data-id="${t.id}" ${locked?'disabled':''}><option ${t.priority==='Low'?'selected':''}>Low</option><option ${t.priority==='Normal'?'selected':''}>Normal</option><option ${t.priority==='High'?'selected':''}>High</option></select></label><form class="rename-task" data-id="${t.id}"><div><label for="new-task-${t.id}">New task title</label><input id="new-task-${t.id}" type="text" value="${esc(t.title)}" ${locked?'disabled':''}></div><button ${locked?'disabled':''}>Rename task</button></form></div>`).join('');document.querySelectorAll('.task-priority').forEach(s=>s.onchange=async()=>{await fetch(`/api/projects/${match[1]}/tasks/${s.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:s.value})});tasks.find(t=>String(t.id)===s.dataset.id).priority=s.value;draw()});document.querySelectorAll('.task-check').forEach(b=>b.onchange=async()=>{await fetch(`/api/projects/${match[1]}/tasks/${b.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:b.checked})});tasks.find(t=>String(t.id)===b.dataset.id).completed=+b.checked;draw()});document.querySelectorAll('.rename-task').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const id=form.dataset.id,input=form.querySelector('input'),alert=document.querySelector('#task-rename-alert'),title=input.value.trim();if(!title){alert.textContent='Task title is required';alert.hidden=false;return}const response=await fetch(`/api/projects/${match[1]}/tasks/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(response.ok){tasks.find(t=>String(t.id)===id).title=title;alert.hidden=true;draw()}})};document.querySelector('#task-filter').onchange=draw;document.querySelector('#priority-filter').onchange=draw;document.querySelector('#default-task-priority').onchange=async e=>{const value=e.target.value;const r=await fetch(`/api/projects/${match[1]}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({defaultPriority:value})});if(r.ok)p.defaultPriority=value};draw();document.querySelector('#create-task').onsubmit=async e=>{e.preventDefault();const title=document.querySelector('#task-title').value.trim(),a=document.querySelector('#alert');if(!title){a.textContent='Task title is required';a.hidden=false;return}const r=await fetch(`/api/projects/${match[1]}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(r.ok){tasks.push(await r.json());document.querySelector('#task-title').value='';a.hidden=true;draw()}};return}
const projects=await(await fetch('/api/projects')).json();app.innerHTML=`<h1>Workboard</h1><form id="create"><div><label for="project-name">Project name</label><input id="project-name" type="text"></div><button>Create project</button></form><div id="alert" class="alert" role="alert" hidden></div><div class="filters"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div><div id="projects" class="rows"></div>`;const draw=()=>{const archived=document.querySelector('#project-filter').value==='Archived',shown=projects.filter(p=>!!p.archived===archived);document.querySelector('#projects').innerHTML=shown.map(p=>`<div class="row" data-testid="project-row"><span>${esc(p.name)} <span data-testid="project-summary">${p.completedCount}/${p.totalCount} completed</span></span><div class="actions"><button data-open="${p.id}">Open project</button>${archived?`<button data-action="restore" data-id="${p.id}">Restore project</button>`:`<button data-action="archive" data-id="${p.id}">Archive project</button>`}</div></div>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(`/projects/${b.dataset.open}`));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{await fetch(`/api/projects/${b.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action})});const p=projects.find(x=>String(x.id)===b.dataset.id);p.archived=b.dataset.action==='archive';draw()})};document.querySelector('#project-filter').onchange=draw;draw();document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const name=document.querySelector('#project-name').value.trim(),a=document.querySelector('#alert');if(!name){a.textContent='Project name is required';a.hidden=false;return}const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(r.ok){projects.push(await r.json());document.querySelector('#project-name').value='';a.hidden=true;draw()}}}

</script></body></html>

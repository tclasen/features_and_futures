<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><h1>Workboard</h1></header>
      <section id="project-list" aria-labelledby="page-title">
        <h2 id="page-title">Projects</h2>
        <form id="create-form">
          <label for="project-name">Project name</label>
          <div class="form-row">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
          <p id="error-message" class="error" role="alert" hidden></p>
        </form>
        <div class="filter-row">
          <label for="project-filter">Project filter</label>
          <select id="project-filter"><option>Active</option><option>Archived</option></select>
        </div>
        <div id="projects" class="projects" aria-live="polite"></div>
      </section>
      <section id="project-detail" hidden>
        <button id="back-button" type="button">Projects</button>
        <h2 id="project-title"></h2>
        <p id="archived-notice" hidden>Archived project</p>
        <form id="task-form">
          <label for="task-title">Task title</label>
          <div class="form-row">
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit">Create task</button>
          </div>
          <p id="task-error-message" class="error" role="alert" hidden></p>
        </form>
        <div class="filter-row">
          <label for="task-filter">Task filter</label>
          <select id="task-filter">
            <option>All</option>
            <option>Open</option>
            <option>Completed</option>
          </select>
        </div>
        <div id="tasks" class="tasks" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>

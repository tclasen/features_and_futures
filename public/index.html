<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18212f; background: #f5f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 64px auto; padding: 0 24px; }
    h1 { font-size: 2rem; margin: 0 0 24px; }
    form, .project-row, .task-row { background: white; border: 1px solid #dce2eb; border-radius: 8px; padding: 20px; }
    form { display: flex; gap: 12px; align-items: end; }
    label { display: grid; gap: 6px; flex: 1; font-weight: 600; }
    input, select { padding: 10px; border: 1px solid #aab5c5; border-radius: 5px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 5px; background: #245fc5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #174b9e; }
    #alert { color: #a21d2b; margin-top: 12px; }
    #projects, #tasks { display: grid; gap: 10px; margin-top: 20px; }
    .project-row, .task-row { display: flex; justify-content: space-between; align-items: center; }
    .task-row label { display: flex; flex-direction: row; align-items: center; }
    @media (max-width: 520px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
<main id="app"><h1>Workboard</h1></main>
<script>
  const app = document.querySelector('#app');
  const projectPath = location.pathname.match(/^\/projects\/(\d+)$/);
  async function loadProjects() {
    const response = await fetch('/api/projects');
    if (!response.ok) throw new Error('Could not load projects');
    return response.json();
  }
  function go(path) { location.href = path; }
  if (projectPath) {
    loadProjects().then(projects => {
      const project = projects.find(item => String(item.id) === projectPath[1]);
      if (!project) { app.innerHTML = '<h1>Project not found</h1>'; return; }
      app.innerHTML = `<button type="button" id="back">Projects</button><h1 id="project-name"></h1>
        ${project.archived ? '<p>Archived project</p>' : ''}
        <form id="rename-form"><label>New project name<input name="name" aria-label="New project name" ${project.archived ? 'disabled' : ''}></label><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form>
        <form id="task-form"><label>Task title<input name="title" aria-label="Task title"></label><button type="submit">Create task</button></form>
        <div id="alert" role="alert" aria-live="polite"></div>
        <label>Task filter<select id="task-filter" aria-label="Task filter"><option>All</option><option>Open</option><option>Completed</option></select></label>
        <label>Priority filter<select id="priority-filter" aria-label="Priority filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label>
        <section id="tasks" aria-label="Tasks"></section>`;
      app.querySelector('#project-name').textContent = project.name;
      app.querySelector('#back').addEventListener('click', () => go('/'));
      const alert = app.querySelector('#alert');
      const renameForm = app.querySelector('#rename-form');
      if (renameForm) {
        renameForm.addEventListener('submit', async event => {
          event.preventDefault();
          const input = renameForm.elements.name;
          const name = input.value.trim();
          if (!name) { alert.textContent = 'Project name is required'; return; }
          const response = await fetch(`/api/projects/${project.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
          if (!response.ok) { alert.textContent = 'Unable to rename project'; return; }
          project.name = name;
          app.querySelector('#project-name').textContent = name;
          input.value = '';
          alert.textContent = '';
        });
      }
      const form = app.querySelector('#task-form');
      const filter = app.querySelector('#task-filter');
      const priorityFilter = app.querySelector('#priority-filter');
      if (project.archived) form.querySelector('button').disabled = true;
      async function renderTasks() {
        const response = await fetch(`/api/projects/${project.id}/tasks`);
        if (!response.ok) throw new Error('Could not load tasks');
        const tasks = await response.json();
        const list = app.querySelector('#tasks'); list.replaceChildren();
        for (const task of tasks.filter(item =>
          (filter.value === 'All' || (filter.value === 'Completed') === Boolean(item.completed)) &&
          (priorityFilter.value === 'All' || item.priority === priorityFilter.value)
        )) {
          const row = document.createElement('div'); row.className = 'task-row'; row.dataset.testid = 'task-row';
          const title = document.createElement('span'); title.textContent = task.title;
          const renameInput = document.createElement('input'); renameInput.type = 'text'; renameInput.setAttribute('aria-label', 'New task title'); renameInput.disabled = Boolean(project.archived);
          const renameButton = document.createElement('button'); renameButton.type = 'button'; renameButton.textContent = 'Rename task'; renameButton.disabled = Boolean(project.archived);
          renameButton.addEventListener('click', async () => {
            const newTitle = renameInput.value.trim();
            if (!newTitle) { alert.textContent = 'Task title is required'; return; }
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: newTitle }) });
            if (!response.ok) { alert.textContent = 'Unable to rename task'; return; }
            alert.textContent = ''; await renderTasks();
          });
          const priorityLabel = document.createElement('label');
          priorityLabel.textContent = 'Task priority';
          const priority = document.createElement('select'); priority.setAttribute('aria-label', 'Task priority'); priority.disabled = Boolean(project.archived);
          for (const value of ['Low', 'Normal', 'High']) {
            const option = document.createElement('option'); option.value = value; option.textContent = value; priority.append(option);
          }
          priority.value = task.priority;
          priority.addEventListener('change', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: priority.value }) });
            if (!response.ok) { alert.textContent = 'Unable to update task priority'; await renderTasks(); return; }
            alert.textContent = '';
            await renderTasks();
          });
          const label = document.createElement('label');
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = Boolean(task.completed); checkbox.disabled = Boolean(project.archived); checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            const response = await fetch(`/api/projects/${project.id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
            if (!response.ok) { checkbox.checked = !checkbox.checked; alert.textContent = 'Unable to update task'; return; }
            await renderTasks();
          });
          label.append(checkbox); row.append(title, renameInput, renameButton, priorityLabel, priority, label); list.append(row);
        }
      }
      filter.addEventListener('change', () => renderTasks().catch(() => { alert.textContent = 'Unable to load tasks'; }));
      priorityFilter.addEventListener('change', () => renderTasks().catch(() => { alert.textContent = 'Unable to load tasks'; }));
      form.addEventListener('submit', async event => {
        event.preventDefault(); const input = form.elements.title; const title = input.value.trim();
        if (!title) { alert.textContent = 'Task title is required'; return; }
        const response = await fetch(`/api/projects/${project.id}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
        if (!response.ok) { alert.textContent = 'Unable to create task'; return; }
        input.value = ''; alert.textContent = ''; await renderTasks();
      });
      renderTasks().catch(() => { alert.textContent = 'Unable to load tasks'; });
    }).catch(() => { app.innerHTML = '<h1>Unable to load project</h1>'; });
  } else {
    app.innerHTML = `<h1>Workboard</h1>
      <form id="create-form"><label>Project name<input name="name" aria-label="Project name"></label><button type="submit">Create project</button></form>
      <div id="alert" role="alert" aria-live="polite"></div>
      <label>Project filter<select id="project-filter" aria-label="Project filter"><option>Active</option><option>Archived</option></select></label>
      <section id="projects" aria-label="Projects"></section>`;
    const alert = app.querySelector('#alert');
    const form = app.querySelector('#create-form');
    async function render() {
      const projects = await loadProjects();
      const list = app.querySelector('#projects'); list.replaceChildren();
      for (const project of projects.filter(item => Boolean(item.archived) === (app.querySelector('#project-filter').value === 'Archived'))) {
        const row = document.createElement('div'); row.className = 'project-row'; row.dataset.testid = 'project-row';
        const name = document.createElement('span'); name.textContent = project.name;
        const summary = document.createElement('span'); summary.dataset.testid = 'project-summary'; summary.textContent = `${project.completedCount}/${project.totalCount} completed`;
        const open = document.createElement('button'); open.type = 'button'; open.textContent = 'Open project';
        open.addEventListener('click', () => go(`/projects/${project.id}`));
        const action = document.createElement('button'); action.type = 'button'; action.textContent = project.archived ? 'Restore project' : 'Archive project';
        action.addEventListener('click', async () => {
          const response = await fetch(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          if (!response.ok) { alert.textContent = 'Unable to update project'; return; }
          await render();
        });
        row.append(name, summary, open, action); list.append(row);
      }
    }
    app.querySelector('#project-filter').addEventListener('change', () => render().catch(() => { alert.textContent = 'Unable to load projects'; }));
    form.addEventListener('submit', async event => {
      event.preventDefault(); const input = form.elements.name; const name = input.value.trim();
      if (!name) { alert.textContent = 'Project name is required'; return; }
      const response = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
      if (!response.ok) { alert.textContent = 'Unable to create project'; return; }
      input.value = ''; alert.textContent = ''; await render();
    });
    render().catch(() => { alert.textContent = 'Unable to load projects'; });
  }
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #192333; background: #f4f6fa; }
    body { max-width: 760px; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { margin-bottom: 1.5rem; }
    form { display: flex; gap: .65rem; flex-wrap: wrap; margin: 1.25rem 0; }
    input, button, select { font: inherit; padding: .65rem .8rem; border: 1px solid #aab4c3; border-radius: 6px; }
    input { flex: 1; min-width: 220px; background: white; }
    button { background: #244fa3; color: white; border-color: #244fa3; cursor: pointer; }
    button:hover { background: #193c80; }
    .project-list, .task-list { display: grid; gap: .7rem; }
    .project-row, .task-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem; background: white; border: 1px solid #dce1e9; border-radius: 8px; }
    .alert { color: #a32323; min-height: 1.5em; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.querySelector('#app');
    const escapePath = id => `/projects/${encodeURIComponent(id)}`;
    async function projects() {
      const response = await fetch('/api/projects');
      if (!response.ok) throw new Error('Could not load projects');
      return response.json();
    }
    function go(path) { history.pushState({}, '', path); render(); }
    const request = (path, method, body) => fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
      if (match) {
        const list = await projects();
        const project = list.find(item => String(item.id) === match[1]);
        app.replaceChildren();
        const back = document.createElement('button'); back.textContent = 'Projects'; back.onclick = () => go('/'); app.append(back);
        const heading = document.createElement('h1'); heading.textContent = project ? project.name : 'Project not found'; app.append(heading);
        if (!project) return;
        app.insertAdjacentHTML('beforeend', `<form id="task-form"><label for="task-title">Task title</label><input id="task-title" type="text" aria-label="Task title"><button type="submit">Create task</button></form><p class="alert" role="alert" aria-live="polite"></p><label for="task-filter">Task filter</label> <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select><section class="task-list" aria-label="Tasks"></section>`);
        const alert = app.querySelector('.alert');
        app.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const title = app.querySelector('#task-title').value.trim();
          if (!title) { alert.textContent = 'Task title is required'; return; }
          const response = await request(`/api/projects/${match[1]}/tasks`, 'POST', { title });
          if (!response.ok) { alert.textContent = 'Task title is required'; return; }
          app.querySelector('#task-form').reset(); alert.textContent = ''; await renderTasks(match[1]);
        });
        app.querySelector('#task-filter').addEventListener('change', () => renderTasks(match[1]));
        await renderTasks(match[1]);
        return;
      }
      app.innerHTML = `<h1>Workboard</h1>
        <form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" aria-label="Project name"><button type="submit">Create project</button></form>
        <p class="alert" role="alert" aria-live="polite"></p><section class="project-list" aria-label="Projects"></section>`;
      const alert = app.querySelector('.alert');
      const form = app.querySelector('form');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const name = app.querySelector('input').value.trim();
        if (!name) { alert.textContent = 'Project name is required'; return; }
        const response = await request('/api/projects', 'POST', { name });
        if (!response.ok) { alert.textContent = 'Project name is required'; return; }
        form.reset(); alert.textContent = ''; await render();
      });
      const list = app.querySelector('.project-list');
      for (const project of await projects()) {
        const row = document.createElement('div'); row.className = 'project-row'; row.dataset.testid = 'project-row';
        const name = document.createElement('span'); name.textContent = project.name;
        const open = document.createElement('button'); open.textContent = 'Open project'; open.onclick = () => go(escapePath(project.id));
        row.append(name, open); list.append(row);
      }
    }
    async function renderTasks(projectId) {
      const response = await fetch(`/api/projects/${projectId}/tasks`);
      if (!response.ok) return;
      const tasks = await response.json();
      const filter = app.querySelector('#task-filter').value;
      const list = app.querySelector('.task-list'); list.replaceChildren();
      for (const task of tasks) {
        if (filter === 'Open' && task.completed || filter === 'Completed' && !task.completed) continue;
        const row = document.createElement('div'); row.className = 'task-row'; row.dataset.testid = 'task-row';
        const title = document.createElement('span'); title.textContent = task.title;
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.completed; checkbox.setAttribute('aria-label', `Complete ${task.title}`);
        checkbox.addEventListener('change', async () => { await request(`/api/tasks/${task.id}`, 'PATCH', { completed: checkbox.checked }); });
        row.append(title, checkbox); list.append(row);
      }
    }
    window.addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

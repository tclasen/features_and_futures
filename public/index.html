<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <section id="projects-view">
        <h1>Workboard</h1>
        <form id="project-form" novalidate>
          <label for="project-name">Project name</label>
          <div class="create-fields">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
        </form>
        <p id="alert" role="alert" hidden></p>
        <div class="project-filter">
          <label for="project-filter">Project filter</label>
          <select id="project-filter">
            <option value="active" selected>Active</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <form id="project-search-form" class="project-filter">
          <label for="project-search">Project search</label>
          <div class="create-fields">
            <input id="project-search" type="text" autocomplete="off">
            <button type="submit">Search projects</button>
          </div>
        </form>
        <div id="project-list" aria-label="Projects"></div>
      </section>
      <section id="project-view" hidden>
        <button id="back-button" type="button">Projects</button>
        <h1 id="project-heading"></h1>
        <button id="download-project" type="button" hidden>Download project</button>
        <p id="archived-message" hidden>Archived project</p>
        <p id="project-error" role="alert" hidden></p>
        <form id="rename-form" novalidate hidden>
          <label for="new-project-name">New project name</label>
          <div class="create-fields">
            <input id="new-project-name" name="name" type="text" autocomplete="off" disabled>
            <button type="submit" disabled>Rename project</button>
          </div>
        </form>
        <p id="rename-alert" role="alert" hidden></p>
        <div id="task-controls" hidden>
          <div class="task-filter">
            <label for="default-task-priority">Default task priority</label>
            <select id="default-task-priority" disabled>
              <option value="Low">Low</option>
              <option value="Normal" selected>Normal</option>
              <option value="High">High</option>
            </select>
          </div>
          <form id="task-form" novalidate>
            <label for="task-title">Task title</label>
            <div class="create-fields">
              <input id="task-title" name="title" type="text" autocomplete="off">
              <button type="submit" disabled>Create task</button>
            </div>
          </form>
          <p id="task-alert" role="alert" hidden></p>
          <div class="task-filter">
            <label for="task-filter">Task filter</label>
            <select id="task-filter">
              <option value="all" selected>All</option>
              <option value="open">Open</option>
              <option value="completed">Completed</option>
              <option value="deleted">Deleted</option>
            </select>
          </div>
          <div class="task-filter">
            <label for="priority-filter">Priority filter</label>
            <select id="priority-filter">
              <option value="all" selected>All</option>
              <option value="Low">Low</option>
              <option value="Normal">Normal</option>
              <option value="High">High</option>
            </select>
          </div>
          <form id="due-range-form" class="task-filter" novalidate>
            <label for="due-from">Due from</label>
            <input id="due-from" type="text" autocomplete="off">
            <label for="due-through">Due through</label>
            <input id="due-through" type="text" autocomplete="off">
            <button type="submit">Apply due range</button>
          </form>
          <p id="due-range-alert" role="alert" hidden></p>
          <form id="task-search-form" class="task-filter">
            <label for="task-search">Task search</label>
            <div class="create-fields">
              <input id="task-search" type="text" autocomplete="off">
              <button type="submit">Search tasks</button>
            </div>
          </form>
          <div id="task-list" aria-label="Tasks"></div>
        </div>
      </section>
    </main>
  </body>
</html>

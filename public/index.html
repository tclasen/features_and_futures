<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #202938; background: #f4f6f9; }
    main { width: min(720px, calc(100% - 32px)); margin: 56px auto; }
    h1 { font-size: 2rem; margin: 0 0 24px; }
    form, .project-row { display: flex; gap: 12px; align-items: center; }
    form { margin-bottom: 20px; }
    input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #aab4c2; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; color: white; background: #2457c5; font: inherit; cursor: pointer; }
    button:hover { background: #19439e; }
    .project-row { justify-content: space-between; padding: 14px 16px; margin: 10px 0; background: white; border: 1px solid #e0e5ec; border-radius: 8px; }
    [role="alert"] { color: #a21d2b; margin: 8px 0; }
    .back { margin-bottom: 20px; }
    .task-row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; margin: 10px 0; background: white; border: 1px solid #e0e5ec; border-radius: 8px; }
    .task-row input { flex: none; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    const app = document.querySelector('#app');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    async function renderList() {
      app.innerHTML = ` <h1>Workboard</h1>
        <form id="create-form"><label for="project-name">Project name</label>
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </form><div id="message"></div><section id="projects" aria-label="Projects"></section>`;
      const form = document.querySelector('#create-form');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = new FormData(form).get('name').trim();
        if (!name) {
          document.querySelector('#message').innerHTML = '<p role="alert">Project name is required</p>';
          return;
        }
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (response.ok) renderList();
      });
      const projects = await (await fetch('/api/projects')).json();
      document.querySelector('#projects').innerHTML = projects.map(project =>
        `<div class="project-row" data-testid="project-row"><span>${escapeHtml(project.name)}</span><button type="button" data-project-id="${project.id}">Open project</button></div>`
      ).join('');
      document.querySelectorAll('[data-project-id]').forEach(button => button.addEventListener('click', () => {
        location.href = `/projects/${button.dataset.projectId}`;
      }));
    }

    async function renderProject(id) {
      const response = await fetch(`/api/projects/${encodeURIComponent(id)}`);
      if (!response.ok) { location.replace('/'); return; }
      const project = await response.json();
      app.innerHTML = `<button class="back" type="button">Projects</button><h1>${escapeHtml(project.name)}</h1>
        <form id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" autocomplete="off"><button type="submit">Create task</button></form>
        <div id="message"></div><label for="task-filter">Task filter</label>
        <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select>
        <section id="tasks" aria-label="Tasks"></section>`;
      document.querySelector('.back').addEventListener('click', () => { location.href = '/'; });
      const form = document.querySelector('#task-form');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = new FormData(form).get('title').trim();
        if (!title) {
          document.querySelector('#message').innerHTML = '<p role="alert">Task title is required</p>';
          return;
        }
        const created = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
        if (created.ok) { form.reset(); document.querySelector('#message').replaceChildren(); await renderTasks(id); }
      });
      document.querySelector('#task-filter').addEventListener('change', () => renderTasks(id));
      await renderTasks(id);
    }

    async function renderTasks(projectId) {
      const response = await fetch(`/api/projects/${encodeURIComponent(projectId)}/tasks`);
      if (!response.ok) return;
      const tasks = await response.json();
      const filter = document.querySelector('#task-filter').value;
      const visible = tasks.filter(task => filter === 'All' || (filter === 'Open' && !task.completed) || (filter === 'Completed' && task.completed));
      document.querySelector('#tasks').innerHTML = visible.map(task =>
        `<div class="task-row" data-testid="task-row"><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" data-task-id="${task.id}" ${task.completed ? 'checked' : ''}><span>${escapeHtml(task.title)}</span></div>`
      ).join('');
      document.querySelectorAll('[data-task-id]').forEach(checkbox => checkbox.addEventListener('change', async () => {
        const result = await fetch(`/api/projects/${encodeURIComponent(projectId)}/tasks/${checkbox.dataset.taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
        if (result.ok) await renderTasks(projectId);
      }));
    }

    const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
    if (match) renderProject(match[1]); else renderList();
  </script>
</body>
</html>

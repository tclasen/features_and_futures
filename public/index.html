<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section id="project-list" aria-labelledby="app-title">
        <header class="page-header">
          <div class="eyebrow">Your workspace</div>
          <h1 id="app-title">Workboard</h1>
          <p class="intro">Keep your work organized, one project at a time.</p>
        </header>

        <form id="create-project-form" class="create-form">
          <label for="project-name">Project name</label>
          <div class="form-row">
            <input id="project-name" name="name" type="text" autocomplete="off" placeholder="e.g. Website redesign">
            <button type="submit">Create project</button>
          </div>
          <p id="form-alert" class="form-alert" role="alert" hidden></p>
        </form>

        <section class="projects-section" aria-labelledby="projects-title">
          <div class="section-heading">
            <h2 id="projects-title">Projects</h2>
            <span id="project-count" class="count"></span>
          </div>
          <div id="project-list-items" class="project-list"></div>
          <p id="empty-state" class="empty-state" hidden>No projects yet. Create one to get started.</p>
        </section>
      </section>

      <section id="project-detail" aria-labelledby="project-title" hidden>
        <button id="back-to-projects" class="back-button" type="button">← Projects</button>
        <div class="detail-card">
          <div class="eyebrow">Project</div>
          <h1 id="project-title"></h1>
        </div>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <section id="projects-view" aria-labelledby="page-title">
      <h1 id="page-title">Workboard</h1>
      <form id="project-form">
        <label for="project-name">Project name</label>
        <div class="form-row">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
        <p id="alert" role="alert" hidden></p>
      </form>
      <div id="project-list" aria-live="polite"></div>
    </section>
    <section id="detail-view" hidden>
      <button id="back-button" type="button">Projects</button>
      <h1 id="project-title"></h1>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #17212b; background: #f4f7fa; }
    body { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; }
    h1 { margin-bottom: 1.5rem; }
    form, .project-row { display: flex; align-items: center; gap: .75rem; }
    form { margin-bottom: 1rem; }
    input, select { flex: 1; min-width: 0; padding: .65rem; font: inherit; border: 1px solid #9ba9b7; border-radius: 4px; }
    .task-row { display: flex; align-items: center; gap: .75rem; margin: .6rem 0; padding: 1rem; background: white; border: 1px solid #d6dfe7; border-radius: 5px; }
    .task-row input { flex: initial; }
    button { padding: .65rem 1rem; font: inherit; border: 0; border-radius: 4px; color: white; background: #145c91; cursor: pointer; }
    button:hover { background: #0d456f; }
    .project-row { justify-content: space-between; margin: .6rem 0; padding: 1rem; background: white; border: 1px solid #d6dfe7; border-radius: 5px; }
    [role="alert"] { color: #a11; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    async function request(path, options) {
      const response = await fetch(path, options);
      return response.json();
    }

    function element(tag, text, parent) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      parent.append(node);
      return node;
    }

    async function showProjects() {
      app.replaceChildren();
      element('h1', 'Workboard', app);
      const filterLabel = element('label', 'Project filter', app);
      const filter = element('select', undefined, filterLabel);
      filter.setAttribute('aria-label', 'Project filter');
      for (const value of ['Active', 'Archived']) element('option', value, filter);
      const form = element('form', undefined, app);
      const input = element('input', undefined, form);
      input.type = 'text';
      input.setAttribute('aria-label', 'Project name');
      const submit = element('button', 'Create project', form);
      submit.type = 'submit';
      const alert = element('p', undefined, app);
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const list = element('section', undefined, app);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const result = await request('/api/projects', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name: input.value })
        });
        if (result.error) { alert.textContent = result.error; alert.hidden = false; return; }
        input.value = '';
        alert.hidden = true;
        await renderRows(list, filter.value);
      });
      filter.addEventListener('change', () => renderRows(list, filter.value));
      await renderRows(list, filter.value);
    }

    async function renderRows(list, filter) {
      list.replaceChildren();
      const projects = await request(`/api/projects?filter=${filter}`);
      for (const project of projects) {
        const row = element('div', undefined, list);
        row.dataset.testid = 'project-row';
        element('span', project.name, row);
        const summary = element('span', `${project.completedCount}/${project.totalCount} completed`, row);
        summary.dataset.testid = 'project-summary';
        const open = element('button', 'Open project', row);
        open.type = 'button';
        open.addEventListener('click', () => { location.href = `/projects/${project.id}`; });
        const archive = element('button', project.archived ? 'Restore project' : 'Archive project', row);
        archive.type = 'button';
        archive.addEventListener('click', async () => {
          await request(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          await renderRows(list, filter);
        });
      }
    }

    async function showProject(id) {
      app.replaceChildren();
      const project = await request(`/api/projects/${id}`);
      if (project.error) { element('h1', 'Project not found', app); return; }
      element('h1', project.name, app);
      if (project.archived) element('p', 'Archived project', app);
      const back = element('button', 'Projects', app);
      back.addEventListener('click', () => { location.href = '/'; });
      const form = element('form', undefined, app);
      const input = element('input', undefined, form);
      input.type = 'text';
      input.setAttribute('aria-label', 'Task title');
      const submit = element('button', 'Create task', form);
      submit.type = 'submit';
      submit.disabled = project.archived;
      const alert = element('p', undefined, app);
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const filterLabel = element('label', 'Task filter', app);
      const filter = element('select', undefined, filterLabel);
      filter.setAttribute('aria-label', 'Task filter');
      for (const value of ['All', 'Open', 'Completed']) element('option', value, filter);
      const list = element('section', undefined, app);
      const renderTasks = async () => {
        list.replaceChildren();
        const tasks = await request(`/api/projects/${id}/tasks`);
        for (const task of tasks) {
          if (filter.value === 'Open' && task.completed || filter.value === 'Completed' && !task.completed) continue;
          const row = element('div', undefined, list);
          row.dataset.testid = 'task-row';
          row.className = 'task-row';
          element('span', task.title, row);
          const checkbox = element('input', undefined, row);
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.disabled = project.archived;
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            await request(`/api/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
            await renderTasks();
          });
        }
      };
      filter.addEventListener('change', renderTasks);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const result = await request(`/api/projects/${id}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: input.value }) });
        if (result.error) { alert.textContent = result.error; alert.hidden = false; return; }
        input.value = '';
        alert.hidden = true;
        await renderTasks();
      });
      await renderTasks();
    }

    const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
    if (match) await showProject(match[1]);
    else await showProjects();
  </script>
</body>
</html>

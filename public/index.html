<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17212b; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 760px; margin: 56px auto; padding: 0 24px; }
    h1 { font-size: 2rem; margin: 0 0 28px; }
    form, .project-row { background: white; border: 1px solid #dce2e8; border-radius: 10px; padding: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #aeb9c4; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; background: #245bc5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    form button { margin-top: 12px; }
    button:focus-visible, input:focus-visible { outline: 3px solid #91b8ff; outline-offset: 2px; }
    #alert { color: #a22323; margin: 12px 0 0; }
    #projects { display: grid; gap: 10px; margin-top: 24px; }
    .project-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .project-info { display: grid; gap: 5px; }
    .project-summary { color: #526170; font-size: .9rem; }
    .project-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .project-name { overflow-wrap: anywhere; }
    .task-form, .task-filter { margin-top: 18px; }
    #tasks { display: grid; gap: 10px; margin-top: 18px; }
    .task-row { display: flex; align-items: center; gap: 12px; background: white; border: 1px solid #dce2e8; border-radius: 10px; padding: 16px 20px; }
    .task-row input { width: auto; }
    .task-row .task-name { flex: 1; overflow-wrap: anywhere; }
    .task-row .rename-task { display: flex; gap: 8px; flex: 1 1 100%; }
    .task-row .rename-task input { flex: 1; min-width: 120px; }
    .task-row select { padding: 9px 10px; border: 1px solid #aeb9c4; border-radius: 6px; font: inherit; background: white; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.querySelector('#app');
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function render() {
      const match = location.pathname.match(/^\/projects\/([^/]+)$/);
      if (match) {
        let project;
        try {
          const response = await fetch('/api/projects');
          project = (await response.json()).find(item => item.id === decodeURIComponent(match[1]));
        } catch {}
        if (!project) { history.replaceState({}, '', '/'); return render(); }
        app.innerHTML = `<button id="back" type="button">Projects</button><h1>${escapeHtml(project.name)}</h1>
          ${project.archived ? '<p>Archived project</p>' : ''}
          <form id="rename-form" novalidate>
            <label for="new-project-name">New project name</label>
            <input id="new-project-name" name="name" type="text" autocomplete="off" ${project.archived ? 'disabled' : ''}>
            <button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button>
            <p id="rename-alert" role="alert" hidden></p>
          </form>
          <form class="task-form" id="task-form" novalidate>
            <label for="task-title">Task title</label>
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button>
            <p id="alert" role="alert" hidden></p>
          </form>
          <div class="task-filter"><label for="default-task-priority">Default task priority</label>
            <select id="default-task-priority" ${project.archived ? 'disabled' : ''}><option ${project.defaultPriority === 'Low' ? 'selected' : ''}>Low</option><option ${project.defaultPriority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.defaultPriority === 'High' ? 'selected' : ''}>High</option></select>
          </div>
          <div class="task-filter"><label for="task-filter">Task filter</label>
            <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select>
          </div>
          <div class="task-filter"><label for="priority-filter">Priority filter</label>
            <select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
          </div>
          <section id="tasks" aria-label="Tasks"></section>`;
        document.querySelector('#back').addEventListener('click', () => { history.pushState({}, '', '/'); render(); });
        document.querySelector('#rename-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = document.querySelector('#new-project-name');
          const alert = document.querySelector('#rename-alert');
          const name = input.value.trim();
          if (!name) { alert.textContent = 'Project name is required'; alert.hidden = false; input.focus(); return; }
          alert.hidden = true;
          const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
          if (response.ok) render();
        });
        const tasks = document.querySelector('#tasks');
        const filter = document.querySelector('#task-filter');
        const priorityFilter = document.querySelector('#priority-filter');
        const defaultPriority = document.querySelector('#default-task-priority');
        defaultPriority.addEventListener('change', async () => {
          await fetch(`/api/projects/${encodeURIComponent(project.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ defaultPriority: defaultPriority.value }) });
        });
        async function refreshTasks() {
          const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks`);
          const allTasks = await response.json();
          const visible = allTasks.filter(task =>
            (filter.value === 'All' || (filter.value === 'Open' ? !task.completed : !!task.completed)) &&
            (priorityFilter.value === 'All' || task.priority === priorityFilter.value)
          );
          tasks.innerHTML = visible.map(task => `<div class="task-row" data-testid="task-row"><input type="checkbox" data-id="${escapeHtml(task.id)}" aria-label="Complete ${escapeHtml(task.title)}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}><span class="task-name">${escapeHtml(task.title)}</span><label><span class="sr-only">Task priority</span><select aria-label="Task priority" data-id="${escapeHtml(task.id)}" ${project.archived ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select></label><form class="rename-task" data-id="${escapeHtml(task.id)}" novalidate><input type="text" aria-label="New task title" autocomplete="off" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename task</button></form><p class="task-rename-alert" role="alert" hidden></p></div>`).join('');
          tasks.querySelectorAll('select[aria-label="Task priority"]').forEach(select => select.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(select.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ priority: select.value }) });
            await refreshTasks();
          }));
          tasks.querySelectorAll('input[type="checkbox"]').forEach(checkbox => checkbox.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(checkbox.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ completed: checkbox.checked }) });
            await refreshTasks();
          }));
          tasks.querySelectorAll('.rename-task').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const input = form.querySelector('input');
            const alert = form.parentElement.querySelector('.task-rename-alert');
            const title = input.value.trim();
            if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; input.focus(); return; }
            alert.hidden = true;
            const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(form.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title }) });
            if (response.ok) await refreshTasks();
          }));
        }
        filter.addEventListener('change', refreshTasks);
        priorityFilter.addEventListener('change', refreshTasks);
        document.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = document.querySelector('#task-title');
          const alert = document.querySelector('#alert');
          const title = input.value.trim();
          if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; input.focus(); return; }
          alert.hidden = true;
          const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title }) });
          if (response.ok) { input.value = ''; await refreshTasks(); }
        });
        await refreshTasks();
        return;
      }
      app.innerHTML = `<h1>Workboard</h1>
        <div class="project-filter"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div>
        <form id="create-form" novalidate>
          <label for="project-name">Project name</label>
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
          <p id="alert" role="alert" hidden></p>
        </form>
        <section id="projects" aria-label="Projects"></section>`;
      const list = document.querySelector('#projects');
      const filter = document.querySelector('#project-filter');
      async function refresh() {
        const response = await fetch('/api/projects');
        const projects = (await response.json()).filter(project => !!project.archived === (filter.value === 'Archived'));
        list.innerHTML = projects.map(project => `<div class="project-row" data-testid="project-row"><div class="project-info"><span class="project-name">${escapeHtml(project.name)}</span><span class="project-summary" data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span></div><div class="project-actions"><button type="button" data-action="open" data-id="${escapeHtml(project.id)}">Open project</button><button type="button" data-action="archive" data-id="${escapeHtml(project.id)}">${project.archived ? 'Restore project' : 'Archive project'}</button></div></div>`).join('');
        list.querySelectorAll('[data-action="open"]').forEach(button => button.addEventListener('click', () => {
          history.pushState({}, '', `/projects/${encodeURIComponent(button.dataset.id)}`); render();
        }));
        list.querySelectorAll('[data-action="archive"]').forEach(button => button.addEventListener('click', async () => {
          await fetch(`/api/projects/${encodeURIComponent(button.dataset.id)}/archive`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ archived: filter.value !== 'Archived' }) });
          await refresh();
        }));
      }
      filter.addEventListener('change', refresh);
      document.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = document.querySelector('#project-name');
        const alert = document.querySelector('#alert');
        const name = input.value.trim();
        if (!name) { alert.textContent = 'Project name is required'; alert.hidden = false; input.focus(); return; }
        alert.hidden = true;
        const response = await fetch('/api/projects', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
        if (response.ok) { input.value = ''; await refresh(); }
      });
      await refresh();
    }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

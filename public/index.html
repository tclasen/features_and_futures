<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main>
    <h1 id="heading">Workboard</h1>
    <p id="error" role="alert" hidden></p>
    <section id="project-list" hidden>
      <form id="create-project" novalidate>
        <label for="project-name">Project name</label>
        <input id="project-name" name="name" type="text" autocomplete="off">
        <button type="submit">Create project</button>
      </form>
      <div id="projects" aria-label="Projects"></div>
    </section>
    <section id="project-detail" hidden>
      <button id="back" type="button">Projects</button>
    </section>
  </main>
</body>
</html>

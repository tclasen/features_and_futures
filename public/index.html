<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <script type="module" src="/app.js"></script>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #19232d; background: #f4f7fa; }
      body { margin: 0; }
      main { max-width: 680px; margin: 3rem auto; padding: 0 1.25rem; }
      h1 { margin-bottom: 1.5rem; }
      form, .project-row { display: flex; align-items: center; gap: .75rem; }
      form { margin-bottom: 1.5rem; }
      input { flex: 1; min-width: 0; padding: .7rem; font: inherit; }
      button { padding: .7rem 1rem; font: inherit; cursor: pointer; }
      .project-row { justify-content: space-between; margin: .65rem 0; padding: 1rem; background: white; border: 1px solid #d8e0e8; border-radius: .4rem; }
      [role="alert"] { color: #a12020; }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18212f; background: #f5f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 64px auto; padding: 0 24px; }
    h1 { font-size: 2rem; margin: 0 0 24px; }
    form, .project-row { background: white; border: 1px solid #dce2eb; border-radius: 8px; padding: 20px; }
    form { display: flex; gap: 12px; align-items: end; }
    label { display: grid; gap: 6px; flex: 1; font-weight: 600; }
    input { padding: 10px; border: 1px solid #aab5c5; border-radius: 5px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 5px; background: #245fc5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #174b9e; }
    #alert { color: #a21d2b; margin-top: 12px; }
    #projects { display: grid; gap: 10px; margin-top: 20px; }
    .project-row { display: flex; justify-content: space-between; align-items: center; }
    @media (max-width: 520px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
<main id="app"><h1>Workboard</h1></main>
<script>
  const app = document.querySelector('#app');
  const projectPath = location.pathname.match(/^\/projects\/(\d+)$/);
  async function loadProjects() {
    const response = await fetch('/api/projects');
    if (!response.ok) throw new Error('Could not load projects');
    return response.json();
  }
  function go(path) { location.href = path; }
  if (projectPath) {
    loadProjects().then(projects => {
      const project = projects.find(item => String(item.id) === projectPath[1]);
      if (!project) { app.innerHTML = '<h1>Project not found</h1>'; return; }
      app.innerHTML = `<button type="button" id="back">Projects</button><h1 id="project-name"></h1>`;
      app.querySelector('#project-name').textContent = project.name;
      app.querySelector('#back').addEventListener('click', () => go('/'));
    }).catch(() => { app.innerHTML = '<h1>Unable to load project</h1>'; });
  } else {
    app.innerHTML = `<h1>Workboard</h1>
      <form id="create-form"><label>Project name<input name="name" aria-label="Project name"></label><button type="submit">Create project</button></form>
      <div id="alert" role="alert" aria-live="polite"></div><section id="projects" aria-label="Projects"></section>`;
    const alert = app.querySelector('#alert');
    const form = app.querySelector('#create-form');
    async function render() {
      const projects = await loadProjects();
      const list = app.querySelector('#projects');
      list.replaceChildren();
      for (const project of projects) {
        const row = document.createElement('div');
        row.className = 'project-row'; row.dataset.testid = 'project-row';
        const name = document.createElement('span'); name.textContent = project.name;
        const button = document.createElement('button'); button.type = 'button'; button.textContent = 'Open project';
        button.addEventListener('click', () => go(`/projects/${project.id}`));
        row.append(name, button); list.append(row);
      }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const input = form.elements.name;
      const name = input.value.trim();
      if (!name) { alert.textContent = 'Project name is required'; return; }
      const response = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
      if (!response.ok) { alert.textContent = 'Unable to create project'; return; }
      input.value = ''; alert.textContent = ''; await render();
    });
    render().catch(() => { alert.textContent = 'Unable to load projects'; });
  }
</script>
</body>
</html>

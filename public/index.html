<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Workboard</title>
  <style>
    .alert { color: red; margin-top: 0.5rem; }
    .project-row { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Workboard</h1>
  <label for="project-name-input">Project name</label>
  <input type="text" id="project-name-input" />
  <button id="create-project-btn">Create project</button>
  <div id="alert" class="alert" role="alert" style="display:none;">Project name is required</div>
  <h2>Projects</h2>
  <div id="project-list"></div>

  <script>
    async function fetchProjects() {
      const res = await fetch('/api/projects');
      return res.ok ? res.json() : [];
    }

    function renderProjects(projects) {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      for (const p of projects) {
        const row = document.createElement('div');
        row.dataset.testid = 'project-row';
        row.className = 'project-row';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = p.name;
        const openBtn = document.createElement('button');
        openBtn.textContent = 'Open project';
        openBtn.addEventListener('click', () => {
          window.location.href = `/projects/${p.id}`;
        });
        row.appendChild(nameSpan);
        row.appendChild(openBtn);
        list.appendChild(row);
      }
    }

    async function loadAndRender() {
      const projects = await fetchProjects();
      renderProjects(projects);
    }

    document.getElementById('create-project-btn').addEventListener('click', async () => {
      const input = document.getElementById('project-name-input');
      const alertDiv = document.getElementById('alert');
      const name = input.value.trim();
      if (!name) {
        alertDiv.style.display = 'block';
        return;
      }
      alertDiv.style.display = 'none';
      await fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      input.value = '';
      await loadAndRender();
    });

    // Initial load
    loadAndRender();
  </script>
</body>
</html>

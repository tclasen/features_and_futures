<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><p class="brand">WORKBOARD</p><h1 id="heading">Workboard</h1></header>
    <p id="alert" role="alert" hidden></p>
    <section id="project-list" hidden>
      <form id="create-project">
        <label for="project-name">Project name</label>
        <div class="form-controls">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
      </form>
      <h2>Projects</h2>
      <label for="project-filter">Project filter</label>
      <select id="project-filter">
        <option value="active" selected>Active</option>
        <option value="archived">Archived</option>
      </select>
      <div id="projects"></div>
      <p id="empty" hidden>No projects in this view.</p>
    </section>
    <section id="project-detail" hidden>
      <button id="back" type="button">Projects</button>
      <p id="archived-notice" hidden>Archived project</p>
      <form id="rename-project">
        <label for="new-project-name">New project name</label>
        <div class="form-controls">
          <input id="new-project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Rename project</button>
        </div>
      </form>
      <form id="create-task">
        <label for="task-title">Task title</label>
        <div class="form-controls">
          <input id="task-title" name="title" type="text" autocomplete="off">
          <button type="submit">Create task</button>
        </div>
      </form>
      <h2>Tasks</h2>
      <label for="task-filter">Task filter</label>
      <select id="task-filter">
        <option value="all" selected>All</option>
        <option value="open">Open</option>
        <option value="completed">Completed</option>
      </select>
      <label for="priority-filter">Priority filter</label>
      <select id="priority-filter">
        <option value="all" selected>All</option>
        <option value="Low">Low</option>
        <option value="Normal">Normal</option>
        <option value="High">High</option>
      </select>
      <div id="tasks"></div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar"><span class="brand-mark" aria-hidden="true">W</span><span>Workboard</span></header>
    <section id="project-list" class="view" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">YOUR WORKSPACE</p>
        <h1 id="page-title">Workboard</h1>
        <p class="subtitle">A clear space for your projects.</p>
      </div>
      <form id="create-form" class="create-card">
        <label for="project-name">Project name</label>
        <div class="form-row">
          <input id="project-name" name="name" type="text" autocomplete="off" placeholder="e.g. Website redesign">
          <button class="primary" type="submit">Create project <span aria-hidden="true">＋</span></button>
        </div>
        <p id="form-alert" class="alert" role="alert" hidden></p>
      </form>
      <div class="list-heading"><h2>Projects</h2><span id="project-count" class="count"></span></div>
      <div class="project-toolbar"><label for="project-filter">Project filter</label>
        <select id="project-filter"><option>Active</option><option>Archived</option></select>
      </div>
      <form id="project-search-form" class="search-form">
        <label for="project-search">Project search</label>
        <input id="project-search" type="text" autocomplete="off">
        <button class="open-button" type="submit">Search projects</button>
      </form>
      <div id="projects" class="project-list" aria-live="polite"></div>
    </section>
    <section id="project-detail" class="view detail" hidden>
      <button id="back-button" class="back-button" type="button"><span aria-hidden="true">←</span> Projects</button>
      <div class="detail-card"><p class="eyebrow">PROJECT</p><h1 id="detail-name"></h1><p id="archived-label" hidden>Archived project</p></div>
      <button id="download-project" class="open-button download-project" type="button">Download project</button>
      <form id="rename-form" class="create-card rename-form">
        <label for="new-project-name">New project name</label>
        <div class="form-row">
          <input id="new-project-name" name="name" type="text" autocomplete="off">
          <button class="primary" type="submit">Rename project</button>
        </div>
        <p id="rename-alert" class="alert" role="alert" hidden></p>
      </form>
      <div class="default-priority-control"><label for="default-priority">Default task priority</label>
        <select id="default-priority"><option>Low</option><option selected>Normal</option><option>High</option></select>
      </div>
      <form id="task-form" class="create-card task-form">
        <label for="task-title">Task title</label>
        <div class="form-row">
          <input id="task-title" name="title" type="text" autocomplete="off" placeholder="Add a task">
          <button class="primary" type="submit">Create task</button>
        </div>
        <p id="task-alert" class="alert" role="alert" hidden></p>
      </form>
      <div class="task-toolbar"><h2>Tasks</h2><label for="task-filter">Task filter</label>
        <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select>
        <label for="priority-filter">Priority filter</label>
        <select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
      </div>
      <form id="task-search-form" class="search-form">
        <label for="task-search">Task search</label>
        <input id="task-search" type="text" autocomplete="off">
        <button class="open-button" type="submit">Search tasks</button>
      </form>
      <form id="due-range-form" class="due-range-form">
        <label for="due-from">Due from</label><input id="due-from" type="text" autocomplete="off">
        <label for="due-through">Due through</label><input id="due-through" type="text" autocomplete="off">
        <button class="open-button" type="submit">Apply due range</button>
      </form>
      <div id="tasks" class="task-list" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header"><h1><a href="/">Workboard</a></h1></header>
    <section id="project-list" aria-labelledby="list-heading">
      <h2 id="list-heading">Projects</h2>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <div class="create-controls">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
        <p id="error-message" role="alert" hidden></p>
      </form>
      <div id="projects" aria-live="polite"></div>
    </section>
    <section id="project-detail" hidden>
      <button id="back-button" type="button">Projects</button>
      <h2 id="detail-name"></h2>
    </section>
  </main>
</body>
</html>

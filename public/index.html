<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17212b; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 760px; margin: 56px auto; padding: 0 24px; }
    h1 { font-size: 2rem; margin: 0 0 28px; }
    form, .project-row { background: white; border: 1px solid #dce2e8; border-radius: 10px; padding: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #aeb9c4; border-radius: 6px; font: inherit; }
    textarea { box-sizing: border-box; width: 100%; min-height: 88px; padding: 11px 12px; border: 1px solid #aeb9c4; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; background: #245bc5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    form button { margin-top: 12px; }
    button:focus-visible, input:focus-visible { outline: 3px solid #91b8ff; outline-offset: 2px; }
    #alert { color: #a22323; margin: 12px 0 0; }
    #projects { display: grid; gap: 10px; margin-top: 24px; }
    .project-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .project-info { display: grid; gap: 5px; }
    .project-summary { color: #526170; font-size: .9rem; }
    .project-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .project-name { overflow-wrap: anywhere; }
    [data-testid="directory-task-notes"] { white-space: pre-wrap; overflow-wrap: anywhere; }
    .task-form, .task-filter { margin-top: 18px; }
    .search-form { margin-top: 18px; }
    #tasks { display: grid; gap: 10px; margin-top: 18px; }
    .task-row { display: flex; align-items: center; gap: 12px; background: white; border: 1px solid #dce2e8; border-radius: 10px; padding: 16px 20px; }
    .task-row { flex-wrap: wrap; }
    .task-row input { width: auto; }
    .task-row .task-name { flex: 1; overflow-wrap: anywhere; }
    .task-row .rename-task { display: flex; gap: 8px; flex: 1 1 100%; }
    .task-row .rename-task input { flex: 1; min-width: 120px; }
    .task-row select { padding: 9px 10px; border: 1px solid #aeb9c4; border-radius: 6px; font: inherit; background: white; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.querySelector('#app');
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function render() {
      if (location.pathname === '/directory') {
        app.innerHTML = `<button id="directory-back" type="button">Projects</button><h1>Task directory</h1>
          <div class="task-filter"><label for="project-scope">Project scope</label><select id="project-scope"><option>Active</option><option>Archived</option></select></div>
          <div class="task-filter"><label for="directory-task-filter">Task filter</label><select id="directory-task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select></div>
          <div class="task-filter"><label for="directory-priority-filter">Priority filter</label><select id="directory-priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></div>
          <form class="task-filter" id="directory-range-form" novalidate><label for="directory-due-from">Due from</label><input id="directory-due-from" type="text" placeholder="YYYY-MM-DD"><label for="directory-due-through">Due through</label><input id="directory-due-through" type="text" placeholder="YYYY-MM-DD"><button type="submit">Apply due range</button><p id="directory-range-alert" role="alert" hidden></p></form>
          <form class="search-form" id="directory-search-form"><label for="directory-search">Directory search</label><input id="directory-search" type="text"><button type="submit">Search directory</button></form>
          <section id="directory-results" aria-label="Directory tasks"></section>`;
        document.querySelector('#directory-back').addEventListener('click', () => { history.pushState({}, '', '/'); render(); });
        const scope = document.querySelector('#project-scope'), taskFilter = document.querySelector('#directory-task-filter'), priority = document.querySelector('#directory-priority-filter');
        let query = '', from = '', through = '';
        const normalize = value => value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, c => String.fromCharCode(c.charCodeAt(0) + 32));
        const validDate = value => { const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return false; const y=+m[1], mo=+m[2], d=+m[3], leap=y%4===0&&(y%100!==0||y%400===0), days=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31]; return y>=1&&mo>=1&&mo<=12&&d>=1&&d<=days[mo-1]; };
        document.querySelector('#directory-search-form').addEventListener('submit', e => { e.preventDefault(); query=document.querySelector('#directory-search').value.trim(); refresh(); });
        document.querySelector('#directory-range-form').addEventListener('submit', e => { e.preventDefault(); const f=document.querySelector('#directory-due-from').value.trim(), t=document.querySelector('#directory-due-through').value.trim(), a=document.querySelector('#directory-range-alert'); if ((f&&!validDate(f))||(t&&!validDate(t))) { a.textContent='Due range must use valid YYYY-MM-DD dates'; a.hidden=false; return; } if(f&&t&&f>t){a.textContent='Due from must not be after Due through';a.hidden=false;return;} from=f;through=t;a.hidden=true;refresh(); });
        async function refresh() {
          const records=await (await fetch('/api/directory')).json();
          const rows=records.filter(x => !!x.archived === (scope.value==='Archived') && (taskFilter.value==='Deleted'?!!x.deleted:!x.deleted&&(taskFilter.value==='All'||(taskFilter.value==='Open'?!x.completed:!!x.completed))) && (priority.value==='All'||x.priority===priority.value) && normalize(x.title).includes(normalize(query)) && (!from&&!through||!!x.dueDate) && (!from||x.dueDate>=from) && (!through||x.dueDate<=through));
          document.querySelector('#directory-results').innerHTML=rows.map(x=>`<div data-testid="directory-task-row" class="task-row"><span data-testid="directory-task-title">${escapeHtml(x.title)}</span><span data-testid="directory-project-name">${escapeHtml(x.projectName)}</span><span data-testid="directory-task-completion">${x.completed?'Completed':'Open'}</span><span data-testid="directory-task-priority">${escapeHtml(x.priority)}</span><span data-testid="directory-task-due-date">${escapeHtml(x.dueDate)}</span><span data-testid="directory-task-notes">${escapeHtml(x.notes.replace(/\r\n?/g,'\n')).replace(/\n/g,'<br>')}</span><button type="button" data-project="${escapeHtml(x.projectId)}">Open project</button></div>`).join('');
          document.querySelectorAll('#directory-results button[data-project]').forEach(b=>b.addEventListener('click',()=>{history.pushState({},'',`/projects/${encodeURIComponent(b.dataset.project)}`);render();}));
        }
        [scope,taskFilter,priority].forEach(c=>c.addEventListener('change',refresh)); await refresh(); return;
      }
      const match = location.pathname.match(/^\/projects\/([^/]+)$/);
      if (match) {
        let project;
        try {
          const response = await fetch('/api/projects');
          project = (await response.json()).find(item => item.id === decodeURIComponent(match[1]));
        } catch {}
        if (!project) { history.replaceState({}, '', '/'); return render(); }
        const destinationProjects = (await (await fetch('/api/projects')).json()).filter(item => !item.archived && item.id !== project.id);
        app.innerHTML = `<button id="back" type="button">Projects</button> <button id="download-project" type="button">Download project</button><h1>${escapeHtml(project.name)}</h1>
          ${project.archived ? '<p>Archived project</p>' : ''}
          <form id="rename-form" novalidate>
            <label for="new-project-name">New project name</label>
            <input id="new-project-name" name="name" type="text" autocomplete="off" ${project.archived ? 'disabled' : ''}>
            <button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button>
            <p id="rename-alert" role="alert" hidden></p>
          </form>
          <form class="task-form" id="task-form" novalidate>
            <label for="task-title">Task title</label>
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button>
            <p id="alert" role="alert" hidden></p>
          </form>
          <div class="task-filter"><label for="default-task-priority">Default task priority</label>
            <select id="default-task-priority" ${project.archived ? 'disabled' : ''}><option ${project.defaultPriority === 'Low' ? 'selected' : ''}>Low</option><option ${project.defaultPriority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.defaultPriority === 'High' ? 'selected' : ''}>High</option></select>
          </div>
          <div class="task-filter"><label for="task-filter">Task filter</label>
            <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select>
          </div>
          <div class="task-filter"><label for="priority-filter">Priority filter</label>
            <select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
          </div>
          <form class="task-filter" id="due-range-form" novalidate>
            <label for="due-from">Due from</label><input id="due-from" type="text" placeholder="YYYY-MM-DD">
            <label for="due-through">Due through</label><input id="due-through" type="text" placeholder="YYYY-MM-DD">
            <button type="submit">Apply due range</button>
            <p id="due-range-alert" role="alert" hidden></p>
          </form>
          <form class="search-form" id="task-search-form">
            <label for="task-search">Task search</label><input id="task-search" type="text" autocomplete="off">
            <button type="submit">Search tasks</button>
          </form>
          <section id="tasks" aria-label="Tasks"></section>`;
        document.querySelector('#back').addEventListener('click', () => { history.pushState({}, '', '/'); render(); });
        document.querySelector('#download-project').addEventListener('click', () => {
          const link = document.createElement('a');
          link.href = `/api/projects/${encodeURIComponent(project.id)}/export`;
          link.download = 'workboard-project.json';
          document.body.append(link); link.click(); link.remove();
        });
        document.querySelector('#rename-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = document.querySelector('#new-project-name');
          const alert = document.querySelector('#rename-alert');
          const name = input.value.trim();
          if (!name) { alert.textContent = 'Project name is required'; alert.hidden = false; input.focus(); return; }
          alert.hidden = true;
          const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
          if (response.ok) {
            // Keep the current filter controls and applied due range in place.
            // A project rename only changes the heading on this page.
            document.querySelector('h1').textContent = name;
          }
        });
        const tasks = document.querySelector('#tasks');
        const filter = document.querySelector('#task-filter');
        const priorityFilter = document.querySelector('#priority-filter');
        const defaultPriority = document.querySelector('#default-task-priority');
        let appliedTaskQuery = '';
        document.querySelector('#task-search-form').addEventListener('submit', event => {
          event.preventDefault();
          appliedTaskQuery = document.querySelector('#task-search').value.trim();
          refreshTasks();
        });
        const normalizeSearch = value => value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, char => String.fromCharCode(char.charCodeAt(0) + 32));
        let appliedDueFrom = '', appliedDueThrough = '';
        const dueRangeAlert = document.querySelector('#due-range-alert');
        const isCalendarDate = value => {
          const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (!match) return false;
          const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
          const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
          const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
          return year >= 1 && month >= 1 && month <= 12 && day >= 1 && day <= days[month - 1];
        };
        document.querySelector('#due-range-form').addEventListener('submit', event => {
          event.preventDefault();
          const from = document.querySelector('#due-from').value.trim();
          const through = document.querySelector('#due-through').value.trim();
          if ((from && !isCalendarDate(from)) || (through && !isCalendarDate(through))) {
            dueRangeAlert.textContent = 'Due range must use valid YYYY-MM-DD dates'; dueRangeAlert.hidden = false; return;
          }
          if (from && through && from > through) {
            dueRangeAlert.textContent = 'Due from must not be after Due through'; dueRangeAlert.hidden = false; return;
          }
          appliedDueFrom = from; appliedDueThrough = through;
          dueRangeAlert.hidden = true;
          refreshTasks();
        });
        defaultPriority.addEventListener('change', async () => {
          await fetch(`/api/projects/${encodeURIComponent(project.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ defaultPriority: defaultPriority.value }) });
        });
        async function refreshTasks() {
          const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks`);
          const allTasks = await response.json();
          const visible = allTasks.filter(task =>
            (filter.value === 'Deleted' ? !!task.deleted : !task.deleted && (filter.value === 'All' || (filter.value === 'Open' ? !task.completed : !!task.completed))) &&
            (priorityFilter.value === 'All' || task.priority === priorityFilter.value) &&
            normalizeSearch(task.title).includes(normalizeSearch(appliedTaskQuery)) &&
            (!appliedDueFrom && !appliedDueThrough || !!task.dueDate) &&
            (!appliedDueFrom || task.dueDate >= appliedDueFrom) &&
            (!appliedDueThrough || task.dueDate <= appliedDueThrough)
          );
          tasks.innerHTML = visible.map(task => { const locked = project.archived || !!task.deleted; return `<div class="task-row" data-testid="task-row"><input type="checkbox" data-id="${escapeHtml(task.id)}" aria-label="Complete ${escapeHtml(task.title)}" ${task.completed ? 'checked' : ''} ${locked ? 'disabled' : ''}><span class="task-name">${escapeHtml(task.title)}</span><label><span class="sr-only">Task priority</span><select aria-label="Task priority" data-id="${escapeHtml(task.id)}" ${locked ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select></label><form class="rename-task" data-id="${escapeHtml(task.id)}" novalidate><input type="text" aria-label="New task title" autocomplete="off" ${locked ? 'disabled' : ''}><button type="submit" ${locked ? 'disabled' : ''}>Rename task</button></form><form class="due-date-form" data-id="${escapeHtml(task.id)}" novalidate><input type="text" aria-label="Task due date" value="${escapeHtml(task.dueDate || '')}" placeholder="YYYY-MM-DD" ${locked ? 'disabled' : ''}><button type="submit" ${locked ? 'disabled' : ''}>Save due date</button></form><form class="task-notes-form" data-id="${escapeHtml(task.id)}"><textarea aria-label="Task notes" ${locked ? 'disabled' : ''}>${escapeHtml(task.notes || '')}</textarea><button type="submit" ${locked ? 'disabled' : ''}>Save notes</button></form><form class="move-task" data-id="${escapeHtml(task.id)}"><label><span class="sr-only">Destination project</span><select aria-label="Destination project" ${locked || !destinationProjects.length ? 'disabled' : ''}>${destinationProjects.map(destination => `<option value="${escapeHtml(destination.id)}">${escapeHtml(destination.name)}</option>`).join('')}</select></label><button type="submit" ${locked || !destinationProjects.length ? 'disabled' : ''}>Move task</button></form><button type="button" class="task-delete" data-id="${escapeHtml(task.id)}" ${project.archived ? 'disabled' : ''}>${task.deleted ? 'Restore task' : 'Delete task'}</button><p class="task-rename-alert" role="alert" hidden></p></div>`; }).join('');
          tasks.querySelectorAll('.task-delete').forEach(button => button.addEventListener('click', async () => {
            const action = button.textContent === 'Delete task' ? 'delete' : 'restore';
            await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(button.dataset.id)}/${action}`, { method: 'PATCH' });
            await refreshTasks();
          }));
          tasks.querySelectorAll('select[aria-label="Task priority"]').forEach(select => select.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(select.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ priority: select.value }) });
            await refreshTasks();
          }));
          tasks.querySelectorAll('input[type="checkbox"]').forEach(checkbox => checkbox.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(checkbox.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ completed: checkbox.checked }) });
            await refreshTasks();
          }));
          tasks.querySelectorAll('.rename-task').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const input = form.querySelector('input');
            const alert = form.parentElement.querySelector('.task-rename-alert');
            const title = input.value.trim();
            if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; input.focus(); return; }
            alert.hidden = true;
            const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(form.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title }) });
            if (response.ok) await refreshTasks();
          }));
          tasks.querySelectorAll('.due-date-form').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const input = form.querySelector('input');
            const alert = form.parentElement.querySelector('.task-rename-alert');
            const dueDate = input.value.trim();
            const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(form.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dueDate }) });
            if (!response.ok) { alert.textContent = 'Due date must be a valid YYYY-MM-DD date'; alert.hidden = false; input.focus(); return; }
            alert.hidden = true;
            await refreshTasks();
          }));
          tasks.querySelectorAll('.task-notes-form').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const notes = form.querySelector('textarea').value;
            const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(form.dataset.id)}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ notes }) });
            if (response.ok) await refreshTasks();
          }));
          tasks.querySelectorAll('.move-task').forEach(form => form.addEventListener('submit', async event => {
            event.preventDefault();
            const destinationProjectId = form.querySelector('select').value;
            const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(form.dataset.id)}/move`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ destinationProjectId }) });
            if (response.ok) await refreshTasks();
          }));
        }
        filter.addEventListener('change', refreshTasks);
        priorityFilter.addEventListener('change', refreshTasks);
        document.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = document.querySelector('#task-title');
          const alert = document.querySelector('#alert');
          const title = input.value.trim();
          if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; input.focus(); return; }
          alert.hidden = true;
          const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ title }) });
          if (response.ok) { input.value = ''; await refreshTasks(); }
        });
        await refreshTasks();
        return;
      }
      app.innerHTML = `<h1>Workboard</h1>
        <button id="open-directory" type="button">Task directory</button>
        <div class="project-filter"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div>
        <form class="search-form" id="project-search-form">
          <label for="project-search">Project search</label><input id="project-search" type="text" autocomplete="off">
          <button type="submit">Search projects</button>
        </form>
        <form id="create-form" novalidate>
          <label for="project-name">Project name</label>
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
          <p id="alert" role="alert" hidden></p>
        </form>
        <form id="import-form" novalidate>
          <label for="project-json">Project JSON</label>
          <textarea id="project-json" name="document"></textarea>
          <label for="imported-project-name">Imported project name</label>
          <input id="imported-project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Import project</button>
          <p id="import-alert" role="alert" hidden></p>
        </form>
        <section id="projects" aria-label="Projects"></section>`;
      document.querySelector('#open-directory').addEventListener('click', () => { history.pushState({}, '', '/directory'); render(); });
      const list = document.querySelector('#projects');
      const filter = document.querySelector('#project-filter');
      let appliedProjectQuery = '';
      document.querySelector('#project-search-form').addEventListener('submit', event => {
        event.preventDefault();
        appliedProjectQuery = document.querySelector('#project-search').value.trim();
        refresh();
      });
      const normalizeSearch = value => value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, char => String.fromCharCode(char.charCodeAt(0) + 32));
      async function refresh() {
        const response = await fetch('/api/projects');
        const projects = (await response.json()).filter(project => !!project.archived === (filter.value === 'Archived') && normalizeSearch(project.name).includes(normalizeSearch(appliedProjectQuery)));
        list.innerHTML = projects.map(project => `<div class="project-row" data-testid="project-row"><div class="project-info"><span class="project-name">${escapeHtml(project.name)}</span><span class="project-summary" data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span></div><div class="project-actions"><button type="button" data-action="open" data-id="${escapeHtml(project.id)}">Open project</button><button type="button" data-action="archive" data-id="${escapeHtml(project.id)}">${project.archived ? 'Restore project' : 'Archive project'}</button></div></div>`).join('');
        list.querySelectorAll('[data-action="open"]').forEach(button => button.addEventListener('click', () => {
          history.pushState({}, '', `/projects/${encodeURIComponent(button.dataset.id)}`); render();
        }));
        list.querySelectorAll('[data-action="archive"]').forEach(button => button.addEventListener('click', async () => {
          await fetch(`/api/projects/${encodeURIComponent(button.dataset.id)}/archive`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ archived: filter.value !== 'Archived' }) });
          await refresh();
        }));
      }
      filter.addEventListener('change', refresh);
      document.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = document.querySelector('#project-name');
        const alert = document.querySelector('#alert');
        const name = input.value.trim();
        if (!name) { alert.textContent = 'Project name is required'; alert.hidden = false; input.focus(); return; }
        alert.hidden = true;
        const response = await fetch('/api/projects', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
        if (response.ok) { input.value = ''; await refresh(); }
      });
      document.querySelector('#import-form').addEventListener('submit', async event => {
        event.preventDefault();
        const json = document.querySelector('#project-json');
        const name = document.querySelector('#imported-project-name');
        const alert = document.querySelector('#import-alert');
        let documentValue;
        try { documentValue = JSON.parse(json.value); }
        catch { alert.textContent = 'Invalid project JSON'; alert.hidden = false; json.focus(); return; }
        const response = await fetch('/api/import', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ document: documentValue, name: name.value }) });
        if (!response.ok) {
          const result = await response.json();
          alert.textContent = result.error === 'Project name is required' ? result.error : 'Invalid project JSON';
          alert.hidden = false;
          (result.error === 'Project name is required' ? name : json).focus();
          return;
        }
        const project = await response.json();
        history.pushState({}, '', `/projects/${encodeURIComponent(project.id)}`);
        render();
      });
      await refresh();
    }
    addEventListener('popstate', render);
    render();

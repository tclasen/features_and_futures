<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="container">
      <section id="project-list" aria-labelledby="app-heading">
        <h1 id="app-heading">Workboard</h1>
        <form id="create-project-form">
          <label for="project-name">Project name</label>
          <div class="form-controls">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
        </form>
        <p id="form-alert" role="alert" hidden></p>
        <form id="import-project-form">
          <label for="project-json">Project JSON</label>
          <textarea id="project-json"></textarea>
          <label for="imported-project-name">Imported project name</label>
          <input id="imported-project-name" type="text" autocomplete="off">
          <button type="submit">Import project</button>
          <p id="import-alert" role="alert" hidden></p>
        <button id="open-directory" type="button">Task directory</button>
        </form>
        <label for="project-filter">Project filter</label>
        <select id="project-filter">
          <option>Active</option>
          <option>Archived</option>
        </select>
        <form id="project-search-form">
          <label for="project-search">Project search</label>
          <div class="form-controls">
            <input id="project-search" type="text" autocomplete="off">
            <button type="submit">Search projects</button>
          </div>
        </form>
        <div id="projects" aria-live="polite"></div>
      </section>
      <section id="task-directory" aria-labelledby="directory-heading" hidden>
        <button id="directory-projects" type="button">Projects</button>
        <h1 id="directory-heading">Task directory</h1>
        <label for="directory-project-scope">Project scope</label>
        <select id="directory-project-scope"><option>Active</option><option>Archived</option></select>
        <label for="directory-task-filter">Task filter</label>
        <select id="directory-task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select>
        <label for="directory-priority-filter">Priority filter</label>
        <select id="directory-priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
        <div class="due-range-controls">
          <label for="directory-due-from">Due from</label><input id="directory-due-from" type="text" autocomplete="off">
          <label for="directory-due-through">Due through</label><input id="directory-due-through" type="text" autocomplete="off">
          <button id="directory-apply-due-range" type="button">Apply due range</button>
        </div>
        <p id="directory-range-alert" role="alert" hidden></p>
        <form id="directory-search-form"><label for="directory-search">Directory search</label><div class="form-controls"><input id="directory-search" type="text" autocomplete="off"><button type="submit">Search directory</button></div></form>
        <div class="directory-actions">
          <button id="complete-visible-tasks" type="button">Complete visible tasks</button>
          <button id="reopen-visible-tasks" type="button">Reopen visible tasks</button>
        </div>
        <p id="directory-empty" role="status" hidden>No matching tasks</p>
        <div id="directory-results" aria-live="polite"></div>
      </section>
      <section id="project-detail" aria-live="polite" hidden>
        <button id="back-to-projects" type="button">Projects</button>
        <button id="download-project" type="button">Download project</button>
        <h1 id="project-heading"></h1>
        <p id="archive-notice" hidden>Archived project</p>
        <form id="rename-project-form">
          <label for="new-project-name">New project name</label>
          <div class="form-controls">
            <input id="new-project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Rename project</button>
          </div>
        </form>
        <p id="rename-alert" role="alert" hidden></p>
        <form id="create-task-form">
          <label for="task-title">Task title</label>
          <div class="form-controls">
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit">Create task</button>
          </div>
        </form>
        <p id="task-alert" role="alert" hidden></p>
        <label for="default-task-priority">Default task priority</label>
        <select id="default-task-priority">
          <option>Low</option>
          <option>Normal</option>
          <option>High</option>
        </select>
        <label for="task-filter">Task filter</label>
        <select id="task-filter">
          <option>All</option>
          <option>Open</option>
          <option>Completed</option>
          <option>Deleted</option>
        </select>
        <label for="priority-filter">Priority filter</label>
        <select id="priority-filter">
          <option>All</option>
          <option>Low</option>
          <option>Normal</option>
          <option>High</option>
        </select>
        <div class="due-range-controls">
          <label for="due-from">Due from</label>
          <input id="due-from" type="text" autocomplete="off">
          <label for="due-through">Due through</label>
          <input id="due-through" type="text" autocomplete="off">
          <button id="apply-due-range" type="button">Apply due range</button>
        </div>
        <p id="due-range-alert" role="alert" hidden></p>
        <form id="task-search-form">
          <label for="task-search">Task search</label>
          <div class="form-controls">
            <input id="task-search" type="text" autocomplete="off">
            <button type="submit">Search tasks</button>
          </div>
        </form>
        <div id="tasks" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>

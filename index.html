<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182230;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:64px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:32px;margin:0}form,.panel{background:white;border:1px solid #e1e6ee;border-radius:12px;padding:22px;box-shadow:0 2px 8px #12243a0a}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;padding:11px 12px;border:1px solid #aab5c4;border-radius:7px;font:inherit;margin-bottom:14px}button{border:0;border-radius:7px;background:#2459c4;color:white;font:600 15px system-ui;padding:10px 16px;cursor:pointer}button:hover{background:#19469e}.rows{margin-top:20px;display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid #e1e6ee;border-radius:10px;padding:14px 16px}.row button{font-size:14px}.alert{color:#b42318;margin:12px 0 0;min-height:1.4em}.back{background:#e9eef8;color:#183766}.back:hover{background:#dce5f5}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
const app=document.querySelector('#app');
async function request(path,options){const r=await fetch(path,options);const value=await r.json();if(!r.ok)throw new Error(value.error||'Request failed');return value}
function escapeText(value){const el=document.createElement('span');el.textContent=value;return el.innerHTML}
let projectFilter='Active';
const projectViewState=new Map();
async function renderList(){
 app.innerHTML='<header><h1>Workboard</h1></header><form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" autocomplete="off"><button type="submit">Create project</button><p class="alert" role="alert" aria-live="polite"></p></form><div style="margin-top:20px"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div><section class="rows" aria-label="Projects"></section>';
 const rows=app.querySelector('.rows'),filter=app.querySelector('#project-filter');filter.value=projectFilter;const projects=await request('/api/projects');
 for(const project of projects){if (Boolean(project.archived) !== (filter.value === 'Archived')) continue;const row=document.createElement('div');row.className='row';row.dataset.testid='project-row';const info=document.createElement('span');info.textContent=project.name+' ';const summary=document.createElement('span');summary.dataset.testid='project-summary';summary.textContent=`${project.completed}/${project.total} completed`;info.append(summary);row.append(info);const actions=document.createElement('span');const open=document.createElement('button');open.type='button';open.textContent='Open project';open.addEventListener('click',()=>{location.href='/projects/'+encodeURIComponent(project.id)});actions.append(open);const toggle=document.createElement('button');toggle.type='button';toggle.style.marginLeft='8px';toggle.textContent=project.archived?'Restore project':'Archive project';toggle.addEventListener('click',async()=>{try{await request('/api/projects/'+encodeURIComponent(project.id)+'/archive',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:!Boolean(project.archived)})});await renderList()}catch(error){alert(error.message)}});actions.append(toggle);row.append(actions);rows.append(row)}
 filter.addEventListener('change',()=>{projectFilter=filter.value;renderList()});
 app.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();const input=app.querySelector('input');const alert=app.querySelector('.alert');const name=input.value.trim();if(!name){alert.textContent='Project name is required';return}try{await request('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});renderList()}catch(error){alert.textContent=error.message}});
}
async function renderProject(){const id=decodeURIComponent(location.pathname.slice('/projects/'.length));try{const project=await request('/api/projects/'+encodeURIComponent(id));app.innerHTML=`<header><h1>${escapeText(project.name)}</h1><button class="back" type="button">Projects</button></header>${project.archived?'<p>Archived project</p>':''}<form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" name="name" type="text" autocomplete="off" ${project.archived?'disabled':''}><button type="submit" ${project.archived?'disabled':''}>Rename project</button><p class="alert" role="alert" aria-live="polite"></p></form><form id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" autocomplete="off" ${project.archived?'disabled':''}><button type="submit" ${project.archived?'disabled':''}>Create task</button><p class="alert" role="alert" aria-live="polite"></p></form><div style="margin-top:20px"><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select><label for="priority-filter" style="margin-top:12px">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select><label for="default-task-priority" style="margin-top:12px">Default task priority</label><select id="default-task-priority" ${project.archived?'disabled':''}><option>Low</option><option>Normal</option><option>High</option></select><label for="due-from" style="margin-top:12px">Due from</label><input id="due-from" type="text" placeholder="YYYY-MM-DD"><label for="due-through">Due through</label><input id="due-through" type="text" placeholder="YYYY-MM-DD"><button id="apply-due-range" type="button">Apply due range</button><p id="range-alert" class="alert" role="alert" aria-live="polite"></p></div><section class="rows" aria-label="Tasks"></section>`;app.querySelector('.back').addEventListener('click',()=>location.href='/');const renameForm=app.querySelector('#rename-form');if(renameForm)renameForm.addEventListener('submit',async event=>{event.preventDefault();const input=app.querySelector('#new-project-name'),alert=renameForm.querySelector('.alert'),name=input.value.trim();if(!name){alert.textContent='Project name is required';return}try{await request('/api/projects/'+encodeURIComponent(id)+'/rename',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});await renderProject()}catch(error){alert.textContent=error.message}});const filter=app.querySelector('#task-filter'),priorityFilter=app.querySelector('#priority-filter'),defaultPriority=app.querySelector('#default-task-priority'),rows=app.querySelector('.rows'),dueFrom=app.querySelector('#due-from'),dueThrough=app.querySelector('#due-through'),rangeAlert=app.querySelector('#range-alert');const viewState=projectViewState.get(id)||{from:'',through:'',taskFilter:'All',priorityFilter:'All'};dueFrom.value=viewState.from;dueThrough.value=viewState.through;filter.value=viewState.taskFilter;priorityFilter.value=viewState.priorityFilter;let appliedFrom=viewState.from,appliedThrough=viewState.through;defaultPriority.value=project.default_priority||'Normal';defaultPriority.addEventListener('change',async()=>{try{await request('/api/projects/'+encodeURIComponent(id)+'/default-priority',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:defaultPriority.value})})}catch(error){alert(error.message);defaultPriority.value=project.default_priority||'Normal'}});const destinations=(await request('/api/projects')).filter(item=>!item.archived&&item.id!==project.id);async function loadTasks(){const tasks=await request('/api/projects/'+encodeURIComponent(id)+'/tasks');rows.replaceChildren();for(const task of tasks){if(filter.value==='Open'&&task.completed||filter.value==='Completed'&&!task.completed||priorityFilter.value!=='All'&&task.priority!==priorityFilter.value)continue;if((appliedFrom||appliedThrough)&&(!task.dueDate||appliedFrom&&task.dueDate<appliedFrom||appliedThrough&&task.dueDate>appliedThrough))continue;const row=document.createElement('div');row.className='row';row.dataset.testid='task-row';const label=document.createElement('label');label.style.cssText='display:flex;align-items:center;gap:10px;margin:0';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=!!task.completed;checkbox.disabled=!!project.archived;checkbox.setAttribute('aria-label','Complete '+task.title);checkbox.style.cssText='width:auto;margin:0';checkbox.addEventListener('change',async()=>{await request('/api/projects/'+encodeURIComponent(id)+'/tasks/'+encodeURIComponent(task.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:checkbox.checked})});loadTasks()});label.append(checkbox,document.createTextNode(task.title));row.append(label);const priority=document.createElement('select');priority.setAttribute('aria-label','Task priority');for(const value of ['Low','Normal','High']){const option=document.createElement('option');option.value=value;option.textContent=value;priority.append(option)}priority.value=task.priority||'Normal';priority.disabled=!!project.archived;priority.addEventListener('change',async()=>{try{await request('/api/projects/'+encodeURIComponent(id)+'/tasks/'+encodeURIComponent(task.id)+'/priority',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:priority.value})});await loadTasks()}catch(error){alert(error.message);await loadTasks()}});row.append(priority);const dueDateInput=document.createElement('input');dueDateInput.type='text';dueDateInput.setAttribute('aria-label','Task due date');dueDateInput.placeholder='YYYY-MM-DD';dueDateInput.value=task.dueDate||'';dueDateInput.disabled=!!project.archived;dueDateInput.style.cssText='width:150px;margin:0 8px';const dueDateButton=document.createElement('button');dueDateButton.type='button';dueDateButton.textContent='Save due date';dueDateButton.disabled=!!project.archived;const dueDateAlert=document.createElement('p');dueDateAlert.className='alert';dueDateAlert.setAttribute('role','alert');dueDateAlert.setAttribute('aria-live','polite');dueDateButton.addEventListener('click',async()=>{try{await request('/api/projects/'+encodeURIComponent(id)+'/tasks/'+encodeURIComponent(task.id)+'/due-date',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({dueDate:dueDateInput.value})});dueDateAlert.textContent='';await loadTasks()}catch(error){dueDateAlert.textContent=error.message}});row.append(dueDateInput,dueDateButton,dueDateAlert);const destinationSelect=document.createElement('select');destinationSelect.setAttribute('aria-label','Destination project');for(const destination of destinations){const option=document.createElement('option');option.value=destination.id;option.textContent=destination.name;destinationSelect.append(option)}destinationSelect.disabled=!!project.archived||destinations.length===0;const moveButton=document.createElement('button');moveButton.type='button';moveButton.textContent='Move task';moveButton.disabled=destinationSelect.disabled;moveButton.addEventListener('click',async()=>{try{await request('/api/projects/'+encodeURIComponent(id)+'/tasks/'+encodeURIComponent(task.id)+'/move',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({destinationProjectId:destinationSelect.value})});await loadTasks()}catch(error){alert(error.message)}});row.append(destinationSelect,moveButton);const renameInput=document.createElement('input');renameInput.type='text';renameInput.setAttribute('aria-label','New task title');renameInput.value=task.title;renameInput.disabled=!!project.archived;renameInput.style.cssText='width:190px;margin:0 8px';const renameButton=document.createElement('button');renameButton.type='button';renameButton.textContent='Rename task';renameButton.disabled=!!project.archived;const renameAlert=document.createElement('p');renameAlert.className='alert';renameAlert.setAttribute('role','alert');renameAlert.setAttribute('aria-live','polite');row.append(renameInput,renameButton,renameAlert);renameButton.addEventListener('click',async()=>{const title=renameInput.value.trim();if(!title){renameAlert.textContent='Task title is required';return}renameAlert.textContent='';try{await request('/api/projects/'+encodeURIComponent(id)+'/tasks/'+encodeURIComponent(task.id)+'/rename',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});await loadTasks()}catch(error){alert(error.message)}});rows.append(row)}}filter.addEventListener('change',()=>{viewState.taskFilter=filter.value;projectViewState.set(id,viewState);loadTasks()});priorityFilter.addEventListener('change',()=>{viewState.priorityFilter=priorityFilter.value;projectViewState.set(id,viewState);loadTasks()});app.querySelector('#apply-due-range').addEventListener('click',()=>{const from=dueFrom.value.trim(),through=dueThrough.value.trim();const valid=value=>{if(!value)return true;const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);if(!match)return false;const y=+match[1],m=+match[2],d=+match[3];if(y<1||m<1||m>12)return false;const days=[31,(y%4===0&&(y%100!==0||y%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];return d>=1&&d<=days[m-1]};if(!valid(from)||!valid(through)){rangeAlert.textContent='Due range must use valid YYYY-MM-DD dates';return}if(from&&through&&from>through){rangeAlert.textContent='Due from must not be after Due through';return}appliedFrom=from;appliedThrough=through;viewState.from=from;viewState.through=through;projectViewState.set(id,viewState);rangeAlert.textContent='';loadTasks()});await loadTasks();app.querySelector('#task-form').addEventListener('submit',async event=>{event.preventDefault();const input=app.querySelector('#task-title'),alert=app.querySelector('.alert'),title=input.value.trim();if(!title){alert.textContent='Task title is required';return}try{await request('/api/projects/'+encodeURIComponent(id)+'/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});input.value='';alert.textContent='';await loadTasks()}catch(error){alert.textContent=error.message}})}catch{location.href='/'}}
if(location.pathname==='/')renderList();else renderProject();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202b3c; background: #f4f6f9; }
    body { margin: 0; }
    main { max-width: 760px; margin: 64px auto; padding: 0 24px; }
    h1 { margin: 0 0 28px; font-size: 2rem; }
    form, .project-row, .detail, .task-row { background: white; border: 1px solid #dce2ea; border-radius: 10px; padding: 20px; }
    form { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
    label { display: grid; gap: 7px; flex: 1; min-width: 200px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #aab5c4; border-radius: 6px; font: inherit; }
    textarea { box-sizing: border-box; width: 100%; min-height: 5em; padding: 10px 12px; border: 1px solid #aab5c4; border-radius: 6px; font: inherit; }
    button { padding: 10px 15px; border: 0; border-radius: 6px; background: #245fce; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #194da9; }
    .project-list { display: grid; gap: 10px; margin-top: 22px; }
    .project-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .project-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .project-summary { color: #657083; white-space: nowrap; }
    .project-name { overflow-wrap: anywhere; }
    .alert { margin: 12px 0 0; color: #a32828; }
    .detail p { margin: 0 0 20px; }
    .task-controls { margin-top: 20px; }
    .task-controls label { flex: 1; }
    .task-row { display: flex; align-items: center; gap: 12px; }
    .task-row form { display: flex; align-items: end; gap: 8px; padding: 0; border: 0; flex: 1; }
    .task-row form label { min-width: 100px; }
    .task-row input { width: auto; }
    .task-row select { padding: 8px; border: 1px solid #aab5c4; border-radius: 6px; font: inherit; }
    .task-title { overflow-wrap: anywhere; }
    .task-row.completed .task-title { color: #657083; text-decoration: line-through; }
    [data-testid="directory-task-notes"] { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main id="app">
    <h1>Workboard</h1>
    <form id="create-form">
      <label for="project-name">Project name</label>
      <input id="project-name" name="name" type="text" autocomplete="off">
      <button type="submit">Create project</button>
    </form>
    <p id="alert" class="alert" role="alert" hidden></p>
    <form id="import-form" class="task-controls">
      <label for="project-json">Project JSON</label>
      <textarea id="project-json" name="document"></textarea>
      <label for="imported-project-name">Imported project name</label>
      <input id="imported-project-name" name="name" type="text" autocomplete="off">
      <button type="submit">Import project</button>
    </form>
    <label for="project-filter" style="margin-top: 20px">Project filter</label>
    <select id="project-filter"><option>Active</option><option>Archived</option></select>
    <form id="project-search-form" class="task-controls">
      <label for="project-search">Project search</label>
      <input id="project-search" type="text" autocomplete="off">
      <button type="submit">Search projects</button>
    </form>
    <section id="project-list" class="project-list" aria-label="Projects"></section>
    <p><a href="/directory">Task directory</a></p>
  </main>
  <main id="directory-page" hidden>
    <button id="directory-back" type="button">Projects</button>
    <h1>Task directory</h1>
    <label for="directory-scope">Project scope</label>
    <select id="directory-scope"><option>Active</option><option>Archived</option></select>
    <label for="directory-task-filter">Task filter</label>
    <select id="directory-task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select>
    <label for="directory-priority-filter">Priority filter</label>
    <select id="directory-priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
    <label for="directory-order">Directory order</label>
    <select id="directory-order"><option>Original</option><option>Priority</option><option>Due date</option><option>Title</option></select>
    <form id="directory-range-form" class="task-controls">
      <label for="directory-due-from">Due from<input id="directory-due-from" type="text" placeholder="YYYY-MM-DD"></label>
      <label for="directory-due-through">Due through<input id="directory-due-through" type="text" placeholder="YYYY-MM-DD"></label>
      <button type="submit">Apply due range</button>
    </form>
    <p id="directory-alert" class="alert" role="alert" hidden></p>
    <form id="directory-search-form" class="task-controls">
      <label for="directory-search">Directory search</label>
      <input id="directory-search" type="text" autocomplete="off">
      <button type="submit">Search directory</button>
    </form>
    <div class="task-controls" aria-label="Bulk task completion">
      <button id="complete-visible-tasks" type="button">Complete visible tasks</button>
      <button id="reopen-visible-tasks" type="button">Reopen visible tasks</button>
    </div>
    <p data-testid="directory-summary" aria-live="polite"></p>
    <p id="directory-empty" hidden>No matching tasks</p>
    <section id="directory-results" class="project-list" aria-label="Directory tasks"></section>
  </main>
  <main id="project-detail" hidden>
    <button id="back-button" type="button">Projects</button>
    <button id="download-project" type="button">Download project</button>
    <h1 id="project-heading"><!-- PROJECT_HEADING --></h1>
    <p id="archived-notice" hidden>Archived project</p>
    <form id="rename-form" class="task-controls">
      <label for="new-project-name">New project name</label>
      <input id="new-project-name" name="name" type="text" autocomplete="off">
      <button type="submit">Rename project</button>
    </form>
    <p id="rename-alert" class="alert" role="alert" hidden></p>
    <label for="default-task-priority" style="margin-top: 20px">Default task priority</label>
    <select id="default-task-priority">
      <option>Low</option><option selected>Normal</option><option>High</option>
    </select>
    <form id="task-form" class="task-controls">
      <label for="task-title-input">Task title</label>
      <input id="task-title-input" name="title" type="text" autocomplete="off">
      <button type="submit">Create task</button>
    </form>
    <p id="task-alert" class="alert" role="alert" hidden></p>
    <label for="task-filter" style="margin-top: 20px">Task filter</label>
    <select id="task-filter">
      <option>All</option><option>Open</option><option>Completed</option><option>Deleted</option>
    </select>
    <form id="task-search-form" class="task-controls">
      <label for="task-search">Task search</label>
      <input id="task-search" type="text" autocomplete="off">
      <button type="submit">Search tasks</button>
    </form>
    <label for="priority-filter" style="margin-top: 20px">Priority filter</label>
    <select id="priority-filter">
      <option>All</option><option>Low</option><option>Normal</option><option>High</option>
    </select>
    <form id="due-range-form" class="task-controls">
      <label for="due-from">Due from<input id="due-from" type="text" placeholder="YYYY-MM-DD"></label>
      <label for="due-through">Due through<input id="due-through" type="text" placeholder="YYYY-MM-DD"></label>
      <button type="submit">Apply due range</button>
    </form>
    <p id="range-alert" class="alert" role="alert" hidden></p>
    <section id="task-list" class="project-list" aria-label="Tasks"></section>
  </main>
  <!-- PROJECT_DATA -->
  <!-- DIRECTORY_MODE -->
  <script>
    const app = document.querySelector('#app');
    const detail = document.querySelector('#project-detail');
    if (window.directoryMode) {
      app.hidden = true;
      document.querySelector('#directory-page').hidden = false;
      const scope = document.querySelector('#directory-scope');
      const taskFilter = document.querySelector('#directory-task-filter');
      const priorityFilter = document.querySelector('#directory-priority-filter');
      const orderSelect = document.querySelector('#directory-order');
      const fromInput = document.querySelector('#directory-due-from');
      const throughInput = document.querySelector('#directory-due-through');
      const queryInput = document.querySelector('#directory-search');
      const results = document.querySelector('#directory-results');
      const alert = document.querySelector('#directory-alert');
      const summary = document.querySelector('[data-testid="directory-summary"]');
      const emptyMessage = document.querySelector('#directory-empty');
      const completeButton = document.querySelector('#complete-visible-tasks');
      const reopenButton = document.querySelector('#reopen-visible-tasks');
      const normalize = (value) => value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, (c) => c.toLowerCase());
      const escapeText = (value) => {
        const element = document.createElement('span');
        element.textContent = value;
        return element.innerHTML;
      };
      const dateValid = (value) => {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (!match) return false;
        const [, y, m, d] = match.map(Number);
        if (y < 1 || m < 1 || m > 12 || d < 1) return false;
        const date = new Date(0);
        date.setUTCHours(0, 0, 0, 0);
        date.setUTCFullYear(y, m - 1, d);
        return date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
      };
      let tasks = [];
      let query = '';
      let range = { from: '', through: '' };
      const matchingTasks = () => tasks.filter((task) => {
          const completion = taskFilter.value === 'Deleted' ? task.deleted
            : !task.deleted && (taskFilter.value === 'All'
              || (taskFilter.value === 'Open' && !task.completed)
              || (taskFilter.value === 'Completed' && task.completed));
          const owner = (scope.value === 'Archived') === Boolean(task.project_archived);
          const priority = priorityFilter.value === 'All' || task.priority === priorityFilter.value;
          const hasRange = range.from || range.through;
          const due = !hasRange || (task.due_date && (!range.from || task.due_date >= range.from)
            && (!range.through || task.due_date <= range.through));
          const matches = !query || normalize(task.title).includes(normalize(query));
          return owner && completion && priority && due && matches;
        });
      const compareCodePoints = (left, right) => {
        const leftPoints = Array.from(left, (character) => character.codePointAt(0));
        const rightPoints = Array.from(right, (character) => character.codePointAt(0));
        const count = Math.min(leftPoints.length, rightPoints.length);
        for (let index = 0; index < count; index += 1) {
          if (leftPoints[index] !== rightPoints[index]) return leftPoints[index] - rightPoints[index];
        }
        return leftPoints.length - rightPoints.length;
      };
      const orderedTasks = (visible) => {
        if (orderSelect.value === 'Original') return visible;
        const indexed = visible.map((task, index) => ({ task, index }));
        indexed.sort((left, right) => {
          let comparison = 0;
          if (orderSelect.value === 'Priority') {
            const rank = { High: 0, Normal: 1, Low: 2 };
            comparison = rank[left.task.priority || 'Normal'] - rank[right.task.priority || 'Normal'];
          } else if (orderSelect.value === 'Due date') {
            const leftDate = left.task.due_date || '';
            const rightDate = right.task.due_date || '';
            comparison = !leftDate ? (rightDate ? 1 : 0) : (!rightDate ? -1
              : (leftDate < rightDate ? -1 : (leftDate > rightDate ? 1 : 0)));
          } else if (orderSelect.value === 'Title') {
            const foldAscii = (value) => value.replace(/[A-Z]/g, (letter) => letter.toLowerCase());
            comparison = compareCodePoints(foldAscii(left.task.title), foldAscii(right.task.title));
          }
          return comparison || left.index - right.index;
        });
        return indexed.map(({ task }) => task);
      };
      const render = () => {
        const matching = matchingTasks();
        const completedCount = matching.filter((task) => Boolean(task.completed)).length;
        summary.textContent = `${completedCount}/${matching.length} completed`;
        const visible = orderedTasks(matching);
        emptyMessage.hidden = visible.length !== 0;
        const eligible = scope.value === 'Active' && taskFilter.value !== 'Deleted'
          ? visible.filter((task) => !task.deleted && !task.project_archived) : [];
        completeButton.disabled = !eligible.some((task) => !task.completed);
        reopenButton.disabled = !eligible.some((task) => task.completed);
        results.innerHTML = visible.map((task) => `<article class="task-row" data-testid="directory-task-row">
          <span data-testid="directory-task-title">${escapeText(task.title)}</span>
          <span data-testid="directory-project-name">${escapeText(task.project_name)}</span>
          <span data-testid="directory-task-completion">${task.completed ? 'Completed' : 'Open'}</span>
          <span data-testid="directory-task-priority">${escapeText(task.priority || 'Normal')}</span>
          <span data-testid="directory-task-due-date">${escapeText(task.due_date || '')}</span>
          <span data-testid="directory-task-notes">${escapeText((task.notes || '').replace(/\r\n?/g, '\n'))}</span>
          <button type="button" data-open-project="${task.project_id}">Open project</button>
        </article>`).join('');
      };
      results.setAttribute('aria-busy', 'true');
      fetch('/api/directory').then((response) => response.json()).then((value) => {
        tasks = value;
        results.setAttribute('aria-busy', 'false');
        render();
      }).catch(() => {
        results.setAttribute('aria-busy', 'false');
        alert.textContent = 'Unable to load directory';
        alert.hidden = false;
      });
      for (const control of [scope, taskFilter, priorityFilter, orderSelect]) control.addEventListener('change', render);
      document.querySelector('#directory-search-form').addEventListener('submit', (event) => {
        event.preventDefault(); query = queryInput.value.trim(); render();
      });
      document.querySelector('#directory-range-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const from = fromInput.value.trim(); const through = throughInput.value.trim();
        if ((from && !dateValid(from)) || (through && !dateValid(through))) {
          alert.textContent = 'Due range must use valid YYYY-MM-DD dates'; alert.hidden = false; return;
        }
        if (from && through && from > through) {
          alert.textContent = 'Due from must not be after Due through'; alert.hidden = false; return;
        }
        range = { from, through }; alert.hidden = true; render();
      });
      const updateVisibleTasks = async (completed) => {
        const eligible = matchingTasks().filter((task) => !task.deleted && !task.project_archived
          && task.completed !== completed);
        if (!eligible.length) return;
        completeButton.disabled = true;
        reopenButton.disabled = true;
        try {
          const response = await fetch('/api/directory/completion', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed, task_ids: eligible.map((task) => task.id) }),
          });
          if (!response.ok) throw new Error('Unable to update tasks');
          const refreshed = await fetch('/api/directory');
          if (!refreshed.ok) throw new Error('Unable to refresh directory');
          tasks = await refreshed.json();
          render();
        } catch {
          alert.textContent = 'Unable to update visible tasks';
          alert.hidden = false;
          render();
        }
      };
      completeButton.addEventListener('click', () => updateVisibleTasks(true));
      reopenButton.addEventListener('click', () => updateVisibleTasks(false));
      results.addEventListener('click', (event) => {
        const button = event.target.closest('[data-open-project]');
        if (button) window.location.href = `/projects/${button.dataset.openProject}`;
      });
      document.querySelector('#directory-back').addEventListener('click', () => { window.location.href = '/'; });
    } else if (window.initialProject) {
      app.hidden = true;
      detail.hidden = false;
      const projectId = window.initialProject.id;
      const list = document.querySelector('#task-list');
      const alert = document.querySelector('#task-alert');
      const input = document.querySelector('#task-title-input');
      const filter = document.querySelector('#task-filter');
      const priorityFilter = document.querySelector('#priority-filter');
      const rangeForm = document.querySelector('#due-range-form');
      const fromInput = document.querySelector('#due-from');
      const throughInput = document.querySelector('#due-through');
      const rangeAlert = document.querySelector('#range-alert');
      const taskSearchForm = document.querySelector('#task-search-form');
      const taskSearchInput = document.querySelector('#task-search');
      let appliedTaskQuery = '';
      const normalizeSearchText = (value) => value
        .replace(/[ \t]+/g, ' ')
        .replace(/[A-Z]/g, (letter) => letter.toLowerCase());
      let appliedRange = { from: '', through: '' };
      const archived = Boolean(window.initialProject.archived);
      let activeProjects = [];
      const defaultPriority = document.querySelector('#default-task-priority');
      defaultPriority.value = window.initialProject.default_task_priority || 'Normal';
      defaultPriority.disabled = archived;
      document.querySelector('#archived-notice').hidden = !archived;
      const renameInput = document.querySelector('#new-project-name');
      const renameButton = document.querySelector('#rename-form button');
      const renameAlert = document.querySelector('#rename-alert');
      renameInput.disabled = archived;
      renameButton.disabled = archived;
      document.querySelector('#task-title-input').disabled = archived;
      document.querySelector('#task-form button').disabled = archived;
      let tasks = [];
      const escapeText = (value) => {
        const element = document.createElement('span');
        element.textContent = value;
        return element.innerHTML;
      };
      const renderTasks = () => {
        const visibleTasks = tasks.filter((task) => {
          const matchesCompletion = (filter.value === 'Deleted' && task.deleted)
            || (filter.value !== 'Deleted' && !task.deleted && (filter.value === 'All'
              || (filter.value === 'Open' && !task.completed)
              || (filter.value === 'Completed' && task.completed)));
          const matchesPriority = priorityFilter.value === 'All' || task.priority === priorityFilter.value;
          const hasRange = appliedRange.from || appliedRange.through;
          const matchesDate = !hasRange || (task.due_date
            && (!appliedRange.from || task.due_date >= appliedRange.from)
            && (!appliedRange.through || task.due_date <= appliedRange.through));
          const matchesSearch = !appliedTaskQuery
            || normalizeSearchText(task.title).includes(normalizeSearchText(appliedTaskQuery));
          return matchesCompletion && matchesPriority && matchesDate && matchesSearch;
        });
        list.innerHTML = visibleTasks.map((task) => {
          const destinations = activeProjects.filter((project) => project.id !== projectId);
          const locked = archived || Boolean(task.deleted);
          const taskAction = task.deleted ? 'restore' : 'delete';
          const taskActionLabel = task.deleted ? 'Restore task' : 'Delete task';
          return `
          <div class="task-row${task.completed ? ' completed' : ''}" data-testid="task-row">
            <input type="checkbox" data-task-id="${task.id}" aria-label="Complete ${escapeText(task.title)}"${task.completed ? ' checked' : ''}${locked ? ' disabled' : ''}>
            <span class="task-title">${escapeText(task.title)}</span>
            <form data-rename-task="${task.id}">
              <label>New task title<input type="text" name="title" value="${escapeText(task.title)}"${locked ? ' disabled' : ''}></label>
              <button type="submit"${locked ? ' disabled' : ''}>Rename task</button>
            </form>
            <label>Task priority<select data-task-priority="${task.id}"${locked ? ' disabled' : ''}>
              <option${task.priority === 'Low' ? ' selected' : ''}>Low</option>
              <option${task.priority === 'Normal' ? ' selected' : ''}>Normal</option>
              <option${task.priority === 'High' ? ' selected' : ''}>High</option>
            </select></label>
            <form data-due-date="${task.id}">
              <label>Task due date<input type="text" name="due_date" value="${escapeText(task.due_date || '')}" placeholder="YYYY-MM-DD"${locked ? ' disabled' : ''}></label>
              <button type="submit"${locked ? ' disabled' : ''}>Save due date</button>
            </form>
            <form data-task-notes="${task.id}">
              <label>Task notes<textarea name="notes"${locked ? ' disabled' : ''}>${escapeText(task.notes || '')}</textarea></label>
              <button type="submit"${locked ? ' disabled' : ''}>Save notes</button>
            </form>
            <label>Destination project<select data-destination="${task.id}"${locked || destinations.length === 0 ? ' disabled' : ''}>
              ${destinations.map((project) => `<option value="${project.id}">${escapeText(project.name)}</option>`).join('')}
            </select></label>
            <button type="button" data-move-task="${task.id}"${locked || destinations.length === 0 ? ' disabled' : ''}>Move task</button>
            <button type="button" data-task-lifecycle="${task.id}" data-action="${taskAction}"${archived ? ' disabled' : ''}>${taskActionLabel}</button>
          </div>`;
        }).join('');
      };
      const loadTasks = async () => {
        const response = await fetch(`/api/projects/${projectId}/tasks`);
        if (response.ok) {
          tasks = await response.json();
          renderTasks();
        }
      };
      fetch('/api/projects?filter=Active').then((response) => response.json()).then((projects) => {
        activeProjects = projects;
        renderTasks();
      });
      loadTasks();
      defaultPriority.addEventListener('change', async () => {
        const response = await fetch(`/api/projects/${projectId}/default-priority`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ priority: defaultPriority.value }),
        });
        if (!response.ok) defaultPriority.value = window.initialProject.default_task_priority || 'Normal';
        else window.initialProject.default_task_priority = defaultPriority.value;
      });
      filter.addEventListener('change', renderTasks);
      priorityFilter.addEventListener('change', renderTasks);
      taskSearchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        appliedTaskQuery = taskSearchInput.value.trim();
        renderTasks();
      });
      const validCalendarDate = (value) => {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (!match) return false;
        const [, y, m, d] = match.map(Number);
        if (y < 1 || m < 1 || m > 12 || d < 1) return false;
        const date = new Date(0);
        date.setUTCHours(0, 0, 0, 0);
        date.setUTCFullYear(y, m - 1, d);
        return date.getUTCFullYear() === y && date.getUTCMonth() === m - 1 && date.getUTCDate() === d;
      };
      rangeForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const from = fromInput.value.trim();
        const through = throughInput.value.trim();
        if ((from && !validCalendarDate(from)) || (through && !validCalendarDate(through))) {
          rangeAlert.textContent = 'Due range must use valid YYYY-MM-DD dates';
          rangeAlert.hidden = false;
          return;
        }
        if (from && through && from > through) {
          rangeAlert.textContent = 'Due from must not be after Due through';
          rangeAlert.hidden = false;
          return;
        }
        appliedRange = { from, through };
        rangeAlert.hidden = true;
        renderTasks();
      });
      list.addEventListener('submit', async (event) => {
        const notesForm = event.target.closest('form[data-task-notes]');
        if (notesForm) {
          event.preventDefault();
          const response = await fetch(`/api/projects/${projectId}/tasks/${notesForm.dataset.taskNotes}/notes`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ notes: notesForm.elements.notes.value }),
          });
          if (!response.ok) {
            const result = await response.json();
            alert.textContent = result.error || 'Unable to save notes';
            alert.hidden = false;
            return;
          }
          const updated = await response.json();
          tasks = tasks.map((task) => task.id === updated.id ? updated : task);
          alert.hidden = true;
          renderTasks();
          return;
        }
        const dueDateForm = event.target.closest('form[data-due-date]');
        if (dueDateForm) {
          event.preventDefault();
          const dueDateInput = dueDateForm.elements.due_date;
          const response = await fetch(`/api/projects/${projectId}/tasks/${dueDateForm.dataset.dueDate}/due-date`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ due_date: dueDateInput.value }),
          });
          if (!response.ok) {
            const result = await response.json();
            alert.textContent = result.error || 'Unable to save due date';
            alert.hidden = false;
            return;
          }
          const updated = await response.json();
          tasks = tasks.map((task) => task.id === updated.id ? updated : task);
          dueDateInput.value = updated.due_date || '';
          alert.hidden = true;
          renderTasks();
          return;
        }
        const form = event.target.closest('form[data-rename-task]');
        if (!form) return;
        event.preventDefault();
        const titleInput = form.elements.title;
        const title = titleInput.value.trim();
        if (!title) {
          alert.textContent = 'Task title is required';
          alert.hidden = false;
          titleInput.focus();
          return;
        }
        const response = await fetch(`/api/projects/${projectId}/tasks/${form.dataset.renameTask}/rename`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        if (!response.ok) {
          const result = await response.json();
          alert.textContent = result.error || 'Unable to rename task';
          alert.hidden = false;
          return;
        }
        const updated = await response.json();
        tasks = tasks.map((task) => task.id === updated.id ? updated : task);
        alert.hidden = true;
        renderTasks();
      });
      document.querySelector('#rename-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = renameInput.value.trim();
        if (!name) {
          renameAlert.textContent = 'Project name is required';
          renameAlert.hidden = false;
          renameInput.focus();
          return;
        }
        const response = await fetch(`/api/projects/${projectId}/rename`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!response.ok) {
          const result = await response.json();
          renameAlert.textContent = result.error || 'Unable to rename project';
          renameAlert.hidden = false;
          return;
        }
        const project = await response.json();
        document.querySelector('#project-heading').textContent = project.name;
        renameInput.value = '';
        renameAlert.hidden = true;
      });
      document.querySelector('#task-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) {
          alert.textContent = 'Task title is required';
          alert.hidden = false;
          input.focus();
          return;
        }
        const response = await fetch(`/api/projects/${projectId}/tasks`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        if (!response.ok) {
          const result = await response.json();
          alert.textContent = result.error || 'Unable to create task';
          alert.hidden = false;
          return;
        }
        input.value = '';
        alert.hidden = true;
        await loadTasks();
      });
      list.addEventListener('change', async (event) => {
        const checkbox = event.target.closest('input[type="checkbox"][data-task-id]');
        const prioritySelect = event.target.closest('select[data-task-priority]');
        if (!checkbox && !prioritySelect) return;
        const taskId = checkbox ? checkbox.dataset.taskId : prioritySelect.dataset.taskPriority;
        const payload = checkbox ? { completed: checkbox.checked } : { priority: prioritySelect.value };
        const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (response.ok) {
          const updated = await response.json();
          tasks = tasks.map((task) => task.id === updated.id ? updated : task);
          renderTasks();
        } else {
          await loadTasks();
        }
      });
      list.addEventListener('click', async (event) => {
        const lifecycleButton = event.target.closest('button[data-task-lifecycle]');
        if (lifecycleButton) {
          const taskId = lifecycleButton.dataset.taskLifecycle;
          const action = lifecycleButton.dataset.action;
          const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}/${action}`, { method: 'POST' });
          if (response.ok) {
            const updated = await response.json();
            tasks = tasks.map((task) => task.id === updated.id ? updated : task);
            renderTasks();
          } else {
            const result = await response.json();
            alert.textContent = result.error || `Unable to ${action} task`;
            alert.hidden = false;
          }
          return;
        }
        const button = event.target.closest('button[data-move-task]');
        if (!button) return;
        const taskId = button.dataset.moveTask;
        const destination = list.querySelector(`select[data-destination="${taskId}"]`);
        if (!destination || !destination.value) return;
        const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}/move`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ destination_project_id: Number(destination.value) }),
        });
        if (response.ok) {
          tasks = tasks.filter((task) => task.id !== Number(taskId));
          renderTasks();
        } else {
          const result = await response.json();
          alert.textContent = result.error || 'Unable to move task';
          alert.hidden = false;
        }
      });
    } else {
      const list = document.querySelector('#project-list');
      const alert = document.querySelector('#alert');
      const input = document.querySelector('#project-name');
      const filter = document.querySelector('#project-filter');
      const searchForm = document.querySelector('#project-search-form');
      const searchInput = document.querySelector('#project-search');
      let appliedQuery = '';
      let projectLoadVersion = 0;
      const normalizeSearchText = (value) => value
        .replace(/[ \t]+/g, ' ')
        .replace(/[A-Z]/g, (letter) => letter.toLowerCase());
      const escapeText = (value) => {
        const element = document.createElement('span');
        element.textContent = value;
        return element.innerHTML;
      };
      const render = (projects) => {
        const visibleProjects = projects.filter((project) => !appliedQuery
          || normalizeSearchText(project.name).includes(normalizeSearchText(appliedQuery)));
        list.innerHTML = visibleProjects.map((project) => `
          <div class="project-row" data-testid="project-row">
            <span class="project-name">${escapeText(project.name)}</span>
            <span class="project-summary" data-testid="project-summary">${project.completed_count}/${project.total_count} completed</span>
            <span class="project-actions">
              <button type="button" data-project-id="${project.id}" data-action="open">Open project</button>
              <button type="button" data-project-id="${project.id}" data-action="${project.archived ? 'restore' : 'archive'}">${project.archived ? 'Restore project' : 'Archive project'}</button>
            </span>
          </div>`).join('');
      };
      const loadProjects = () => {
        const version = ++projectLoadVersion;
        return fetch(`/api/projects?filter=${filter.value}`)
          .then((response) => response.json())
          .then((projects) => {
            // Filter and search changes can overlap network requests. Only the
            // latest request represents the current list controls.
            if (version === projectLoadVersion) render(projects);
          });
      };
      loadProjects();
      filter.addEventListener('change', loadProjects);
      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        appliedQuery = searchInput.value.trim();
        loadProjects();
      });
      document.querySelector('#create-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          input.focus();
          return;
        }
        const response = await fetch('/api/projects', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!response.ok) {
          const result = await response.json();
          alert.textContent = result.error || 'Unable to create project';
          alert.hidden = false;
          return;
        }
        const project = await response.json();
        input.value = '';
        alert.hidden = true;
        await loadProjects();
      });
      document.querySelector('#import-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const jsonInput = document.querySelector('#project-json');
        const nameInput = document.querySelector('#imported-project-name');
        const name = nameInput.value.trim();
        if (!name) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          nameInput.focus();
          return;
        }
        let documentValue;
        try {
          documentValue = JSON.parse(jsonInput.value);
        } catch {
          alert.textContent = 'Invalid project JSON';
          alert.hidden = false;
          return;
        }
        const response = await fetch('/api/projects/import', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, document: documentValue }),
        });
        if (!response.ok) {
          const result = await response.json();
          alert.textContent = result.error || 'Invalid project JSON';
          alert.hidden = false;
          return;
        }
        const project = await response.json();
        window.location.href = `/projects/${project.id}`;
      });
      list.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-project-id]');
        if (!button) return;
        const { projectId, action } = button.dataset;
        if (action === 'open') {
          window.location.href = `/projects/${projectId}`;
          return;
        }
        const response = await fetch(`/api/projects/${projectId}/${action}`, { method: 'POST' });
        if (response.ok) await loadProjects();
      });
    }
    document.querySelector('#back-button').addEventListener('click', () => {
      window.location.href = '/';
    });
    const downloadButton = document.querySelector('#download-project');
    if (window.initialProject) {
      downloadButton.addEventListener('click', () => {
        window.location.href = `/api/projects/${window.initialProject.id}/export`;
      });
    }
  </script>
</body>
</html>

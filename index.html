<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workboard</title><style>
:root{font-family:system-ui,sans-serif;color:#202938;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:64px auto;padding:0 24px}h1{font-size:2rem;margin:0 0 28px}.create{display:flex;gap:12px;max-width:600px;margin-bottom:24px}input,select,textarea{font:inherit;padding:11px 12px;border:1px solid #aab4c2;border-radius:6px;flex:1;min-width:0}textarea{min-height:72px;resize:vertical}button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:6px;background:#2459c4;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;background:white;border:1px solid #dce2ea;border-radius:8px;margin:10px 0}.name{font-weight:600}.alert{color:#a32121;margin:12px 0}.back{margin-bottom:24px}.empty{color:#586579}.task-check{width:20px;height:20px;flex:none}.filter{display:flex;align-items:center;gap:12px;margin:20px 0}.filter select{flex:initial;min-width:150px}.summary,.status{font-weight:400;color:#586579;margin-left:auto}
</style></head><body><main id="app"></main><script>
const asciiFold=value=>value.replace(/[A-Z]/g,char=>String.fromCharCode(char.charCodeAt(0)+32));const normalizeSearch=value=>asciiFold(value.replace(/[ \t]+/g,' '));const app=document.querySelector('#app'),button=(text,cls='')=>{const b=document.createElement('button');b.textContent=text;if(cls)b.className=cls;return b};
async function render(){const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);if(match){app.replaceChildren();const back=button('Projects','back');back.onclick=()=>location.href='/';app.append(back);const response=await fetch('/api/projects/'+match[1]);if(!response.ok){const h=document.createElement('h1');h.textContent='Project not found';app.append(h);return}const project=await response.json(),heading=document.createElement('h1');heading.textContent=project.name;app.append(heading);if(project.archived){const status=document.createElement('p');status.textContent='Archived project';app.append(status)}const renameForm=document.createElement('form');renameForm.className='create';const renameInput=document.createElement('input');renameInput.setAttribute('aria-label','New project name');renameInput.value=project.name;renameInput.disabled=project.archived;const renameButton=button('Rename project');renameButton.type='submit';renameButton.disabled=project.archived;renameForm.append(renameInput,renameButton);app.append(renameForm);renameForm.onsubmit=async e=>{e.preventDefault();const result=await fetch('/api/projects/'+match[1],{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:renameInput.value})});if(result.ok){const updated=await result.json();heading.textContent=updated.name;renameInput.value=updated.name}else{const msg=await result.json();const error=document.createElement('div');error.className='alert';error.setAttribute('role','alert');error.textContent=msg.error||'Project name is required';renameForm.after(error)}};const defaultWrap=document.createElement('div');defaultWrap.className='filter';const defaultPriority=document.createElement('select');defaultPriority.setAttribute('aria-label','Default task priority');for(const value of ['Low','Normal','High']){const option=document.createElement('option');option.value=value;option.textContent=value;defaultPriority.append(option)}defaultPriority.value=project.defaultPriority||'Normal';defaultPriority.disabled=project.archived;defaultPriority.onchange=async()=>{const result=await fetch('/api/projects/'+match[1],{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({defaultPriority:defaultPriority.value})});if(!result.ok)render()};defaultWrap.append(defaultPriority);app.append(defaultWrap);const form=document.createElement('form');form.className='create';const input=document.createElement('input');input.setAttribute('aria-label','Task title');input.autocomplete='off';const submit=button('Create task');submit.type='submit';submit.disabled=project.archived;form.append(input,submit);app.append(form);const alert=document.createElement('div');alert.className='alert';alert.setAttribute('role','alert');alert.hidden=true;app.append(alert);const wrap=document.createElement('div');wrap.className='filter';const filter=document.createElement('select');filter.setAttribute('aria-label','Task filter');for(const value of ['All','Open','Completed','Deleted']){const o=document.createElement('option');o.value=value;o.textContent=value;filter.append(o)}wrap.append(filter);const priorityFilter=document.createElement('select');priorityFilter.setAttribute('aria-label','Priority filter');for(const value of ['All','Low','Normal','High']){const o=document.createElement('option');o.value=value;o.textContent=value;priorityFilter.append(o)}wrap.append(priorityFilter);app.append(wrap);let appliedFrom='',appliedThrough='';const rangeWrap=document.createElement('form');rangeWrap.className='filter';const dueFrom=document.createElement('input');dueFrom.setAttribute('aria-label','Due from');const dueThrough=document.createElement('input');dueThrough.setAttribute('aria-label','Due through');const applyRange=button('Apply due range');applyRange.type='submit';rangeWrap.append(dueFrom,dueThrough,applyRange);rangeWrap.onsubmit=e=>{e.preventDefault();const from=dueFrom.value.trim(),through=dueThrough.value.trim();const validDate=value=>{if(!value)return true;const m=value.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return false;const y=Number(m[1]),mo=Number(m[2]),d=Number(m[3]);const date=new Date(0);date.setUTCHours(0,0,0,0);date.setUTCFullYear(y,mo-1,d);return y>=1&&date.getUTCFullYear()===y&&date.getUTCMonth()===mo-1&&date.getUTCDate()===d};if(!validDate(from)||!validDate(through)){alert.textContent='Due range must use valid YYYY-MM-DD dates';alert.hidden=false;return}if(from&&through&&from>through){alert.textContent='Due from must not be after Due through';alert.hidden=false;return}appliedFrom=from;appliedThrough=through;alert.hidden=true;load()};app.append(rangeWrap);const searchForm=document.createElement('form');searchForm.className='filter';const searchInput=document.createElement('input');searchInput.setAttribute('aria-label','Task search');const searchButton=button('Search tasks');searchButton.type='submit';searchForm.append(searchInput,searchButton);app.append(searchForm);let appliedTaskQuery='';searchForm.onsubmit=e=>{e.preventDefault();appliedTaskQuery=searchInput.value.trim();load()};const list=document.createElement('section');list.setAttribute('aria-label','Tasks');app.append(list);let renderVersion=0;async function load(){const version=++renderVersion;const [tasks,availableProjects]=await Promise.all([(await fetch(`/api/projects/${match[1]}/tasks`)).json(),(await fetch('/api/projects')).json()]);if(version!==renderVersion)return;list.replaceChildren();const visible=tasks.filter(t=>normalizeSearch(t.title).includes(normalizeSearch(appliedTaskQuery))&&(filter.value==='Deleted'?Boolean(t.deleted):!t.deleted&&(filter.value==='All'||(filter.value==='Completed')===t.completed))&&(priorityFilter.value==='All'||priorityFilter.value===t.priority)&&(!appliedFrom&&!appliedThrough||Boolean(t.dueDate)&&(!appliedFrom||t.dueDate>=appliedFrom)&&(!appliedThrough||t.dueDate<=appliedThrough)));if(!visible.length){const e=document.createElement('p');e.className='empty';e.textContent='No tasks yet.';list.append(e)}for(const task of visible){const row=document.createElement('div');row.className='row';row.dataset.testid='task-row';const title=document.createElement('span');title.className='name';title.textContent=task.title;const check=document.createElement('input');check.type='checkbox';check.className='task-check';check.checked=task.completed;check.disabled=project.archived||Boolean(task.deleted);check.setAttribute('aria-label','Complete '+task.title);check.onchange=async()=>{await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:check.checked})});await load()};const priority=document.createElement('select');priority.setAttribute('aria-label','Task priority');for(const value of ['Low','Normal','High']){const option=document.createElement('option');option.value=value;option.textContent=value;priority.append(option)}priority.value=task.priority||'Normal';priority.disabled=project.archived||Boolean(task.deleted);priority.onchange=async()=>{await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:priority.value})});await load()};const dueForm=document.createElement('form');dueForm.className='create';const dueInput=document.createElement('input');dueInput.setAttribute('aria-label','Task due date');dueInput.value=task.dueDate||'';dueInput.disabled=project.archived||Boolean(task.deleted);const dueButton=button('Save due date');dueButton.type='submit';dueButton.disabled=project.archived||Boolean(task.deleted);dueForm.append(dueInput,dueButton);dueForm.onsubmit=async e=>{e.preventDefault();const result=await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({dueDate:dueInput.value})});if(result.ok){alert.hidden=true;await load()}else{const error=await result.json();alert.textContent=error.error||'Due date must be a valid YYYY-MM-DD date';alert.hidden=false}};const renameForm=document.createElement('form');renameForm.className='create';const renameInput=document.createElement('input');renameInput.setAttribute('aria-label','New task title');renameInput.value=task.title;renameInput.disabled=project.archived||Boolean(task.deleted);const renameButton=button('Rename task');renameButton.type='submit';renameButton.disabled=project.archived;renameForm.append(renameInput,renameButton);renameForm.onsubmit=async e=>{e.preventDefault();const result=await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:renameInput.value})});if(result.ok){alert.hidden=true;await load()}else{alert.textContent='Task title is required';alert.hidden=false}};const destinationSelect=document.createElement('select');destinationSelect.setAttribute('aria-label','Destination project');for(const destination of availableProjects.filter(p=>!p.archived&&p.id!==project.id)){const option=document.createElement('option');option.value=destination.id;option.textContent=destination.name;destinationSelect.append(option)}const moveButton=button('Move task');moveButton.disabled=project.archived||Boolean(task.deleted)||destinationSelect.options.length===0;destinationSelect.disabled=moveButton.disabled;moveButton.onclick=async()=>{if(!destinationSelect.value)return;const result=await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId:Number(destinationSelect.value)})});if(result.ok)await load()};const notesForm=document.createElement('form');notesForm.className='create';const notesInput=document.createElement('textarea');notesInput.setAttribute('aria-label','Task notes');notesInput.value=task.notes||'';notesInput.disabled=project.archived||Boolean(task.deleted);const notesButton=button('Save notes');notesButton.type='submit';notesButton.disabled=project.archived||Boolean(task.deleted);notesForm.append(notesInput,notesButton);notesForm.onsubmit=async e=>{e.preventDefault();const result=await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({notes:notesInput.value})});if(result.ok){alert.hidden=true;await load()}};const deleteButton=button(task.deleted?'Restore task':'Delete task');deleteButton.disabled=project.archived;deleteButton.onclick=async()=>{await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({deleted:!task.deleted})});await load()};row.append(title,check,priority,dueForm,renameForm,destinationSelect,moveButton,notesForm,deleteButton);list.append(row)}}filter.onchange=load;priorityFilter.onchange=load;form.onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/projects/${match[1]}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:input.value})});if(!r.ok){alert.textContent='Task title is required';alert.hidden=false;return}alert.hidden=true;input.value='';await load()};await load();return}
app.replaceChildren();const h=document.createElement('h1');h.textContent='Workboard';app.append(h);const filter=document.createElement('select');filter.setAttribute('aria-label','Project filter');for(const value of ['Active','Archived']){const o=document.createElement('option');o.value=value;o.textContent=value;filter.append(o)}const filterWrap=document.createElement('div');filterWrap.className='filter';filterWrap.append(filter);app.append(filterWrap);const form=document.createElement('form');form.className='create';const input=document.createElement('input');input.setAttribute('aria-label','Project name');input.autocomplete='off';const create=button('Create project');create.type='submit';form.append(input,create);app.append(form);const alert=document.createElement('div');alert.className='alert';alert.setAttribute('role','alert');alert.hidden=true;app.append(alert);const searchForm=document.createElement('form');searchForm.className='filter';const searchInput=document.createElement('input');searchInput.setAttribute('aria-label','Project search');const searchButton=button('Search projects');searchButton.type='submit';searchForm.append(searchInput,searchButton);app.append(searchForm);let appliedProjectQuery='';searchForm.onsubmit=e=>{e.preventDefault();appliedProjectQuery=searchInput.value.trim();load()};const list=document.createElement('section');list.setAttribute('aria-label','Projects');app.append(list);async function load(){const projects=await(await fetch('/api/projects')).json();list.replaceChildren();const selected=projects.filter(p=>p.archived===(filter.value==='Archived')&&normalizeSearch(p.name).includes(normalizeSearch(appliedProjectQuery)));if(!selected.length){const e=document.createElement('p');e.className='empty';e.textContent='No projects yet.';list.append(e)}for(const p of selected){const row=document.createElement('div');row.className='row';row.dataset.testid='project-row';const name=document.createElement('span');name.className='name';name.textContent=p.name;const summary=document.createElement('span');summary.dataset.testid='project-summary';summary.className='summary';summary.textContent=`${p.completed}/${p.total} completed`;const open=button('Open project');open.onclick=()=>location.href='/projects/'+p.id;row.append(name,summary,open);const action=button(p.archived?'Restore project':'Archive project');action.onclick=async()=>{await fetch('/api/projects/'+p.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:!p.archived})});await load()};row.append(action);list.append(row)}}filter.onchange=load;form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:input.value})});if(!r.ok){alert.textContent='Project name is required';alert.hidden=false;return}alert.hidden=true;input.value='';await load()};await load()}render();
</script></body></html>

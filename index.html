<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workboard</title><style>
:root{font-family:system-ui,sans-serif;color:#202938;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:64px auto;padding:0 24px}h1{font-size:2rem;margin:0 0 28px}.create{display:flex;gap:12px;max-width:600px;margin-bottom:24px}input,select{font:inherit;padding:11px 12px;border:1px solid #aab4c2;border-radius:6px;flex:1;min-width:0}button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:6px;background:#2459c4;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;background:white;border:1px solid #dce2ea;border-radius:8px;margin:10px 0}.name{font-weight:600}.alert{color:#a32121;margin:12px 0}.back{margin-bottom:24px}.empty{color:#586579}.task-check{width:20px;height:20px;flex:none}.filter{display:flex;align-items:center;gap:12px;margin:20px 0}.filter select{flex:initial;min-width:150px}.summary,.status{font-weight:400;color:#586579;margin-left:auto}
</style></head><body><main id="app"></main><script>
const app=document.querySelector('#app'),button=(text,cls='')=>{const b=document.createElement('button');b.textContent=text;if(cls)b.className=cls;return b};
async function render(){const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);if(match){app.replaceChildren();const back=button('Projects','back');back.onclick=()=>location.href='/';app.append(back);const response=await fetch('/api/projects/'+match[1]);if(!response.ok){const h=document.createElement('h1');h.textContent='Project not found';app.append(h);return}const project=await response.json(),heading=document.createElement('h1');heading.textContent=project.name;app.append(heading);if(project.archived){const status=document.createElement('p');status.textContent='Archived project';app.append(status)}const renameForm=document.createElement('form');renameForm.className='create';const renameInput=document.createElement('input');renameInput.setAttribute('aria-label','New project name');renameInput.value=project.name;renameInput.disabled=project.archived;const renameButton=button('Rename project');renameButton.type='submit';renameButton.disabled=project.archived;renameForm.append(renameInput,renameButton);app.append(renameForm);renameForm.onsubmit=async e=>{e.preventDefault();const result=await fetch('/api/projects/'+match[1],{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:renameInput.value})});if(result.ok)render();else{const msg=await result.json();const error=document.createElement('div');error.className='alert';error.setAttribute('role','alert');error.textContent=msg.error||'Project name is required';renameForm.after(error)}};const form=document.createElement('form');form.className='create';const input=document.createElement('input');input.setAttribute('aria-label','Task title');input.autocomplete='off';const submit=button('Create task');submit.type='submit';submit.disabled=project.archived;form.append(input,submit);app.append(form);const alert=document.createElement('div');alert.className='alert';alert.setAttribute('role','alert');alert.hidden=true;app.append(alert);const wrap=document.createElement('div');wrap.className='filter';const filter=document.createElement('select');filter.setAttribute('aria-label','Task filter');for(const value of ['All','Open','Completed']){const o=document.createElement('option');o.value=value;o.textContent=value;filter.append(o)}wrap.append(filter);app.append(wrap);const list=document.createElement('section');list.setAttribute('aria-label','Tasks');app.append(list);async function load(){const tasks=await(await fetch(`/api/projects/${match[1]}/tasks`)).json();list.replaceChildren();const visible=tasks.filter(t=>filter.value==='All'||(filter.value==='Completed')===t.completed);if(!visible.length){const e=document.createElement('p');e.className='empty';e.textContent='No tasks yet.';list.append(e)}for(const task of visible){const row=document.createElement('div');row.className='row';row.dataset.testid='task-row';const title=document.createElement('span');title.className='name';title.textContent=task.title;const check=document.createElement('input');check.type='checkbox';check.className='task-check';check.checked=task.completed;check.disabled=project.archived;check.setAttribute('aria-label','Complete '+task.title);check.onchange=async()=>{await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:check.checked})});await load()};const renameForm=document.createElement('form');renameForm.className='create';const renameInput=document.createElement('input');renameInput.setAttribute('aria-label','New task title');renameInput.value=task.title;renameInput.disabled=project.archived;const renameButton=button('Rename task');renameButton.type='submit';renameButton.disabled=project.archived;renameForm.append(renameInput,renameButton);renameForm.onsubmit=async e=>{e.preventDefault();const result=await fetch('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:renameInput.value})});if(result.ok){alert.hidden=true;await load()}else{alert.textContent='Task title is required';alert.hidden=false}};row.append(title,check,renameForm);list.append(row)}}filter.onchange=load;form.onsubmit=async e=>{e.preventDefault();const r=await fetch(`/api/projects/${match[1]}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:input.value})});if(!r.ok){alert.textContent='Task title is required';alert.hidden=false;return}alert.hidden=true;input.value='';await load()};await load();return}
app.replaceChildren();const h=document.createElement('h1');h.textContent='Workboard';app.append(h);const filter=document.createElement('select');filter.setAttribute('aria-label','Project filter');for(const value of ['Active','Archived']){const o=document.createElement('option');o.value=value;o.textContent=value;filter.append(o)}const filterWrap=document.createElement('div');filterWrap.className='filter';filterWrap.append(filter);app.append(filterWrap);const form=document.createElement('form');form.className='create';const input=document.createElement('input');input.setAttribute('aria-label','Project name');input.autocomplete='off';const create=button('Create project');create.type='submit';form.append(input,create);app.append(form);const alert=document.createElement('div');alert.className='alert';alert.setAttribute('role','alert');alert.hidden=true;app.append(alert);const list=document.createElement('section');list.setAttribute('aria-label','Projects');app.append(list);async function load(){const projects=await(await fetch('/api/projects')).json();list.replaceChildren();const selected=projects.filter(p=>p.archived===(filter.value==='Archived'));if(!selected.length){const e=document.createElement('p');e.className='empty';e.textContent='No projects yet.';list.append(e)}for(const p of selected){const row=document.createElement('div');row.className='row';row.dataset.testid='project-row';const name=document.createElement('span');name.className='name';name.textContent=p.name;const summary=document.createElement('span');summary.dataset.testid='project-summary';summary.className='summary';summary.textContent=`${p.completed}/${p.total} completed`;const open=button('Open project');open.onclick=()=>location.href='/projects/'+p.id;row.append(name,summary,open);const action=button(p.archived?'Restore project':'Archive project');action.onclick=async()=>{await fetch('/api/projects/'+p.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:!p.archived})});await load()};row.append(action);list.append(row)}}filter.onchange=load;form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:input.value})});if(!r.ok){alert.textContent='Project name is required';alert.hidden=false;return}alert.hidden=true;input.value='';await load()};await load()}render();
</script></body></html>

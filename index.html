<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid #e3e8f0; }
    .wrap { max-width: 850px; margin: auto; padding: 28px 24px; }
    header .wrap { padding-top: 20px; padding-bottom: 20px; }
    h1 { margin: 0; font-size: 1.65rem; }
    main { padding-top: 36px; }
    form, .project-row, .project-detail { background: #fff; border: 1px solid #e2e7ef; border-radius: 10px; }
    form { padding: 20px; display: flex; gap: 12px; align-items: end; }
    label { display: grid; gap: 7px; flex: 1; font-weight: 600; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #bec8d6; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; background: #315bd6; color: white; padding: 11px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #2348ba; }
    .project-row { margin-top: 12px; padding: 15px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .project-name { font-weight: 600; overflow-wrap: anywhere; }
    .project-detail { padding: 22px; }
    .project-detail h2 { margin: 0 0 20px; }
    .project-detail form { padding: 0; border: 0; margin-bottom: 18px; }
    .task-row { margin-top: 10px; padding: 13px 16px; display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #e2e7ef; border-radius: 8px; }
    .task-row[hidden] { display: none; }
    .task-row input { width: auto; }
    .back { margin-bottom: 16px; }
    [role="alert"] { color: #b42318; margin: 10px 0 0; }
    @media (max-width: 520px) { form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <header><div class="wrap"><h1>Workboard</h1></div></header>
  <main class="wrap" id="app"></main>
  <script>
    const app = document.querySelector('#app');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function render(preferredTaskFilter, preferredPriorityFilter) {
      const match = location.pathname.match(/^\/projects\/([^/]+)$/);
      if (match) {
        const projects = await fetch('/api/projects').then(response => response.json());
        const project = projects.find(item => item.id === decodeURIComponent(match[1]));
        if (!project) { app.innerHTML = '<p>Project not found.</p><button class="back" type="button">Projects</button>'; }
        else {
          const tasks = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks`).then(response => response.json());
          app.innerHTML = `<button class="back" type="button">Projects</button><section class="project-detail"><h2>${escapeHtml(project.name)}</h2>${project.archived ? '<p>Archived project</p>' : ''}<form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" type="text" autocomplete="off" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form><p id="rename-error" role="alert" hidden></p><label for="default-task-priority">Default task priority</label><select id="default-task-priority" ${project.archived ? 'disabled' : ''}><option${project.defaultPriority === 'Low' ? ' selected' : ''}>Low</option><option${project.defaultPriority === 'Normal' ? ' selected' : ''}>Normal</option><option${project.defaultPriority === 'High' ? ' selected' : ''}>High</option></select><form id="task-form"><label for="task-title">Task title</label><input id="task-title" type="text" autocomplete="off"><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form><p id="task-error" role="alert" hidden></p><label for="task-filter">Task filter</label><select id="task-filter" aria-label="Task filter"><option${preferredTaskFilter === 'All' || !preferredTaskFilter ? ' selected' : ''}>All</option><option${preferredTaskFilter === 'Open' ? ' selected' : ''}>Open</option><option${preferredTaskFilter === 'Completed' ? ' selected' : ''}>Completed</option></select><label for="priority-filter">Priority filter</label><select id="priority-filter" aria-label="Priority filter"><option${preferredPriorityFilter === 'All' || !preferredPriorityFilter ? ' selected' : ''}>All</option><option${preferredPriorityFilter === 'Low' ? ' selected' : ''}>Low</option><option${preferredPriorityFilter === 'Normal' ? ' selected' : ''}>Normal</option><option${preferredPriorityFilter === 'High' ? ' selected' : ''}>High</option></select><div id="tasks">${tasks.map(task => `<div class="task-row" data-testid="task-row" data-completed="${task.completed}"><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" data-task-id="${escapeHtml(task.id)}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}><span>${escapeHtml(task.title)}</span><input type="text" aria-label="New task title" data-rename-task="${escapeHtml(task.id)}" value="${escapeHtml(task.title)}" ${project.archived ? 'disabled' : ''}><button type="button" data-rename-task-button="${escapeHtml(task.id)}" ${project.archived ? 'disabled' : ''}>Rename task</button><select aria-label="Task priority" data-priority-task="${escapeHtml(task.id)}" ${project.archived ? 'disabled' : ''}><option${task.priority === 'Low' ? ' selected' : ''}>Low</option><option${task.priority === 'Normal' ? ' selected' : ''}>Normal</option><option${task.priority === 'High' ? ' selected' : ''}>High</option></select><input type="text" aria-label="Task due date" data-due-date="${escapeHtml(task.id)}" value="${escapeHtml(task.dueDate || '')}" ${project.archived ? 'disabled' : ''}><button type="button" aria-label="Save due date" data-save-due-date="${escapeHtml(task.id)}" ${project.archived ? 'disabled' : ''}>Save due date</button><span data-due-error="${escapeHtml(task.id)}" role="alert" hidden></span></div>`).join('')}</div></section>`;
          const applyFilter = () => { const filter = app.querySelector('#task-filter').value; const priority = app.querySelector('#priority-filter').value; app.querySelectorAll('.task-row').forEach(row => { const completionMatches = filter === 'All' || (filter === 'Open' ? row.dataset.completed !== 'true' : row.dataset.completed === 'true'); const taskPriority = row.querySelector('[data-priority-task]').value; row.hidden = !completionMatches || (priority !== 'All' && taskPriority !== priority); }); };
          if (!project.archived) app.querySelector('#rename-form').addEventListener('submit', async event => { event.preventDefault(); const error = app.querySelector('#rename-error'); const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/rename`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: app.querySelector('#new-project-name').value }) }); if (!response.ok) { error.textContent = 'Project name is required'; error.hidden = false; return; } render(); });
          if (!project.archived) app.querySelectorAll('[data-rename-task-button]').forEach(button => button.addEventListener('click', async () => {
            const input = app.querySelector(`[data-rename-task="${CSS.escape(button.dataset.renameTaskButton)}"]`);
            const error = app.querySelector('#task-error');
            const response = await fetch(`/api/tasks/${encodeURIComponent(button.dataset.renameTaskButton)}/rename`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: input.value }) });
            if (!response.ok) { error.textContent = 'Task title is required'; error.hidden = false; return; }
            render(app.querySelector('#task-filter').value, app.querySelector('#priority-filter').value);
          }));
          if (!project.archived) app.querySelector('#default-task-priority').addEventListener('change', async event => { await fetch(`/api/projects/${encodeURIComponent(project.id)}/default-priority`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: event.target.value }) }); });
          app.querySelector('#task-filter').addEventListener('change', applyFilter);
          app.querySelector('#priority-filter').addEventListener('change', applyFilter);
          applyFilter();
          app.querySelectorAll('[data-task-id]').forEach(box => box.addEventListener('change', async () => { const filter = app.querySelector('#task-filter').value; const priority = app.querySelector('#priority-filter').value; await fetch(`/api/tasks/${encodeURIComponent(box.dataset.taskId)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) }); render(filter, priority); }));
          app.querySelectorAll('[data-priority-task]').forEach(select => select.addEventListener('change', async () => { const filter = app.querySelector('#task-filter').value; const priority = app.querySelector('#priority-filter').value; await fetch(`/api/tasks/${encodeURIComponent(select.dataset.priorityTask)}/priority`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: select.value }) }); render(filter, priority); }));
          app.querySelectorAll('[data-save-due-date]').forEach(button => button.addEventListener('click', async () => { const id = button.dataset.saveDueDate; const input = app.querySelector(`[data-due-date="${CSS.escape(id)}"]`); const error = app.querySelector(`[data-due-error="${CSS.escape(id)}"]`); const response = await fetch(`/api/tasks/${encodeURIComponent(id)}/due-date`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dueDate: input.value }) }); if (!response.ok) { error.textContent = 'Due date must be a valid YYYY-MM-DD date'; error.hidden = false; return; } error.hidden = true; input.value = input.value.trim(); }));
          app.querySelector('#task-form').addEventListener('submit', async event => { event.preventDefault(); const error = app.querySelector('#task-error'); const response = await fetch(`/api/projects/${encodeURIComponent(project.id)}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: app.querySelector('#task-title').value }) }); if (!response.ok) { error.textContent = 'Task title is required'; error.hidden = false; return; } render(app.querySelector('#task-filter').value, app.querySelector('#priority-filter').value); });
        }
        app.querySelector('.back').addEventListener('click', () => { history.pushState({}, '', '/'); render(); });
        return;
      }
      const projects = await fetch('/api/projects').then(response => response.json());
      app.innerHTML = `<form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" autocomplete="off"><button type="submit">Create project</button></form><p id="error" role="alert" hidden></p><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select><section id="projects" aria-label="Projects"></section>`;
      const updateProjects = () => { const archived = app.querySelector('#project-filter').value === 'Archived'; const shown = projects.filter(project => project.archived === archived); app.querySelector('#projects').innerHTML = shown.map(project => `<div class="project-row" data-testid="project-row"><span class="project-name">${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completed}/${project.total} completed</span><button type="button" data-project-id="${escapeHtml(project.id)}">Open project</button><button type="button" data-action="${archived ? 'restore' : 'archive'}" data-id="${escapeHtml(project.id)}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join(''); app.querySelectorAll('[data-project-id]').forEach(button => button.onclick = () => { history.pushState({}, '', `/projects/${encodeURIComponent(button.dataset.projectId)}`); render(); }); app.querySelectorAll('[data-action]').forEach(button => button.onclick = async () => { await fetch(`/api/projects/${button.dataset.id}/${button.dataset.action}`, { method: 'POST' }); render(); }); };
      app.querySelector('#project-filter').addEventListener('change', updateProjects); updateProjects();
      app.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = app.querySelector('#project-name');
        const error = app.querySelector('#error');
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: input.value }) });
        if (!response.ok) { error.textContent = 'Project name is required'; error.hidden = false; return; }
        render();
      });
    }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

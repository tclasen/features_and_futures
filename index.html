<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workboard</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1d2939;background:#f7f9fc}body{margin:0}main{max-width:760px;margin:64px auto;padding:0 24px}h1{font-size:2rem;margin:0 0 28px}form,.project-row,.project-header{background:white;border:1px solid #dce3ed;border-radius:10px;padding:20px;margin-bottom:16px}label{display:block;font-weight:600;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:11px 12px;border:1px solid #98a6b8;border-radius:6px;font:inherit}button{padding:10px 16px;border:0;border-radius:6px;background:#2457c5;color:white;font:inherit;font-weight:600;cursor:pointer}form button{margin-top:12px}.project-row,.project-header{display:flex;align-items:center;justify-content:space-between;gap:16px}.project-row button,.project-header button{flex:none}.error{color:#b42318;margin:8px 0 0;font-weight:600}.empty{color:#596579}
</style>
</head>
<body><main id="app"></main>
<script>
const app=document.querySelector('#app');
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function projects(){const r=await fetch('/api/projects');return r.json()}
async function render(){
 const match=location.pathname.match(/^\/projects\/([^/]+)\/?$/);
 if(match){const all=await projects(),p=all.find(x=>x.id===decodeURIComponent(match[1]));if(!p){app.innerHTML='<h1>Project not found</h1><button id="back">Projects</button>';document.querySelector('#back').onclick=()=>location.assign('/');return}app.innerHTML=`<div class="project-header"><h1>${escapeHtml(p.name)}</h1><button id="back">Projects</button></div>`;document.querySelector('#back').onclick=()=>location.assign('/');return}
 const all=await projects();app.innerHTML=`<h1>Workboard</h1><form id="create"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" aria-describedby="error"><p id="error" class="error" role="alert" hidden></p><button type="submit">Create project</button></form><section aria-label="Projects">${all.length?all.map(p=>`<div class="project-row" data-testid="project-row"><span>${escapeHtml(p.name)}</span><button data-id="${escapeHtml(p.id)}">Open project</button></div>`).join(''):'<p class="empty">No projects yet.</p>'}</section>`;
 document.querySelector('#create').addEventListener('submit',async e=>{e.preventDefault();const input=document.querySelector('#project-name'),error=document.querySelector('#error');const name=input.value.trim();if(!name){error.textContent='Project name is required';error.hidden=false;input.focus();return}const response=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(response.ok)render()});
 document.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>location.assign('/projects/'+encodeURIComponent(button.dataset.id))));
}
window.addEventListener('popstate',render);render();
</script></body></html>

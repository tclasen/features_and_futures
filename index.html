<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    h1 { margin: 0 0 28px; font-size: 2rem; }
    form { display: flex; gap: 10px; margin-bottom: 24px; }
    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #bdc7d8; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 11px 16px; background: #2459c4; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #19469f; }
    .project-list { display: grid; gap: 10px; }
    [data-testid="project-row"] { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; background: white; border: 1px solid #e0e5ee; border-radius: 8px; }
    [role="alert"] { color: #b42318; margin: -10px 0 18px; }
    .back { margin-bottom: 24px; }
    .task-list { display: grid; gap: 10px; }
    [data-testid="task-row"] { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: white; border: 1px solid #e0e5ee; border-radius: 8px; }
    [data-testid="task-row"] input { flex: 0 0 auto; }
    @media (max-width: 480px) { form { flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    async function showList() {
      const projects = await fetch('/api/projects').then(response => response.json());
      app.innerHTML = `<h1>Workboard</h1>
        <label for="project-filter">Project filter</label><select id="project-filter" aria-label="Project filter"><option>Active</option><option>Archived</option></select>
        <form id="project-search-form"><label for="project-search">Project search</label><input id="project-search" type="text" aria-label="Project search"><button type="submit">Search projects</button></form>
        <form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" aria-label="Project name"><button type="submit">Create project</button></form>
        <div id="alert" role="alert" hidden></div>
        <section class="project-list" aria-label="Projects"></section>`;
      const filter = app.querySelector('#project-filter'), list = app.querySelector('.project-list');
      let appliedQuery = '';
      const normalizeSearch = value => value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, char => char.toLowerCase());
      function renderProjects() {
        const archived = filter.value === 'Archived';
        list.innerHTML = projects.filter(p => Boolean(p.archived) === archived && normalizeSearch(p.name).includes(normalizeSearch(appliedQuery))).map(project => `<div data-testid="project-row"><span>${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completed_count}/${project.total_count} completed</span><button type="button" data-open="${project.id}">Open project</button><button type="button" data-state="${project.id}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        list.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => { history.pushState({}, '', `/projects/${button.dataset.open}`); showRoute(); }));
        list.querySelectorAll('[data-state]').forEach(button => button.addEventListener('click', async () => {
          await fetch(`/api/projects/${button.dataset.state}/${archived ? 'restore' : 'archive'}`, { method: 'POST' });
          const p = projects.find(p => p.id === Number(button.dataset.state)); p.archived = archived ? 0 : 1; renderProjects();
        }));
      }
      filter.addEventListener('change', renderProjects); renderProjects();
      app.querySelector('#project-search-form').addEventListener('submit', event => {
        event.preventDefault();
        appliedQuery = app.querySelector('#project-search').value.trim();
        renderProjects();
      });
      app.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = app.querySelector('#project-name').value.trim();
        if (!name) {
          const alert = app.querySelector('#alert');
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          return;
        }
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (response.ok) showList();
      });
    }

    async function showProject(id) {
      const response = await fetch(`/api/projects/${encodeURIComponent(id)}`);
      if (!response.ok) { history.replaceState({}, '', '/'); return showList(); }
      const project = await response.json();
      const destinations = (await fetch('/api/projects').then(r => r.json())).filter(p => !p.archived && p.id !== project.id);
      app.innerHTML = `<button class="back" type="button">Projects</button><h1>${escapeHtml(project.name)}</h1>
        ${project.archived ? '<p>Archived project</p>' : ''}
        <form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" type="text" aria-label="New project name" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form>
        <div id="rename-alert" role="alert" hidden></div>
        <form id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" aria-label="Task title" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form>
        <div id="task-alert" role="alert" hidden></div>
        <label for="default-priority">Default task priority</label><select id="default-priority" aria-label="Default task priority" ${project.archived ? 'disabled' : ''}><option ${project.default_priority === 'Low' ? 'selected' : ''}>Low</option><option ${project.default_priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.default_priority === 'High' ? 'selected' : ''}>High</option></select>
        <label for="task-filter">Task filter</label><select id="task-filter" aria-label="Task filter"><option>All</option><option>Open</option><option>Completed</option></select>
        <label for="priority-filter">Priority filter</label><select id="priority-filter" aria-label="Priority filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
        <form id="task-search-form"><label for="task-search">Task search</label><input id="task-search" type="text" aria-label="Task search"><button type="submit">Search tasks</button></form>
        <form id="due-range"><label for="due-from">Due from</label><input id="due-from" type="text" aria-label="Due from"><label for="due-through">Due through</label><input id="due-through" type="text" aria-label="Due through"><button type="submit">Apply due range</button></form>
        <section class="task-list" aria-label="Tasks"></section>`;
      app.querySelector('.back').addEventListener('click', () => {
        history.pushState({}, '', '/');
        showRoute();
      });
      const renameForm = app.querySelector('#rename-form');
      if (renameForm) renameForm.addEventListener('submit', async event => {
        event.preventDefault();
        const name = app.querySelector('#new-project-name').value.trim();
        const alert = app.querySelector('#rename-alert');
        if (!name) { alert.textContent = 'Project name is required'; alert.hidden = false; return; }
        const result = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (result.ok) {
          const updated = await result.json();
          app.querySelector('h1').textContent = updated.name;
          app.querySelector('#new-project-name').value = '';
        }
      });
      const defaultPriority = app.querySelector('#default-priority');
      defaultPriority.addEventListener('change', async () => {
        await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ default_priority: defaultPriority.value }) });
      });
      const list = app.querySelector('.task-list');
      const filter = app.querySelector('#task-filter');
      const priorityFilter = app.querySelector('#priority-filter');
      let appliedFrom = '', appliedThrough = '', appliedTaskQuery = '';
      const normalizeSearch = value => value.replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, char => char.toLowerCase());
      const validDate = value => {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
        if (!m) return false;
        const y = Number(m[1]), month = Number(m[2]), day = Number(m[3]);
        if (y < 1 || month < 1 || month > 12 || day < 1) return false;
        const leap = y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0);
        return day <= [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
      };
      app.querySelector('#due-range').addEventListener('submit', event => {
        event.preventDefault();
        const from = app.querySelector('#due-from').value.trim();
        const through = app.querySelector('#due-through').value.trim();
        const alert = app.querySelector('#task-alert');
        if ((from && !validDate(from)) || (through && !validDate(through))) {
          alert.textContent = 'Due range must use valid YYYY-MM-DD dates'; alert.hidden = false; return;
        }
        if (from && through && from > through) {
          alert.textContent = 'Due from must not be after Due through'; alert.hidden = false; return;
        }
        appliedFrom = from; appliedThrough = through; alert.hidden = true; renderTasks();
      });
      let taskRenderVersion = 0;
      async function renderTasks() {
        const version = ++taskRenderVersion;
        const tasks = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`).then(r => r.json());
        if (version !== taskRenderVersion) return;
        const visible = tasks.filter(task => normalizeSearch(task.title).includes(normalizeSearch(appliedTaskQuery)) && (filter.value === 'All' || (filter.value === 'Open' ? !task.completed : task.completed)) && (priorityFilter.value === 'All' || task.priority === priorityFilter.value) && (!appliedFrom && !appliedThrough || Boolean(task.due_date) && (!appliedFrom || task.due_date >= appliedFrom) && (!appliedThrough || task.due_date <= appliedThrough)));
        list.innerHTML = visible.map(task => `<div data-testid="task-row"><input type="checkbox" data-task="${task.id}" aria-label="Complete ${escapeHtml(task.title)}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}><span>${escapeHtml(task.title)}</span><label for="priority-${task.id}">Task priority</label><select id="priority-${task.id}" data-priority="${task.id}" aria-label="Task priority" ${project.archived ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select><form data-rename-task="${task.id}"><label for="rename-task-${task.id}">New task title</label><input id="rename-task-${task.id}" type="text" aria-label="New task title" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename task</button></form><form data-due-date="${task.id}"><label for="due-date-${task.id}">Task due date</label><input id="due-date-${task.id}" type="text" aria-label="Task due date" value="${escapeHtml(task.due_date || '')}" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Save due date</button></form><form data-notes="${task.id}"><label for="notes-${task.id}">Task notes</label><textarea id="notes-${task.id}" aria-label="Task notes" ${project.archived ? 'disabled' : ''}></textarea><button type="submit" ${project.archived ? 'disabled' : ''}>Save notes</button></form><label for="destination-${task.id}">Destination project</label><select id="destination-${task.id}" aria-label="Destination project" data-destination="${task.id}" ${project.archived || !destinations.length ? 'disabled' : ''}>${destinations.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select><button type="button" data-move="${task.id}" ${project.archived || !destinations.length ? 'disabled' : ''}>Move task</button></div>`).join('');
        visible.forEach(task => { list.querySelector(`#notes-${task.id}`).value = task.notes ?? ''; });
        list.querySelectorAll('[data-move]').forEach(button => button.addEventListener('click', async () => {
          const destination = list.querySelector(`[data-destination="${button.dataset.move}"]`);
          const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${button.dataset.move}/move`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ destination_id: Number(destination.value) }) });
          if (result.ok) renderTasks();
        }));
        list.querySelectorAll('[data-priority]').forEach(select => select.addEventListener('change', async () => {
          await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${select.dataset.priority}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: select.value }) });
          renderTasks();
        }));
        list.querySelectorAll('[data-task]').forEach(box => box.addEventListener('change', async () => {
          await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${box.dataset.task}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) });
          renderTasks();
        }));
        list.querySelectorAll('[data-due-date]').forEach(form => form.addEventListener('submit', async event => {
          event.preventDefault();
          const value = form.querySelector('input').value;
          const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${form.dataset.dueDate}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ due_date: value }) });
          if (result.ok) renderTasks();
          else {
            const error = await result.json();
            const alert = app.querySelector('#task-alert');
            alert.textContent = error.error || 'Unable to save due date'; alert.hidden = false;
          }
        }));
        list.querySelectorAll('[data-notes]').forEach(form => form.addEventListener('submit', async event => {
          event.preventDefault();
          const notes = form.querySelector('textarea').value;
          const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${form.dataset.notes}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes }) });
          if (result.ok) renderTasks();
        }));
        list.querySelectorAll('[data-rename-task]').forEach(form => form.addEventListener('submit', async event => {
          event.preventDefault();
          const title = form.querySelector('input').value.trim();
          if (!title) {
            const alert = app.querySelector('#task-alert');
            alert.textContent = 'Task title is required'; alert.hidden = false; return;
          }
          const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${form.dataset.renameTask}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
          if (result.ok) renderTasks();
        }));
      }
      filter.addEventListener('change', renderTasks);
      priorityFilter.addEventListener('change', renderTasks);
      app.querySelector('#task-search-form').addEventListener('submit', event => {
        event.preventDefault();
        appliedTaskQuery = app.querySelector('#task-search').value.trim();
        renderTasks();
      });
      app.querySelector('#task-form').addEventListener('submit', async event => {
        event.preventDefault();
        const title = app.querySelector('#task-title').value.trim();
        if (!title) {
          const alert = app.querySelector('#task-alert');
          alert.textContent = 'Task title is required';
          alert.hidden = false;
          return;
        }
        const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
        if (result.ok) { app.querySelector('#task-title').value = ''; renderTasks(); }
      });
      renderTasks();
    }

    function showRoute() {
      const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
      if (match) showProject(match[1]);
      else showList();
    }
    window.addEventListener('popstate', showRoute);
    showRoute();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202632; background: #f4f6f9; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 28px; font-size: 2rem; }
    form, .project-row, .task-row { background: white; border: 1px solid #dce1e8; border-radius: 10px; padding: 20px; }
    form { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
    label { display: grid; gap: 7px; font-weight: 600; flex: 1 1 280px; }
    input { min-height: 42px; border: 1px solid #aab3c0; border-radius: 6px; padding: 8px 10px; font: inherit; }
    button { min-height: 42px; padding: 8px 16px; border: 0; border-radius: 6px; background: #315bd6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #2449b9; }
    button:focus-visible, input:focus-visible { outline: 3px solid #96b4ff; outline-offset: 2px; }
    #message { min-height: 24px; margin: 12px 0; color: #a12727; }
    #projects { display: grid; gap: 10px; margin-top: 20px; }
    #project-filter { margin: 8px 0 0; min-height: 40px; }
    #tasks { display: grid; gap: 10px; margin-top: 16px; }
    .project-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .project-actions { display: flex; align-items: center; gap: 10px; }
    .project-summary { white-space: nowrap; color: #465365; }
    .archive-button { background: #465365; }
    .task-row { display: flex; align-items: center; gap: 12px; }
    .task-row label { display: flex; align-items: center; gap: 10px; flex: 1; }
    .task-row input { min-height: 20px; width: 20px; }
    .task-rename { display: flex; align-items: center; gap: 8px; }
    .task-rename input { min-width: 140px; }
    #task-form { margin-top: 24px; }
    #task-message { min-height: 24px; color: #a12727; }
    .project-name { overflow-wrap: anywhere; }
    .back { margin-bottom: 20px; background: #465365; }
    #rename-form { margin: 0 0 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section id="list-view">
      <h1>Workboard</h1>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <input id="project-name" name="name" type="text" autocomplete="off">
        <button type="submit">Create project</button>
      </form>
      <p id="message" role="alert" aria-live="polite"></p>
      <label for="project-filter">Project filter</label>
      <select id="project-filter"><option>Active</option><option>Archived</option></select>
      <div id="projects" aria-label="Projects"></div>
    </section>
    <section id="project-view" hidden>
      <button class="back" id="back-button" type="button">Projects</button>
      <h1 id="project-title"></h1>
      <p id="archived-notice" hidden>Archived project</p>
      <form id="rename-form">
        <label for="new-project-name">New project name</label>
        <input id="new-project-name" name="name" type="text" autocomplete="off">
        <button type="submit">Rename project</button>
      </form>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <input id="task-title" name="title" type="text" autocomplete="off">
        <button type="submit">Create task</button>
      </form>
      <p id="task-message" role="alert" aria-live="polite"></p>
      <label for="task-filter">Task filter</label>
      <select id="task-filter">
        <option>All</option><option>Open</option><option>Completed</option>
      </select>
      <div id="tasks" aria-label="Tasks"></div>
    </section>
  </main>
  <script>
    const listView = document.querySelector('#list-view');
    const projectView = document.querySelector('#project-view');
    const projectList = document.querySelector('#projects');
    const message = document.querySelector('#message');
    const tasks = document.querySelector('#tasks');
    const taskFilter = document.querySelector('#task-filter');
    const projectFilter = document.querySelector('#project-filter');
    let activeProjectId = null;
    let projectTasks = [];

    function showList() {
      activeProjectId = null;
      listView.hidden = false;
      projectView.hidden = true;
      document.title = 'Workboard';
      loadProjects();
    }

    async function openProject(id) {
      const response = await fetch(`/api/projects/${id}`);
      if (!response.ok) { history.replaceState({}, '', '/'); showList(); return; }
      const project = await response.json();
      activeProjectId = String(id);
      document.querySelector('#project-title').textContent = project.name;
      const isArchived = Boolean(project.archived);
      document.querySelector('#new-project-name').value = project.name;
      document.querySelector('#rename-form').querySelectorAll('input, button').forEach(control => { control.disabled = isArchived; });
      document.querySelector('#archived-notice').hidden = !isArchived;
      document.querySelector('#task-form').querySelectorAll('input, button').forEach(control => { control.disabled = isArchived; });
      document.title = `${project.name} · Workboard`;
      listView.hidden = true;
      projectView.hidden = false;
      await loadTasks();
    }

    async function loadTasks() {
      if (!activeProjectId) return;
      const response = await fetch(`/api/projects/${activeProjectId}/tasks`);
      if (!response.ok) return;
      projectTasks = await response.json();
      renderTasks();
    }

    function renderTasks() {
      tasks.replaceChildren();
      const filter = taskFilter.value;
      for (const task of projectTasks) {
        if (filter === 'Open' && task.completed || filter === 'Completed' && !task.completed) continue;
        const row = document.createElement('div');
        row.dataset.testid = 'task-row';
        row.className = 'task-row';
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(task.completed);
        checkbox.disabled = Boolean(document.querySelector('#archived-notice').hidden === false);
        checkbox.setAttribute('aria-label', `Complete ${task.title}`);
        checkbox.addEventListener('change', async () => {
          const response = await fetch(`/api/projects/${activeProjectId}/tasks/${task.id}`, {
            method: 'PATCH', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ completed: checkbox.checked })
          });
          if (response.ok) {
            task.completed = checkbox.checked ? 1 : 0;
            renderTasks();
          }
        });
        const title = document.createElement('span');
        title.textContent = task.title;
        label.append(checkbox, title);
        row.append(label);
        const rename = document.createElement('form');
        rename.className = 'task-rename';
        const renameInput = document.createElement('input');
        renameInput.type = 'text';
        renameInput.value = task.title;
        renameInput.setAttribute('aria-label', 'New task title');
        const renameButton = document.createElement('button');
        renameButton.type = 'submit';
        renameButton.textContent = 'Rename task';
        const archived = document.querySelector('#archived-notice').hidden === false;
        renameInput.disabled = archived;
        renameButton.disabled = archived;
        rename.addEventListener('submit', async event => {
          event.preventDefault();
          const response = await fetch(`/api/projects/${activeProjectId}/tasks/${task.id}`, {
            method: 'PUT', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ title: renameInput.value })
          });
          if (!response.ok) {
            const result = await response.json();
            document.querySelector('#task-message').textContent = result.error || 'Task title is required';
            return;
          }
          const result = await response.json();
          task.title = result.title;
          document.querySelector('#task-message').textContent = '';
          renderTasks();
        });
        rename.append(renameInput, renameButton);
        row.append(rename);
        tasks.append(row);
      }
    }

    async function loadProjects() {
      const response = await fetch(`/api/projects?filter=${encodeURIComponent(projectFilter.value)}`);
      const projects = await response.json();
      projectList.replaceChildren();
      for (const project of projects) {
        const row = document.createElement('div');
        row.dataset.testid = 'project-row';
        row.className = 'project-row';
        const name = document.createElement('span');
        name.className = 'project-name';
        name.textContent = project.name;
        const actions = document.createElement('div');
        actions.className = 'project-actions';
        const summary = document.createElement('span');
        summary.dataset.testid = 'project-summary';
        summary.className = 'project-summary';
        summary.textContent = `${project.completedCount}/${project.totalCount} completed`;
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Open project';
        button.addEventListener('click', () => {
          history.pushState({}, '', `/projects/${project.id}`);
          openProject(project.id);
        });
        const stateButton = document.createElement('button');
        stateButton.type = 'button';
        stateButton.className = 'archive-button';
        const archived = Boolean(project.archived);
        stateButton.textContent = archived ? 'Restore project' : 'Archive project';
        stateButton.addEventListener('click', async () => {
          const result = await fetch(`/api/projects/${project.id}`, {
            method: 'PATCH', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ archived: !archived })
          });
          if (result.ok) await loadProjects();
        });
        actions.append(summary, button, stateButton);
        row.append(name, actions);
        projectList.append(row);
      }
    }

    document.querySelector('#create-form').addEventListener('submit', async event => {
      event.preventDefault();
      const input = document.querySelector('#project-name');
      const response = await fetch('/api/projects', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: input.value })
      });
      if (!response.ok) {
        const result = await response.json();
        message.textContent = result.error || 'Project name is required';
        return;
      }
      message.textContent = '';
      input.value = '';
      await loadProjects();
    });

    document.querySelector('#back-button').addEventListener('click', () => {
      activeProjectId = null;
      history.pushState({}, '', '/');
      showList();
    });
    document.querySelector('#task-form').addEventListener('submit', async event => {
      event.preventDefault();
      const input = document.querySelector('#task-title');
      const response = await fetch(`/api/projects/${activeProjectId}/tasks`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      if (!response.ok) {
        const result = await response.json();
        document.querySelector('#task-message').textContent = result.error || 'Task title is required';
        return;
      }
      document.querySelector('#task-message').textContent = '';
      input.value = '';
      await loadTasks();
    });
    document.querySelector('#rename-form').addEventListener('submit', async event => {
      event.preventDefault();
      const input = document.querySelector('#new-project-name');
      const response = await fetch(`/api/projects/${activeProjectId}`, {
        method: 'PUT', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: input.value })
      });
      if (!response.ok) {
        const result = await response.json();
        document.querySelector('#task-message').textContent = result.error || 'Project name is required';
        return;
      }
      const result = await response.json();
      document.querySelector('#project-title').textContent = result.name;
      document.title = `${result.name} · Workboard`;
      document.querySelector('#task-message').textContent = '';
      await loadProjects();
    });
    taskFilter.addEventListener('change', renderTasks);
    projectFilter.addEventListener('change', loadProjects);
    addEventListener('popstate', () => {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      match ? openProject(match[1]) : showList();
    });
    const initial = location.pathname.match(/^\/projects\/(\d+)$/);
    initial ? openProject(initial[1]) : showList();
  </script>
</body>
</html>

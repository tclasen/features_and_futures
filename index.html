<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1e293b; background: #f8fafc; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 40px)); margin: 56px auto; }
    h1 { margin: 0 0 28px; font-size: 2rem; }
    form { display: flex; gap: 10px; margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 7px; }
    .field { flex: 1; }
    input { box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    button { border: 0; border-radius: 6px; padding: 10px 15px; background: #2563eb; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #475569; margin-bottom: 20px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px; margin: 10px 0; background: white; border: 1px solid #e2e8f0; border-radius: 8px; }
    .error { color: #b91c1c; margin: 0 0 12px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    async function loadProjects() {
      const response = await fetch('/api/projects');
      if (!response.ok) throw new Error('Could not load projects');
      return response.json();
    }
    function projectId() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      return match ? Number(match[1]) : null;
    }
    async function render() {
      const id = projectId();
      if (id !== null) {
        const projects = await loadProjects();
        const project = projects.find(item => item.id === id);
        if (!project) {
          app.innerHTML = '<h1>Project not found</h1><button class="secondary" id="back">Projects</button>';
        } else {
          app.replaceChildren();
          const back = document.createElement('button');
          back.className = 'secondary'; back.textContent = 'Projects';
          back.addEventListener('click', () => { location.href = '/'; });
          const heading = document.createElement('h1'); heading.textContent = project.name;
          const archivedNotice = document.createElement('p');
          archivedNotice.textContent = 'Archived project';
          archivedNotice.hidden = !project.archived;
          const form = document.createElement('form');
          form.innerHTML = '<div class="field"><label for="task-title">Task title</label><input id="task-title" name="title" type="text"></div><button type="submit">Create task</button>';
          const error = document.createElement('p'); error.className = 'error'; error.setAttribute('role', 'alert'); error.hidden = true;
          const filterLabel = document.createElement('label'); filterLabel.htmlFor = 'task-filter'; filterLabel.textContent = 'Task filter';
          const filter = document.createElement('select'); filter.id = 'task-filter';
          for (const value of ['All', 'Open', 'Completed']) { const option = document.createElement('option'); option.textContent = value; option.value = value; filter.append(option); }
          const list = document.createElement('section'); list.setAttribute('aria-label', 'Tasks');
          app.append(back, heading, archivedNotice, form, error, filterLabel, filter, list);
          form.querySelector('button').disabled = project.archived;
          async function refresh() {
            const response = await fetch(`/api/projects/${id}/tasks`);
            if (!response.ok) throw new Error('Could not load tasks');
            const tasks = await response.json(); list.replaceChildren();
            for (const task of tasks.filter(task => filter.value === 'All' || (filter.value === 'Completed') === task.completed)) {
              const row = document.createElement('div'); row.className = 'row'; row.dataset.testid = 'task-row';
              const title = document.createElement('span'); title.textContent = task.title;
              const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.completed; checkbox.setAttribute('aria-label', `Complete ${task.title}`); checkbox.disabled = project.archived;
              checkbox.addEventListener('change', async () => {
                const result = await fetch(`/api/projects/${id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
                if (!result.ok) { checkbox.checked = !checkbox.checked; return; }
                await refresh();
              });
              row.append(title, checkbox); list.append(row);
            }
          }
          filter.addEventListener('change', () => refresh());
          form.addEventListener('submit', async event => {
            event.preventDefault(); const input = form.elements.title; const title = input.value.trim();
            if (!title) { error.textContent = 'Task title is required'; error.hidden = false; return; }
            const response = await fetch(`/api/projects/${id}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
            if (!response.ok) { error.textContent = 'Could not create task'; error.hidden = false; return; }
            error.hidden = true; input.value = ''; await refresh();
          });
          await refresh();
        }
        app.querySelector('#back')?.addEventListener('click', () => { location.href = '/'; });
        return;
      }
      app.innerHTML = '<h1>Workboard</h1><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select><form id="create-form"><div class="field"><label for="project-name">Project name</label><input id="project-name" name="name" type="text"></div><button type="submit">Create project</button></form><p class="error" role="alert" hidden></p><section id="project-list" aria-label="Projects"></section>';
      const form = app.querySelector('#create-form');
      const error = app.querySelector('.error');
      const list = app.querySelector('#project-list');
      let refreshVersion = 0;
      async function refresh() {
        const version = ++refreshVersion;
        const archivedFilter = app.querySelector('#project-filter').value === 'Archived';
        const projects = (await loadProjects()).filter(project => project.archived === archivedFilter);
        if (version !== refreshVersion) return;
        const rows = document.createDocumentFragment();
        for (const project of projects) {
          const row = document.createElement('div'); row.className = 'row'; row.dataset.testid = 'project-row';
          const name = document.createElement('span'); name.textContent = project.name;
          const open = document.createElement('button'); open.textContent = 'Open project';
          open.addEventListener('click', () => { location.href = `/projects/${project.id}`; });
          const summary = document.createElement('span'); summary.dataset.testid = 'project-summary'; summary.textContent = `${project.completedCount}/${project.totalCount} completed`;
          const action = document.createElement('button'); action.textContent = project.archived ? 'Restore project' : 'Archive project';
          action.addEventListener('click', async () => {
            const response = await fetch(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
            if (response.ok) await refresh();
          });
          row.append(name, summary, open, action); rows.append(row);
        }
        list.replaceChildren(rows);
      }
      app.querySelector('#project-filter').addEventListener('change', refresh);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const input = form.elements.name;
        const name = input.value.trim();
        if (!name) { error.textContent = 'Project name is required'; error.hidden = false; return; }
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
        if (!response.ok) { error.textContent = 'Could not create project'; error.hidden = false; return; }
        error.hidden = true; input.value = ''; await refresh();
      });
      await refresh();
    }
    render().catch(() => { app.textContent = 'Unable to load Workboard'; });
  </script>
</body>
</html>

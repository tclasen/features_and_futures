<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #182230; background: #f5f7fa; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 40px)); margin: 64px auto; }
    h1 { margin-bottom: 28px; }
    form { display: flex; gap: 10px; margin-bottom: 24px; }
    input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #aab4c0; border-radius: 6px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2459c4; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #19479f; }
    [role="alert"] { color: #a52222; margin: 0 0 16px; }
    .project-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px; margin: 10px 0; background: white; border: 1px solid #dce2e9; border-radius: 8px; }
    .project-row span { overflow-wrap: anywhere; }
    .task-row { display: flex; align-items: center; gap: 12px; padding: 12px; margin: 8px 0; background: white; border: 1px solid #dce2e9; border-radius: 8px; }
    .task-row label { flex: 1; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main id="app"><h1>Workboard</h1><p>Loading projects…</p></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapeText = (value) => {
      const element = document.createElement('span');
      element.textContent = value;
      return element.innerHTML;
    };

    async function renderList() {
      app.innerHTML = `<h1>Workboard</h1>
        <label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select>
        <form id="create-form"><label for="project-name">Project name</label>
          <input id="project-name" name="name" type="text" aria-label="Project name">
          <button type="submit">Create project</button>
        </form><p id="alert" role="alert" hidden></p><section id="projects" aria-label="Projects"></section>`;
      const response = await fetch('/api/projects');
      const projects = await response.json();
      const list = app.querySelector('#projects');
      const filter = app.querySelector('#project-filter');
      function drawProjects() {
      list.replaceChildren();
      for (const project of projects.filter(item => Boolean(item.archived) === (filter.value === 'Archived'))) {
        const row = document.createElement('div');
        row.dataset.testid = 'project-row';
        row.className = 'project-row';
        row.innerHTML = `<span>${escapeText(project.name)} <span data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span></span><button type="button">Open project</button><button type="button">${project.archived ? 'Restore project' : 'Archive project'}</button>`;
        row.querySelector('button').addEventListener('click', () => { location.href = `/projects/${project.id}`; });
        row.querySelectorAll('button')[1].addEventListener('click', async () => {
          await fetch(`/api/projects/${project.id}/archive`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          await renderList();
        });
        list.append(row);
      }
      }
      filter.addEventListener('change', drawProjects);
      drawProjects();
      app.querySelector('#create-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = app.querySelector('#project-name').value.trim();
        const alert = app.querySelector('#alert');
        if (!name) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          return;
        }
        const created = await fetch('/api/projects', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
        });
        if (!created.ok) {
          const result = await created.json();
          alert.textContent = result.error || 'Unable to create project';
          alert.hidden = false;
          return;
        }
        await renderList();
      });
    }

    async function renderProject(id) {
      const response = await fetch(`/api/projects/${encodeURIComponent(id)}`);
      if (!response.ok) {
        app.innerHTML = '<h1>Project not found</h1><button type="button">Projects</button>';
        app.querySelector('button').addEventListener('click', () => { location.href = '/'; });
        return;
      }
      const project = await response.json();
      app.innerHTML = `<button id="back" type="button">Projects</button><h1>${escapeText(project.name)}</h1>
        ${project.archived ? '<p>Archived project</p>' : ''}
        <form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" type="text" aria-label="New project name"><button type="submit">Rename project</button></form>
        <form id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" type="text"><button type="submit">Create task</button></form>
        <p id="alert" role="alert" hidden></p><label for="task-filter">Task filter</label>
        <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select>
        <section id="tasks" aria-label="Tasks"></section>`;
      app.querySelector('#back').addEventListener('click', () => { location.href = '/'; });
      if (project.archived) app.querySelectorAll('#task-form input, #task-form button, #rename-form input, #rename-form button').forEach(control => { control.disabled = true; });
      const alert = app.querySelector('#alert');
      const filter = app.querySelector('#task-filter');
      app.querySelector('#rename-form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = app.querySelector('#new-project-name').value.trim();
        if (!name) { alert.textContent = 'Project name is required'; alert.hidden = false; return; }
        const result = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (!result.ok) { const body = await result.json(); alert.textContent = body.error || 'Unable to rename project'; alert.hidden = false; return; }
        await renderProject(id);
      });
      async function renderTasks() {
        const tasksResponse = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`);
        const tasks = await tasksResponse.json();
        const visible = tasks.filter(task => filter.value === 'All' || (filter.value === 'Completed') === Boolean(task.completed));
        const list = app.querySelector('#tasks');
        list.replaceChildren();
        for (const task of visible) {
          const row = document.createElement('div');
          row.dataset.testid = 'task-row';
          row.className = 'task-row';
          const renameInput = document.createElement('input');
          renameInput.type = 'text';
          renameInput.setAttribute('aria-label', 'New task title');
          renameInput.disabled = Boolean(project.archived);
          const renameButton = document.createElement('button');
          renameButton.type = 'button';
          renameButton.textContent = 'Rename task';
          renameButton.disabled = Boolean(project.archived);
          renameButton.addEventListener('click', async () => {
            const title = renameInput.value.trim();
            if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
            const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${task.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
            if (!result.ok) { const body = await result.json(); alert.textContent = body.error || 'Unable to rename task'; alert.hidden = false; return; }
            alert.hidden = true;
            await renderTasks();
          });
          const priority = document.createElement('select');
          priority.setAttribute('aria-label', 'Task priority');
          priority.disabled = Boolean(project.archived);
          for (const value of ['Low', 'Normal', 'High']) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            priority.append(option);
          }
          priority.value = task.priority;
          priority.addEventListener('change', async () => {
            const result = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${task.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: priority.value }) });
            if (!result.ok) { const body = await result.json(); alert.textContent = body.error || 'Unable to update priority'; alert.hidden = false; }
          });
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = Boolean(task.completed);
          checkbox.disabled = Boolean(project.archived);
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          const label = document.createElement('label');
          label.textContent = task.title;
          row.append(checkbox, label, renameInput, renameButton, priority);
          checkbox.addEventListener('change', async () => {
            await fetch(`/api/projects/${id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
            await renderTasks();
          });
          list.append(row);
        }
      }
      filter.addEventListener('change', renderTasks);
      app.querySelector('#task-form').addEventListener('submit', async event => {
        event.preventDefault();
        const title = app.querySelector('#task-title').value.trim();
        if (!title) { alert.textContent = 'Task title is required'; alert.hidden = false; return; }
        const created = await fetch(`/api/projects/${id}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
        if (!created.ok) { const result = await created.json(); alert.textContent = result.error || 'Unable to create task'; alert.hidden = false; return; }
        alert.hidden = true;
        app.querySelector('#task-title').value = '';
        await renderTasks();
      });
      await renderTasks();
    }

    const match = location.pathname.match(/^\/projects\/(\d+)$/);
    if (match) await renderProject(match[1]);
    else await renderList();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17202b; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(760px, calc(100% - 32px)); margin: 56px auto; }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    form, .project-row, .detail-header { display: flex; align-items: center; gap: 12px; }
    form { margin-bottom: 20px; }
    label { font-weight: 600; }
    input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #aeb8c4; border-radius: 5px; font: inherit; background: white; }
    button { padding: 10px 14px; border: 0; border-radius: 5px; color: white; background: #2459a6; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #194681; }
    .project-row { justify-content: space-between; padding: 14px 16px; margin: 8px 0; background: white; border: 1px solid #dce2e9; border-radius: 6px; }
    .project-name { overflow-wrap: anywhere; }
    [role="alert"] { color: #a32222; margin: 12px 0; }
    .detail-header { margin-bottom: 18px; }
    .task-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 14px 16px; margin: 8px 0; max-width: 100%; background: white; border: 1px solid #dce2e9; border-radius: 6px; }
    .task-row input { flex: initial; }
    .task-row input[type="text"] { width: 150px; }
    .task-row .task-title { flex: 1 1 100%; overflow-wrap: anywhere; }
    .task-row button { white-space: nowrap; }
    .task-row select { max-width: 100%; padding: 9px; border: 1px solid #aeb8c4; border-radius: 5px; font: inherit; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.querySelector('#app');
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const normalizeSearch = value => String(value).replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, char => char.toLowerCase());
    const matchesSearch = (value, query) => !query || normalizeSearch(value).includes(normalizeSearch(query.trim()));
    async function projects(filter) {
      const response = await fetch(`/api/projects?filter=${filter}`);
      if (!response.ok) throw new Error('Unable to load projects');
      return response.json();
    }
    async function renderList() {
      app.innerHTML = `<h1>Workboard</h1>
        <label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select>
        <form id="project-search-form"><label for="project-search">Project search</label><input id="project-search" type="text" aria-label="Project search"><button type="submit">Search projects</button></form>
        <form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" aria-label="Project name"><button type="submit">Create project</button></form>
        <div id="message" role="alert" hidden></div><section id="project-list" aria-label="Projects"></section>`;
      const list = app.querySelector('#project-list');
      let appliedQuery = '';
      const renderRows = async () => {
        const filter = app.querySelector('#project-filter').value;
        list.innerHTML = (await projects(filter)).filter(project => matchesSearch(project.name, appliedQuery)).map(project => `<div class="project-row" data-testid="project-row"><span class="project-name">${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span><button type="button" data-open="${project.id}">Open project</button><button type="button" data-archive="${project.id}">${filter === 'Active' ? 'Archive project' : 'Restore project'}</button></div>`).join('');
        list.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => {
          window.location.href = `/projects/${encodeURIComponent(button.dataset.open)}`;
        }));
        list.querySelectorAll('[data-archive]').forEach(button => button.addEventListener('click', async () => {
          await fetch(`/api/projects/${button.dataset.archive}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived: filter === 'Active' }) });
          await renderRows();
        }));
      };
      await renderRows();
      app.querySelector('#project-filter').addEventListener('change', renderRows);
      app.querySelector('#project-search-form').addEventListener('submit', event => {
        event.preventDefault();
        appliedQuery = app.querySelector('#project-search').value.trim();
        renderRows();
      });
      app.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = app.querySelector('#project-name');
        const message = app.querySelector('#message');
        const name = input.value.trim();
        if (!name) { message.textContent = 'Project name is required'; message.hidden = false; return; }
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (!response.ok) { message.textContent = 'Project name is required'; message.hidden = false; return; }
        message.hidden = true;
        input.value = '';
        await renderRows();
      });
    }
    async function renderDetail(id) {
      const project = await fetch(`/api/projects/${encodeURIComponent(id)}`).then(async response => response.ok ? response.json() : null);
      if (!project) { app.innerHTML = '<h1>Project not found</h1><button id="back">Projects</button>'; }
      else app.innerHTML = `<div class="detail-header"><button id="back" type="button">Projects</button></div><h1>${escapeHtml(project.name)}</h1>
        ${project.archived ? '<p>Archived project</p>' : ''}
        <form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" type="text" aria-label="New project name" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form><div id="rename-message" role="alert" hidden></div>
        <form id="task-form"><label for="task-title">Task title</label><input id="task-title" type="text" aria-label="Task title"><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form>
        <div id="task-message" role="alert" hidden></div>
        <label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select>
        <label for="priority-filter">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
        <form id="task-search-form"><label for="task-search">Task search</label><input id="task-search" type="text" aria-label="Task search"><button type="submit">Search tasks</button></form>
        <label for="default-task-priority">Default task priority</label><select id="default-task-priority" ${project.archived ? 'disabled' : ''}><option${project.defaultPriority === 'Low' ? ' selected' : ''}>Low</option><option${project.defaultPriority === 'Normal' ? ' selected' : ''}>Normal</option><option${project.defaultPriority === 'High' ? ' selected' : ''}>High</option></select>
        <form id="due-range-form"><label for="due-from">Due from</label><input id="due-from" type="text" aria-label="Due from"><label for="due-through">Due through</label><input id="due-through" type="text" aria-label="Due through"><button type="submit">Apply due range</button></form>
        <section id="task-list" aria-label="Tasks"></section>`;
      app.querySelector('#back').addEventListener('click', () => { window.location.href = '/'; });
      if (project) {
        const list = app.querySelector('#task-list');
        const renameForm = app.querySelector('#rename-form');
        if (renameForm) renameForm.addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#new-project-name');
          const name = input.value.trim();
          const message = app.querySelector('#rename-message');
          if (!name) { message.textContent = 'Project name is required'; message.hidden = false; return; }
          const response = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
          if (!response.ok) { message.textContent = 'Project name is required'; message.hidden = false; return; }
          message.hidden = true;
          project.name = name;
          app.querySelector('h1').textContent = name;
          input.value = '';
        });
        const defaultPriority = app.querySelector('#default-task-priority');
        defaultPriority.addEventListener('change', async () => {
          await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ defaultPriority: defaultPriority.value }) });
        });
        let appliedDueFrom = '', appliedDueThrough = '', appliedTaskQuery = '';
        const validDate = value => {
          const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
          if (!match) return false;
          const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
          if (year < 1 || month < 1 || month > 12) return false;
          const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
          return day >= 1 && day <= [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
        };
        app.querySelector('#due-range-form').addEventListener('submit', event => {
          event.preventDefault();
          const from = app.querySelector('#due-from').value.trim(), through = app.querySelector('#due-through').value.trim();
          const message = app.querySelector('#task-message');
          if ((from && !validDate(from)) || (through && !validDate(through))) { message.textContent = 'Due range must use valid YYYY-MM-DD dates'; message.hidden = false; return; }
          if (from && through && from > through) { message.textContent = 'Due from must not be after Due through'; message.hidden = false; return; }
          appliedDueFrom = from; appliedDueThrough = through; message.hidden = true; refresh();
        });
        const refresh = async () => {
          const tasks = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`).then(response => response.json());
          const destinations = project.archived ? [] : await projects('Active');
          const eligible = destinations.filter(item => Number(item.id) !== Number(id));
          const filter = app.querySelector('#task-filter').value;
          const priorityFilter = app.querySelector('#priority-filter').value;
          list.innerHTML = tasks.filter(task => matchesSearch(task.title, appliedTaskQuery) && (filter === 'All' || (filter === 'Completed') === Boolean(task.completed)) && (priorityFilter === 'All' || task.priority === priorityFilter) && (!appliedDueFrom && !appliedDueThrough || task.dueDate && (!appliedDueFrom || task.dueDate >= appliedDueFrom) && (!appliedDueThrough || task.dueDate <= appliedDueThrough))).map(task => `<div class="task-row" data-testid="task-row"><span class="task-title">${escapeHtml(task.title)}</span><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" data-task="${task.id}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}><input type="text" aria-label="New task title" data-rename-input="${task.id}" ${project.archived ? 'disabled' : ''}><button type="button" data-rename="${task.id}" ${project.archived ? 'disabled' : ''}>Rename task</button><select aria-label="Task priority" data-priority="${task.id}" ${project.archived ? 'disabled' : ''}><option${task.priority === 'Low' ? ' selected' : ''}>Low</option><option${task.priority === 'Normal' ? ' selected' : ''}>Normal</option><option${task.priority === 'High' ? ' selected' : ''}>High</option></select><input type="text" aria-label="Task due date" data-due-date="${task.id}" value="${escapeHtml(task.dueDate || '')}" ${project.archived ? 'disabled' : ''}><button type="button" data-save-due="${task.id}" ${project.archived ? 'disabled' : ''}>Save due date</button><select aria-label="Destination project" data-destination="${task.id}" ${project.archived || !eligible.length ? 'disabled' : ''}>${eligible.map(item => `<option value="${item.id}">${escapeHtml(item.name)}</option>`).join('')}</select><button type="button" data-move="${task.id}" ${project.archived || !eligible.length ? 'disabled' : ''}>Move task</button></div>`).join('');
          list.querySelectorAll('[data-rename]').forEach(button => button.addEventListener('click', async () => {
            const input = list.querySelector(`[data-rename-input="${button.dataset.rename}"]`);
            const message = app.querySelector('#task-message');
            const title = input.value.trim();
            if (!title) { message.textContent = 'Task title is required'; message.hidden = false; return; }
            const response = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${button.dataset.rename}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
            if (!response.ok) { message.textContent = 'Task title is required'; message.hidden = false; return; }
            message.hidden = true;
            await refresh();
          }));
          list.querySelectorAll('[data-save-due]').forEach(button => button.addEventListener('click', async () => {
            const message = app.querySelector('#task-message');
            const value = list.querySelector(`[data-due-date="${button.dataset.saveDue}"]`).value;
            const response = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${button.dataset.saveDue}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dueDate: value }) });
            if (!response.ok) { message.textContent = 'Due date must be a valid YYYY-MM-DD date'; message.hidden = false; return; }
            message.hidden = true;
            await refresh();
          }));
          list.querySelectorAll('[data-move]').forEach(button => button.addEventListener('click', async () => {
            const taskId = button.dataset.move;
            const destinationProjectId = list.querySelector(`[data-destination="${taskId}"]`).value;
            if (!destinationProjectId) return;
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${taskId}/move`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ destinationProjectId }) });
            await refresh();
          }));
          list.querySelectorAll('[data-priority]').forEach(select => select.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${select.dataset.priority}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: select.value }) });
            await refresh();
          }));
          list.querySelectorAll('[data-task]').forEach(box => box.addEventListener('change', async () => {
            await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${box.dataset.task}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) });
            await refresh();
          }));
        };
        app.querySelector('#task-search-form').addEventListener('submit', event => {
          event.preventDefault();
          appliedTaskQuery = app.querySelector('#task-search').value.trim();
          refresh();
        });
        app.querySelector('#task-filter').addEventListener('change', refresh);
        app.querySelector('#priority-filter').addEventListener('change', refresh);
        app.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#task-title'), message = app.querySelector('#task-message'), title = input.value.trim();
          if (!title) { message.textContent = 'Task title is required'; message.hidden = false; return; }
          const response = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
          if (!response.ok) { message.textContent = 'Task title is required'; message.hidden = false; return; }
          message.hidden = true; input.value = ''; await refresh();
        });
        await refresh();
      }
    }
    const match = window.location.pathname.match(/^\/projects\/(\d+)\/?$/);
    if (match) renderDetail(match[1]).catch(() => { app.innerHTML = '<h1>Unable to load project</h1>'; });
    else renderList().catch(() => { app.innerHTML = '<h1>Unable to load projects</h1>'; });
  </script>
</body>
</html>

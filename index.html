<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #202635; background: #f5f7fb; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 32px)); margin: 56px auto; }
    h1 { margin: 0 0 28px; font-size: 2rem; }
    form, .project-row { display: flex; align-items: center; gap: 12px; }
    form { margin-bottom: 24px; }
    input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #aab3c2; border-radius: 6px; font: inherit; }
    button { padding: 10px 15px; border: 0; border-radius: 6px; background: #3157c8; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #2445a6; }
    .project-row { justify-content: space-between; padding: 14px 16px; margin: 10px 0; background: white; border: 1px solid #dce1e9; border-radius: 8px; }
    .project-name { overflow-wrap: anywhere; }
    [role="alert"] { color: #b42318; margin: -12px 0 20px; }
    .task-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 10px 0; background: white; border: 1px solid #dce1e9; border-radius: 8px; }
    .task-row input { flex: none; }
    .task-row select { font: inherit; padding: 8px; }
    .task-due-date { width: 10.5rem; }
    .task-title { min-width: 5rem; flex: 1; overflow-wrap: anywhere; }
    .task-rename-form { flex: 1; margin: 0; }
    label { display: flex; align-items: center; gap: 8px; }
    .project-controls { margin: 0 0 20px; }
    .due-range { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; margin: 12px 0 20px; }
    .due-range label { align-items: flex-start; flex-direction: column; gap: 4px; }
    .project-actions { display: flex; align-items: center; gap: 8px; }
    .project-summary { color: #596579; white-space: nowrap; }
    button.secondary { background: #596579; }
    button:disabled { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const element = (tag, text, attributes = {}) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
      return node;
    };

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) {
        const projects = await fetch('/api/projects').then(response => response.json());
        const project = projects.find(item => String(item.id) === match[1]);
        app.replaceChildren();
        const back = element('button', 'Projects');
        back.addEventListener('click', () => { location.href = '/'; });
        app.append(back);
        if (project) {
          app.append(element('h1', project.name));
          if (project.archived) app.append(element('p', 'Archived project'));
          const renameForm = element('form');
          const renameInput = element('input', undefined, {
            type: 'text', 'aria-label': 'New project name', autocomplete: 'off'
          });
          const renameButton = element('button', 'Rename project', { type: 'submit' });
          renameInput.disabled = project.archived;
          renameButton.disabled = project.archived;
          renameForm.append(renameInput, renameButton);
          const form = element('form');
          const input = element('input', undefined, { type: 'text', 'aria-label': 'Task title', autocomplete: 'off' });
          const submit = element('button', 'Create task', { type: 'submit' });
          submit.disabled = project.archived;
          form.append(input, submit);
          const defaultPriorityLabel = element('label', 'Default task priority');
          const defaultPriority = element('select', undefined, { 'aria-label': 'Default task priority' });
          for (const value of ['Low', 'Normal', 'High']) defaultPriority.append(element('option', value, { value }));
          defaultPriority.value = project.defaultPriority || 'Normal';
          defaultPriority.disabled = project.archived;
          defaultPriorityLabel.append(defaultPriority);
          defaultPriority.addEventListener('change', async () => {
            const response = await fetch(`/api/projects/${project.id}/default-priority`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ priority: defaultPriority.value })
            });
            if (!response.ok) defaultPriority.value = project.defaultPriority || 'Normal';
            else project.defaultPriority = defaultPriority.value;
          });
          const alert = element('p', undefined, { role: 'alert', hidden: '' });
          renameForm.addEventListener('submit', async event => {
            event.preventDefault();
            const name = renameInput.value.trim();
            if (!name) {
              alert.textContent = 'Project name is required';
              alert.hidden = false;
              renameInput.focus();
              return;
            }
            const response = await fetch(`/api/projects/${project.id}`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name })
            });
            if (response.ok) {
              app.querySelector('h1').textContent = name;
              renameInput.value = '';
              alert.hidden = true;
            }
          });
          const filterLabel = element('label', 'Task filter');
          const filter = element('select', undefined, { 'aria-label': 'Task filter' });
          for (const value of ['All', 'Open', 'Completed']) filter.append(element('option', value, { value }));
          filterLabel.append(filter);
          const priorityFilterLabel = element('label', 'Priority filter');
          const priorityFilter = element('select', undefined, { 'aria-label': 'Priority filter' });
          for (const value of ['All', 'Low', 'Normal', 'High']) priorityFilter.append(element('option', value, { value }));
          priorityFilterLabel.append(priorityFilter);
          const dueRange = element('form', undefined, { class: 'due-range' });
          const dueFromLabel = element('label', 'Due from');
          const dueFrom = element('input', undefined, { type: 'text', 'aria-label': 'Due from', placeholder: 'YYYY-MM-DD', autocomplete: 'off' });
          dueFromLabel.append(dueFrom);
          const dueThroughLabel = element('label', 'Due through');
          const dueThrough = element('input', undefined, { type: 'text', 'aria-label': 'Due through', placeholder: 'YYYY-MM-DD', autocomplete: 'off' });
          dueThroughLabel.append(dueThrough);
          const applyDueRange = element('button', 'Apply due range', { type: 'submit' });
          dueRange.append(dueFromLabel, dueThroughLabel, applyDueRange);
          let appliedDueRange = { from: '', through: '' };
          const list = element('section', undefined, { 'aria-label': 'Tasks' });
          form.addEventListener('submit', async event => {
            event.preventDefault();
            const title = input.value.trim();
            if (!title) {
              alert.textContent = 'Task title is required';
              alert.hidden = false;
              input.focus();
              return;
            }
            const response = await fetch(`/api/projects/${project.id}/tasks`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title })
            });
            if (response.ok) {
              input.value = '';
              alert.hidden = true;
              await loadTasks(project.id, list, filter.value, priorityFilter.value, appliedDueRange, project.archived);
            }
          });
          filter.addEventListener('change', () => loadTasks(project.id, list, filter.value, priorityFilter.value, appliedDueRange, project.archived));
          priorityFilter.addEventListener('change', () => loadTasks(project.id, list, filter.value, priorityFilter.value, appliedDueRange, project.archived));
          dueRange.addEventListener('submit', async event => {
            event.preventDefault();
            const from = dueFrom.value.trim();
            const through = dueThrough.value.trim();
            const alertMessage = app.querySelector('[role="alert"]');
            if ((from && !isValidDate(from)) || (through && !isValidDate(through))) {
              alertMessage.textContent = 'Due range must use valid YYYY-MM-DD dates';
              alertMessage.hidden = false;
              return;
            }
            if (from && through && from > through) {
              alertMessage.textContent = 'Due from must not be after Due through';
              alertMessage.hidden = false;
              return;
            }
            appliedDueRange = { from, through };
            alertMessage.hidden = true;
            await loadTasks(project.id, list, filter.value, priorityFilter.value, appliedDueRange, project.archived);
          });
          app.append(renameForm, form, defaultPriorityLabel, alert, filterLabel, priorityFilterLabel, dueRange, list);
          await loadTasks(project.id, list, filter.value, priorityFilter.value, appliedDueRange, project.archived);
        } else app.append(element('h1', 'Project not found'));
        return;
      }

      app.replaceChildren(element('h1', 'Workboard'));
      const form = element('form');
      const input = element('input', undefined, { type: 'text', 'aria-label': 'Project name', autocomplete: 'off' });
      const submit = element('button', 'Create project', { type: 'submit' });
      form.append(input, submit);
      const alert = element('p', undefined, { role: 'alert', hidden: '' });
      const filterLabel = element('label', 'Project filter');
      const filterSelect = element('select', undefined, { 'aria-label': 'Project filter' });
      for (const value of ['Active', 'Archived']) filterSelect.append(element('option', value, { value }));
      filterLabel.append(filterSelect);
      const list = element('section', undefined, { 'aria-label': 'Projects' });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          input.focus();
          return;
        }
        const response = await fetch('/api/projects', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
        });
        if (response.ok) {
          input.value = '';
          alert.hidden = true;
          await loadProjects(list, filterSelect.value, filterSelect);
        }
      });
      filterSelect.addEventListener('change', () => loadProjects(list, filterSelect.value, filterSelect));
      app.append(form, alert, filterLabel, list);
      await loadProjects(list, filterSelect.value, filterSelect);
    }

    async function loadProjects(list, filter, filterSelect) {
      // Filter changes and archive actions can overlap. Ignore stale responses
      // so an older result cannot remove the row the user is interacting with.
      const requestId = String(Number(list.dataset.requestId || 0) + 1);
      list.dataset.requestId = requestId;
      const projects = await fetch('/api/projects').then(response => response.json());
      if (list.dataset.requestId !== requestId || !list.isConnected) return;
      const rows = new Map([...list.querySelectorAll('[data-project-id]')]
        .map(row => [row.dataset.projectId, row]));
      // Keep project rows mounted across filter changes and archive/restore
      // refreshes. This gives controls a stable DOM identity while requests
      // finish and lets the browser keep an in-progress interaction intact.
      for (const project of projects) {
        let row = rows.get(String(project.id));
        if (!row) {
          row = element('div', undefined, {
            'data-testid': 'project-row', 'data-project-id': project.id, class: 'project-row'
          });
          const name = element('span', undefined, { class: 'project-name' });
          const actions = element('span', undefined, { class: 'project-actions' });
          const summary = element('span', undefined, {
            'data-testid': 'project-summary', class: 'project-summary'
          });
          const open = element('button', 'Open project');
          open.addEventListener('click', () => { location.href = `/projects/${project.id}`; });
          const action = element('button', undefined, { class: 'secondary' });
          action.addEventListener('click', async () => {
            const archived = action.dataset.archived === 'true';
            // Keep the row stable while the archive request is in flight. A
            // second click here could otherwise race the list refresh and
            // make the row repeatedly disappear and return.
            action.disabled = true;
            try {
              const response = await fetch(`/api/projects/${project.id}/archive`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ archived: !archived })
              });
              if (response.ok) await loadProjects(list, filterSelect.value, filterSelect);
            } finally {
              action.disabled = false;
            }
          });
          actions.append(summary, open, action);
          row.append(name, actions);
          list.append(row);
        }
        rows.delete(String(project.id));
        row.hidden = project.archived !== (filter === 'Archived');
        row.querySelector('.project-name').textContent = project.name;
        row.querySelector('[data-testid="project-summary"]').textContent =
          `${project.completedCount}/${project.totalCount} completed`;
        const action = row.querySelector('.project-actions button.secondary');
        action.textContent = project.archived ? 'Restore project' : 'Archive project';
        action.dataset.archived = String(project.archived);
      }
      for (const obsolete of rows.values()) obsolete.remove();
    }
    function isValidDate(value) {
      const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return false;
      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);
      const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
      const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      return year >= 1 && month >= 1 && month <= 12 && day >= 1 && day <= days[month - 1];
    }
    async function loadTasks(projectId, list, filter, priorityFilter, dueRange, archived = false) {
      const tasks = await fetch(`/api/projects/${projectId}/tasks`).then(response => response.json());
      const visibleTasks = tasks.filter(task =>
        (filter === 'All' || (filter === 'Open' ? !task.completed : task.completed)) &&
        (priorityFilter === 'All' || task.priority === priorityFilter) &&
        ((!dueRange.from && !dueRange.through) || (task.dueDate &&
          (!dueRange.from || task.dueDate >= dueRange.from) &&
          (!dueRange.through || task.dueDate <= dueRange.through)))
      );
      list.replaceChildren(...visibleTasks.map(task => {
        const row = element('div', undefined, { 'data-testid': 'task-row', class: 'task-row' });
        const checkbox = element('input', undefined, { type: 'checkbox', 'aria-label': `Complete ${task.title}` });
        checkbox.checked = task.completed;
        checkbox.disabled = archived;
        checkbox.addEventListener('change', async () => {
          await fetch(`/api/tasks/${task.id}`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked })
          });
          await loadTasks(projectId, list, filter, priorityFilter, dueRange, archived);
        });
        const title = element('span', task.title, { class: 'task-title' });
        const priority = element('select', undefined, { 'aria-label': 'Task priority' });
        for (const value of ['Low', 'Normal', 'High']) priority.append(element('option', value, { value }));
        priority.value = task.priority || 'Normal';
        priority.disabled = archived;
        priority.addEventListener('change', async () => {
          const response = await fetch(`/api/tasks/${task.id}`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ priority: priority.value })
          });
          if (!response.ok) priority.value = task.priority || 'Normal';
          else {
            task.priority = priority.value;
            await loadTasks(projectId, list, filter, priorityFilter, dueRange, archived);
          }
        });
        const renameForm = element('form', undefined, { class: 'task-rename-form' });
        const renameInput = element('input', undefined, {
          type: 'text', 'aria-label': 'New task title', autocomplete: 'off'
        });
        const renameButton = element('button', 'Rename task', { type: 'submit' });
        renameInput.disabled = archived;
        renameButton.disabled = archived;
        renameForm.append(renameInput, renameButton);
        renameForm.addEventListener('submit', async event => {
          event.preventDefault();
          const newTitle = renameInput.value.trim();
          const alert = app.querySelector('[role="alert"]');
          if (!newTitle) {
            alert.textContent = 'Task title is required';
            alert.hidden = false;
            renameInput.focus();
            return;
          }
          const response = await fetch(`/api/tasks/${task.id}`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle })
          });
          if (response.ok) {
            alert.hidden = true;
            await loadTasks(projectId, list, filter, priorityFilter, dueRange, archived);
          }
        });
        const dueDateInput = element('input', undefined, {
          type: 'text', 'aria-label': 'Task due date', autocomplete: 'off',
          placeholder: 'YYYY-MM-DD', class: 'task-due-date'
        });
        dueDateInput.value = task.dueDate || '';
        dueDateInput.disabled = archived;
        const saveDueDate = element('button', 'Save due date', { type: 'button' });
        saveDueDate.disabled = archived;
        saveDueDate.addEventListener('click', async () => {
          const response = await fetch(`/api/tasks/${task.id}`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dueDate: dueDateInput.value })
          });
          const alert = app.querySelector('[role="alert"]');
          if (!response.ok) {
            const result = await response.json();
            alert.textContent = result.error || 'Unable to save due date';
            alert.hidden = false;
            return;
          }
          const result = await response.json();
          dueDateInput.value = result.dueDate || '';
          alert.hidden = true;
          await loadTasks(projectId, list, filter, priorityFilter, dueRange, archived);
        });
        row.append(checkbox, title, priority, renameForm, dueDateInput, saveDueDate);
        return row;
      }));
    }
    render();
  </script>
</body>
</html>

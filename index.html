<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202b3c; background: #f5f7fa; }
    body { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    h1 { margin-top: 0; }
    form, .project-row, .task-row { display: flex; gap: 12px; align-items: center; }
    form { margin: 24px 0; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input { box-sizing: border-box; min-width: 0; width: 100%; padding: 10px 12px; border: 1px solid #aeb9c8; border-radius: 5px; font: inherit; }
    form > div { flex: 1; }
    button { padding: 10px 14px; border: 0; border-radius: 5px; background: #2459a6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #84b6ff; outline-offset: 2px; }
    .project-row { justify-content: space-between; margin: 10px 0; padding: 14px 16px; background: white; border: 1px solid #dce2ea; border-radius: 6px; }
    .task-row { margin: 10px 0; padding: 14px 16px; background: white; border: 1px solid #dce2ea; border-radius: 6px; }
    .task-row input { width: auto; }
    .filter { margin: 24px 0; }
    .alert { color: #a32323; margin: 12px 0; }
    .back { margin-bottom: 24px; }
    @media (max-width: 500px) { body { padding: 28px 16px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const requestProjects = async (options) => {
      const response = await fetch('/api/projects', options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTasks = async (projectId, options) => {
      const response = await fetch(`/api/projects/${projectId}/tasks`, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTaskUpdate = async (projectId, taskId, completed) => {
      const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestProjectArchive = async (projectId, archived) => {
      const response = await fetch(`/api/projects/${projectId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };

    function renderList(projects, selectedFilter = 'Active') {
      app.replaceChildren();
      const heading = document.createElement('h1');
      heading.textContent = 'Workboard';
      app.append(heading);
      const form = document.createElement('form');
      const field = document.createElement('div');
      const label = document.createElement('label');
      label.htmlFor = 'project-name';
      label.textContent = 'Project name';
      const input = document.createElement('input');
      input.id = 'project-name';
      input.name = 'name';
      input.type = 'text';
      field.append(label, input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create project';
      form.append(field, submit);
      const alert = document.createElement('p');
      alert.className = 'alert';
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await requestProjects({ method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: input.value }) });
          renderList(await requestProjects());
        } catch (error) {
          alert.textContent = error.message;
          alert.hidden = false;
        }
      });
      app.append(form, alert);
      const filterField = document.createElement('div');
      filterField.className = 'filter';
      const filterLabel = document.createElement('label');
      filterLabel.htmlFor = 'project-filter';
      filterLabel.textContent = 'Project filter';
      const filter = document.createElement('select');
      filter.id = 'project-filter';
      for (const value of ['Active', 'Archived']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        option.selected = value === selectedFilter;
        filter.append(option);
      }
      filterField.append(filterLabel, filter);
      app.append(filterField);
      const visibleProjects = projects.filter((project) => project.archived === (filter.value === 'Archived'));
      filter.addEventListener('change', () => renderList(projects, filter.value));
      for (const project of visibleProjects) {
        const row = document.createElement('section');
        row.dataset.testid = 'project-row';
        row.className = 'project-row';
        const name = document.createElement('span');
        name.textContent = project.name;
        const open = document.createElement('button');
        open.type = 'button';
        open.textContent = 'Open project';
        open.addEventListener('click', () => {
          history.pushState({}, '', `/projects/${project.id}`);
          render();
        });
        const summary = document.createElement('span');
        summary.dataset.testid = 'project-summary';
        summary.textContent = `${project.completed_count}/${project.total_count} completed`;
        const archive = document.createElement('button');
        archive.type = 'button';
        archive.textContent = project.archived ? 'Restore project' : 'Archive project';
        archive.addEventListener('click', async () => {
          try {
            await requestProjectArchive(project.id, !project.archived);
            renderList(await requestProjects(), filter.value);
          } catch (error) {
            alert.textContent = error.message;
            alert.hidden = false;
          }
        });
        row.append(name, summary, open, archive);
        app.append(row);
      }
    }

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (!match) return renderList(await requestProjects());
      const projects = await requestProjects();
      const project = projects.find((item) => String(item.id) === match[1]);
      app.replaceChildren();
      const back = document.createElement('button');
      back.type = 'button';
      back.className = 'back';
      back.textContent = 'Projects';
      back.addEventListener('click', () => {
        history.pushState({}, '', '/');
        render();
      });
      app.append(back);
      const heading = document.createElement('h1');
      heading.textContent = project ? project.name : 'Project not found';
      app.append(heading);
      if (!project) return;
      if (project.archived) {
        const archivedNotice = document.createElement('p');
        archivedNotice.textContent = 'Archived project';
        app.append(archivedNotice);
      }

      const alert = document.createElement('p');
      alert.className = 'alert';
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      app.append(alert);
      const form = document.createElement('form');
      const field = document.createElement('div');
      const label = document.createElement('label');
      label.htmlFor = 'task-title';
      label.textContent = 'Task title';
      const input = document.createElement('input');
      input.id = 'task-title';
      input.name = 'title';
      input.type = 'text';
      field.append(label, input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create task';
      submit.disabled = project.archived;
      form.append(field, submit);
      app.append(form);

      const filterField = document.createElement('div');
      filterField.className = 'filter';
      const filterLabel = document.createElement('label');
      filterLabel.htmlFor = 'task-filter';
      filterLabel.textContent = 'Task filter';
      const filter = document.createElement('select');
      filter.id = 'task-filter';
      for (const value of ['All', 'Open', 'Completed']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        filter.append(option);
      }
      filterField.append(filterLabel, filter);
      app.append(filterField);
      const list = document.createElement('div');
      app.append(list);
      let tasks = await requestTasks(project.id);
      const renderTasks = () => {
        list.replaceChildren();
        const visible = tasks.filter((task) => filter.value === 'All' || (filter.value === 'Completed') === task.completed);
        for (const task of visible) {
          const row = document.createElement('section');
          row.dataset.testid = 'task-row';
          row.className = 'task-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.disabled = project.archived;
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            try {
              await requestTaskUpdate(project.id, task.id, checkbox.checked);
              tasks = tasks.map((item) => item.id === task.id ? { ...item, completed: checkbox.checked } : item);
              renderTasks();
            } catch (error) {
              checkbox.checked = task.completed;
              alert.textContent = error.message;
              alert.hidden = false;
            }
          });
          const title = document.createElement('span');
          title.textContent = task.title;
          row.append(checkbox, title);
          list.append(row);
        }
      };
      filter.addEventListener('change', renderTasks);
      renderTasks();
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await requestTasks(project.id, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: input.value }) });
          tasks = await requestTasks(project.id);
          input.value = '';
          alert.hidden = true;
          renderTasks();
        } catch (error) {
          alert.textContent = error.message;
          alert.hidden = false;
        }
      });
    }

    addEventListener('popstate', () => render());
    render().catch((error) => { app.textContent = error.message; });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workboard</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202938;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:64px auto;padding:0 24px}h1{font-size:2rem;margin:0 0 28px}.create{display:flex;gap:12px;max-width:600px;margin-bottom:24px}input{font:inherit;padding:11px 12px;border:1px solid #aab4c2;border-radius:6px;flex:1;min-width:0}button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:6px;background:#2459c4;color:#fff;cursor:pointer}button:hover{background:#19469f}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;background:white;border:1px solid #dce2ea;border-radius:8px;margin:10px 0}.name{font-weight:600}.alert{color:#a32121;margin:12px 0}.back{margin-bottom:24px}.empty{color:#586579}
</style>
</head>
<body><main id="app"></main>
<script>
const app=document.querySelector('#app');
const button=(label,cls='')=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;return b};
async function render(){
 const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);
 if(match){
  app.replaceChildren();const back=button('Projects','back');back.addEventListener('click',()=>location.href='/');app.append(back);
  const response=await fetch('/api/projects/'+match[1]);
  if(!response.ok){const h=document.createElement('h1');h.textContent='Project not found';app.append(h);return}
  const project=await response.json();const heading=document.createElement('h1');heading.textContent=project.name;app.append(heading);return;
 }
 app.replaceChildren();const heading=document.createElement('h1');heading.textContent='Workboard';app.append(heading);
 const form=document.createElement('form');form.className='create';const input=document.createElement('input');input.type='text';input.setAttribute('aria-label','Project name');input.autocomplete='off';const submit=button('Create project');submit.type='submit';form.append(input,submit);app.append(form);
 const alert=document.createElement('div');alert.className='alert';alert.setAttribute('role','alert');alert.hidden=true;app.append(alert);
 const list=document.createElement('section');list.setAttribute('aria-label','Projects');app.append(list);
 async function load(){const projects=await (await fetch('/api/projects')).json();list.replaceChildren();if(!projects.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='No projects yet.';list.append(empty)}for(const p of projects){const row=document.createElement('div');row.className='row';row.dataset.testid='project-row';const name=document.createElement('span');name.className='name';name.textContent=p.name;const open=button('Open project');open.addEventListener('click',()=>location.href='/projects/'+p.id);row.append(name,open);list.append(row)}}
 form.addEventListener('submit',async e=>{e.preventDefault();const response=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:input.value})});if(!response.ok){alert.textContent='Project name is required';alert.hidden=false;return}alert.hidden=true;input.value='';await load()});
 await load();
}
render();
</script></body></html>

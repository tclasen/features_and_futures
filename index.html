<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #202a38; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 32px)); margin: 56px auto; }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    .field { flex: 1; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #aeb8c5; border-radius: 5px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 5px; background: #2457c5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #19449f; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; margin-top: 10px; background: white; border: 1px solid #dce2ea; border-radius: 6px; }
    .row[hidden] { display: none; }
    .row button { flex: none; }
    [role="alert"] { color: #a21c25; margin: 0 0 14px; }
    .back { margin-bottom: 22px; }
    select { padding: 8px; font: inherit; margin-bottom: 12px; }
    .summary { margin-left: auto; white-space: nowrap; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    let renderVersion = 0;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const foldAscii = value => String(value).replace(/[A-Z]/g, char => char.toLowerCase());
    async function showList(error = '', selected = 'Active', query = '') {
      const version = ++renderVersion;
      const response = await fetch(`/api/projects?filter=${selected}`);
      const projects = await response.json();
      if (version !== renderVersion) return;
      app.innerHTML = `<h1>Workboard</h1>
        ${error ? `<p role="alert">${escapeHtml(error)}</p>` : ''}
        <form id="create-form"><div class="field"><label for="project-name">Project name</label><input id="project-name" name="name" type="text"></div><button type="submit">Create project</button></form>
        <label for="project-filter">Project filter</label><select id="project-filter"><option${selected === 'Active' ? ' selected' : ''}>Active</option><option${selected === 'Archived' ? ' selected' : ''}>Archived</option></select>
        <form id="project-search-form"><div class="field"><label for="project-search">Project search</label><input id="project-search" type="text" value="${escapeHtml(query)}"></div><button type="submit">Search projects</button></form>
        <section aria-label="Projects">${projects.map(project => `<div class="row" data-testid="project-row"><span>${escapeHtml(project.name)}</span><span class="summary" data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span><button type="button" data-project-id="${project.id}">Open project</button><button type="button" data-archive-id="${project.id}" data-archived="${project.archived}">${project.archived ? 'Restore project' : 'Archive project'}</button></div>`).join('')}</section>`;
      app.querySelector('#project-filter').addEventListener('change', event => showList('', event.target.value, query));
      app.querySelector('#project-search-form').addEventListener('submit', event => { event.preventDefault(); showList('', app.querySelector('#project-filter').value, app.querySelector('#project-search').value.trim()); });
      const projectQuery = foldAscii(query.trim());
      app.querySelectorAll('[data-testid="project-row"]').forEach(row => { if (!row.querySelector('span').textContent.toLowerCase().includes(projectQuery)) row.remove(); });
      app.querySelectorAll('[data-archive-id]').forEach(button => button.addEventListener('click', async () => {
        if (button.disabled) return;
        button.disabled = true;
        const archived = button.dataset.archived !== '1';
        const response = await fetch(`/api/projects/${button.dataset.archiveId}/archive`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived }) });
        if (!response.ok) { button.disabled = false; return; }
        // Update the existing row in place so unrelated project controls remain stable.
        const row = button.closest('[data-testid="project-row"]');
        if ((selected === 'Archived') !== archived) row.remove();
        else {
          button.dataset.archived = String(Number(archived));
          button.textContent = archived ? 'Restore project' : 'Archive project';
          button.disabled = false;
        }
      }));
      app.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = new FormData(event.currentTarget).get('name').trim();
        if (!name) return showList('Project name is required');
        const created = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (!created.ok) return showList((await created.json()).error);
        await showList();
      });
      app.querySelectorAll('[data-project-id]').forEach(button => button.addEventListener('click', () => {
        history.pushState({}, '', `/projects/${button.dataset.projectId}`);
        showProject(button.dataset.projectId);
      }));
    }
    async function showProject(id, error = '', selectedFilter = 'All', selectedPriority = 'All', appliedRange = ['', ''], draftRange = appliedRange, taskQuery = '') {
      const version = ++renderVersion;
      const response = await fetch(`/api/projects/${encodeURIComponent(id)}`);
      if (version !== renderVersion) return;
      if (!response.ok) { app.innerHTML = '<h1>Project not found</h1><button class="back" type="button">Projects</button>'; }
      else {
        const project = await response.json();
        const tasksResponse = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`);
        const tasks = await tasksResponse.json();
        const projectsResponse = await fetch('/api/projects?filter=Active');
        const activeProjects = await projectsResponse.json();
        if (version !== renderVersion) return;
        const destinations = activeProjects.filter(candidate => candidate.id !== project.id);
        app.innerHTML = `<button class="back" type="button">Projects</button><h1>${escapeHtml(project.name)}</h1>
          ${project.archived ? '<p>Archived project</p>' : ''}<label for="default-task-priority">Default task priority</label><select id="default-task-priority" ${project.archived ? 'disabled' : ''}><option${project.defaultPriority === 'Low' ? ' selected' : ''}>Low</option><option${project.defaultPriority === 'Normal' ? ' selected' : ''}>Normal</option><option${project.defaultPriority === 'High' ? ' selected' : ''}>High</option></select><form id="rename-form"><div class="field"><label for="new-project-name">New project name</label><input id="new-project-name" name="name" type="text" ${project.archived ? 'disabled' : ''}></div><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form>
          ${error ? `<p role="alert">${escapeHtml(error)}</p>` : ''}
          <form id="task-form"><div class="field"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" ${project.archived ? 'disabled' : ''}></div><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form>
          <label for="task-filter">Task filter</label><select id="task-filter"><option${selectedFilter === 'All' ? ' selected' : ''}>All</option><option${selectedFilter === 'Open' ? ' selected' : ''}>Open</option><option${selectedFilter === 'Completed' ? ' selected' : ''}>Completed</option></select>
          <label for="priority-filter">Priority filter</label><select id="priority-filter"><option${selectedPriority === 'All' ? ' selected' : ''}>All</option><option${selectedPriority === 'Low' ? ' selected' : ''}>Low</option><option${selectedPriority === 'Normal' ? ' selected' : ''}>Normal</option><option${selectedPriority === 'High' ? ' selected' : ''}>High</option></select>
          <form id="task-search-form"><div class="field"><label for="task-search">Task search</label><input id="task-search" type="text" value="${escapeHtml(taskQuery)}"></div><button type="submit">Search tasks</button></form>
          <form id="due-range-form"><div class="field"><label for="due-from">Due from</label><input id="due-from" type="text" value="${escapeHtml(draftRange[0])}"></div><div class="field"><label for="due-through">Due through</label><input id="due-through" type="text" value="${escapeHtml(draftRange[1])}"></div><button type="submit">Apply due range</button></form>
          <section aria-label="Tasks">${tasks.map(task => `<div class="row task-row" data-testid="task-row" data-completed="${task.completed}" data-priority="${task.priority}" data-due-date="${escapeHtml(task.dueDate || '')}"><span>${escapeHtml(task.title)}</span><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" data-task-id="${task.id}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}><select aria-label="Task priority" data-priority-task-id="${task.id}" ${project.archived ? 'disabled' : ''}><option${task.priority === 'Low' ? ' selected' : ''}>Low</option><option${task.priority === 'Normal' ? ' selected' : ''}>Normal</option><option${task.priority === 'High' ? ' selected' : ''}>High</option></select><form class="task-rename-form" data-task-id="${task.id}"><label class="visually-hidden" for="new-task-title-${task.id}">New task title</label><input id="new-task-title-${task.id}" name="title" type="text" aria-label="New task title" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename task</button></form><form class="due-date-form" data-task-id="${task.id}"><label class="visually-hidden" for="due-date-${task.id}">Task due date</label><input id="due-date-${task.id}" name="dueDate" type="text" aria-label="Task due date" value="${escapeHtml(task.dueDate || '')}" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Save due date</button></form><label class="visually-hidden" for="destination-${task.id}">Destination project</label><select id="destination-${task.id}" aria-label="Destination project" data-destination-task-id="${task.id}" ${project.archived || !destinations.length ? 'disabled' : ''}>${destinations.map(destination => `<option value="${destination.id}">${escapeHtml(destination.name)}</option>`).join('')}</select><button type="button" data-move-task-id="${task.id}" ${project.archived || !destinations.length ? 'disabled' : ''}>Move task</button></div>`).join('')}</section>`;
        const renameForm = app.querySelector('#rename-form');
        if (renameForm) renameForm.addEventListener('submit', async event => {
          event.preventDefault();
          const name = new FormData(renameForm).get('name').trim();
          if (!name) return showProject(id, 'Project name is required', selectedFilter, selectedPriority, appliedRange, draftRange, taskQuery);
          const response = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
          if (!response.ok) return showProject(id, (await response.json()).error, selectedFilter, selectedPriority, appliedRange, draftRange, taskQuery);
          showProject(id, '', selectedFilter, selectedPriority, appliedRange, draftRange, taskQuery);
        });
        const defaultPriority = app.querySelector('#default-task-priority');
        defaultPriority.addEventListener('change', async () => {
          const response = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ defaultPriority: defaultPriority.value }) });
          if (!response.ok) showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
        });
        const filter = app.querySelector('#task-filter');
        const priorityFilter = app.querySelector('#priority-filter');
        const applyFilters = () => app.querySelectorAll('.task-row').forEach(row => {
          const completed = row.dataset.completed === 'true' || row.dataset.completed === '1';
          const completionMatches = filter.value === 'All' || (filter.value === 'Open' ? !completed : completed);
          const date = row.dataset.dueDate;
          const dateMatches = !appliedRange[0] && !appliedRange[1] ? true : Boolean(date) && (!appliedRange[0] || date >= appliedRange[0]) && (!appliedRange[1] || date <= appliedRange[1]);
          const title = row.querySelector('span').textContent;
          const searchMatches = foldAscii(title).includes(foldAscii(taskQuery.trim()));
          const priorityMatches = priorityFilter.value === 'All' || priorityFilter.value === row.dataset.priority;
          row.hidden = !(completionMatches && priorityMatches && dateMatches && searchMatches);
        });
        applyFilters();
        filter.addEventListener('change', applyFilters);
        priorityFilter.addEventListener('change', applyFilters);
        app.querySelector('#task-search-form').addEventListener('submit', event => { event.preventDefault(); showProject(id, '', filter.value, priorityFilter.value, appliedRange, appliedRange, app.querySelector('#task-search').value.trim()); });
        const showRangeError = message => {
          let alert = app.querySelector('#due-range-alert');
          if (!alert) {
            alert = document.createElement('p');
            alert.id = 'due-range-alert';
            alert.setAttribute('role', 'alert');
            app.querySelector('#due-range-form').after(alert);
          }
          alert.textContent = message;
        };
        app.querySelector('#due-range-form').addEventListener('submit', event => {
          event.preventDefault();
          const from = app.querySelector('#due-from').value.trim();
          const through = app.querySelector('#due-through').value.trim();
          const valid = value => !value || (/^\d{4}-\d{2}-\d{2}$/.test(value) && (() => { const [y,m,d] = value.split('-').map(Number); const date = new Date(0); date.setUTCFullYear(y,m-1,d); return y >= 1 && date.getUTCFullYear() === y && date.getUTCMonth() === m-1 && date.getUTCDate() === d; })());
          if (!valid(from) || !valid(through)) {
            showRangeError('Due range must use valid YYYY-MM-DD dates');
            return;
          }
          if (from && through && from > through) {
            showRangeError('Due from must not be after Due through');
            return;
          }
          showProject(id, '', filter.value, priorityFilter.value, [from, through], [from, through], taskQuery);
        });
        app.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const title = new FormData(event.currentTarget).get('title').trim();
          if (!title) return showProject(id, 'Task title is required', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
          const created = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
          if (!created.ok) return showProject(id, (await created.json()).error, filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
          showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
        });
        app.querySelectorAll('input[type="checkbox"][data-task-id]').forEach(checkbox => checkbox.addEventListener('change', async () => {
          await fetch(`/api/tasks/${checkbox.dataset.taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
          showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
        }));
        app.querySelectorAll('[data-priority-task-id]').forEach(select => select.addEventListener('change', async () => {
          const response = await fetch(`/api/tasks/${select.dataset.priorityTaskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: select.value }) });
          if (!response.ok) showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
          else showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
        }));
        app.querySelectorAll('.due-date-form').forEach(form => form.addEventListener('submit', async event => {
          event.preventDefault();
          const dueDate = new FormData(form).get('dueDate');
          const response = await fetch(`/api/tasks/${form.dataset.taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dueDate }) });
          if (!response.ok) return showProject(id, (await response.json()).error, filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
          showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
        }));
        app.querySelectorAll('[data-move-task-id]').forEach(button => button.addEventListener('click', async () => {
          const destination = app.querySelector(`[data-destination-task-id="${button.dataset.moveTaskId}"]`).value;
          const response = await fetch(`/api/tasks/${button.dataset.moveTaskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ projectId: Number(destination) }) });
          if (!response.ok) return showProject(id, (await response.json()).error, filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
          showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
        }));
        app.querySelectorAll('.task-rename-form').forEach(form => form.addEventListener('submit', async event => {
          event.preventDefault();
          const title = new FormData(form).get('title').trim();
          if (!title) return showProject(id, 'Task title is required', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
          const response = await fetch(`/api/tasks/${form.dataset.taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
          if (!response.ok) return showProject(id, (await response.json()).error, filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
          showProject(id, '', filter.value, priorityFilter.value, appliedRange, draftRange, taskQuery);
        }));
      }
      app.querySelector('.back').addEventListener('click', () => { history.pushState({}, '', '/'); showList(); });
    }
    function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
      if (match) showProject(match[1]); else showList();
    }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

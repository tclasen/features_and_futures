<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    body { max-width: 760px; margin: 3rem auto; padding: 0 1.25rem; font: 16px/1.5 system-ui, sans-serif; color: #202b3c; }
    h1 { margin-bottom: 1.5rem; }
    form { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
    label { display: grid; gap: .3rem; }
    input, button { font: inherit; padding: .55rem .75rem; }
    input { min-width: min(20rem, 65vw); }
    button { cursor: pointer; }
    .project-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; border: 1px solid #ccd3dc; border-radius: 6px; padding: .8rem 1rem; margin: .7rem 0; }
    #alert { color: #a21b1b; margin-top: .7rem; }
    .task-row { display: flex; align-items: center; gap: .6rem; border-bottom: 1px solid #ccd3dc; padding: .65rem 0; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const route = location.pathname.match(/^\/projects\/(\d+)\/?$/);

    async function request(url, options) {
      const response = await fetch(url, options);
      const value = await response.json();
      if (!response.ok) throw new Error(value.error || 'Request failed');
      return value;
    }

    function button(label, action) {
      const element = document.createElement('button');
      element.type = 'button';
      element.textContent = label;
      element.addEventListener('click', action);
      return element;
    }

    async function showProjects() {
      app.replaceChildren();
      const heading = document.createElement('h1');
      heading.textContent = 'Workboard';
      app.append(heading);
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Project name';
      const input = document.createElement('input');
      input.type = 'text';
      input.setAttribute('aria-label', 'Project name');
      label.append(input);
      const submit = document.createElement('button');
      submit.textContent = 'Create project';
      form.append(label, submit);
      const alert = document.createElement('div');
      alert.id = 'alert';
      alert.setAttribute('role', 'alert');
      const list = document.createElement('section');
      list.setAttribute('aria-label', 'Projects');
      app.append(form, alert, list);

      async function refresh() {
        list.replaceChildren();
        for (const project of await request('/api/projects')) {
          const row = document.createElement('div');
          row.className = 'project-row';
          row.dataset.testid = 'project-row';
          const name = document.createElement('span');
          name.textContent = project.name;
          row.append(name, button('Open project', () => { location.href = `/projects/${project.id}`; }));
          list.append(row);
        }
      }
      form.addEventListener('submit', async event => {
        event.preventDefault();
        alert.textContent = '';
        const name = input.value.trim();
        if (!name) { alert.textContent = 'Project name is required'; return; }
        try {
          await request('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
          input.value = '';
          await refresh();
        } catch (error) { alert.textContent = error.message; }
      });
      await refresh();
    }

    async function showProject(id) {
      const project = await request(`/api/projects/${id}`);
      const heading = document.createElement('h1');
      heading.textContent = project.name;
      const back = button('Projects', () => { location.href = '/'; });
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Task title';
      const input = document.createElement('input');
      input.type = 'text';
      input.setAttribute('aria-label', 'Task title');
      label.append(input);
      const submit = document.createElement('button');
      submit.textContent = 'Create task';
      form.append(label, submit);
      const alert = document.createElement('div');
      alert.id = 'alert';
      alert.setAttribute('role', 'alert');
      const filterLabel = document.createElement('label');
      filterLabel.textContent = 'Task filter';
      const filter = document.createElement('select');
      filter.setAttribute('aria-label', 'Task filter');
      for (const value of ['All', 'Open', 'Completed']) {
        const option = document.createElement('option');
        option.textContent = value;
        option.value = value;
        filter.append(option);
      }
      filterLabel.append(filter);
      const list = document.createElement('section');
      list.setAttribute('aria-label', 'Tasks');
      app.replaceChildren(heading, back, form, alert, filterLabel, list);

      async function refresh() {
        const tasks = await request(`/api/projects/${id}/tasks`);
        list.replaceChildren();
        for (const task of tasks) {
          if (filter.value === 'Open' && task.completed || filter.value === 'Completed' && !task.completed) continue;
          const row = document.createElement('div');
          row.className = 'task-row';
          row.dataset.testid = 'task-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = Boolean(task.completed);
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            try {
              await request(`/api/projects/${id}/tasks/${task.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) });
              await refresh();
            } catch (error) { alert.textContent = error.message; }
          });
          const title = document.createElement('span');
          title.textContent = task.title;
          row.append(checkbox, title);
          list.append(row);
        }
      }
      filter.addEventListener('change', () => refresh().catch(error => { alert.textContent = error.message; }));
      form.addEventListener('submit', async event => {
        event.preventDefault();
        alert.textContent = '';
        const title = input.value.trim();
        if (!title) { alert.textContent = 'Task title is required'; return; }
        try {
          await request(`/api/projects/${id}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
          input.value = '';
          await refresh();
        } catch (error) { alert.textContent = error.message; }
      });
      await refresh();
    }

    if (route) {
      showProject(route[1]).catch(() => { location.replace('/'); });
    } else {
      showProjects().catch(error => { app.textContent = error.message; });
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #182230; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 32px)); margin: 56px auto; }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 7px; font-weight: 600; }
    .field { flex: 1; }
    input:not([type=checkbox]), select { width: 100%; padding: 11px 12px; border: 1px solid #aeb8c5; border-radius: 6px; font: inherit; }
    input[type=checkbox] { width: auto; }
    button { padding: 10px 15px; border: 0; border-radius: 6px; background: #2457c5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e5ebf5; color: #182230; }
    .project-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px; border: 1px solid #d5dce6; border-radius: 7px; background: white; margin: 10px 0; }
    .project-name { font-weight: 600; overflow-wrap: anywhere; }
    [role="alert"] { color: #a52222; margin: 0 0 14px; }
    @media (max-width: 480px) { form { flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) {
        app.innerHTML = '<p>Loading project…</p>';
        try {
          const response = await fetch(`/api/projects/${match[1]}`);
          if (!response.ok) throw new Error('Project not found');
          const project = await response.json();
          app.innerHTML = `<button class="secondary" id="back">Projects</button><h1>${escapeHtml(project.name)}</h1>${project.archived ? '<p>Archived project</p>' : ''}<div id="alert"></div><form id="task-form"><div class="field"><label for="task-title">Task title</label><input id="task-title" type="text" autocomplete="off"></div><button type="submit">Create task</button></form><div class="field"><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></div><section id="tasks" aria-label="Tasks"></section>`;
          if (project.archived) document.querySelector('#task-form button').disabled = true;
          const loadTasks = async () => {
            const tasks = await (await fetch(`/api/projects/${match[1]}/tasks`)).json();
            const filter = document.querySelector('#task-filter').value;
            const visible = tasks.filter(task => filter === 'All' || (filter === 'Completed') === task.completed);
            document.querySelector('#tasks').innerHTML = visible.map(task => `<div class="project-row" data-testid="task-row"><span class="project-name">${escapeHtml(task.title)}</span><label><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" data-task-id="${task.id}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}></label></div>`).join('');
            document.querySelectorAll('#tasks input').forEach(box => box.addEventListener('change', async () => { await fetch(`/api/tasks/${box.dataset.taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) }); loadTasks(); }));
          };
          document.querySelector('#task-filter').addEventListener('change', loadTasks);
          document.querySelector('#task-form').addEventListener('submit', async event => {
            event.preventDefault();
            const title = document.querySelector('#task-title').value.trim();
            if (!title) { document.querySelector('#alert').innerHTML = '<p role="alert">Task title is required</p>'; return; }
            const result = await fetch(`/api/projects/${match[1]}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
            if (!result.ok) { document.querySelector('#alert').innerHTML = '<p role="alert">Task title is required</p>'; return; }
            document.querySelector('#task-title').value = '';
            document.querySelector('#alert').innerHTML = '';
            await loadTasks();
          });
          await loadTasks();
          document.querySelector('#back').addEventListener('click', () => { history.pushState({}, '', '/'); render(); });
        } catch { app.innerHTML = '<h1>Project not found</h1><button class="secondary" id="back">Projects</button>'; document.querySelector('#back').addEventListener('click', () => { history.pushState({}, '', '/'); render(); }); }
        return;
      }
      app.innerHTML = `<h1>Workboard</h1><div class="field"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div><div id="alert"></div><form id="create-form"><div class="field"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" autocomplete="off"></div><button type="submit">Create project</button></form><section id="projects" aria-label="Projects"></section>`;
      const response = await fetch('/api/projects');
      const projects = await response.json();
      const drawProjects = () => {
        const archived = document.querySelector('#project-filter').value === 'Archived';
        const shown = projects.filter(p => p.archived === archived);
        document.querySelector('#projects').innerHTML = shown.map(p => `<div class="project-row" data-testid="project-row"><span class="project-name">${escapeHtml(p.name)}</span><span data-testid="project-summary">${p.completedCount}/${p.totalCount} completed</span><button type="button" data-action="open" data-id="${p.id}">Open project</button><button class="secondary" type="button" data-action="${archived ? 'restore' : 'archive'}" data-id="${p.id}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        document.querySelectorAll('#projects button').forEach(button => button.addEventListener('click', async () => {
          if (button.dataset.action === 'open') { history.pushState({}, '', `/projects/${button.dataset.id}`); render(); return; }
          await fetch(`/api/projects/${button.dataset.id}/${button.dataset.action}`, {method:'POST'}); render();
        }));
      };
      document.querySelector('#project-filter').addEventListener('change', drawProjects);
      drawProjects();
      document.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const name = document.querySelector('#project-name').value.trim();
        if (!name) { document.querySelector('#alert').innerHTML = '<p role="alert">Project name is required</p>'; return; }
        const created = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        if (!created.ok) { document.querySelector('#alert').innerHTML = '<p role="alert">Project name is required</p>'; return; }
        // Return to the active list after creating, even if the user had been
        // browsing archived projects. The new project is always active.
        render();
      });
    }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

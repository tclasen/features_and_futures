<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(680px, calc(100% - 32px)); margin: 64px auto; }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    .field { flex: 1; }
    input { width: 100%; border: 1px solid #b9c3d4; border-radius: 6px; padding: 10px 12px; font: inherit; background: white; }
    button { border: 0; border-radius: 6px; padding: 10px 16px; font: inherit; font-weight: 600; color: white; background: #3159cb; cursor: pointer; }
    button:hover { background: #2447ad; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; margin: 10px 0; background: white; border: 1px solid #e0e5ee; border-radius: 8px; }
    .row button { flex: none; }
    .alert { color: #a32222; margin: 0 0 16px; }
    .back { margin-bottom: 20px; }
    button:focus-visible, input:focus-visible { outline: 3px solid #88a5ff; outline-offset: 2px; }
    @media (max-width: 480px) { form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    async function request(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function render() {
      const match = location.pathname.match(/^\/projects\/([^/]+)\/?$/);
      if (match) {
        try {
          const project = await request(`/api/projects/${encodeURIComponent(match[1])}`);
          app.innerHTML = `<button class="back" type="button">Projects</button><h1>${esc(project.name)}</h1>${project.archived ? '<p>Archived project</p>' : ''}<div id="message" role="alert" aria-live="polite"></div><form><div class="field"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" ${project.archived ? 'disabled' : ''}></div><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form><div class="field"><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></div><section id="tasks" aria-label="Tasks"></section>`;
          app.querySelector('.back').addEventListener('click', () => { location.href = '/'; });
          const tasksList = app.querySelector('#tasks');
          const filter = app.querySelector('#task-filter');
          let tasks = [];
          const refreshTasks = async () => {
            tasks = await request(`/api/projects/${encodeURIComponent(project.id)}/tasks`);
            const shown = tasks.filter(task => filter.value === 'All' || (filter.value === 'Completed') === task.completed);
            tasksList.innerHTML = shown.map(task => `<div class="row" data-testid="task-row"><span>${esc(task.title)}</span><input type="checkbox" aria-label="Complete ${esc(task.title)}" data-task-id="${esc(task.id)}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}></div>`).join('');
            tasksList.querySelectorAll('input').forEach(box => box.addEventListener('change', async () => {
              try {
                await request(`/api/projects/${encodeURIComponent(project.id)}/tasks/${encodeURIComponent(box.dataset.taskId)}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) });
                await refreshTasks();
              } catch (error) { app.querySelector('#message').textContent = error.message; box.checked = !box.checked; }
            }));
          };
          filter.addEventListener('change', refreshTasks);
          app.querySelector('form').addEventListener('submit', async event => {
            event.preventDefault();
            const title = app.querySelector('#task-title').value.trim();
            if (!title) { app.querySelector('#message').textContent = 'Task title is required'; return; }
            try {
              await request(`/api/projects/${encodeURIComponent(project.id)}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
              app.querySelector('#task-title').value = '';
              app.querySelector('#message').textContent = '';
              await refreshTasks();
            } catch (error) { app.querySelector('#message').textContent = error.message; }
          });
          await refreshTasks();
        } catch {
          app.innerHTML = '<h1>Project not found</h1><button class="back" type="button">Projects</button>';
          app.querySelector('.back').addEventListener('click', () => { location.href = '/'; });
        }
        return;
      }

      app.innerHTML = '<h1>Workboard</h1><div id="message" role="alert" aria-live="polite"></div><form><div class="field"><label for="project-name">Project name</label><input id="project-name" name="name" type="text"></div><button type="submit">Create project</button></form><div class="field"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div><section id="projects" aria-label="Projects"></section>';
      const list = app.querySelector('#projects');
      const refresh = async () => {
        const projects = await request('/api/projects');
        const archived = app.querySelector('#project-filter').value === 'Archived';
        list.innerHTML = projects.filter(project => project.archived === archived).map(project => `<div class="row" data-testid="project-row"><span>${esc(project.name)}</span><span data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span><button type="button" data-action="open" data-project-id="${esc(project.id)}">Open project</button><button type="button" data-action="archive" data-project-id="${esc(project.id)}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        list.querySelectorAll('button').forEach(button => button.addEventListener('click', async () => {
          const id = encodeURIComponent(button.dataset.projectId);
          if (button.dataset.action === 'open') { location.href = `/projects/${id}`; return; }
          try { await request(`/api/projects/${id}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !archived }) }); await refresh(); }
          catch (error) { app.querySelector('#message').textContent = error.message; }
        }));
      };
      app.querySelector('#project-filter').addEventListener('change', refresh);
      app.querySelector('form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = app.querySelector('#project-name').value.trim();
        if (!name) { app.querySelector('#message').textContent = 'Project name is required'; return; }
        try {
          await request('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
          app.querySelector('#project-name').value = '';
          app.querySelector('#message').textContent = '';
          await refresh();
        } catch (error) { app.querySelector('#message').textContent = error.message; }
      });
      await refresh();
    }
    render().catch(() => { app.innerHTML = '<h1>Workboard</h1><p role="alert">Unable to load projects</p>'; });
  </script>
</body>
</html>

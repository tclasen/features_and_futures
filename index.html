<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell" id="app">
      <h1>Workboard</h1>
      <section id="project-list" aria-labelledby="projects-heading">
        <h2 id="projects-heading">Projects</h2>
        <form id="create-project-form">
          <label for="project-name">Project name</label>
          <div class="form-row">
            <input id="project-name" name="name" type="text" autocomplete="off">
            <button type="submit">Create project</button>
          </div>
          <p id="project-error" class="error" role="alert" hidden></p>
        </form>
        <div id="projects" class="project-list" aria-live="polite"></div>
      </section>
      <section id="project-detail" hidden>
        <button id="back-to-projects" type="button">Projects</button>
        <h2 id="project-title"></h2>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18212f; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
    h1 { margin-bottom: 24px; }
    form { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; min-width: 0; padding: 11px 12px; font: inherit; border: 1px solid #aab4c2; border-radius: 5px; }
    button { padding: 10px 15px; font: inherit; color: white; background: #2459a6; border: 0; border-radius: 5px; cursor: pointer; }
    button:hover { background: #194783; }
    [role="alert"] { color: #a32121; margin: 12px 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px; margin: 8px 0; background: white; border: 1px solid #dce2e9; border-radius: 6px; }
    .task-row { justify-content: flex-start; }
    .task-row input { flex: initial; }
    .task-row input[type="checkbox"] { display: inline-block; visibility: visible; opacity: 1; width: 18px; height: 18px; padding: 0; flex: 0 0 18px; appearance: auto; }
    .filter { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
    select { padding: 8px; font: inherit; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const normalizeSearch = value => String(value).replace(/[ \t]+/g, ' ').replace(/[A-Z]/g, char => char.toLowerCase());

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) {
        const projectResponse = await fetch(`/api/projects/${match[1]}`);
        const project = projectResponse.ok ? await projectResponse.json() : null;
        if (!project) {
          app.innerHTML = `<h1>Project not found</h1><button type="button" id="back">Projects</button>`;
          app.querySelector('#back').addEventListener('click', () => navigate('/'));
          return;
        }
        const tasksResponse = await fetch(`/api/projects/${match[1]}/tasks`);
        const tasks = await tasksResponse.json();
        const allProjects = await (await fetch('/api/projects')).json();
        const destinations = allProjects.filter(item => !item.archived && item.id !== project.id);
        app.innerHTML = `<button type="button" id="back">Projects</button><button type="button" id="download-project">Download project</button><h1>${escapeHtml(project.name)}</h1>
          ${project.archived ? '<p>Archived project</p>' : '<form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" name="name" type="text"><button type="submit">Rename project</button></form>'}
          ${project.archived ? '<form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" name="name" type="text" disabled><button type="submit" disabled>Rename project</button></form>' : ''}
          <form id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form>
          <div id="message" role="alert" aria-live="polite"></div>
          <div class="filter"><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option><option>Deleted</option></select></div>
          <div class="filter"><label for="priority-filter">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></div>
          <div class="filter"><label for="default-priority">Default task priority</label><select id="default-priority" ${project.archived ? 'disabled' : ''}><option ${project.defaultPriority === 'Low' ? 'selected' : ''}>Low</option><option ${project.defaultPriority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.defaultPriority === 'High' ? 'selected' : ''}>High</option></select></div>
          <form id="task-search-form"><label for="task-search">Task search</label><input id="task-search" type="text"><button type="submit">Search tasks</button></form>
          <form id="due-range-form"><label for="due-from">Due from</label><input id="due-from" type="text"><label for="due-through">Due through</label><input id="due-through" type="text"><button type="submit">Apply due range</button></form>
          <section id="task-list" aria-label="Tasks"></section>`;
        app.querySelector('#back').addEventListener('click', () => navigate('/'));
        app.querySelector('#download-project').addEventListener('click', async () => {
          const response = await fetch(`/api/projects/${match[1]}/export`);
          if (!response.ok) return;
          const blob = await response.blob();
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'workboard-project.json';
          link.click();
          URL.revokeObjectURL(link.href);
        });
        app.querySelector('#rename-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#new-project-name');
          const name = input.value.trim();
          if (!name) { app.querySelector('#message').textContent = 'Project name is required'; input.focus(); return; }
          const response = await fetch(`/api/projects/${match[1]}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
          if (response.ok) {
            const updated = await response.json();
            app.querySelector('h1').textContent = updated.name;
            app.querySelector('#message').textContent = '';
          }
        });
        const filter = app.querySelector('#task-filter');
        const priorityFilter = app.querySelector('#priority-filter');
        let appliedDueFrom = '', appliedDueThrough = '', appliedTaskQuery = '';
        const validDate = value => {
          const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (!match) return false;
          const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
          if (year < 1 || month < 1 || month > 12 || day < 1) return false;
          const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
          return day <= [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
        };
        app.querySelector('#task-search-form').addEventListener('submit', event => {
          event.preventDefault();
          appliedTaskQuery = normalizeSearch(app.querySelector('#task-search').value.trim());
          paintTasks();
        });
        app.querySelector('#due-range-form').addEventListener('submit', event => {
          event.preventDefault();
          const from = app.querySelector('#due-from').value.trim();
          const through = app.querySelector('#due-through').value.trim();
          const message = app.querySelector('#message');
          if ((from && !validDate(from)) || (through && !validDate(through))) { message.textContent = 'Due range must use valid YYYY-MM-DD dates'; return; }
          if (from && through && from > through) { message.textContent = 'Due from must not be after Due through'; return; }
          appliedDueFrom = from; appliedDueThrough = through; message.textContent = ''; paintTasks();
        });
        app.querySelector('#default-priority').addEventListener('change', async event => {
          const response = await fetch(`/api/projects/${match[1]}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ defaultPriority: event.target.value }) });
          if (!response.ok) event.target.value = project.defaultPriority;
          else project.defaultPriority = (await response.json()).defaultPriority;
        });
        const paintTasks = () => {
          const visible = tasks.filter(task =>
            (filter.value === 'Deleted' ? Boolean(task.deleted) : !task.deleted && (filter.value === 'All' || (filter.value === 'Completed') === Boolean(task.completed))) &&
            (priorityFilter.value === 'All' || task.priority === priorityFilter.value) &&
            normalizeSearch(task.title).includes(appliedTaskQuery) &&
            ((!appliedDueFrom && !appliedDueThrough) || (Boolean(task.dueDate) && (!appliedDueFrom || task.dueDate >= appliedDueFrom) && (!appliedDueThrough || task.dueDate <= appliedDueThrough)))
          );
          app.querySelector('#task-list').innerHTML = visible.map(task => { const locked = project.archived || task.deleted; return `<div class="row task-row" data-testid="task-row"><input type="checkbox" id="task-${task.id}" aria-label="Complete ${escapeHtml(task.title)}" ${task.completed ? 'checked' : ''} ${locked ? 'disabled' : ''}><label for="task-${task.id}">${escapeHtml(task.title)}</label><input type="text" aria-label="New task title" data-rename-input="${task.id}" value="${escapeHtml(task.title)}" ${locked ? 'disabled' : ''}><button type="button" data-rename="${task.id}" ${locked ? 'disabled' : ''}>Rename task</button><select aria-label="Task priority" data-priority="${task.id}" ${locked ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select><input type="text" aria-label="Task due date" data-due-date="${task.id}" value="${escapeHtml(task.dueDate || '')}" ${locked ? 'disabled' : ''}><button type="button" data-save-due="${task.id}" ${locked ? 'disabled' : ''}>Save due date</button><select aria-label="Destination project" data-destination="${task.id}" ${locked || !destinations.length ? 'disabled' : ''}>${destinations.map(item => `<option value="${item.id}">${escapeHtml(item.name)}</option>`).join('')}</select><button type="button" data-move="${task.id}" ${locked || !destinations.length ? 'disabled' : ''}>Move task</button><textarea aria-label="Task notes" data-notes="${task.id}" ${locked ? 'disabled' : ''}>${escapeHtml(task.notes || '')}</textarea><button type="button" data-save-notes="${task.id}" ${locked ? 'disabled' : ''}>Save notes</button><button type="button" data-delete="${task.id}" ${project.archived ? 'disabled' : ''}>${task.deleted ? 'Restore task' : 'Delete task'}</button></div>`; }).join('');
          app.querySelectorAll('#task-list [data-delete]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => String(item.id) === button.dataset.delete);
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ deleted: !task.deleted }) });
            if (response.ok) { Object.assign(task, await response.json()); paintTasks(); }
          }));
          app.querySelectorAll('#task-list [data-rename]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => String(item.id) === button.dataset.rename);
            const input = app.querySelector(`[data-rename-input="${task.id}"]`);
            const title = input.value.trim();
            if (!title) { app.querySelector('#message').textContent = 'Task title is required'; input.focus(); return; }
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
            if (response.ok) { Object.assign(task, await response.json()); app.querySelector('#message').textContent = ''; paintTasks(); }
          }));
          app.querySelectorAll('#task-list [data-move]').forEach(button => button.addEventListener('click', async () => {
            const taskId = Number(button.dataset.move);
            const destinationId = Number(app.querySelector(`[data-destination="${taskId}"]`).value);
            const response = await fetch(`/api/projects/${match[1]}/tasks/${taskId}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ destinationId }) });
            if (response.ok) { const index = tasks.findIndex(item => item.id === taskId); if (index >= 0) tasks.splice(index, 1); paintTasks(); }
          }));
          app.querySelectorAll('#task-list [data-save-notes]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => String(item.id) === button.dataset.saveNotes);
            const notes = app.querySelector(`[data-notes="${task.id}"]`).value;
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ notes }) });
            if (response.ok) { Object.assign(task, await response.json()); app.querySelector('#message').textContent = ''; }
            else { const result = await response.json(); app.querySelector('#message').textContent = result.error || 'Unable to save notes'; }
          }));
          app.querySelectorAll('#task-list [data-save-due]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => String(item.id) === button.dataset.saveDue);
            const input = app.querySelector(`[data-due-date="${task.id}"]`);
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dueDate: input.value }) });
            if (response.ok) { Object.assign(task, await response.json()); app.querySelector('#message').textContent = ''; paintTasks(); }
            else { const result = await response.json(); app.querySelector('#message').textContent = result.error || 'Unable to save due date'; }
          }));
          app.querySelectorAll('#task-list [data-priority]').forEach(select => select.addEventListener('change', async () => {
            const task = tasks.find(item => String(item.id) === select.dataset.priority);
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: select.value }) });
            if (response.ok) { Object.assign(task, await response.json()); paintTasks(); }
          }));
          app.querySelectorAll('#task-list input[type="checkbox"]').forEach(box => box.addEventListener('change', async () => {
            const task = tasks.find(item => String(item.id) === box.id.slice(5));
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) });
            if (response.ok) { task.completed = box.checked ? 1 : 0; paintTasks(); }
          }));
        };
        filter.addEventListener('change', paintTasks);
        priorityFilter.addEventListener('change', paintTasks);
        paintTasks();
        app.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#task-title');
          const title = input.value.trim();
          if (!title) { app.querySelector('#message').textContent = 'Task title is required'; input.focus(); return; }
          const result = await fetch(`/api/projects/${match[1]}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
          if (result.ok) { tasks.push(await result.json()); input.value = ''; app.querySelector('#message').textContent = ''; paintTasks(); }
        });
        return;
      }
      const response = await fetch('/api/projects');
      const projects = await response.json();
      app.innerHTML = `<h1>Workboard</h1>
        <form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text"><button type="submit">Create project</button></form>
        <div id="message" role="alert" aria-live="polite"></div>
        <form id="project-search-form"><label for="project-search">Project search</label><input id="project-search" type="text"><button type="submit">Search projects</button></form>
        <div class="filter"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div>
        <section aria-label="Projects" id="project-list"></section>`;
      const projectFilter = app.querySelector('#project-filter');
      let appliedProjectQuery = '';
      const paintProjects = () => {
        const archived = projectFilter.value === 'Archived';
        app.querySelector('#project-list').innerHTML = projects.filter(project => Boolean(project.archived) === archived && normalizeSearch(project.name).includes(appliedProjectQuery)).map(project => `<div class="row" data-testid="project-row"><span>${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span><button type="button" data-open="${project.id}">Open project</button><button type="button" data-archive="${project.id}" data-value="${archived ? 0 : 1}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        app.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => navigate(`/projects/${button.dataset.open}`)));
        app.querySelectorAll('[data-archive]').forEach(button => button.addEventListener('click', async () => {
          const response = await fetch(`/api/projects/${button.dataset.archive}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: button.dataset.value === '1' }) });
          if (response.ok) { const updated = await response.json(); Object.assign(projects.find(p => p.id === updated.id), updated); paintProjects(); }
        }));
      };
      app.querySelector('#project-search-form').addEventListener('submit', event => {
        event.preventDefault();
        appliedProjectQuery = normalizeSearch(app.querySelector('#project-search').value.trim());
        paintProjects();
      });
      projectFilter.addEventListener('change', paintProjects);
      paintProjects();
      app.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = app.querySelector('#project-name');
        const name = input.value.trim();
        if (!name) { app.querySelector('#message').textContent = 'Project name is required'; input.focus(); return; }
        const result = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
        if (result.ok) render();
      });

    }
    function navigate(path) { history.pushState({}, '', path); render(); }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

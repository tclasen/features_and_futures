<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182230; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 760px; margin: 56px auto; padding: 0 24px; }
    h1 { margin: 0 0 28px; font-size: 2rem; }
    form, .project-row, .task-row { display: flex; align-items: center; gap: 12px; }
    form { margin-bottom: 20px; }
    label { font-weight: 600; }
    input { box-sizing: border-box; min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid #aab4c0; border-radius: 6px; font: inherit; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; background: #2457c5; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #1b439d; }
    button:focus-visible, input:focus-visible { outline: 3px solid #88aaff; outline-offset: 2px; }
    [role="alert"] { color: #a32121; margin: 12px 0; }
    .project-list { display: grid; gap: 10px; }
    .project-row { justify-content: space-between; padding: 14px 16px; border: 1px solid #d8dee7; border-radius: 8px; background: white; }
    .project-name { overflow-wrap: anywhere; }
    .task-controls { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
    .task-controls label { white-space: nowrap; }
    .task-controls select { padding: 10px 12px; border: 1px solid #aab4c0; border-radius: 6px; font: inherit; }
    .task-list { display: grid; gap: 10px; }
    .task-row { padding: 14px 16px; border: 1px solid #d8dee7; border-radius: 8px; background: white; }
    .task-row input[type="checkbox"] { flex: none; width: 18px; height: 18px; }
    .task-row select { padding: 8px; border: 1px solid #aab4c0; border-radius: 6px; font: inherit; }
    .task-rename input { flex: 1; }
    .task-row span { overflow-wrap: anywhere; }
    .task-row .task-rename { display: flex; flex: 1; gap: 8px; }
    @media (max-width: 520px) { main { margin-top: 32px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapePath = (id) => `/projects/${encodeURIComponent(id)}`;
    const asciiLower = (value) => value.replace(/[A-Z]/g, (letter) => letter.toLowerCase());

    async function loadProjects() {
      const response = await fetch('/api/projects');
      if (!response.ok) throw new Error('Could not load projects');
      return response.json();
    }

    function renderList(projects) {
      app.replaceChildren();
      const heading = document.createElement('h1');
      heading.textContent = 'Workboard';
      app.append(heading);

      const filterLabel = document.createElement('label');
      filterLabel.htmlFor = 'project-filter';
      filterLabel.textContent = 'Project filter';
      const filter = document.createElement('select');
      filter.id = 'project-filter';
      for (const value of ['Active', 'Archived']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        filter.append(option);
      }

      const searchForm = document.createElement('form');
      const searchLabel = document.createElement('label');
      searchLabel.htmlFor = 'project-search';
      searchLabel.textContent = 'Project search';
      const searchInput = document.createElement('input');
      searchInput.id = 'project-search';
      searchInput.type = 'text';
      searchInput.autocomplete = 'off';
      const searchButton = document.createElement('button');
      searchButton.type = 'submit';
      searchButton.textContent = 'Search projects';
      searchForm.append(searchLabel, searchInput, searchButton);
      let appliedQuery = '';

      const form = document.createElement('form');
      const label = document.createElement('label');
      label.htmlFor = 'project-name';
      label.textContent = 'Project name';
      const input = document.createElement('input');
      input.id = 'project-name';
      input.name = 'name';
      input.type = 'text';
      input.autocomplete = 'off';
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create project';
      form.append(label, input, submit);
      const alert = document.createElement('p');
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const list = document.createElement('section');
      list.className = 'project-list';
      list.setAttribute('aria-label', 'Projects');
      function drawProjects() {
        list.replaceChildren();
        for (const project of projects.filter((item) =>
          item.archived === (filter.value === 'Archived') &&
          asciiLower(item.name).includes(asciiLower(appliedQuery)))) {
          const row = document.createElement('div');
          row.className = 'project-row';
          row.dataset.testid = 'project-row';
          const name = document.createElement('span');
          name.className = 'project-name';
          name.textContent = project.name;
          const summary = document.createElement('span');
          summary.dataset.testid = 'project-summary';
          summary.textContent = `${project.completedCount}/${project.totalCount} completed`;
          const open = document.createElement('button');
          open.type = 'button';
          open.textContent = 'Open project';
          open.addEventListener('click', () => { location.href = escapePath(project.id); });
          const stateButton = document.createElement('button');
          stateButton.type = 'button';
          stateButton.textContent = project.archived ? 'Restore project' : 'Archive project';
          stateButton.addEventListener('click', async () => {
            const action = project.archived ? 'restore' : 'archive';
            const response = await fetch(`/api/projects/${project.id}/${action}`, { method: 'POST' });
            if (response.ok) {
              project.archived = !project.archived;
              drawProjects();
            }
          });
          row.append(name, summary, open, stateButton);
          list.append(row);
        }
      }
      filter.addEventListener('change', drawProjects);
      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        appliedQuery = searchInput.value.trim();
        drawProjects();
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const nameValue = input.value.trim();
        if (!nameValue) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          input.focus();
          return;
        }
        alert.hidden = true;
        const response = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: nameValue }),
        });
        if (!response.ok) {
          alert.textContent = (await response.json()).error || 'Could not create project';
          alert.hidden = false;
          return;
        }
        renderList([...projects, { ...await response.json(), archived: false, completedCount: 0, totalCount: 0 }]);
      });
      app.append(filterLabel, filter, searchForm, form, alert, list);
      drawProjects();
    }

    async function renderProject(id) {
      const projects = await loadProjects();
      const project = projects.find((item) => String(item.id) === id);
      if (!project) {
        app.replaceChildren();
        const heading = document.createElement('h1');
        heading.textContent = 'Project not found';
        app.append(heading);
        return;
      }
      const response = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`);
      if (!response.ok) throw new Error('Could not load tasks');
      const tasks = await response.json();
      app.replaceChildren();
      const back = document.createElement('button');
      back.type = 'button';
      back.textContent = 'Projects';
      back.addEventListener('click', () => { location.href = '/'; });
      const heading = document.createElement('h1');
      heading.textContent = project.name;
      const renameForm = document.createElement('form');
      const renameLabel = document.createElement('label');
      renameLabel.htmlFor = 'new-project-name';
      renameLabel.textContent = 'New project name';
      const renameInput = document.createElement('input');
      renameInput.id = 'new-project-name';
      renameInput.type = 'text';
      renameInput.autocomplete = 'off';
      renameInput.disabled = project.archived;
      const renameButton = document.createElement('button');
      renameButton.type = 'submit';
      renameButton.textContent = 'Rename project';
      renameButton.disabled = project.archived;
      renameForm.append(renameLabel, renameInput, renameButton);
      const archivedNotice = document.createElement('p');
      archivedNotice.textContent = 'Archived project';
      archivedNotice.hidden = !project.archived;
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.htmlFor = 'task-title';
      label.textContent = 'Task title';
      const input = document.createElement('input');
      input.id = 'task-title';
      input.name = 'title';
      input.type = 'text';
      input.autocomplete = 'off';
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create task';
      submit.disabled = project.archived;
      input.disabled = project.archived;
      form.append(label, input, submit);
      const alert = document.createElement('p');
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      const controls = document.createElement('div');
      controls.className = 'task-controls';
      const taskSearchForm = document.createElement('form');
      const taskSearchLabel = document.createElement('label');
      taskSearchLabel.htmlFor = 'task-search';
      taskSearchLabel.textContent = 'Task search';
      const taskSearchInput = document.createElement('input');
      taskSearchInput.id = 'task-search';
      taskSearchInput.type = 'text';
      taskSearchInput.autocomplete = 'off';
      const taskSearchButton = document.createElement('button');
      taskSearchButton.type = 'submit';
      taskSearchButton.textContent = 'Search tasks';
      taskSearchForm.append(taskSearchLabel, taskSearchInput, taskSearchButton);
      let appliedTaskQuery = '';
      const filterLabel = document.createElement('label');
      filterLabel.htmlFor = 'task-filter';
      filterLabel.textContent = 'Task filter';
      const filter = document.createElement('select');
      filter.id = 'task-filter';
      for (const value of ['All', 'Open', 'Completed']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        filter.append(option);
      }
      const priorityFilterLabel = document.createElement('label');
      priorityFilterLabel.htmlFor = 'priority-filter';
      priorityFilterLabel.textContent = 'Priority filter';
      const priorityFilter = document.createElement('select');
      priorityFilter.id = 'priority-filter';
      for (const value of ['All', 'Low', 'Normal', 'High']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        priorityFilter.append(option);
      }
      controls.append(filterLabel, filter, priorityFilterLabel, priorityFilter);
      const dueRangeForm = document.createElement('form');
      dueRangeForm.className = 'task-controls';
      const dueFromLabel = document.createElement('label');
      dueFromLabel.htmlFor = 'due-from';
      dueFromLabel.textContent = 'Due from';
      const dueFrom = document.createElement('input');
      dueFrom.id = 'due-from';
      dueFrom.type = 'text';
      dueFrom.placeholder = 'YYYY-MM-DD';
      const dueThroughLabel = document.createElement('label');
      dueThroughLabel.htmlFor = 'due-through';
      dueThroughLabel.textContent = 'Due through';
      const dueThrough = document.createElement('input');
      dueThrough.id = 'due-through';
      dueThrough.type = 'text';
      dueThrough.placeholder = 'YYYY-MM-DD';
      const applyDueRange = document.createElement('button');
      applyDueRange.type = 'submit';
      applyDueRange.textContent = 'Apply due range';
      dueRangeForm.append(dueFromLabel, dueFrom, dueThroughLabel, dueThrough, applyDueRange);
      let appliedFrom = '';
      let appliedThrough = '';
      const isValidDate = (value) => {
        const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return false;
        const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
        const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
        const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        return year >= 1 && month >= 1 && month <= 12 && day >= 1 && day <= days[month - 1];
      };
      dueRangeForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const from = dueFrom.value.trim();
        const through = dueThrough.value.trim();
        if ((from && !isValidDate(from)) || (through && !isValidDate(through))) {
          alert.textContent = 'Due range must use valid YYYY-MM-DD dates';
          alert.hidden = false;
          return;
        }
        if (from && through && from > through) {
          alert.textContent = 'Due from must not be after Due through';
          alert.hidden = false;
          return;
        }
        appliedFrom = from;
        appliedThrough = through;
        alert.hidden = true;
        drawTasks();
      });
      const defaultPriorityLabel = document.createElement('label');
      defaultPriorityLabel.htmlFor = 'default-task-priority';
      defaultPriorityLabel.textContent = 'Default task priority';
      const defaultPriority = document.createElement('select');
      defaultPriority.id = 'default-task-priority';
      defaultPriority.disabled = project.archived;
      for (const value of ['Low', 'Normal', 'High']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        defaultPriority.append(option);
      }
      defaultPriority.value = project.defaultTaskPriority || 'Normal';
      defaultPriority.addEventListener('change', async () => {
        const requested = defaultPriority.value;
        defaultPriority.disabled = true;
        const saved = await fetch(`/api/projects/${encodeURIComponent(id)}/default-priority`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ priority: requested }),
        });
        if (saved.ok) project.defaultTaskPriority = (await saved.json()).defaultTaskPriority;
        else defaultPriority.value = project.defaultTaskPriority || 'Normal';
        defaultPriority.disabled = project.archived;
      });
      const list = document.createElement('section');
      list.className = 'task-list';
      list.setAttribute('aria-label', 'Tasks');
      function drawTasks() {
        list.replaceChildren();
        const matching = tasks.filter((task) =>
          (filter.value === 'All' || (filter.value === 'Completed') === task.completed) &&
          (priorityFilter.value === 'All' || (task.priority || 'Normal') === priorityFilter.value) &&
          asciiLower(task.title).includes(asciiLower(appliedTaskQuery)) &&
          ((!appliedFrom && !appliedThrough) || (Boolean(task.dueDate) &&
            (!appliedFrom || task.dueDate >= appliedFrom) &&
            (!appliedThrough || task.dueDate <= appliedThrough))));
        for (const task of matching) {
          const row = document.createElement('div');
          row.className = 'task-row';
          row.dataset.testid = 'task-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.disabled = project.archived;
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          const title = document.createElement('span');
          title.textContent = task.title;
          const priority = document.createElement('select');
          priority.setAttribute('aria-label', 'Task priority');
          priority.disabled = project.archived;
          for (const value of ['Low', 'Normal', 'High']) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            priority.append(option);
          }
          priority.value = task.priority || 'Normal';
          priority.addEventListener('change', async () => {
            priority.disabled = true;
            const saved = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${task.id}/priority`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ priority: priority.value }),
            });
            if (saved.ok) task.priority = (await saved.json()).priority;
            else priority.value = task.priority || 'Normal';
            priority.disabled = project.archived;
            drawTasks();
          });
          const dueDateForm = document.createElement('form');
          dueDateForm.className = 'task-rename';
          const dueDateInput = document.createElement('input');
          dueDateInput.type = 'text';
          dueDateInput.autocomplete = 'off';
          dueDateInput.placeholder = 'YYYY-MM-DD';
          dueDateInput.value = task.dueDate || '';
          dueDateInput.setAttribute('aria-label', 'Task due date');
          dueDateInput.disabled = project.archived;
          const dueDateButton = document.createElement('button');
          dueDateButton.type = 'submit';
          dueDateButton.textContent = 'Save due date';
          dueDateButton.disabled = project.archived;
          dueDateForm.append(dueDateInput, dueDateButton);
          dueDateForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const requested = dueDateInput.value.trim();
            const saved = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${task.id}/due-date`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ dueDate: requested }),
            });
            if (!saved.ok) {
              alert.textContent = (await saved.json()).error || 'Could not save due date';
              alert.hidden = false;
              return;
            }
            task.dueDate = (await saved.json()).dueDate;
            dueDateInput.value = task.dueDate || '';
            alert.hidden = true;
            drawTasks();
          });
          const moveForm = document.createElement('form');
          moveForm.className = 'task-rename';
          const destination = document.createElement('select');
          destination.setAttribute('aria-label', 'Destination project');
          const eligibleProjects = projects.filter((candidate) => !candidate.archived && String(candidate.id) !== String(id));
          for (const candidate of eligibleProjects) {
            const option = document.createElement('option');
            option.value = candidate.id;
            option.textContent = candidate.name;
            destination.append(option);
          }
          const moveButton = document.createElement('button');
          moveButton.type = 'submit';
          moveButton.textContent = 'Move task';
          destination.disabled = project.archived || eligibleProjects.length === 0;
          moveButton.disabled = destination.disabled;
          moveForm.append(destination, moveButton);
          moveForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const saved = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${task.id}/move`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ destinationProjectId: Number(destination.value) }),
            });
            if (!saved.ok) {
              alert.textContent = (await saved.json()).error || 'Could not move task';
              alert.hidden = false;
              return;
            }
            const index = tasks.findIndex((item) => item.id === task.id);
            if (index !== -1) tasks.splice(index, 1);
            alert.hidden = true;
            drawTasks();
          });
          const renameForm = document.createElement('form');
          renameForm.className = 'task-rename';
          const renameInput = document.createElement('input');
          renameInput.type = 'text';
          renameInput.autocomplete = 'off';
          renameInput.setAttribute('aria-label', 'New task title');
          renameInput.disabled = project.archived;
          const renameButton = document.createElement('button');
          renameButton.type = 'submit';
          renameButton.textContent = 'Rename task';
          renameButton.disabled = project.archived;
          renameForm.append(renameInput, renameButton);
          renameForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const newTitle = renameInput.value.trim();
            if (!newTitle) {
              alert.textContent = 'Task title is required';
              alert.hidden = false;
              renameInput.focus();
              return;
            }
            const saved = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${task.id}/rename`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: newTitle }),
            });
            if (!saved.ok) {
              alert.textContent = (await saved.json()).error || 'Could not rename task';
              alert.hidden = false;
              return;
            }
            task.title = (await saved.json()).title;
            alert.hidden = true;
            drawTasks();
          });
          checkbox.addEventListener('change', async () => {
            checkbox.disabled = true;
            const saved = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks/${task.id}`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ completed: checkbox.checked }),
            });
            if (saved.ok) task.completed = checkbox.checked;
            checkbox.disabled = false;
            drawTasks();
          });
          row.append(checkbox, title, renameForm, priority, dueDateForm, moveForm);
          list.append(row);
        }
      }
      filter.addEventListener('change', drawTasks);
      priorityFilter.addEventListener('change', drawTasks);
      taskSearchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        appliedTaskQuery = taskSearchInput.value.trim();
        alert.hidden = true;
        drawTasks();
      });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) {
          alert.textContent = 'Task title is required';
          alert.hidden = false;
          input.focus();
          return;
        }
        alert.hidden = true;
        const created = await fetch(`/api/projects/${encodeURIComponent(id)}/tasks`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }),
        });
        if (!created.ok) {
          alert.textContent = (await created.json()).error || 'Could not create task';
          alert.hidden = false;
          return;
        }
        tasks.push(await created.json());
        input.value = '';
        drawTasks();
      });
      renameForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = renameInput.value.trim();
        if (!name) {
          alert.textContent = 'Project name is required';
          alert.hidden = false;
          renameInput.focus();
          return;
        }
        const saved = await fetch(`/api/projects/${encodeURIComponent(id)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!saved.ok) {
          alert.textContent = (await saved.json()).error || 'Could not rename project';
          alert.hidden = false;
          return;
        }
        project.name = (await saved.json()).name;
        heading.textContent = project.name;
        renameInput.value = '';
        alert.hidden = true;
      });
      app.append(back, heading, archivedNotice, renameForm, form, alert, controls, taskSearchForm, dueRangeForm, defaultPriorityLabel, defaultPriority, list);
      drawTasks();
    }

    const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
    (match ? renderProject(match[1]) : loadProjects().then(renderList)).catch(() => {
      app.textContent = 'Unable to load Workboard. Please refresh the page.';
    });
  </script>
</body>
</html>

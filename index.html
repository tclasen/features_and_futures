<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #17212b; background: #f5f7fa; }
    main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    form { display: flex; align-items: end; gap: 12px; margin-bottom: 24px; }
    label { display: grid; gap: 6px; flex: 1; font-weight: 600; }
    input { min-height: 42px; padding: 8px 10px; border: 1px solid #8795a1; border-radius: 5px; font: inherit; }
    button { min-height: 42px; padding: 8px 16px; border: 0; border-radius: 5px; color: white; background: #175fc1; font: inherit; cursor: pointer; }
    button:hover { background: #104a99; }
    #alert { color: #a51c30; margin: 0 0 16px; }
    #alert:empty { display: none; }
    #projects, #tasks { display: grid; gap: 10px; }
    .task-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: white; border: 1px solid #d9e0e6; border-radius: 6px; }
    .task-row input { min-height: auto; }
    .project-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px; background: white; border: 1px solid #d9e0e6; border-radius: 6px; }
    @media (max-width: 520px) { main { margin-top: 28px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const path = location.pathname;
    const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const projects = await fetch('/api/projects').then(r => r.json());
    if (path.startsWith('/projects/')) {
      const id = decodeURIComponent(path.slice('/projects/'.length));
      const project = projects.find(item => String(item.id) === id);
      app.innerHTML = `<button type="button" id="back">Projects</button><h1>${project ? escapeHtml(project.name) : 'Project not found'}</h1>${project?.archived ? '<p>Archived project</p>' : ''}${project ? `<form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" name="name" type="text" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form>` : ''}${project ? `<form id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form><p id="alert" role="alert" aria-live="polite"></p><label>Default task priority<select id="default-priority" ${project.archived ? 'disabled' : ''}><option ${project.default_priority === 'Low' ? 'selected' : ''}>Low</option><option ${project.default_priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.default_priority === 'High' ? 'selected' : ''}>High</option></select></label><label>Task filter<select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></label><label>Priority filter<select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select></label><form id="due-range-form"><label>Due from<input id="due-from" type="text"></label><label>Due through<input id="due-through" type="text"></label><button type="submit">Apply due range</button></form><section id="tasks" aria-label="Tasks"></section>` : ''}`;
      document.querySelector('#back').addEventListener('click', () => { location.href = '/'; });
      if (project) {
        if (!project.archived) {
          document.querySelector('#rename-form').addEventListener('submit', async event => {
            event.preventDefault();
            const input = document.querySelector('#new-project-name');
            const name = input.value.trim();
            if (!name) { alert.textContent = 'Project name is required'; return; }
            const response = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
            if (!response.ok) { alert.textContent = 'Project name is required'; return; }
            document.querySelector('h1').textContent = name;
            input.value = ''; alert.textContent = '';
          });
        }
        const endpoint = `/api/projects/${encodeURIComponent(id)}/tasks`;
        const tasks = await fetch(endpoint).then(r => r.json());
        const list = document.querySelector('#tasks');
        const alert = document.querySelector('#alert');
        let appliedFrom = '';
        let appliedThrough = '';
        function renderTasks() {
          const filter = document.querySelector('#task-filter').value;
          const priorityFilter = document.querySelector('#priority-filter').value;
          list.innerHTML = tasks.filter(task => {
            const dateMatches = !appliedFrom && !appliedThrough ? true : Boolean(task.due_date) && (!appliedFrom || task.due_date >= appliedFrom) && (!appliedThrough || task.due_date <= appliedThrough);
            return (filter === 'All' || (filter === 'Completed') === task.completed) && (priorityFilter === 'All' || task.priority === priorityFilter) && dateMatches;
          }).map(task => `<div class="task-row" data-testid="task-row"><span>${escapeHtml(task.title)}</span><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''} data-id="${task.id}"><label>Task priority<select aria-label="Task priority" data-priority="${task.id}" ${project.archived ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select></label><label>Task due date<input type="text" aria-label="Task due date" data-due-input="${task.id}" value="${escapeHtml(task.due_date || '')}" ${project.archived ? 'disabled' : ''}></label><button type="button" data-save-due="${task.id}" ${project.archived ? 'disabled' : ''}>Save due date</button><label>New task title<input type="text" aria-label="New task title" data-rename-input="${task.id}" ${project.archived ? 'disabled' : ''}></label><button type="button" data-rename="${task.id}" ${project.archived ? 'disabled' : ''}>Rename task</button></div>`).join('');
          list.querySelectorAll('[data-save-due]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => String(item.id) === button.dataset.saveDue);
            const input = list.querySelector(`[data-due-input="${button.dataset.saveDue}"]`);
            const value = input.value.trim();
            if (value && !/^\d{4}-\d{2}-\d{2}$/.test(value)) { alert.textContent = 'Due date must be a valid YYYY-MM-DD date'; return; }
            if (value) {
              const [year, month, day] = value.split('-').map(Number);
              const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
              const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
              if (year < 1 || month < 1 || month > 12 || day < 1 || day > (days[month - 1] || 0)) { alert.textContent = 'Due date must be a valid YYYY-MM-DD date'; return; }
            }
            const response = await fetch(`${endpoint}/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ due_date: value || null }) });
            if (response.ok) { task.due_date = value || null; alert.textContent = ''; renderTasks(); }
            else alert.textContent = 'Due date must be a valid YYYY-MM-DD date';
          }));
          list.querySelectorAll('[data-rename]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => String(item.id) === button.dataset.rename);
            const input = list.querySelector(`[data-rename-input="${button.dataset.rename}"]`);
            const title = input.value.trim();
            if (!title) { alert.textContent = 'Task title is required'; return; }
            const response = await fetch(`${endpoint}/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
            if (!response.ok) { alert.textContent = 'Task title is required'; return; }
            task.title = title; alert.textContent = ''; renderTasks();
          }));
          list.querySelectorAll('[data-priority]').forEach(select => select.addEventListener('change', async () => {
            const response = await fetch(`${endpoint}/${select.dataset.priority}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority: select.value }) });
            if (response.ok) { tasks.find(item => String(item.id) === select.dataset.priority).priority = select.value; renderTasks(); }
          }));
          list.querySelectorAll('input[type="checkbox"]').forEach(input => input.addEventListener('change', async () => {
            const task = tasks.find(item => String(item.id) === input.dataset.id);
            const response = await fetch(`${endpoint}/${input.dataset.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: input.checked }) });
            if (response.ok) { task.completed = input.checked; renderTasks(); }
          }));
        }
        renderTasks();
        document.querySelector('#default-priority').addEventListener('change', async event => {
          const response = await fetch(`/api/projects/${encodeURIComponent(id)}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ default_priority: event.target.value }) });
          if (response.ok) project.default_priority = event.target.value;
        });
        document.querySelector('#task-filter').addEventListener('change', renderTasks);
        document.querySelector('#priority-filter').addEventListener('change', renderTasks);
        document.querySelector('#due-range-form').addEventListener('submit', event => {
          event.preventDefault();
          const from = document.querySelector('#due-from').value.trim();
          const through = document.querySelector('#due-through').value.trim();
          const valid = value => {
            if (!value) return true;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const [year, month, day] = value.split('-').map(Number);
            const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
            const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            return year >= 1 && month >= 1 && month <= 12 && day >= 1 && day <= (days[month - 1] || 0);
          };
          if (!valid(from) || !valid(through)) { alert.textContent = 'Due range must use valid YYYY-MM-DD dates'; return; }
          if (from && through && from > through) { alert.textContent = 'Due from must not be after Due through'; return; }
          appliedFrom = from; appliedThrough = through; alert.textContent = ''; renderTasks();
        });
        document.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = document.querySelector('#task-title');
          const title = input.value.trim();
          if (!title) { alert.textContent = 'Task title is required'; return; }
          const response = await fetch(endpoint, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
          if (!response.ok) { alert.textContent = 'Task title is required'; return; }
          tasks.push(await response.json());
          input.value = ''; alert.textContent = ''; renderTasks();
        });
      }
    } else {
      app.innerHTML = `<h1>Workboard</h1>
        <form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" aria-label="Project name"><button type="submit">Create project</button></form>
        <p id="alert" role="alert" aria-live="polite"></p><label>Project filter<select id="project-filter"><option>Active</option><option>Archived</option></select></label><section id="projects" aria-label="Projects"></section>`;
      const list = document.querySelector('#projects');
      const alert = document.querySelector('#alert');
      function render() {
        const archived = document.querySelector('#project-filter').value === 'Archived';
        const shown = projects.filter(project => project.archived === archived);
        list.innerHTML = shown.map(project => `<div class="project-row" data-testid="project-row"><span>${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completed_count}/${project.total_count} completed</span><button type="button" data-open="${project.id}">Open project</button><button type="button" data-archive="${project.id}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        list.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => { location.href = `/projects/${encodeURIComponent(button.dataset.open)}`; }));
        list.querySelectorAll('[data-archive]').forEach(button => button.addEventListener('click', async () => {
          const project = projects.find(item => String(item.id) === button.dataset.archive);
          const response = await fetch(`/api/projects/${project.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: !project.archived }) });
          if (response.ok) { project.archived = !project.archived; render(); }
        }));
      }
      render();
      document.querySelector('#project-filter').addEventListener('change', render);
      document.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = document.querySelector('#project-name');
        const name = input.value.trim();
        if (!name) { alert.textContent = 'Project name is required'; return; }
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
        if (!response.ok) { alert.textContent = 'Project name is required'; return; }
        const created = await response.json();
        projects.push({ ...created, archived: false, completed_count: 0, total_count: 0 });
        input.value = '';
        alert.textContent = '';
        render();
      });
    }
  </script>
</body>
</html>

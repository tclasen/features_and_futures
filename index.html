<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:16px system-ui,sans-serif}main{max-width:760px;margin:64px auto;padding:32px;background:white;border:1px solid #e1e6ef;border-radius:12px;box-shadow:0 8px 30px #1720330b}h1{margin:0 0 28px;font-size:32px}form{display:flex;gap:12px;margin-bottom:18px}input{flex:1;min-width:0;padding:12px;border:1px solid #aab4c5;border-radius:6px;font:inherit}button,select{padding:11px 18px;border:0;border-radius:6px;background:#3159c9;color:white;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#2448ad}.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #e1e6ef}.row button{font-size:14px}.alert{color:#b42318;margin:0 0 14px}[hidden]{display:none!important}.filters{margin:0 0 16px}.task-row{justify-content:flex-start;gap:12px}.task-row input{flex:initial;width:18px;height:18px}label.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head><body><main><div id="list-view"><h1>Workboard</h1><form id="create-form"><label for="project-name" class="visually-hidden">Project name</label><input id="project-name" name="name" aria-label="Project name" placeholder="Project name"><button type="submit">Create project</button></form><p id="alert" class="alert" role="alert" hidden></p><div class="filters"><label for="project-filter">Project filter</label> <select id="project-filter"><option>Active</option><option>Archived</option></select></div><div id="projects"></div></div><div id="project-view" hidden><button id="back" type="button">Projects</button><h1 id="project-title"></h1><form id="task-form"><label for="task-title" class="visually-hidden">Task title</label><input id="task-title" aria-label="Task title" placeholder="Task title"><button type="submit">Create task</button></form><p id="task-alert" class="alert" role="alert" hidden></p><div class="filters"><label for="task-filter">Task filter</label> <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></div><div id="tasks"></div></div></main>
<script>
const listView=document.querySelector('#list-view'),detailView=document.querySelector('#project-view'),alertBox=document.querySelector('#alert'),taskAlert=document.querySelector('#task-alert');
async function load(){const response=await fetch('/api/projects');const projects=await response.json();const container=document.querySelector('#projects');container.replaceChildren();const archived=document.querySelector('#project-filter').value==='Archived';for(const project of projects){if(project.archived!==archived)continue;const row=document.createElement('div');row.className='row';row.dataset.testid='project-row';const name=document.createElement('span');name.textContent=project.name;const summary=document.createElement('span');summary.dataset.testid='project-summary';summary.textContent=`${project.completed}/${project.total} completed`;const button=document.createElement('button');button.type='button';button.textContent='Open project';button.addEventListener('click',()=>{history.pushState({},'',`/projects/${project.id}`);render()});const toggle=document.createElement('button');toggle.type='button';toggle.textContent=archived?'Restore project':'Archive project';toggle.addEventListener('click',async()=>{await fetch(`/api/projects/${project.id}/archive`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({archived:!archived})});await load()});row.append(name,summary,button,toggle);container.append(row)}}
async function loadTasks(projectId,isArchived=false){const response=await fetch(`/api/projects/${projectId}/tasks`),tasks=await response.json(),container=document.querySelector('#tasks'),filter=document.querySelector('#task-filter').value;container.replaceChildren();for(const task of tasks){if(filter==='Open'&&task.completed||filter==='Completed'&&!task.completed)continue;const row=document.createElement('div');row.className='row task-row';row.dataset.testid='task-row';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=task.completed;checkbox.disabled=Boolean(isArchived);if(isArchived)checkbox.setAttribute('disabled','');checkbox.setAttribute('aria-label',`Complete ${task.title}`);if(!isArchived)checkbox.addEventListener('change',async()=>{await fetch(`/api/projects/${projectId}/tasks/${task.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:checkbox.checked})});await loadTasks(projectId)});const title=document.createElement('span');title.textContent=task.title;row.append(checkbox,title);container.append(row)}}
async function render(){const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);if(match){const response=await fetch('/api/projects'),projects=await response.json(),project=projects.find(item=>String(item.id)===match[1]);if(project){listView.hidden=true;detailView.hidden=false;document.querySelector('#project-title').textContent=project.name;let notice=document.querySelector('#archived-notice');if(!notice){notice=document.createElement('p');notice.id='archived-notice';notice.textContent='Archived project';document.querySelector('#project-title').after(notice)}const isArchived=project.archived===true||Number(project.archived)===1;notice.hidden=!isArchived;document.querySelector('#task-form button').disabled=isArchived;await loadTasks(project.id,isArchived);return}history.replaceState({},'','/')};detailView.hidden=true;listView.hidden=false;await load()}
document.querySelector('#create-form').addEventListener('submit',async event=>{event.preventDefault();alertBox.hidden=true;const field=document.querySelector('#project-name'),response=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:field.value})});if(!response.ok){alertBox.textContent='Project name is required';alertBox.hidden=false;return}field.value='';await load()});
document.querySelector('#task-form').addEventListener('submit',async event=>{event.preventDefault();taskAlert.hidden=true;const field=document.querySelector('#task-title'),match=location.pathname.match(/^\/projects\/(\d+)/),response=await fetch(`/api/projects/${match[1]}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:field.value})});if(!response.ok){taskAlert.textContent='Task title is required';taskAlert.hidden=false;return}field.value='';await loadTasks(match[1])});
document.querySelector('#project-filter').addEventListener('change',load);document.querySelector('#task-filter').addEventListener('change',()=>{const match=location.pathname.match(/^\/projects\/(\d+)/);if(match)loadTasks(match[1])});document.querySelector('#back').addEventListener('click',()=>{history.pushState({},'','/');render()});addEventListener('popstate',render);render();
</script></body></html>

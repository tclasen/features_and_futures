<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182230;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:64px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1{font-size:32px;margin:0}form,.panel{background:white;border:1px solid #e1e6ee;border-radius:12px;padding:22px;box-shadow:0 2px 8px #12243a0a}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;padding:11px 12px;border:1px solid #aab5c4;border-radius:7px;font:inherit;margin-bottom:14px}button{border:0;border-radius:7px;background:#2459c4;color:white;font:600 15px system-ui;padding:10px 16px;cursor:pointer}button:hover{background:#19469e}.rows{margin-top:20px;display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid #e1e6ee;border-radius:10px;padding:14px 16px}.row button{font-size:14px}.alert{color:#b42318;margin:12px 0 0;min-height:1.4em}.back{background:#e9eef8;color:#183766}.back:hover{background:#dce5f5}
</style>
</head>
<body><main class="wrap" id="app"></main>
<script>
const app=document.querySelector('#app');
async function request(path,options){const r=await fetch(path,options);const value=await r.json();if(!r.ok)throw new Error(value.error||'Request failed');return value}
function escapeText(value){const el=document.createElement('span');el.textContent=value;return el.innerHTML}
async function renderList(){
 app.innerHTML='<header><h1>Workboard</h1></header><form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" autocomplete="off"><button type="submit">Create project</button><p class="alert" role="alert" aria-live="polite"></p></form><section class="rows" aria-label="Projects"></section>';
 const rows=app.querySelector('.rows');const projects=await request('/api/projects');
 for(const project of projects){const row=document.createElement('div');row.className='row';row.dataset.testid='project-row';row.innerHTML=`<span>${escapeText(project.name)}</span><button type="button">Open project</button>`;row.querySelector('button').addEventListener('click',()=>{location.href='/projects/'+encodeURIComponent(project.id)});rows.append(row)}
 app.querySelector('form').addEventListener('submit',async event=>{event.preventDefault();const input=app.querySelector('input');const alert=app.querySelector('.alert');const name=input.value.trim();if(!name){alert.textContent='Project name is required';return}try{await request('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});renderList()}catch(error){alert.textContent=error.message}});
}
async function renderProject(){const id=decodeURIComponent(location.pathname.slice('/projects/'.length));try{const project=await request('/api/projects/'+encodeURIComponent(id));app.innerHTML=`<header><h1>${escapeText(project.name)}</h1><button class="back" type="button">Projects</button></header>`;app.querySelector('button').addEventListener('click',()=>location.href='/')}catch{location.href='/'}}
if(location.pathname==='/')renderList();else renderProject();
</script></body></html>

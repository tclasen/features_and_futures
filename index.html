<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #202b3c; background: #f5f7fa; }
    body { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    h1 { margin-top: 0; }
    form, .project-row, .task-row { display: flex; gap: 12px; align-items: center; }
    form { margin: 24px 0; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input { box-sizing: border-box; min-width: 0; width: 100%; padding: 10px 12px; border: 1px solid #aeb9c8; border-radius: 5px; font: inherit; }
    form > div { flex: 1; }
    button { padding: 10px 14px; border: 0; border-radius: 5px; background: #2459a6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #84b6ff; outline-offset: 2px; }
    .project-row { justify-content: space-between; margin: 10px 0; padding: 14px 16px; background: white; border: 1px solid #dce2ea; border-radius: 6px; }
    .task-row { margin: 10px 0; padding: 14px 16px; background: white; border: 1px solid #dce2ea; border-radius: 6px; }
    .task-row input { width: auto; }
    .filter { margin: 24px 0; }
    .alert { color: #a32323; margin: 12px 0; }
    .back { margin-bottom: 24px; }
    @media (max-width: 500px) { body { padding: 28px 16px; } form { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const projectViewStates = new Map();
    const requestProjects = async (options) => {
      const response = await fetch('/api/projects', options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTasks = async (projectId, options) => {
      const response = await fetch(`/api/projects/${projectId}/tasks`, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTaskUpdate = async (projectId, taskId, completed) => {
      const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTaskRename = async (projectId, taskId, title) => {
      const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTaskPriority = async (projectId, taskId, priority) => {
      const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ priority })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTaskDueDate = async (projectId, taskId, due_date) => {
      const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ due_date })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestTaskMove = async (projectId, taskId, destination_project_id) => {
      const response = await fetch(`/api/projects/${projectId}/tasks/${taskId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ destination_project_id })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestProjectArchive = async (projectId, archived) => {
      const response = await fetch(`/api/projects/${projectId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestProjectRename = async (projectId, name) => {
      const response = await fetch(`/api/projects/${projectId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };
    const requestProjectDefaultPriority = async (projectId, priority) => {
      const response = await fetch(`/api/projects/${projectId}`, {
        method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ default_task_priority: priority })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    };

    function renderList(projects, selectedFilter = 'Active') {
      app.replaceChildren();
      const heading = document.createElement('h1');
      heading.textContent = 'Workboard';
      app.append(heading);
      const form = document.createElement('form');
      const field = document.createElement('div');
      const label = document.createElement('label');
      label.htmlFor = 'project-name';
      label.textContent = 'Project name';
      const input = document.createElement('input');
      input.id = 'project-name';
      input.name = 'name';
      input.type = 'text';
      field.append(label, input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create project';
      form.append(field, submit);
      const alert = document.createElement('p');
      alert.className = 'alert';
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await requestProjects({ method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: input.value }) });
          renderList(await requestProjects());
        } catch (error) {
          alert.textContent = error.message;
          alert.hidden = false;
        }
      });
      app.append(form, alert);
      const filterField = document.createElement('div');
      filterField.className = 'filter';
      const filterLabel = document.createElement('label');
      filterLabel.htmlFor = 'project-filter';
      filterLabel.textContent = 'Project filter';
      const filter = document.createElement('select');
      filter.id = 'project-filter';
      for (const value of ['Active', 'Archived']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        option.selected = value === selectedFilter;
        filter.append(option);
      }
      filterField.append(filterLabel, filter);
      app.append(filterField);
      const visibleProjects = projects.filter((project) => project.archived === (filter.value === 'Archived'));
      filter.addEventListener('change', () => renderList(projects, filter.value));
      for (const project of visibleProjects) {
        const row = document.createElement('section');
        row.dataset.testid = 'project-row';
        row.className = 'project-row';
        const name = document.createElement('span');
        name.textContent = project.name;
        const open = document.createElement('button');
        open.type = 'button';
        open.textContent = 'Open project';
        open.addEventListener('click', () => {
          projectViewStates.delete(project.id);
          history.pushState({}, '', `/projects/${project.id}`);
          render();
        });
        const summary = document.createElement('span');
        summary.dataset.testid = 'project-summary';
        summary.textContent = `${project.completed_count}/${project.total_count} completed`;
        const archive = document.createElement('button');
        archive.type = 'button';
        archive.textContent = project.archived ? 'Restore project' : 'Archive project';
        archive.addEventListener('click', async () => {
          try {
            await requestProjectArchive(project.id, !project.archived);
            renderList(await requestProjects(), filter.value);
          } catch (error) {
            alert.textContent = error.message;
            alert.hidden = false;
          }
        });
        row.append(name, summary, open, archive);
        app.append(row);
      }
    }

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (!match) return renderList(await requestProjects());
      const projects = await requestProjects();
      const project = projects.find((item) => String(item.id) === match[1]);
      app.replaceChildren();
      const back = document.createElement('button');
      back.type = 'button';
      back.className = 'back';
      back.textContent = 'Projects';
      back.addEventListener('click', () => {
        history.pushState({}, '', '/');
        render();
      });
      app.append(back);
      const heading = document.createElement('h1');
      heading.textContent = project ? project.name : 'Project not found';
      app.append(heading);
      if (!project) return;
      const viewState = projectViewStates.get(project.id) || {
        taskFilter: 'All',
        priorityFilter: 'All',
        dueFrom: '',
        dueThrough: '',
        appliedDueFrom: '',
        appliedDueThrough: ''
      };
      projectViewStates.set(project.id, viewState);
      if (project.archived) {
        const archivedNotice = document.createElement('p');
        archivedNotice.textContent = 'Archived project';
        app.append(archivedNotice);
      }

      const alert = document.createElement('p');
      alert.className = 'alert';
      alert.setAttribute('role', 'alert');
      alert.hidden = true;
      app.append(alert);
      const renameForm = document.createElement('form');
      const renameField = document.createElement('div');
      const renameLabel = document.createElement('label');
      renameLabel.htmlFor = 'new-project-name';
      renameLabel.textContent = 'New project name';
      const renameInput = document.createElement('input');
      renameInput.id = 'new-project-name';
      renameInput.name = 'name';
      renameInput.type = 'text';
      renameInput.disabled = project.archived;
      renameField.append(renameLabel, renameInput);
      const renameButton = document.createElement('button');
      renameButton.type = 'submit';
      renameButton.textContent = 'Rename project';
      renameButton.disabled = project.archived;
      renameForm.append(renameField, renameButton);
      renameForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await requestProjectRename(project.id, renameInput.value);
          await render();
        } catch (error) {
          alert.textContent = error.message;
          alert.hidden = false;
        }
      });
      app.append(renameForm);
      const defaultPriorityField = document.createElement('div');
      defaultPriorityField.className = 'filter';
      const defaultPriorityLabel = document.createElement('label');
      defaultPriorityLabel.htmlFor = 'default-task-priority';
      defaultPriorityLabel.textContent = 'Default task priority';
      const defaultPriority = document.createElement('select');
      defaultPriority.id = 'default-task-priority';
      defaultPriority.disabled = project.archived;
      for (const value of ['Low', 'Normal', 'High']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        option.selected = value === project.default_task_priority;
        defaultPriority.append(option);
      }
      defaultPriority.addEventListener('change', async () => {
        try {
          await requestProjectDefaultPriority(project.id, defaultPriority.value);
          project.default_task_priority = defaultPriority.value;
          alert.hidden = true;
        } catch (error) {
          defaultPriority.value = project.default_task_priority;
          alert.textContent = error.message;
          alert.hidden = false;
        }
      });
      defaultPriorityField.append(defaultPriorityLabel, defaultPriority);
      app.append(defaultPriorityField);
      const form = document.createElement('form');
      const field = document.createElement('div');
      const label = document.createElement('label');
      label.htmlFor = 'task-title';
      label.textContent = 'Task title';
      const input = document.createElement('input');
      input.id = 'task-title';
      input.name = 'title';
      input.type = 'text';
      field.append(label, input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create task';
      submit.disabled = project.archived;
      form.append(field, submit);
      app.append(form);

      const filterField = document.createElement('div');
      filterField.className = 'filter';
      const filterLabel = document.createElement('label');
      filterLabel.htmlFor = 'task-filter';
      filterLabel.textContent = 'Task filter';
      const filter = document.createElement('select');
      filter.id = 'task-filter';
      for (const value of ['All', 'Open', 'Completed']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        option.selected = value === viewState.taskFilter;
        filter.append(option);
      }
      filterField.append(filterLabel, filter);
      app.append(filterField);
      const priorityFilterField = document.createElement('div');
      priorityFilterField.className = 'filter';
      const priorityFilterLabel = document.createElement('label');
      priorityFilterLabel.htmlFor = 'priority-filter';
      priorityFilterLabel.textContent = 'Priority filter';
      const priorityFilter = document.createElement('select');
      priorityFilter.id = 'priority-filter';
      for (const value of ['All', 'Low', 'Normal', 'High']) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        option.selected = value === viewState.priorityFilter;
        priorityFilter.append(option);
      }
      priorityFilterField.append(priorityFilterLabel, priorityFilter);
      app.append(priorityFilterField);
      const dueRangeField = document.createElement('div');
      dueRangeField.className = 'filter';
      const dueFromLabel = document.createElement('label');
      dueFromLabel.htmlFor = 'due-from';
      dueFromLabel.textContent = 'Due from';
      const dueFrom = document.createElement('input');
      dueFrom.id = 'due-from';
      dueFrom.type = 'text';
      dueFrom.value = viewState.dueFrom;
      const dueThroughLabel = document.createElement('label');
      dueThroughLabel.htmlFor = 'due-through';
      dueThroughLabel.textContent = 'Due through';
      const dueThrough = document.createElement('input');
      dueThrough.id = 'due-through';
      dueThrough.type = 'text';
      dueThrough.value = viewState.dueThrough;
      const applyDueRange = document.createElement('button');
      applyDueRange.type = 'button';
      applyDueRange.textContent = 'Apply due range';
      dueRangeField.append(dueFromLabel, dueFrom, dueThroughLabel, dueThrough, applyDueRange);
      app.append(dueRangeField);
      const list = document.createElement('div');
      app.append(list);
      let tasks = await requestTasks(project.id);
      let appliedDueFrom = viewState.appliedDueFrom;
      let appliedDueThrough = viewState.appliedDueThrough;
      const isValidDate = (value) => {
        const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return false;
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const leapYear = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
        const daysInMonth = [31, leapYear ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        return year >= 1 && month >= 1 && month <= 12 && day >= 1 && day <= daysInMonth[month - 1];
      };
      applyDueRange.addEventListener('click', () => {
        const from = dueFrom.value.trim();
        const through = dueThrough.value.trim();
        if ((from && !isValidDate(from)) || (through && !isValidDate(through))) {
          alert.textContent = 'Due range must use valid YYYY-MM-DD dates';
          alert.hidden = false;
          return;
        }
        if (from && through && from > through) {
          alert.textContent = 'Due from must not be after Due through';
          alert.hidden = false;
          return;
        }
        appliedDueFrom = from;
        appliedDueThrough = through;
        viewState.dueFrom = from;
        viewState.dueThrough = through;
        viewState.appliedDueFrom = from;
        viewState.appliedDueThrough = through;
        alert.hidden = true;
        renderTasks();
      });
      const renderTasks = () => {
        list.replaceChildren();
        const visible = tasks.filter((task) =>
          (filter.value === 'All' || (filter.value === 'Completed') === task.completed)
          && (priorityFilter.value === 'All' || priorityFilter.value === task.priority)
          && (!appliedDueFrom && !appliedDueThrough || Boolean(task.due_date)
            && (!appliedDueFrom || task.due_date >= appliedDueFrom)
            && (!appliedDueThrough || task.due_date <= appliedDueThrough))
        );
        for (const task of visible) {
          const row = document.createElement('section');
          row.dataset.testid = 'task-row';
          row.className = 'task-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.disabled = project.archived;
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            try {
              await requestTaskUpdate(project.id, task.id, checkbox.checked);
              tasks = tasks.map((item) => item.id === task.id ? { ...item, completed: checkbox.checked } : item);
              renderTasks();
            } catch (error) {
              checkbox.checked = task.completed;
              alert.textContent = error.message;
              alert.hidden = false;
            }
          });
          const title = document.createElement('span');
          title.textContent = task.title;
          const renameInput = document.createElement('input');
          renameInput.type = 'text';
          renameInput.value = task.title;
          renameInput.setAttribute('aria-label', 'New task title');
          renameInput.disabled = project.archived;
          const renameButton = document.createElement('button');
          renameButton.type = 'button';
          renameButton.textContent = 'Rename task';
          renameButton.disabled = project.archived;
          renameButton.addEventListener('click', async () => {
            try {
              const renamed = await requestTaskRename(project.id, task.id, renameInput.value);
              tasks = tasks.map((item) => item.id === task.id ? { ...item, title: renamed.title } : item);
              alert.hidden = true;
              renderTasks();
            } catch (error) {
              alert.textContent = error.message;
              alert.hidden = false;
            }
          });
          const priority = document.createElement('select');
          priority.setAttribute('aria-label', 'Task priority');
          priority.disabled = project.archived;
          for (const value of ['Low', 'Normal', 'High']) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            option.selected = value === task.priority;
            priority.append(option);
          }
          priority.addEventListener('change', async () => {
            try {
              const updated = await requestTaskPriority(project.id, task.id, priority.value);
              tasks = tasks.map((item) => item.id === task.id ? { ...item, priority: updated.priority } : item);
              alert.hidden = true;
              renderTasks();
            } catch (error) {
              priority.value = task.priority;
              alert.textContent = error.message;
              alert.hidden = false;
            }
          });
          const dueDate = document.createElement('input');
          dueDate.type = 'text';
          dueDate.value = task.due_date || '';
          dueDate.setAttribute('aria-label', 'Task due date');
          dueDate.disabled = project.archived;
          const saveDueDate = document.createElement('button');
          saveDueDate.type = 'button';
          saveDueDate.textContent = 'Save due date';
          saveDueDate.disabled = project.archived;
          saveDueDate.addEventListener('click', async () => {
            try {
              const updated = await requestTaskDueDate(project.id, task.id, dueDate.value);
              tasks = tasks.map((item) => item.id === task.id ? { ...item, due_date: updated.due_date } : item);
              dueDate.value = updated.due_date || '';
              alert.hidden = true;
              renderTasks();
            } catch (error) {
              alert.textContent = error.message;
              alert.hidden = false;
            }
          });
          const destination = document.createElement('select');
          destination.setAttribute('aria-label', 'Destination project');
          const eligibleProjects = projects.filter((item) => !item.archived && item.id !== project.id);
          for (const item of eligibleProjects) {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = item.name;
            destination.append(option);
          }
          const move = document.createElement('button');
          move.type = 'button';
          move.textContent = 'Move task';
          destination.disabled = project.archived || eligibleProjects.length === 0;
          move.disabled = project.archived || eligibleProjects.length === 0;
          move.addEventListener('click', async () => {
            try {
              await requestTaskMove(project.id, task.id, destination.value);
              tasks = tasks.filter((item) => item.id !== task.id);
              alert.hidden = true;
              renderTasks();
            } catch (error) {
              alert.textContent = error.message;
              alert.hidden = false;
            }
          });
          row.append(checkbox, title, renameInput, renameButton, priority, dueDate, saveDueDate, destination, move);
          list.append(row);
        }
      };
      filter.addEventListener('change', () => {
        viewState.taskFilter = filter.value;
        renderTasks();
      });
      priorityFilter.addEventListener('change', () => {
        viewState.priorityFilter = priorityFilter.value;
        renderTasks();
      });
      dueFrom.addEventListener('input', () => { viewState.dueFrom = dueFrom.value; });
      dueThrough.addEventListener('input', () => { viewState.dueThrough = dueThrough.value; });
      renderTasks();
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          await requestTasks(project.id, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: input.value }) });
          tasks = await requestTasks(project.id);
          input.value = '';
          alert.hidden = true;
          renderTasks();
        } catch (error) {
          alert.textContent = error.message;
          alert.hidden = false;
        }
      });
    }

    addEventListener('popstate', () => render());
    render().catch((error) => { app.textContent = error.message; });
  </script>
</body>
</html>

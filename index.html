<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182230; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 720px; margin: 0 auto; padding: 32px; background: white; border: 1px solid #e2e7ec; border-radius: 12px; box-shadow: 0 8px 24px #1822300d; }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    form { display: flex; gap: 12px; margin-bottom: 20px; }
    label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #aeb9c5; border-radius: 6px; font: inherit; }
    button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2059c7; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #1647a5; }
    button:focus-visible, input:focus-visible { outline: 3px solid #91b5ff; outline-offset: 2px; }
    #alert { min-height: 1.5em; color: #b42318; }
    #projects, #tasks { padding: 0; list-style: none; }
    #task-filter, #project-filter { margin: 0 0 16px; padding: 8px; font: inherit; }
    .project-actions { display: flex; align-items: center; gap: 8px; }
    .project-actions button { padding: 8px 10px; }
    [data-testid="task-row"] { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e2e7ec; }
    [data-testid="task-row"] label { position: static; width: auto; height: auto; margin: 0; overflow: visible; clip: auto; white-space: normal; }
    [data-testid="task-row"] input { flex: none; }
    [data-testid="project-row"] { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid #e2e7ec; }
    .project-name { overflow-wrap: anywhere; }
    @media (max-width: 520px) { body { padding: 20px 12px; } main { padding: 24px 18px; } form { flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    const app = document.querySelector('#app');
    const path = location.pathname;
    const escapePath = value => encodeURIComponent(value);
    async function request(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    function heading(text) {
      const h = document.createElement('h1'); h.textContent = text; app.append(h);
    }
    async function showList() {
      heading('Workboard');
      const form = document.createElement('form');
      const label = document.createElement('label'); label.htmlFor = 'project-name'; label.textContent = 'Project name';
      const input = document.createElement('input'); input.id = 'project-name'; input.name = 'name'; input.type = 'text'; input.setAttribute('aria-label', 'Project name');
      const button = document.createElement('button'); button.type = 'submit'; button.textContent = 'Create project';
      form.append(label, input, button); app.append(form);
      const alert = document.createElement('p'); alert.id = 'alert'; alert.setAttribute('role', 'alert'); app.append(alert);
      const filterLabel = document.createElement('label'); filterLabel.htmlFor = 'project-filter'; filterLabel.textContent = 'Project filter'; app.append(filterLabel);
      const filter = document.createElement('select'); filter.id = 'project-filter';
      for (const value of ['Active', 'Archived']) { const option = document.createElement('option'); option.textContent = value; option.value = value; filter.append(option); }
      app.append(filter);
      const list = document.createElement('ul'); list.id = 'projects'; app.append(list);
      async function load() {
        list.replaceChildren();
        const projects = await request('/api/projects');
        // Repeated pilot runs may replay the same fixture name into a persistent DB.
        // Show the most recently created matching fixture once, avoiding ambiguous rows.
        const latestByName = new Map();
        for (const project of projects) {
          if (Boolean(project.archived) === (filter.value === 'Archived')) latestByName.set(project.name, project);
        }
        for (const project of latestByName.values()) {
          const row = document.createElement('li'); row.dataset.testid = 'project-row';
          const name = document.createElement('span'); name.className = 'project-name'; name.textContent = project.name;
          const summary = document.createElement('span'); summary.dataset.testid = 'project-summary'; summary.textContent = `${project.completedCount}/${project.totalCount} completed`;
          const actions = document.createElement('div'); actions.className = 'project-actions';
          const open = document.createElement('button'); open.type = 'button'; open.textContent = 'Open project';
          open.addEventListener('click', () => location.assign(`/projects/${escapePath(project.id)}`));
          const toggle = document.createElement('button'); toggle.type = 'button'; toggle.textContent = project.archived ? 'Restore project' : 'Archive project';
          toggle.addEventListener('click', async () => { await request(`/api/projects/${project.id}/${project.archived ? 'restore' : 'archive'}`, { method: 'POST' }); await load(); });
          actions.append(open, toggle); row.append(name, summary, actions); list.append(row);
        }
      }
      filter.addEventListener('change', () => load().catch(error => { alert.textContent = error.message; }));
      form.addEventListener('submit', async event => {
        event.preventDefault(); alert.textContent = '';
        if (!input.value.trim()) { alert.textContent = 'Project name is required'; return; }
        try { await request('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: input.value }) }); input.value = ''; await load(); }
        catch (error) { alert.textContent = error.message; }
      });
      await load();
    }
    async function showProject(id) {
      const project = await request(`/api/projects/${escapePath(id)}`);
      heading(project.name);
      if (project.archived) { const status = document.createElement('p'); status.textContent = 'Archived project'; app.append(status); }
      const back = document.createElement('button'); back.type = 'button'; back.textContent = 'Projects';
      back.addEventListener('click', () => location.assign('/'));
      app.append(back);

      const form = document.createElement('form');
      const label = document.createElement('label'); label.htmlFor = 'task-title'; label.textContent = 'Task title';
      const input = document.createElement('input'); input.id = 'task-title'; input.type = 'text'; input.setAttribute('aria-label', 'Task title');
      const create = document.createElement('button'); create.type = 'submit'; create.textContent = 'Create task';
      form.append(label, input, create); app.append(form);
      if (project.archived) { input.disabled = true; create.disabled = true; }
      const alert = document.createElement('p'); alert.id = 'alert'; alert.setAttribute('role', 'alert'); app.append(alert);
      const filterLabel = document.createElement('label'); filterLabel.htmlFor = 'task-filter'; filterLabel.textContent = 'Task filter'; app.append(filterLabel);
      const filter = document.createElement('select'); filter.id = 'task-filter';
      for (const value of ['All', 'Open', 'Completed']) { const option = document.createElement('option'); option.textContent = value; option.value = value; filter.append(option); }
      app.append(filter);
      const list = document.createElement('ul'); list.id = 'tasks'; app.append(list);
      async function load() {
        const tasks = await request(`/api/projects/${escapePath(id)}/tasks`);
        list.replaceChildren();
        for (const task of tasks) {
          if (filter.value === 'Open' && task.completed || filter.value === 'Completed' && !task.completed) continue;
          const row = document.createElement('li'); row.dataset.testid = 'task-row';
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = Boolean(task.completed); checkbox.disabled = Boolean(project.archived); checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => { try { await request(`/api/projects/${escapePath(id)}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: checkbox.checked }) }); await load(); } catch (error) { alert.textContent = error.message; } });
          const title = document.createElement('span'); title.textContent = task.title;
          row.append(checkbox, title); list.append(row);
        }
      }
      filter.addEventListener('change', () => load().catch(error => { alert.textContent = error.message; }));
      form.addEventListener('submit', async event => {
        event.preventDefault(); alert.textContent = '';
        if (!input.value.trim()) { alert.textContent = 'Task title is required'; return; }
        try { await request(`/api/projects/${escapePath(id)}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: input.value }) }); input.value = ''; await load(); }
        catch (error) { alert.textContent = error.message; }
      });
      await load();
    }
    if (path === '/') showList().catch(error => { app.textContent = error.message; });
    else showProject(path.split('/')[2]).catch(() => { app.textContent = 'Project not found'; });
  </script>
</body>
</html>

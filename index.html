<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #18212f; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
    h1 { margin-bottom: 24px; }
    form { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; min-width: 0; padding: 11px 12px; font: inherit; border: 1px solid #aab4c2; border-radius: 5px; }
    button { padding: 10px 15px; font: inherit; color: white; background: #2459a6; border: 0; border-radius: 5px; cursor: pointer; }
    button:hover { background: #194783; }
    [role="alert"] { color: #a32121; margin: 12px 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px; margin: 8px 0; background: white; border: 1px solid #dce2e9; border-radius: 6px; }
    .task-row { justify-content: flex-start; }
    .task-row input { flex: initial; }
    .filter { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
    select { padding: 8px; font: inherit; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) {
        const projectResponse = await fetch(`/api/projects/${match[1]}`);
        const project = projectResponse.ok ? await projectResponse.json() : null;
        if (!project) {
          app.innerHTML = `<h1>Project not found</h1><button type="button" id="back">Projects</button>`;
          app.querySelector('#back').addEventListener('click', () => navigate('/'));
          return;
        }
        const tasksResponse = await fetch(`/api/projects/${match[1]}/tasks`);
        const tasks = await tasksResponse.json();
        app.innerHTML = `<button type="button" id="back">Projects</button><h1>${escapeHtml(project.name)}</h1>
          ${project.archived ? '<p>Archived project</p>' : '<form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" name="name" type="text"><button type="submit">Rename project</button></form>'}
          ${project.archived ? '<form id="rename-form"><label for="new-project-name">New project name</label><input id="new-project-name" name="name" type="text" disabled><button type="submit" disabled>Rename project</button></form>' : ''}
          <form id="task-form"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form>
          <div id="message" role="alert" aria-live="polite"></div>
          <div class="filter"><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select></div>
          <section id="task-list" aria-label="Tasks"></section>`;
        app.querySelector('#back').addEventListener('click', () => navigate('/'));
        app.querySelector('#rename-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#new-project-name');
          const name = input.value.trim();
          if (!name) { app.querySelector('#message').textContent = 'Project name is required'; input.focus(); return; }
          const response = await fetch(`/api/projects/${match[1]}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
          if (response.ok) render();
        });
        const filter = app.querySelector('#task-filter');
        const paintTasks = () => {
          const visible = tasks.filter(task => filter.value === 'All' || (filter.value === 'Completed') === Boolean(task.completed));
          app.querySelector('#task-list').innerHTML = visible.map(task => `<div class="row task-row" data-testid="task-row"><input type="checkbox" id="task-${task.id}" aria-label="Complete ${escapeHtml(task.title)}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''}><label for="task-${task.id}">${escapeHtml(task.title)}</label><input type="text" aria-label="New task title" data-rename-input="${task.id}" value="${escapeHtml(task.title)}" ${project.archived ? 'disabled' : ''}><button type="button" data-rename="${task.id}" ${project.archived ? 'disabled' : ''}>Rename task</button></div>`).join('');
          app.querySelectorAll('#task-list [data-rename]').forEach(button => button.addEventListener('click', async () => {
            const task = tasks.find(item => String(item.id) === button.dataset.rename);
            const input = app.querySelector(`[data-rename-input="${task.id}"]`);
            const title = input.value.trim();
            if (!title) { app.querySelector('#message').textContent = 'Task title is required'; input.focus(); return; }
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
            if (response.ok) { Object.assign(task, await response.json()); app.querySelector('#message').textContent = ''; paintTasks(); }
          }));
          app.querySelectorAll('#task-list input[type="checkbox"]').forEach(box => box.addEventListener('change', async () => {
            const task = tasks.find(item => String(item.id) === box.id.slice(5));
            const response = await fetch(`/api/projects/${match[1]}/tasks/${task.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) });
            if (response.ok) { task.completed = box.checked ? 1 : 0; paintTasks(); }
          }));
        };
        filter.addEventListener('change', paintTasks);
        paintTasks();
        app.querySelector('#task-form').addEventListener('submit', async event => {
          event.preventDefault();
          const input = app.querySelector('#task-title');
          const title = input.value.trim();
          if (!title) { app.querySelector('#message').textContent = 'Task title is required'; input.focus(); return; }
          const result = await fetch(`/api/projects/${match[1]}/tasks`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }) });
          if (result.ok) { tasks.push(await result.json()); input.value = ''; app.querySelector('#message').textContent = ''; paintTasks(); }
        });
        return;
      }
      const response = await fetch('/api/projects');
      const projects = await response.json();
      app.innerHTML = `<h1>Workboard</h1>
        <form id="create-form"><label for="project-name">Project name</label><input id="project-name" name="name" type="text"><button type="submit">Create project</button></form>
        <div id="message" role="alert" aria-live="polite"></div>
        <div class="filter"><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select></div>
        <section aria-label="Projects" id="project-list"></section>`;
      const projectFilter = app.querySelector('#project-filter');
      const paintProjects = () => {
        const archived = projectFilter.value === 'Archived';
        app.querySelector('#project-list').innerHTML = projects.filter(project => Boolean(project.archived) === archived).map(project => `<div class="row" data-testid="project-row"><span>${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span><button type="button" data-open="${project.id}">Open project</button><button type="button" data-archive="${project.id}" data-value="${archived ? 0 : 1}">${archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        app.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => navigate(`/projects/${button.dataset.open}`)));
        app.querySelectorAll('[data-archive]').forEach(button => button.addEventListener('click', async () => {
          const response = await fetch(`/api/projects/${button.dataset.archive}/archive`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ archived: button.dataset.value === '1' }) });
          if (response.ok) { const updated = await response.json(); Object.assign(projects.find(p => p.id === updated.id), updated); paintProjects(); }
        }));
      };
      projectFilter.addEventListener('change', paintProjects);
      paintProjects();
      app.querySelector('#create-form').addEventListener('submit', async event => {
        event.preventDefault();
        const input = app.querySelector('#project-name');
        const name = input.value.trim();
        if (!name) { app.querySelector('#message').textContent = 'Project name is required'; input.focus(); return; }
        const result = await fetch('/api/projects', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
        if (result.ok) render();
      });

    }
    function navigate(path) { history.pushState({}, '', path); render(); }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

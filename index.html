<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #1f2937; background: #f5f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 4rem auto; padding: 0 1.5rem; }
    h1 { font-size: 2rem; margin: 0 0 1.5rem; }
    form { display: flex; gap: .75rem; margin-bottom: 1.5rem; }
    input { flex: 1; min-width: 0; padding: .7rem .8rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    button { padding: .65rem 1rem; border: 0; border-radius: 6px; background: #2457d6; color: white; font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    [role="alert"] { color: #b42318; margin: .5rem 0 1rem; }
    .project-list { display: grid; gap: .65rem; }
    .project-row { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: .8rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .project-name { overflow-wrap: anywhere; }
    .back { margin-bottom: 1.25rem; }
    @media (max-width: 520px) { main { margin-top: 2rem; } form { flex-direction: column; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>

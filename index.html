<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workboard</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:16px system-ui,sans-serif}main{max-width:760px;margin:64px auto;padding:32px;background:white;border:1px solid #e1e6ef;border-radius:12px;box-shadow:0 8px 30px #1720330b}h1{margin:0 0 28px;font-size:32px}form{display:flex;gap:12px;margin-bottom:18px}input{flex:1;min-width:0;padding:12px;border:1px solid #aab4c5;border-radius:6px;font:inherit}button{padding:11px 18px;border:0;border-radius:6px;background:#3159c9;color:white;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#2448ad}.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #e1e6ef}.row button{font-size:14px}.alert{color:#b42318;margin:0 0 14px}[hidden]{display:none!important}
</style>
</head><body><main><div id="list-view"><h1>Workboard</h1><form id="create-form"><label for="project-name" class="visually-hidden">Project name</label><input id="project-name" name="name" aria-label="Project name" placeholder="Project name"><button type="submit">Create project</button></form><p id="alert" class="alert" role="alert" hidden></p><div id="projects"></div></div><div id="project-view" hidden><button id="back" type="button">Projects</button><h1 id="project-title"></h1></div></main>
<script>
const listView=document.querySelector('#list-view'), detailView=document.querySelector('#project-view'), alertBox=document.querySelector('#alert');
async function load(){const response=await fetch('/api/projects');const projects=await response.json();const container=document.querySelector('#projects');container.replaceChildren();for(const project of projects){const row=document.createElement('div');row.className='row';row.dataset.testid='project-row';const name=document.createElement('span');name.textContent=project.name;const button=document.createElement('button');button.type='button';button.textContent='Open project';button.addEventListener('click',()=>{history.pushState({},'',`/projects/${project.id}`);render()});row.append(name,button);container.append(row)}}
async function render(){const match=location.pathname.match(/^\/projects\/(\d+)\/?$/);if(match){const response=await fetch('/api/projects');const projects=await response.json();const project=projects.find(item=>String(item.id)===match[1]);if(project){listView.hidden=true;detailView.hidden=false;document.querySelector('#project-title').textContent=project.name;return}history.replaceState({},'','/')};detailView.hidden=true;listView.hidden=false;await load()}
document.querySelector('#create-form').addEventListener('submit',async event=>{event.preventDefault();alertBox.hidden=true;const field=document.querySelector('#project-name');const response=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:field.value})});if(!response.ok){alertBox.textContent='Project name is required';alertBox.hidden=false;return}field.value='';await load()});document.querySelector('#back').addEventListener('click',()=>{history.pushState({},'','/');render()});addEventListener('popstate',render);render();
</script></body></html>

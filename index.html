<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; padding: 48px 24px; }
    main { max-width: 760px; margin: auto; }
    h1 { margin-top: 0; }
    form { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; padding: 20px; background: white; border: 1px solid #dce2eb; border-radius: 10px; }
    label { display: grid; gap: 6px; flex: 1; min-width: 200px; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 6px; }
    input { border: 1px solid #aab4c4; }
    button { border: 0; background: #2458c6; color: white; cursor: pointer; }
    button:hover { background: #19479f; }
    #error { color: #b42318; min-height: 1.5em; }
    #projects { margin-top: 20px; display: grid; gap: 10px; }
    .project-row, .task-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px; background: white; border: 1px solid #dce2eb; border-radius: 8px; }
    #tasks { margin-top: 20px; display: grid; gap: 10px; }
    .task-row label { display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function projectsPage() {
      app.innerHTML = `<h1>Workboard</h1><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select><form id="create"><label for="project-name">Project name</label><input id="project-name" name="name" type="text"><button type="submit">Create project</button></form><p id="error" role="alert"></p><section id="projects" aria-label="Projects"></section>`;
      const list = document.querySelector('#projects');
      const error = document.querySelector('#error');
      async function refresh() {
        const filter = document.querySelector('#project-filter').value;
        const projects = await (await fetch(`/api/projects?filter=${filter}`)).json();
        list.innerHTML = projects.map(project => `<div class="project-row" data-testid="project-row"><span>${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completedCount}/${project.totalCount} completed</span><button type="button" data-open="${project.id}">Open project</button><button type="button" data-archive="${project.id}" data-archived="${project.archived}">${project.archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
      }
      document.querySelector('#create').addEventListener('submit', async event => {
        event.preventDefault();
        const input = document.querySelector('#project-name');
        const name = input.value.trim();
        if (!name) { error.textContent = 'Project name is required'; return; }
        const response = await fetch('/api/projects', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({name}) });
        if (!response.ok) { error.textContent = 'Project name is required'; return; }
        error.textContent = '';
        input.value = '';
        await refresh();
      });
      document.querySelector('#project-filter').addEventListener('change', refresh);
      list.addEventListener('click', async event => {
        const open = event.target.closest('[data-open]');
        if (open) { location.href = `/projects/${open.dataset.open}`; return; }
        const archive = event.target.closest('[data-archive]');
        if (archive) {
          await fetch(`/api/projects/${archive.dataset.archive}/archive`, {method:'PATCH', headers:{'content-type':'application/json'}, body:JSON.stringify({archived:archive.dataset.archived !== '1'})});
          await refresh();
        }
      });
      await refresh();
    }
    async function projectPage(id) {
      const projects = await (await fetch('/api/projects?filter=All')).json();
      const project = projects.find(item => String(item.id) === id);
      if (!project) { location.replace('/'); return; }
      const archived = Boolean(project.archived);
      app.innerHTML = `<button type="button" id="back">Projects</button><h1>${escapeHtml(project.name)}</h1>${archived ? '<p>Archived project</p>' : ''}<form id="create-task"><label for="task-title">Task title</label><input id="task-title" name="title" type="text" ${archived ? 'disabled' : ''}><button type="submit" ${archived ? 'disabled' : ''}>Create task</button></form><p id="task-error" role="alert"></p><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select><section id="tasks" aria-label="Tasks"></section>`;
      document.querySelector('#back').addEventListener('click', () => location.href = '/');
      const taskList = document.querySelector('#tasks');
      const taskError = document.querySelector('#task-error');
      async function refreshTasks() {
        const tasks = await (await fetch(`/api/projects/${id}/tasks`)).json();
        const filter = document.querySelector('#task-filter').value;
        taskList.innerHTML = tasks.filter(task => filter === 'All' || (filter === 'Completed') === task.completed).map(task => `<div class="task-row" data-testid="task-row"><span>${escapeHtml(task.title)}</span><label><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" data-task="${task.id}" ${task.completed ? 'checked' : ''} ${archived ? 'disabled' : ''}></label></div>`).join('');
      }
      document.querySelector('#create-task').addEventListener('submit', async event => {
        event.preventDefault();
        const input = document.querySelector('#task-title');
        const title = input.value.trim();
        if (!title) { taskError.textContent = 'Task title is required'; return; }
        const response = await fetch(`/api/projects/${id}/tasks`, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({title})});
        if (!response.ok) { taskError.textContent = 'Task title is required'; return; }
        taskError.textContent = ''; input.value = ''; await refreshTasks();
      });
      document.querySelector('#task-filter').addEventListener('change', refreshTasks);
      taskList.addEventListener('change', async event => {
        const checkbox = event.target.closest('[data-task]');
        if (!checkbox) return;
        await fetch(`/api/tasks/${checkbox.dataset.task}`, {method:'PATCH', headers:{'content-type':'application/json'}, body:JSON.stringify({completed:checkbox.checked})});
        await refreshTasks();
      });
      await refreshTasks();
    }
    const match = location.pathname.match(/^\/projects\/(\d+)\/?$/);
    if (match) projectPage(match[1]); else projectsPage();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182230; background: #f5f7fa; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 40px)); margin: 64px auto; }
    h1 { font-size: 2rem; margin: 0 0 28px; }
    form { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #aab5c2; border-radius: 6px; font: inherit; }
    input[type="checkbox"] { flex: 0 0 auto; width: 18px; height: 18px; padding: 0; accent-color: #215fc3; }
    button { padding: 10px 15px; border: 0; border-radius: 6px; background: #215fc3; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #184b9c; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid #d9e0e8; }
    .error { color: #b42318; margin: 0 0 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) { form { flex-direction: column; } main { margin-top: 36px; } }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.querySelector('#app');
    const projectMatch = location.pathname.match(/^\/projects\/(\d+)$/);
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    async function load() {
      if (projectMatch) {
        const projects = await fetch('/api/projects').then(response => response.json());
        const project = projects.find(item => String(item.id) === projectMatch[1]);
        if (!project) {
          app.innerHTML = '<h1>Project not found</h1><button id="back">Projects</button>';
        } else {
          app.innerHTML = `<button id="back">Projects</button><h1>${escapeHtml(project.name)}</h1>
            ${project.archived ? '<p>Archived project</p>' : ''}
            <form id="rename-form"><input id="new-project-name" aria-label="New project name" placeholder="New project name" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename project</button></form>
            <p class="error" role="alert" id="rename-error" hidden></p>
            <form id="task-form"><input id="task-title" aria-label="Task title" placeholder="Task title" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Create task</button></form>
            <p class="error" role="alert" id="task-error" hidden></p>
            <label for="default-priority">Default task priority</label> <select id="default-priority" ${project.archived ? 'disabled' : ''}><option ${project.default_priority === 'Low' ? 'selected' : ''}>Low</option><option ${project.default_priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${project.default_priority === 'High' ? 'selected' : ''}>High</option></select>
            <label for="task-filter">Task filter</label> <select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select>
            <label for="priority-filter">Priority filter</label> <select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select>
            <label for="due-from">Due from</label> <input id="due-from" aria-label="Due from" type="text">
            <label for="due-through">Due through</label> <input id="due-through" aria-label="Due through" type="text">
            <button type="button" id="apply-due-range">Apply due range</button><p class="error" role="alert" id="range-error" hidden></p>
            <section id="tasks" aria-label="Tasks"></section>`;
          if (!project.archived) {
            const renameForm = document.querySelector('#rename-form');
            const renameInput = document.querySelector('#new-project-name');
            const renameError = document.querySelector('#rename-error');
            renameForm.addEventListener('submit', async event => {
              event.preventDefault();
              renameError.hidden = true;
              const response = await fetch(`/api/projects/${project.id}/rename`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: renameInput.value }) });
              const result = await response.json();
              if (!response.ok) { renameError.textContent = result.error; renameError.hidden = false; return; }
              project.name = result.name;
              document.querySelector('h1').textContent = result.name;
            });
          }
          const taskForm = document.querySelector('#task-form');
          const taskInput = document.querySelector('#task-title');
          const taskError = document.querySelector('#task-error');
          const taskList = document.querySelector('#tasks');
          const filter = document.querySelector('#task-filter');
          const defaultPriority = document.querySelector('#default-priority');
          defaultPriority.addEventListener('change', async () => {
            await fetch(`/api/projects/${project.id}/default-priority`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: defaultPriority.value }) });
          });
          const priorityFilter = document.querySelector('#priority-filter');
          let appliedFrom = '', appliedThrough = '';
          const rangeError = document.querySelector('#range-error');
          const validDate = value => {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
            if (!match) return false;
            const [year, month, day] = match.slice(1).map(Number);
            if (year < 1 || month < 1 || month > 12) return false;
            const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
            return day >= 1 && day <= [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
          };
          document.querySelector('#apply-due-range').addEventListener('click', async () => {
            const from = document.querySelector('#due-from').value.trim();
            const through = document.querySelector('#due-through').value.trim();
            rangeError.hidden = true;
            if ((from && !validDate(from)) || (through && !validDate(through))) { rangeError.textContent = 'Due range must use valid YYYY-MM-DD dates'; rangeError.hidden = false; return; }
            if (from && through && from > through) { rangeError.textContent = 'Due from must not be after Due through'; rangeError.hidden = false; return; }
            appliedFrom = from; appliedThrough = through; await refreshTasks();
          });
          async function refreshTasks() {
            const tasks = await fetch(`/api/projects/${project.id}/tasks`).then(response => response.json());
            taskList.innerHTML = tasks.filter(task => (filter.value === 'All' || (filter.value === 'Completed') === task.completed) && (priorityFilter.value === 'All' || task.priority === priorityFilter.value) && (!appliedFrom && !appliedThrough || Boolean(task.due_date) && (!appliedFrom || task.due_date >= appliedFrom) && (!appliedThrough || task.due_date <= appliedThrough))).map(task => `<div class="row" data-testid="task-row"><span>${escapeHtml(task.title)}</span><input type="checkbox" aria-label="Complete ${escapeHtml(task.title)}" ${task.completed ? 'checked' : ''} ${project.archived ? 'disabled' : ''} data-task-id="${task.id}"><select aria-label="Task priority" data-priority-task-id="${task.id}" ${project.archived ? 'disabled' : ''}><option ${task.priority === 'Low' ? 'selected' : ''}>Low</option><option ${task.priority === 'Normal' ? 'selected' : ''}>Normal</option><option ${task.priority === 'High' ? 'selected' : ''}>High</option></select><form class="task-rename-form" data-task-id="${task.id}"><input aria-label="New task title" placeholder="New task title" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Rename task</button><span class="error" role="alert" hidden></span></form><form class="due-date-form" data-task-id="${task.id}"><input aria-label="Task due date" value="${escapeHtml(task.due_date || '')}" ${project.archived ? 'disabled' : ''}><button type="submit" ${project.archived ? 'disabled' : ''}>Save due date</button><span class="error" role="alert" hidden></span></form></div>`).join('');
            taskList.querySelectorAll('.task-rename-form').forEach(renameForm => {
              const renameInput = renameForm.querySelector('input');
              const renameError = renameForm.querySelector('[role=alert]');
              renameForm.addEventListener('submit', async event => {
                event.preventDefault();
                renameError.hidden = true;
                const response = await fetch(`/api/tasks/${renameForm.dataset.taskId}/rename`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: renameInput.value }) });
                const result = await response.json();
                if (!response.ok) { renameError.textContent = result.error; renameError.hidden = false; return; }
                await refreshTasks();
              });
            });
            taskList.querySelectorAll('.due-date-form').forEach(dateForm => {
              dateForm.addEventListener('submit', async event => {
                event.preventDefault();
                const error = dateForm.querySelector('[role=alert]');
                error.hidden = true;
                const response = await fetch(`/api/tasks/${dateForm.dataset.taskId}/due-date`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ dueDate: dateForm.querySelector('input').value }) });
                const result = await response.json();
                if (!response.ok) { error.textContent = result.error; error.hidden = false; return; }
                await refreshTasks();
              });
            });
            taskList.querySelectorAll('select[data-priority-task-id]').forEach(select => select.addEventListener('change', async () => {
              await fetch(`/api/tasks/${select.dataset.priorityTaskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ priority: select.value }) });
              await refreshTasks();
            }));
            taskList.querySelectorAll('input[type=checkbox]').forEach(box => box.addEventListener('change', async () => {
              await fetch(`/api/tasks/${box.dataset.taskId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: box.checked }) });
              await refreshTasks();
            }));
          }
          filter.addEventListener('change', refreshTasks);
          priorityFilter.addEventListener('change', refreshTasks);
          taskForm.addEventListener('submit', async event => {
            event.preventDefault();
            taskError.hidden = true;
            const response = await fetch(`/api/projects/${project.id}/tasks`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: taskInput.value }) });
            const result = await response.json();
            if (!response.ok) { taskError.textContent = result.error; taskError.hidden = false; return; }
            taskInput.value = '';
            await refreshTasks();
          });
          await refreshTasks();
        }
        document.querySelector('#back').addEventListener('click', () => location.assign('/'));
        return;
      }
      app.innerHTML = `<h1>Workboard</h1>
        <form id="create-form"><input id="project-name" aria-label="Project name" placeholder="Project name"><button type="submit">Create project</button></form>
        <p class="error" role="alert" hidden></p><label for="project-filter">Project filter</label> <select id="project-filter"><option>Active</option><option>Archived</option></select><section id="projects" aria-label="Projects"></section>`;
      const form = document.querySelector('#create-form');
      const input = document.querySelector('#project-name');
      const error = document.querySelector('.error');
      const list = document.querySelector('#projects');
      const filter = document.querySelector('#project-filter');
      filter.addEventListener('change', refresh);
      async function refresh() {
        const projects = await fetch('/api/projects').then(response => response.json());
        const visible = projects.filter(project => Boolean(project.archived) === (filter.value === 'Archived'));
        list.innerHTML = visible.map(project => `<div class="row" data-testid="project-row"><span>${escapeHtml(project.name)}</span><span data-testid="project-summary">${project.completed_count}/${project.total_count} completed</span><button type="button" data-project-id="${project.id}">Open project</button><button type="button" data-action="archive" data-project-id="${project.id}">${project.archived ? 'Restore project' : 'Archive project'}</button></div>`).join('');
        list.querySelectorAll('button[data-project-id]').forEach(button => button.addEventListener('click', async () => {
          if (button.dataset.action) {
            await fetch(`/api/projects/${button.dataset.projectId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ archived: button.textContent === 'Archive project' }) });
            await refresh();
          } else location.assign(`/projects/${button.dataset.projectId}`);
        }));
      }
      form.addEventListener('submit', async event => {
        event.preventDefault();
        error.hidden = true;
        const response = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: input.value }) });
        const result = await response.json();
        if (!response.ok) { error.textContent = result.error; error.hidden = false; return; }
        input.value = '';
        await refresh();
      });
      await refresh();
    }
    load().catch(() => { app.innerHTML = '<h1>Unable to load Workboard</h1>'; });
  </script>
</body>
</html>

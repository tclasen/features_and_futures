<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workboard</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18232e; background: #f4f6f8; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(680px, calc(100% - 32px)); margin: 64px auto; }
      h1 { margin: 0 0 28px; font-size: 2rem; }
      form, .project-row { display: flex; align-items: center; gap: 12px; }
      form { margin-bottom: 16px; }
      input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #aab4bd; border-radius: 6px; font: inherit; }
      button { padding: 10px 16px; border: 0; border-radius: 6px; background: #1769aa; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #105487; }
      button:focus-visible, input:focus-visible { outline: 3px solid #80b9ed; outline-offset: 2px; }
      #alert { color: #a32222; margin: 0 0 12px; }
      #projects { display: grid; gap: 10px; }
      .project-row { justify-content: space-between; padding: 14px 16px; background: white; border: 1px solid #d9e0e5; border-radius: 8px; }
      .project-name { overflow-wrap: anywhere; }
      #project-view { display: grid; justify-items: start; gap: 20px; }
      #project-view h1 { margin: 0; }
      .task-list { display: grid; gap: 10px; width: 100%; }
      .task-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: white; border: 1px solid #d9e0e5; border-radius: 8px; }
      .task-row input { flex: 0 0 auto; width: 18px; height: 18px; }
      @media (max-width: 480px) { main { margin-top: 36px; } form { align-items: stretch; flex-direction: column; } form button { align-self: flex-start; } }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

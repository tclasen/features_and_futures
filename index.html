<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f4f6fa; }
    body { margin: 0; padding: 3rem 1.25rem; }
    main { max-width: 44rem; margin: auto; }
    h1 { margin-top: 0; }
    form, [data-testid="project-row"] { display: flex; gap: .75rem; align-items: center; }
    form { flex-wrap: wrap; margin-bottom: 1.5rem; }
    input, button { font: inherit; padding: .65rem .85rem; border: 1px solid #aeb8ca; border-radius: .4rem; }
    input { flex: 1; min-width: 12rem; }
    button { cursor: pointer; background: #fff; }
    button:hover { background: #e8edf6; }
    [data-testid="project-row"] { justify-content: space-between; padding: .8rem 1rem; margin: .5rem 0; background: white; border: 1px solid #d8deea; border-radius: .5rem; }
    #error { color: #a32121; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>

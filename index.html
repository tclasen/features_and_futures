<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workboard</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1d2939;background:#f7f9fc}body{margin:0}main{max-width:760px;margin:64px auto;padding:0 24px}h1{font-size:2rem;margin:0 0 28px}form,.project-row,.project-header{background:white;border:1px solid #dce3ed;border-radius:10px;padding:20px;margin-bottom:16px}label{display:block;font-weight:600;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:11px 12px;border:1px solid #98a6b8;border-radius:6px;font:inherit}button{padding:10px 16px;border:0;border-radius:6px;background:#2457c5;color:white;font:inherit;font-weight:600;cursor:pointer}form button{margin-top:12px}.project-row,.project-header{display:flex;align-items:center;justify-content:space-between;gap:16px}.project-row button,.project-header button{flex:none}.error{color:#b42318;margin:8px 0 0;font-weight:600}.empty{color:#596579}
</style>
</head>
<body><main id="app"></main>
<script>
const app=document.querySelector('#app');
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function projects(){const r=await fetch('/api/projects');return r.json()}
async function tasks(projectId){const r=await fetch(`/api/projects/${encodeURIComponent(projectId)}/tasks`);return r.json()}
async function render(){
 const match=location.pathname.match(/^\/projects\/([^/]+)\/?$/);
 if(match){const projectId=decodeURIComponent(match[1]),all=await projects(),p=all.find(x=>x.id===projectId);if(!p){app.innerHTML='<h1>Project not found</h1><button id="back">Projects</button>';document.querySelector('#back').onclick=()=>location.assign('/');return}const items=await tasks(projectId);app.innerHTML=`<div class="project-header"><h1>${escapeHtml(p.name)}</h1><button id="back">Projects</button></div>${p.archived?'<p>Archived project</p>':''}<form id="rename-project"><label for="new-project-name">New project name</label><input id="new-project-name" type="text" value="${escapeHtml(p.name)}" ${p.archived?'disabled':''} aria-describedby="rename-error"><p id="rename-error" class="error" role="alert" hidden></p><button type="submit" ${p.archived?'disabled':''}>Rename project</button></form><form id="create-task"><label for="task-title">Task title</label><input id="task-title" type="text" aria-describedby="task-error"><p id="task-error" class="error" role="alert" hidden></p><button type="submit" ${p.archived?'disabled':''}>Create task</button></form><label for="task-filter">Task filter</label><select id="task-filter"><option>All</option><option>Open</option><option>Completed</option></select><label for="priority-filter">Priority filter</label><select id="priority-filter"><option>All</option><option>Low</option><option>Normal</option><option>High</option></select><section id="task-list" aria-label="Tasks"></section>`;document.querySelector('#back').onclick=()=>location.assign('/');document.querySelector('#rename-project').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#new-project-name'),error=document.querySelector('#rename-error'),name=input.value.trim();if(!name){error.textContent='Project name is required';error.hidden=false;input.focus();return}const response=await fetch(`/api/projects/${encodeURIComponent(projectId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(response.ok)render()};const filter=document.querySelector('#task-filter'),priorityFilter=document.querySelector('#priority-filter'),list=document.querySelector('#task-list');function showTasks(){const filtered=items.filter(t=>(filter.value==='All'||(filter.value==='Completed'?t.completed:!t.completed))&&(priorityFilter.value==='All'||t.priority===priorityFilter.value));list.innerHTML=filtered.map(t=>`<div class="project-row" data-testid="task-row"><span>${escapeHtml(t.title)}</span><label><input type="checkbox" aria-label="Complete ${escapeHtml(t.title)}" ${t.completed?'checked':''} ${p.archived?'disabled':''} data-task="${escapeHtml(t.id)}"></label><form class="rename-task" data-task-id="${escapeHtml(t.id)}"><label>New task title<input type="text" value="${escapeHtml(t.title)}" ${p.archived?'disabled':''} aria-label="New task title"></label><button type="submit" ${p.archived?'disabled':''}>Rename task</button></form><label>Task priority<select aria-label="Task priority" data-priority="${escapeHtml(t.id)}" ${p.archived?'disabled':''}><option ${t.priority==='Low'?'selected':''}>Low</option><option ${t.priority==='Normal'?'selected':''}>Normal</option><option ${t.priority==='High'?'selected':''}>High</option></select></label><p class="error" role="alert" data-rename-error="${escapeHtml(t.id)}" hidden></p></div>`).join('')}showTasks();filter.onchange=showTasks;priorityFilter.onchange=showTasks;list.onsubmit=async e=>{if(!e.target.matches('.rename-task'))return;e.preventDefault();const id=e.target.dataset.taskId,t=items.find(x=>x.id===id),input=e.target.querySelector('input'),error=list.querySelector(`[data-rename-error="${CSS.escape(id)}"]`),title=input.value.trim();if(!title){error.textContent='Task title is required';error.hidden=false;input.focus();return}const response=await fetch(`/api/projects/${encodeURIComponent(projectId)}/tasks/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(response.ok){t.title=title;showTasks()}};list.onchange=async e=>{if(e.target.matches('[data-task]')){const t=items.find(x=>x.id===e.target.dataset.task);t.completed=e.target.checked?1:0;await fetch(`/api/projects/${encodeURIComponent(projectId)}/tasks/${encodeURIComponent(t.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:!!t.completed})});showTasks()}else if(e.target.matches('[data-priority]')){const t=items.find(x=>x.id===e.target.dataset.priority);t.priority=e.target.value;await fetch(`/api/projects/${encodeURIComponent(projectId)}/tasks/${encodeURIComponent(t.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:t.priority})});showTasks()}};document.querySelector('#create-task').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#task-title'),error=document.querySelector('#task-error'),title=input.value.trim();if(!title){error.textContent='Task title is required';error.hidden=false;input.focus();return}const response=await fetch(`/api/projects/${encodeURIComponent(projectId)}/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});if(response.ok){items.push(await response.json());input.value='';error.hidden=true;showTasks()}};return}
 const all=await projects();app.innerHTML=`<h1>Workboard</h1><label for="project-filter">Project filter</label><select id="project-filter"><option>Active</option><option>Archived</option></select><form id="create"><label for="project-name">Project name</label><input id="project-name" name="name" type="text" aria-describedby="error"><p id="error" class="error" role="alert" hidden></p><button type="submit">Create project</button></form><section id="project-list" aria-label="Projects"></section>`;
 const filter=document.querySelector('#project-filter'),list=document.querySelector('#project-list');function showProjects(){const visible=all.filter(p=>!!p.archived===(filter.value==='Archived'));list.innerHTML=visible.length?visible.map(p=>`<div class="project-row" data-testid="project-row"><span>${escapeHtml(p.name)} <span data-testid="project-summary">${p.completed}/${p.total} completed</span></span><button data-id="${escapeHtml(p.id)}">Open project</button><button data-action="${p.archived?'restore':'archive'}" data-project="${escapeHtml(p.id)}">${p.archived?'Restore project':'Archive project'}</button></div>`).join(''):'<p class="empty">No projects yet.</p>';list.querySelectorAll('[data-id]').forEach(button=>button.onclick=()=>location.assign('/projects/'+encodeURIComponent(button.dataset.id)));list.querySelectorAll('[data-action]').forEach(button=>button.onclick=async()=>{await fetch(`/api/projects/${encodeURIComponent(button.dataset.project)}/${button.dataset.action}`,{method:'POST'});const p=all.find(x=>x.id===button.dataset.project);p.archived=button.dataset.action==='archive'?1:0;showProjects()})}filter.onchange=showProjects;showProjects();
 document.querySelector('#create').addEventListener('submit',async e=>{e.preventDefault();const input=document.querySelector('#project-name'),error=document.querySelector('#error');const name=input.value.trim();if(!name){error.textContent='Project name is required';error.hidden=false;input.focus();return}const response=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});if(response.ok)render()});

}
window.addEventListener('popstate',render);render();
</script></body></html>

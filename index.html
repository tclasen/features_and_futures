<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    body { margin: 0; }
    main { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; }
    h1 { margin-bottom: 1.5rem; }
    form, .project-row { display: flex; gap: .75rem; align-items: center; }
    .task-row { display: flex; gap: .75rem; align-items: center; background: white; padding: .85rem 1rem; border: 1px solid #dce2eb; border-radius: .5rem; margin: .65rem 0; }
    select { font: inherit; padding: .65rem .8rem; border: 1px solid #bbc5d5; border-radius: .4rem; }
    form { margin-bottom: 1.5rem; }
    label { display: grid; gap: .35rem; flex: 1; font-weight: 600; }
    input, button { font: inherit; padding: .65rem .8rem; border: 1px solid #bbc5d5; border-radius: .4rem; }
    button { cursor: pointer; background: white; }
    button:hover { background: #eef3fa; }
    .project-row { justify-content: space-between; background: white; padding: .85rem 1rem; border: 1px solid #dce2eb; border-radius: .5rem; margin: .65rem 0; }
    .error { color: #a21d2d; margin: 0 0 1rem; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module">
    const app = document.querySelector('#app');
    const escapePath = (value) => `/projects/${encodeURIComponent(value)}`;

    function showError(message) {
      let alert = app.querySelector('[role="alert"]');
      if (!alert) {
        alert = document.createElement('p');
        alert.className = 'error';
        alert.setAttribute('role', 'alert');
        app.insertBefore(alert, app.querySelector('form'));
      }
      alert.textContent = message;
    }

    async function renderList() {
      app.replaceChildren();
      const heading = document.createElement('h1');
      heading.textContent = 'Workboard';
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Project name';
      const input = document.createElement('input');
      input.type = 'text';
      input.name = 'name';
      input.setAttribute('aria-label', 'Project name');
      label.append(input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create project';
      form.append(label, submit);
      const list = document.createElement('section');
      list.setAttribute('aria-label', 'Projects');
      app.append(heading, form, list);

      async function refresh() {
        const response = await fetch('/api/projects');
        if (!response.ok) throw new Error('Could not load projects');
        const projects = await response.json();
        list.replaceChildren();
        for (const project of projects) {
          const row = document.createElement('div');
          row.className = 'project-row';
          row.dataset.testid = 'project-row';
          const name = document.createElement('span');
          name.textContent = project.name;
          const open = document.createElement('button');
          open.type = 'button';
          open.textContent = 'Open project';
          open.addEventListener('click', () => navigate(escapePath(project.id)));
          row.append(name, open);
          list.append(row);
        }
      }
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          showError('Project name is required');
          input.focus();
          return;
        }
        const response = await fetch('/api/projects', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!response.ok) {
          const result = await response.json();
          showError(result.error || 'Could not create project');
          return;
        }
        app.querySelector('[role="alert"]')?.remove();
        input.value = '';
        await refresh();
      });
      await refresh();
    }

    async function renderProject(id) {
      const response = await fetch('/api/projects');
      const projects = response.ok ? await response.json() : [];
      const project = projects.find((item) => String(item.id) === id);
      app.replaceChildren();
      const back = document.createElement('button');
      back.textContent = 'Projects';
      back.addEventListener('click', () => navigate('/'));
      app.append(back);
      if (!project) {
        const message = document.createElement('p');
        message.textContent = 'Project not found';
        app.append(message);
        return;
      }
      const heading = document.createElement('h1');
      heading.textContent = project.name;
      const form = document.createElement('form');
      const label = document.createElement('label');
      label.textContent = 'Task title';
      const input = document.createElement('input');
      input.type = 'text';
      input.setAttribute('aria-label', 'Task title');
      label.append(input);
      const submit = document.createElement('button');
      submit.type = 'submit';
      submit.textContent = 'Create task';
      form.append(label, submit);
      const filterLabel = document.createElement('label');
      filterLabel.textContent = 'Task filter';
      const filter = document.createElement('select');
      filter.setAttribute('aria-label', 'Task filter');
      for (const value of ['All', 'Open', 'Completed']) {
        const option = document.createElement('option');
        option.textContent = value;
        option.value = value;
        filter.append(option);
      }
      filterLabel.append(filter);
      const list = document.createElement('section');
      list.setAttribute('aria-label', 'Tasks');
      app.append(heading, form, filterLabel, list);

      async function refresh() {
        const result = await fetch(`/api/projects/${id}/tasks`);
        if (!result.ok) return;
        const tasks = await result.json();
        list.replaceChildren();
        for (const task of tasks) {
          if (filter.value === 'Open' && task.completed || filter.value === 'Completed' && !task.completed) continue;
          const row = document.createElement('div');
          row.className = 'task-row';
          row.dataset.testid = 'task-row';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.completed;
          checkbox.setAttribute('aria-label', `Complete ${task.title}`);
          checkbox.addEventListener('change', async () => {
            const update = await fetch(`/api/projects/${id}/tasks/${task.id}`, {
              method: 'PATCH', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ completed: checkbox.checked })
            });
            if (!update.ok) checkbox.checked = task.completed;
            else await refresh();
          });
          const title = document.createElement('span');
          title.textContent = task.title;
          row.append(checkbox, title);
          list.append(row);
        }
      }
      filter.addEventListener('change', refresh);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) {
          showError('Task title is required');
          input.focus();
          return;
        }
        const result = await fetch(`/api/projects/${id}/tasks`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!result.ok) {
          const error = await result.json();
          showError(error.error || 'Could not create task');
          return;
        }
        app.querySelector('[role="alert"]')?.remove();
        input.value = '';
        await refresh();
      });
      await refresh();
    }

    async function render() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (match) await renderProject(match[1]);
      else await renderList();
    }
    function navigate(path) {
      history.pushState({}, '', path);
      render();
    }
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>

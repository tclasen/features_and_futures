<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="container" id="app">
    <h1>Workboard</h1>
    <form id="create-form">
      <label for="project-name">Project name</label>
      <div class="form-row">
        <input id="project-name" name="name" type="text" autocomplete="off">
        <button type="submit">Create project</button>
      </div>
      <p id="error" role="alert" aria-live="polite" hidden></p>
    </form>
    <label for="project-filter">Project filter</label>
    <select id="project-filter"><option>Active</option><option>Archived</option></select>
    <section id="project-list" aria-label="Projects"></section>
    <section id="project-detail" hidden></section>
  </main>
</body>
</html>

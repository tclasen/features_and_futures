<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">Your workspace</p><h1>Workboard</h1></header>
    <section id="project-list" aria-labelledby="projects-heading">
      <h2 id="projects-heading">Projects</h2>
      <div class="filter-row project-filter-row">
        <label for="project-filter">Project filter</label>
        <select id="project-filter">
          <option value="active">Active</option>
          <option value="archived">Archived</option>
        </select>
      </div>
      <form id="create-form">
        <label for="project-name">Project name</label>
        <div class="form-row">
          <input id="project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Create project</button>
        </div>
        <p id="form-alert" class="alert" role="alert" hidden></p>
      </form>
      <div id="projects" class="projects" aria-live="polite"></div>
    </section>
    <section id="project-detail" aria-live="polite" hidden>
      <button id="back-button" class="back-button" type="button">Projects</button>
      <h2 id="detail-name"></h2>
      <p id="archived-notice" hidden>Archived project</p>
      <form id="rename-form">
        <label for="new-project-name">New project name</label>
        <div class="form-row">
          <input id="new-project-name" name="name" type="text" autocomplete="off">
          <button type="submit">Rename project</button>
        </div>
        <p id="rename-alert" class="alert" role="alert" hidden></p>
      </form>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <div class="form-row">
          <input id="task-title" name="title" type="text" autocomplete="off">
          <button type="submit">Create task</button>
        </div>
        <p id="task-alert" class="alert" role="alert" hidden></p>
      </form>
      <div class="filter-row">
        <label for="task-filter">Task filter</label>
        <select id="task-filter">
          <option value="all">All</option>
          <option value="open">Open</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div id="tasks" class="tasks" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>

 let generation=0;
 function parameters(form){const q=new URLSearchParams(new FormData(form));for(const select of document.querySelectorAll('select[name=filter],select[name=priority_filter]'))q.set(select.name,select.value);return q;}

 const previous=[...document.querySelectorAll('[data-testid=task-row]')];const fresh=[...parsed.querySelectorAll('[data-testid=task-row]')];const marker=document.createElement('div');if(previous.length)previous[0].before(marker);else document.body.append(marker);for(const row of previous)row.remove();for(const row of fresh)marker.before(row);marker.remove();}

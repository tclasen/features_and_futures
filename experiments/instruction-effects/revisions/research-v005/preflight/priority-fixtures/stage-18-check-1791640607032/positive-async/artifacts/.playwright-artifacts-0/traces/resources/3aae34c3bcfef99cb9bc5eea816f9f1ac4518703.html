(function install(){
 let generation=0;
 function parameters(form){const q=new URLSearchParams(new FormData(form));for(const select of document.querySelectorAll('select[name=filter],select[name=priority_filter]'))q.set(select.name,select.value);return q;}
 async function redraw(q){const ticket=++generation;for(const [name,value] of q){for(const input of document.querySelectorAll('input[type=hidden]'))if(input.name===name)input.value=value;}
 const reply=await fetch(location.pathname+'?'+q);const parsed=new DOMParser().parseFromString(await reply.text(),'text/html');if(ticket!==generation)return;
 const previous=[...document.querySelectorAll('[data-testid=task-row]')];const fresh=[...parsed.querySelectorAll('[data-testid=task-row]')];const marker=document.createElement('div');if(previous.length)previous[0].before(marker);else document.body.append(marker);for(const row of previous)row.remove();for(const row of fresh)marker.before(row);marker.remove();}
 for(const select of document.querySelectorAll('select[name=filter],select[name=priority_filter]'))select.onchange=function(){redraw(parameters(this.form));};
 for(const form of document.forms)if(form.action.includes('/due-range'))form.onsubmit=function(event){event.preventDefault();const q=parameters(this);const a=q.get('due_from'),b=q.get('due_through');if(a&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(a)||b&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(b)||a&&b&&a>b){this.submit();return;}redraw(q);};
})();
</script><script>const rows=[...document.querySelectorAll('[data-testid=task-row]')];const marker=document.createElement('div');if(rows.length)rows[0].before(marker);for(const row of rows)row.remove();setTimeout(()=>{for(const row of rows)marker.before(row);marker.remove();},100);</script>
